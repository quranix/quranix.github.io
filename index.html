}

}

@font-face {
  font-family:"Hind Siliguri";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/hind-siliguri-600.woff2) format("woff2"), url(fonts/hind-siliguri-600.woff) format("woff")
}

@font-face {
  font-family:"Hind Siliguri";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/hind-siliguri-700.woff2) format("woff2"), url(fonts/hind-siliguri-700.woff) format("woff")
}

}

}

@font-face {
  font-family:"Noto Serif Bengali";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/noto-serif-bengali-400.woff2) format("woff2"), url(fonts/noto-serif-bengali-400.woff) format("woff")
}

@font-face {
  font-family:"Noto Serif Bengali";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/noto-serif-bengali-700.woff2) format("woff2"), url(fonts/noto-serif-bengali-700.woff) format("woff")
}

@font-face {
  font-family:"Kalpurush";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/kalpurush.woff2) format("woff2"), url(fonts/kalpurush.woff) format("woff")
}

@font-face {
  font-family:'MSLocal';font-style:normal;font-weight:200;font-display:block;src:url(fonts/material-symbols-rounded.woff2) format('woff2')
}

:root {
  /* palette (raw colours) */
  --qx-c-white: #ffffff;
  --qx-c-offwhite: #f5f5f5;
  --qx-c-ink: #2b2b2b;
  --qx-c-navy: #1f2a44;
  --qx-c-gray: #e5e7eb;
  --qx-c-mist: #d9dee7;
  --qx-c-meta: #6b6b6b;
  --qx-c-green: #4cc79b;
  --qx-c-teal: #0f766e;
  --qx-c-teal-deep: #0b5c56;
  --qx-c-mint-hc: #7fffd0;
  --qx-c-night: #0a1625;
  --qx-c-night-outer: #08101b;
  --qx-c-night-ink: #0b1727;
  --qx-c-night-chip: #11253d;
  --qx-c-night-raise: #273449;
  --qx-c-night-border: #4a5a6a;
  --qx-c-night-muted: #a7b0be;

  /* roles (light) */
  --qx-bg: var(--qx-c-white);
  --qx-outer-bg: var(--qx-c-offwhite);
  --qx-card-bg: var(--qx-c-offwhite);
  --qx-text-color: var(--qx-c-ink);
  --qx-meta-color: var(--qx-c-meta);
  --qx-main-color: var(--qx-c-teal);
  --qx-main-soft: rgba(15,118,110,.10);
  --qx-on-main: var(--qx-c-white);
  --qx-on-teal: #fff;
  --qx-knob: #fff;
  --qx-badge-bg: #d9d9d9;
  --qx-border: var(--qx-c-gray);
  --qx-tile-bg: var(--qx-c-offwhite);
  --qx-hover: var(--qx-c-mist);
  --qx-shadow: 0 2px 10px rgba(0,0,0,0.05);
  --qx-highlight: #cfd3d8;
  --qx-danger: #d32f2f;
  --qx-success: #2e7d32;
  --qx-event: #e67e22;
  --qx-tj-ghunnah: #e67e22;
  --qx-tj-qalqalah: #2563eb;
  --qx-tj-ikhfa: var(--qx-success);
  --qx-tj-idgham: #9333ea;
  --qx-tj-iqlab: #db2777;
  --qx-tj-madd: var(--qx-danger);
  --qx-tj-lam: #0891b2;

  /* size, font, layout */
  --qx-pad-sm: 10px;
  --qx-pad-item: 14px 18px;
  --qx-pad: 20px;
  --qx-pad-xl: 60px 0;
  --qx-gap: 10px;
  --qx-radius: 8px;
  --qx-radius-lg: 12px;
  --qx-radius-pill: 999px;
  --qx-fs-xs: 11px;
  --qx-fs-sm: 12px;
  --qx-fs-md: 13px;
  --qx-fs: 14px;
  --qx-fs-lg: 16px;
  --qx-fs-xl: 18px;
  --qx-fs-ar: 30px;
  --qx-fs-bn: 16px;
  --qx-font-arabic: "Amiri Quran","Noto Naskh Arabic","Traditional Arabic",serif;
  --qx-font: "Hind Siliguri","Noto Serif Bengali","Kalpurush","Noto Sans Bengali",sans-serif;
  --qx-content-max: 720px;
  --qx-gutter: 14px;
  --qx-z-header: 50;
  --qx-z-search-panel: 40;
  --qx-z-nav: 30;
  --qx-z-modal: 100;
  --qx-z-toast: 120;
  --qx-z-dropdown: 90;
}

[data-theme="dark"] {
  --qx-bg: var(--qx-c-night);
  --qx-outer-bg: var(--qx-c-night-outer);
  --qx-card-bg: var(--qx-c-night);
  --qx-text-color: var(--qx-c-offwhite);
  --qx-meta-color: var(--qx-c-night-muted);
  --qx-main-color: var(--qx-c-green);
  --qx-main-soft: rgba(76,199,155,.16);
  --qx-on-main: var(--qx-c-night-ink);
  --qx-border: var(--qx-c-night-border);
  --qx-tile-bg: var(--qx-c-night-chip);
  --qx-hover: var(--qx-c-night-raise);
  --qx-badge-bg: var(--qx-c-night-raise);
  --qx-shadow: 0 4px 14px rgba(0,0,0,0.22);
  --qx-highlight: #4b544e;
  --qx-danger: #f87171;
  --qx-success: #4ade80;
  --qx-tj-qalqalah: #60a5fa;
  --qx-tj-idgham: #c084fc;
  --qx-tj-iqlab: #f472b6;
}

[data-hc=""] {
  --qx-text-color: #000;
  --qx-meta-color: #333;
  --qx-border: #777;
  --qx-main-color: var(--qx-c-teal-deep);
  --qx-tile-bg: #fff;
  --qx-hover: var(--qx-c-gray);
}

[data-theme="dark"][data-hc=""] {
  --qx-text-color: #fff;
  --qx-meta-color: #e5e5e5;
  --qx-border: #aaa;
  --qx-main-color: var(--qx-c-mint-hc);
  --qx-tile-bg: #111;
  --qx-hover: #333;
}

[data-reduced-motion=""] *,[data-reduced-motion=""] *::before,[data-reduced-motion=""] *::after {
  scroll-behavior: auto;
  animation-duration: .01ms;
  animation-iteration-count: 1;
  transition-duration: .01ms;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: var(--qx-outer-bg);
  color: var(--qx-text-color);
  padding-top: 0;
  padding-bottom: env(safe-area-inset-bottom);
  font-size: var(--qx-fs-bn);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}

header {
  position: sticky;
  top: 0;
  background: var(--qx-bg);
  z-index: var(--qx-z-header);
  padding: 12px 14px;
  padding-top: calc(12px + env(safe-area-inset-top));
  height: auto;
  min-height: 62px;
  display: flex;
  align-items: center;
  border-bottom: 1px solid var(--qx-border);
  transition: transform .25s ease;
  padding-bottom: 12px;
  padding-left: var(--qx-gutter);
  padding-right: var(--qx-gutter);
}

.reader-progress {
  position: fixed;
  left: 0;
  right: 0;
  top: 0;
  z-index: 9999;
  height: 3px;
  background: transparent;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease;
}

.reader-progress-fill {
  height: 100%;
  width: 0;
  background: var(--qx-main-color);
  transition: width .12s linear;
}

body.reader-active .reader-progress {
  opacity: 1;
}

.bar {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 38px;
}

h1 {
  font-size: var(--qx-fs-xl);
  margin: 0;
  flex: 1;
  color: var(--qx-main-color);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

button {
  font: inherit;
  border: 1px solid var(--qx-border);
  background: var(--qx-card-bg);
  color: var(--qx-text-color);
  border-radius: var(--qx-radius-lg);
  padding: 6px 12px;
}

input {
  width: 100%;
  margin-top: 8px;
  padding: 10px 12px;
  border-radius: var(--qx-radius-lg);
  border: 1px solid var(--qx-border);
  background: var(--qx-card-bg);
  color: var(--qx-text-color);
  font: inherit;
}

.tabs {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  overflow-x: auto;
}

.tabs button {
  white-space: nowrap;
}

.tabs button.on {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-color: var(--qx-main-color);
}

main {
  padding: clamp(12px,2.2vw,24px) clamp(12px,2.4vw,24px) 104px;
  max-width: 100%;
  width: 100%;
  margin: 0 auto;
  background: var(--qx-bg);
  min-height: calc(100vh - 62px);
  padding-left: var(--qx-gutter);
  padding-right: var(--qx-gutter);
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
}

#app {
  width: 100%;
  min-width: 0;
  max-width: 100%;
  margin: 0 auto;
}

.item {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--qx-card-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  padding: 14px;
  margin: 8px 0;
  cursor: pointer;
}

.num {
  min-width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--qx-fs-xl);
}

.mid {
  flex: 1;
}

.mid b {
  display: block;
}

.mid small {
  color: var(--qx-meta-color);
}

.ar-name {
  font-size: 20px;
  color: var(--qx-main-color);
}

.ayah {
  background: var(--qx-card-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  padding: clamp(15px,2.4vw,22px);
  margin: 12px auto;
  max-width: 900px;
  box-shadow: 0 2px 8px rgba(0,0,0,.025);
}

.ayah .ar {
  font-size: clamp(20px,var(--qx-fs-ar),48px);
  line-height: 2.15;
  direction: rtl;
  text-align: right;
  overflow-wrap: anywhere;
  padding: 5px 1px 10px;
  letter-spacing: 0;
}

.ayah .bn {
  margin-top: 8px;
  padding-top: 12px;
  border-top: 1px solid var(--qx-border);
  line-height: 1.9;
  color: var(--qx-text-color);
  font-size: clamp(15px,1.6vw,17px);
  text-align: justify;
  text-justify: inter-word;
}

.ayah .no {
  font-size: var(--qx-fs-sm);
  color: var(--qx-meta-color);
  margin-bottom: 8px;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 8px 10px;
  min-height: 36px;
  border-bottom: 1px solid var(--qx-border);
  padding-bottom: 7px;
}

/* আয়াত নম্বরকে নরম অ্যাকসেন্ট ব্যাকগ্রাউন্ডের গোল ব্যাজ */
.ayah .no > .ayah-number {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 32px;
  padding: 0 12px;
  border-radius: var(--qx-radius-pill);
  background: var(--qx-tile-bg);
  color: var(--qx-main-color);
  font-weight: 600;
  white-space: nowrap;
}

/* অ্যাকশন আইকনগুলোতে আলাদা টাইল ব্যাকগ্রাউন্ড থাকবে না */
.ayah-actions > .icon-btn,
.ayah-actions > .star {
  background: transparent;
}

.ayah-actions > .icon-btn:hover,
.ayah-actions > .star:hover {
  background: var(--qx-border);
}

.ayah-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  flex: 0 1 auto;
  min-width: 0;
  position: relative;
}

.icon-btn {
  border: 0;
  background: var(--qx-tile-bg);
  font-size: var(--qx-fs-xl);
  cursor: pointer;
  padding: 8px;
  min-width: 40px;
  min-height: 40px;
  border-radius: var(--qx-radius);
  color: var(--qx-meta-color);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.icon-btn:hover {
  background: var(--qx-border);
  color: var(--qx-text-color);
}

.star {
  border: 0;
  background: var(--qx-tile-bg);
  font-size: 21px;
  color: var(--qx-main-color);
  padding: 7px;
  min-width: 40px;
  min-height: 40px;
  border-radius: var(--qx-radius);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.toast {
  position: fixed;
  bottom: calc(76px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  background: var(--qx-text-color);
  color: var(--qx-bg);
  padding: 6px 14px;
  border-radius: var(--qx-radius-lg);
  font-size: var(--qx-fs-md);
  z-index: 99;
  animation: fadeInOut 2s ease;
  max-width: 90vw;
  text-align: center;
}

.resume {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-radius: var(--qx-radius-lg);
  padding: 12px;
  margin: 8px 0;
  cursor: pointer;
  text-align: center;
}

.bism {
  font-size: clamp(22px,calc(var(--qx-fs-ar) + 2px),50px);
  text-align: center;
  direction: rtl;
  margin: 16px 0;
  color: var(--qx-main-color);
}

.sh {
  margin: 22px 0 6px;
  padding: 10px;
  border-radius: var(--qx-radius-lg);
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  text-align: center;
}

.msg {
  text-align: center;
  color: var(--qx-meta-color);
  padding: 30px 0;
}

nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  background: var(--qx-card-bg);
  border-top: 1px solid var(--qx-border);
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 6;
  transition: transform .25s ease;
  justify-content: center;
  padding-left: 0;
  padding-right: 0;
}

nav button {
  flex: 1 1 0;
  min-width: 0;
  border: 0;
  border-radius: 0;
  background: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 4px;
  padding: 8px 2px 8px;
  min-height: 52px;
  font-size: var(--qx-fs-xs);
  color: var(--qx-meta-color);
  text-align: center;
}

nav button b {
  font-size: 20px;
  font-weight: 400;
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  line-height: 1;
  flex-shrink: 0;
}

nav button span {
  font-size: var(--qx-fs-xs);
  line-height: 1.15;
  white-space: normal;
  text-align: center;
  display: block;
  max-width: 100%;
}

nav button .ms {
  font-size: 20px;
  line-height: 1;
}

.dua-ic {
  width: 22px;
  height: 22px;
  display: block;
  margin: auto;
}

nav button.on {
  color: var(--qx-main-color);
  font-weight: 600;
}

@keyframes qxMorePulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.2); opacity: .7; }
}

/* More button pulse: mobile only (not on tablet/PC), off when reduced motion is on */
@media (max-width: 599px) {
  html:not([data-reduced-motion]) nav button[data-m="more"]:not(.on) b {
    animation: qxMorePulse 2.4s ease-in-out infinite;
  }
}

select {
  font: inherit;
  width: 100%;
  padding: 9px 10px;
  border-radius: var(--qx-radius-lg);
  border: 1px solid var(--qx-border);
  background: var(--qx-card-bg);
  color: var(--qx-text-color);
}

.row2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 10px 0;
}

.hero {
  position: relative;
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-radius: var(--qx-radius-lg);
  padding: 18px 12px;
  text-align: center;
  margin: 8px 0;
}

.hero small {
  opacity: .85;
}

.hero-date {
  position: absolute;
  top: 10px;
  left: 10px;
  width: 44px;
  overflow: hidden;
  border-radius: var(--qx-radius-lg);
  background: rgba(255,255,255,.18);
  line-height: 1;
}

.hero-date .hd-m {
  display: block;
  padding: 3px 0;
  background: rgba(255,255,255,.28);
  font-size: var(--qx-fs-xs);
}

.hero-date .hd-d {
  display: block;
  padding: 5px 0 6px;
  font-size: var(--qx-fs-xl);
}

.hero .big {
  font-size: 26px;
  font-weight: 700;
  margin: 4px 0;
}

.hero .cd {
  font-size: 20px;
  font-variant-numeric: tabular-nums;
}

.prow {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--qx-card-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  padding: 14px;
  margin: 8px 0;
}

.prow.on {
  border-color: var(--qx-main-color);
  box-shadow: 0 0 0 1px var(--qx-main-color);
}

.prow.on b {
  color: var(--qx-main-color);
}

.note {
  font-size: var(--qx-fs-sm);
  color: var(--qx-meta-color);
  line-height: 1.6;
  margin-top: 14px;
}

.tw {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  margin: 10px 0;
}

.tbtn {
  width: 180px;
  height: 210px;
  border-radius: 50%;
  border: 0;
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}

.tbtn:active {
  transform: scale(.97);
}

.tcount {
  font-size: 50px;
  font-weight: 700;
  line-height: 1;
}

.tbtn small {
  margin-top: 8px;
  opacity: .9;
}

.src {
  font-size: var(--qx-fs-sm);
  color: var(--qx-meta-color);
  margin-top: 8px;
}

html.qx-modal-open {
  overflow: hidden;
  overscroll-behavior: none;
}

body.qx-modal-open {
  overflow: hidden;
  overscroll-behavior: none;
}

.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.5);

  display: flex;
  align-items: center;
  justify-content: center;

.modal-content {

  width: 100%;
  max-height: min(84dvh,760px);
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 20px;
  border: 1px solid var(--qx-border);

}

.g-settings-panel {
  color: var(--qx-text-color);
  text-align: left;
}

#gridDropdown.g-settings-view > :not(.g-settings-panel) {
  display: none;
}

.settings-modal-header {
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 4px 2px 8px;
  background: var(--qx-tile-bg);
}

.settings-modal-title {
  flex: 1;
  margin: 0;
  font-size: var(--qx-fs-lg);
  font-weight: 600;
  color: var(--qx-text-color);
}

.settings-modal-header .close-btn {
  display: grid;
  place-items: center;
  flex-shrink: 0;
  width: 34px;
  height: 34px;
  padding: 0;
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  background: var(--qx-card-bg);
  color: var(--qx-meta-color);
  font-size: 20px;
  transition: background-color .18s ease, color .18s ease, border-color .18s ease;
}

.settings-modal-header .close-btn:hover {
  background: var(--qx-hover);
  color: var(--qx-text-color);
}

.settings-modal-header .close-btn:focus-visible {
  outline: 2px solid var(--qx-main-color);
  outline-offset: 2px;
}

.settings-body {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 4px 2px 6px;
  font-size: var(--qx-fs);
  line-height: 1.4;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  border-bottom: 1px solid var(--qx-border);
  padding-bottom: 8px;
}

.modal-header h3 {
  margin: 0;
  color: var(--qx-main-color);
  font-size: var(--qx-fs-xl);
}

.close-btn {
  background: none;
  border: 0;
  font-size: 20px;
  cursor: pointer;
  color: var(--qx-meta-color);
}

.tafseer-body {
  line-height: 1.8;
  font-size: var(--qx-fs-lg);
}

.header-tools {
  display: flex;
  align-items: center;
  gap: 4px;
  height: 100%;
  position: relative;
  flex-shrink: 0;
}

.header-tools input {
  margin: 0;
  width: 115px;
  padding: 6px 10px;
  font-size: var(--qx-fs-md);
  border-radius: var(--qx-radius);
}

.header-btn {
  padding: 6px 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--qx-border);
  background: var(--qx-tile-bg);
  color: var(--qx-text-color);
  border-radius: var(--qx-radius-lg);
  cursor: pointer;
  font-size: var(--qx-fs-lg);
  width: 44px;
  height: 44px;
  min-width: 44px;
  min-height: 44px;
  transition: background 0.2s ease, border-color 0.2s ease;
}

.ayah.playing {
  border-color: var(--qx-main-color);
  box-shadow: 0 0 0 2px var(--qx-main-color);
  background: color-mix(in srgb, var(--qx-main-color) 6%, var(--qx-card-bg));
}

.audio-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--qx-card-bg);
  border-top: 1px solid var(--qx-border);
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
  z-index: 20;
  display: none;
  box-shadow: 0 -4px 16px rgba(0,0,0,0.12);

  padding-left: var(--qx-gutter);
  padding-right: var(--qx-gutter);
}

.audio-bar.with-nav {
  bottom: calc(58px + env(safe-area-inset-bottom));
  padding-bottom: 10px;
}

.audio-inner {
  max-width: none;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}

.audio-info {
  flex: 1 1 100%;
  min-width: 0;
}

.audio-info b {
  display: block;
  font-size: var(--qx-fs-md);
  color: var(--qx-main-color);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.audio-info small {
  display: block;
  font-size: var(--qx-fs-xs);
  color: var(--qx-meta-color);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.audio-ctrls {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  justify-content: space-between;
}

.audio-ctrls button {
  padding: 6px 8px;
  border-radius: var(--qx-radius);
  cursor: pointer;
  font-size: var(--qx-fs);
  display: flex;
  align-items: center;
  justify-content: center;
}

.audio-ctrls button.primary {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-color: var(--qx-main-color);
  font-weight: 600;
}

.audio-ctrls button.on {
  border-color: var(--qx-main-color);
  color: var(--qx-main-color);
}

.audio-progress {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  font-size: var(--qx-fs-xs);
  color: var(--qx-meta-color);
  font-variant-numeric: tabular-nums;
}

.audio-progress input {
  flex: 1;
  min-width: 40px;
  height: 18px;
  accent-color: var(--qx-main-color);
  cursor: pointer;
}

.audio-status {
  width: 100%;
  font-size: var(--qx-fs-xs);
  color: var(--qx-meta-color);
  min-height: 12px;
}

.audio-ctrls button:focus-visible,.audio-progress input:focus-visible {
  outline: 2px solid var(--qx-main-color);
  outline-offset: 2px;
}

.aotd-card {
  background: var(--qx-card-bg);
  border: 1px solid var(--qx-border);
  border-left: 4px solid var(--qx-main-color);
  border-radius: var(--qx-radius-lg);
  padding: 14px;
  margin: 10px 0 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

.aotd-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.aotd-badge {
  font-size: var(--qx-fs-sm);
  font-weight: 600;
  color: var(--qx-main-color);
  display: flex;
  align-items: center;
  gap: 5px;
}

.aotd-ref {
  font-size: var(--qx-fs-sm);
  color: var(--qx-meta-color);
}

.aotd-ar {
  font-size: calc(var(--qx-fs-ar) - 4px);
  line-height: 2;
  direction: rtl;
  text-align: right;
  margin: 6px 0;
}

.aotd-bn {
  font-size: var(--qx-fs);
  line-height: 1.65;
  color: var(--qx-text-color);
  margin-top: 6px;
}

.aotd-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid var(--qx-border);
}

.aotd-link {
  font-size: var(--qx-fs-sm);
  color: var(--qx-main-color);
  background: none;
  border: 0;
  padding: 4px 0;
  cursor: pointer;
  font-weight: 600;
}

.quick-jump {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  min-width: 0;
}

.quick-jump select,.quick-jump input {
  margin: 0;
  padding: 7px 9px;
  font-size: var(--qx-fs-md);
  border-radius: var(--qx-radius);
  height: 36px;
}

.quick-jump button {
  padding: 6px 12px;
  font-size: var(--qx-fs-md);
  border-radius: var(--qx-radius);
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border: 0;
  cursor: pointer;
  white-space: nowrap;
  height: 36px;
}

.goal-bar {
  background: var(--qx-card-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  padding: 12px 14px;
  margin: 8px 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.goal-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: var(--qx-fs-md);
}

.goal-track {
  height: 8px;
  background: var(--qx-border);
  border-radius: var(--qx-radius-pill);
  overflow: hidden;
}

.goal-fill {
  height: 100%;
  background: var(--qx-main-color);
  border-radius: var(--qx-radius-pill);
  transition: width .3s ease;
}

.note-box {
  margin-top: 10px;
  padding: 10px 12px;
  background: color-mix(in srgb, var(--qx-main-color) 7%, var(--qx-card-bg));
  border-left: 3px solid var(--qx-main-color);
  border-radius: var(--qx-radius);
  font-size: var(--qx-fs-md);
  line-height: 1.6;
  color: var(--qx-text-color);
}

.note-box-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: var(--qx-fs-xs);
  color: var(--qx-main-color);
  font-weight: 600;
  margin-bottom: 4px;
}

.ayah.read-done {
  border-left: 3px solid var(--qx-main-color);
}

.speed-btn {
  font-size: var(--qx-fs-sm);
  font-weight: 600;
  min-width: 42px;
}

.p3-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  overflow-x: auto;
  scrollbar-width: none;
}

.p3-tabs button {
  flex: 1 0 auto;
  white-space: nowrap;
  padding: 8px 12px;
  border-radius: var(--qx-radius-lg);
  font-weight: 600;
  cursor: pointer;
}

.p3-tabs button.on {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-color: var(--qx-main-color);
}

.p3-card {
  background: var(--qx-card-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  padding: 12px 14px;
  margin: 8px 0;
}

.p3-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 8px;
}

.p3-grid label {
  font-size: var(--qx-fs-sm);
  color: var(--qx-meta-color);
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.p3-grid input,.p3-grid select {
  margin: 0;
  padding: 8px;
  border-radius: var(--qx-radius);
  border: 1px solid var(--qx-border);
  background: var(--qx-bg);
  color: var(--qx-text-color);
  font: inherit;
}

.qibla-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 10px;
  text-align: center;
}

.compass-dial {
  position: relative;
  width: 200px;
  height: 230px;
  border-radius: 50%;
  border: 4px solid var(--qx-main-color);
  background: var(--qx-card-bg);
  box-shadow: 0 6px 20px rgba(0,0,0,0.08);
  margin: 14px auto;
  display: flex;
  align-items: center;
  justify-content: center;
}

.compass-ring {
  position: absolute;
  inset: 0;
  transition: transform 0.15s ease-out;
}

.compass-mark {
  position: absolute;
  font-size: var(--qx-fs-md);
  font-weight: 700;
  color: var(--qx-meta-color);
}

.compass-mark.n {
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  color: #d9534f;
}

.compass-mark.s {
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
}

.compass-mark.e {
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
}

.compass-mark.w {
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
}

.kaaba-pointer {
  position: absolute;
  inset: 14px;
  transition: transform 0.2s ease-out;
}

.kaaba-badge {
  position: absolute;
  top: -6px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  padding: 3px 8px;
  border-radius: var(--qx-radius-lg);
  font-size: var(--qx-fs-md);
  font-weight: 700;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

.kaaba-needle {
  position: absolute;
  top: 24px;
  bottom: 50%;
  left: 50%;
  width: 4px;
  margin-left: -2px;
  background: var(--qx-main-color);
  border-radius: 4px;
}

.compass-center {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--qx-main-color);
  z-index: 2;
  border: 2px solid var(--qx-card-bg);
}

.qibla-aligned {
  border-color: var(--qx-success);
  box-shadow: 0 0 0 4px rgba(22,163,74,0.2);
}

.alert-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--qx-border);
}

.alert-row:last-child {
  border-bottom: 0;
}

.switch-btn {
  padding: 5px 12px;
  border-radius: var(--qx-radius-lg);
  font-size: var(--qx-fs-sm);
  font-weight: 600;
  cursor: pointer;
}

.switch-btn.on {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-color: var(--qx-main-color);
}

html,body,button,input,select,textarea {
  font-family: var(--qx-font);
}

.ar,.ayah .ar,.ar-name,.bism,.aotd-ar,.asma-card .ar,.asma-top .ar,.ww-sheet .ww-ar,.hadith-item .ar,.surah-item .ar-name {
  font-family: var(--qx-font-arabic), "Noto Naskh Arabic", serif;
}

.ayah .bn,.aotd-bn {
  font-size: var(--qx-fs-bn);
}

.set-sec {
  padding: 8px 4px;
}

.set-title {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 8px;
  font-size: var(--qx-fs);
  font-weight: 600;
  color: var(--qx-text-color);
}

.set-title .ms {
  display: grid;
  place-items: center;
  flex-shrink: 0;
  width: 30px;
  height: 30px;
  border-radius: var(--qx-radius);
  background: var(--qx-main-soft);
  color: var(--qx-main-color);
  font-size: var(--qx-fs-xl);
  vertical-align: baseline;
}

.set-sec > :not(.set-title) ~ * {
  border-top: 1px solid var(--qx-border);
}

.set-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 48px;
  padding: 6px 0;
  font-size: var(--qx-fs);
  color: var(--qx-text-color);
}

label.set-row {
  cursor: pointer;
}

.set-label {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-width: 0;
}

.set-label small {
  color: var(--qx-meta-color);
  font-size: var(--qx-fs-sm);
}

.set-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px 0 6px;
}

.set-field .set-label {
  flex: none;
  color: var(--qx-meta-color);
  font-size: var(--qx-fs-md);
}

.set-select {
  display: block;
  width: 100%;
  min-height: 42px;
  padding: 9px 12px;
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  background: var(--qx-tile-bg);
  color: var(--qx-text-color);
  font: inherit;
  font-size: var(--qx-fs);
  cursor: pointer;
  transition: border-color .18s ease, box-shadow .18s ease;
}

.set-select:hover {
  border-color: var(--qx-main-color);
}

.set-select:focus-visible {
  outline: none;
  border-color: var(--qx-main-color);
  box-shadow: 0 0 0 3px var(--qx-main-soft);
}

.set-stepper {
  display: flex;
  align-items: stretch;
  flex-shrink: 0;
  overflow: hidden;
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  background: var(--qx-tile-bg);
}

.set-stepper button {
  min-width: 42px;
  min-height: 36px;
  padding: 0 10px;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--qx-text-color);
  font-size: var(--qx-fs);
  font-weight: 600;
  cursor: pointer;
  transition: background-color .18s ease, color .18s ease;
}

.set-stepper button + button {
  border-left: 1px solid var(--qx-border);
}

.set-stepper button:hover {
  background: var(--qx-main-soft);
  color: var(--qx-main-color);
}

.set-stepper button:focus-visible {
  outline: 2px solid var(--qx-main-color);
  outline-offset: -2px;
}

.set-switch {
  -webkit-appearance: none;
  appearance: none;
  position: relative;
  flex-shrink: 0;
  width: 44px;
  height: 26px;
  margin: 0;
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-pill);
  background: var(--qx-border);
  cursor: pointer;
  transition: background-color .2s ease, border-color .2s ease;
}

.set-switch::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--qx-knob);
  box-shadow: 0 1px 3px rgba(0,0,0,.3);
  transition: transform .2s ease;
}

.set-switch:checked {
  background: var(--qx-main-color);
  border-color: var(--qx-main-color);
}

.set-switch:checked::after {
  transform: translateX(18px);
}

.set-switch:focus-visible {
  outline: 2px solid var(--qx-main-color);
  outline-offset: 2px;
}

.btn-danger {
  color: var(--qx-danger);
  border-color: var(--qx-danger);
}

.btn-accent {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-color: var(--qx-main-color);
  font-weight: 600;
}

.offline-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: var(--qx-fs-xs);
  padding: 3px 8px;
  border-radius: var(--qx-radius-lg);
  background: color-mix(in srgb, var(--qx-main-color) 12%, var(--qx-card-bg));
  color: var(--qx-main-color);
  font-weight: 600;
}

.help-step {
  background: var(--qx-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  padding: 10px 12px;
  margin-bottom: 8px;
  font-size: var(--qx-fs-md);
  line-height: 1.6;
}

button:focus-visible,select:focus-visible,input:focus-visible {
  outline: 2px solid var(--qx-main-color);
  outline-offset: 2px;
}

#q {
  display: none;
}

/* Header search opens the home search controls as a centered modal. */
#controls {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(560px, calc(100vw - 32px));
  max-height: min(82vh, 680px);
  overflow-y: auto;
  padding: 20px;
  gap: 12px;
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  background: var(--qx-card-bg);
  color: var(--qx-text-color);
  box-shadow: 0 22px 70px rgba(0,0,0,.32), 0 5px 18px rgba(0,0,0,.16);
  z-index: 201;
}

#controls #q {
  display: block;
  width: 100%;
  box-sizing: border-box;
  margin: 0;
  padding: 13px 14px;
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  background: var(--qx-bg);
  color: var(--qx-text-color);
  font: inherit;
  font-size: var(--qx-fs-lg);
}

#controls select,
#controls .quick-jump input,
#controls .quick-jump button,
#controls .tabs button {
  border-radius: var(--qx-radius-lg);
}

@media (max-width: 480px) {
  #controls {
    width: calc(100vw - 24px);
    max-height: 84vh;
    padding: 16px;
    border-radius: var(--qx-radius-lg);
  }
}

.aotd-card, .goal-bar, .resume {
  display: none;
}

.home-hero {
  display: flex;
  overflow: hidden;
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  background: var(--qx-card-bg);
  margin: 10px 0 12px;
  flex-direction: column;
}

.home-hero-left {
  flex: 1;
  background: var(--qx-main-color);
  color: var(--qx-on-main);

  grid-template-columns: auto minmax(0,1fr);
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  text-align: left;
  background: var(--qx-card-bg);
  border: 1px solid color-mix(in srgb,var(--qx-main-color) 35%,var(--qx-border));
  border-radius: var(--qx-radius-lg);
  cursor: pointer;
  box-shadow: var(--qx-shadow);
  transition: background 0.22s ease,transform 0.18s ease,box-shadow 0.22s ease,border-color 0.22s ease;
}

.home-tile:hover {
  background: var(--qx-hover);
  border-color: var(--qx-main-color);
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
  transform: translateY(-2px);
}

.home-tile:active {
  border-color: var(--qx-main-color);
  transform: translateY(0) scale(.985);
}

[data-theme="dark"] .home-tile:hover {
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

.home-tile .t-ic {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 42px;
  border-radius: var(--qx-radius-lg);
  background: color-mix(in srgb,var(--qx-main-color) 12%,transparent);
  line-height: 1;
  color: var(--qx-main-color);
}

.home-tile .t-ic .ms {
  font-size: 22px;
  line-height: 1;
  transition: transform 0.2s ease;
}

.home-tile:hover .t-ic .ms {
  transform: scale(1.08);
}

.home-tile .tile-copy {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 3px;
  min-width: 0;
}

.home-tile .tile-copy b {
  font-size: var(--qx-fs-sm);
  color: var(--qx-meta-color);
  font-weight: 600;
}

.home-tile .tile-copy strong {
  font-size: var(--qx-fs);
  line-height: 1.35;
  color: var(--qx-text-color);
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.home-tile .tile-copy small {
  font-size: var(--qx-fs-xs);
  color: var(--qx-meta-color);
  line-height: 1.35;
}

.surah-meta {
  display: flex;
  align-items: center;
  gap: 6px 8px;
  flex-wrap: wrap;
  margin-top: 5px;
  min-width: 0;
}

.surah-meta span {
  font-size: var(--qx-fs-xs);
  line-height: 1.35;
  color: var(--qx-meta-color);
}

.surah-meta .surah-meaning {
  font-size: var(--qx-fs-sm);
  color: var(--qx-text-color);
  opacity: .78;
  min-width: 0;
}

.surah-meta .surah-revelation,.surah-meta .surah-ayah-count {
  padding: 2px 7px;
  border-radius: var(--qx-radius-pill);
  background: var(--qx-tile-bg);
  border: 1px solid var(--qx-border);
  white-space: nowrap;
}

.surah-meta .surah-revelation {
  color: var(--qx-main-color);
  font-weight: 600;
}

.app-logo:hover {
  transform: scale(1.05);
}

.app-logo:active {
  transform: scale(0.92);
}

.home-browse-nav {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  padding: 3px 1px 10px;
  margin: 2px 0 10px;
  scrollbar-width: thin;
  -webkit-overflow-scrolling: touch;
}

.home-browse-nav button {
  flex: 0 0 auto;
  min-height: 38px;
  padding: 8px 15px;
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-pill);
  background: var(--qx-card-bg);
  color: var(--qx-text-color);
  font: inherit;
  font-size: var(--qx-fs-md);
  font-weight: 600;
  cursor: pointer;
}

.home-browse-nav button.on {
  background: var(--qx-main-color);
  border-color: var(--qx-main-color);
  color: var(--qx-on-main);
}

.home-browse-nav.is-sticky {
  position: sticky;
  top: var(--qx-hdr-h,62px);
  z-index: 4;
  margin: 0 calc(-1 * var(--qx-gutter,12px)) 8px;
  padding: 8px var(--qx-gutter,12px);
  background: var(--qx-bg);
  border-bottom: 1px solid var(--qx-border);
  transition: transform .25s ease;
}

body.bars-hidden .home-browse-nav.is-sticky {
  transform: translateY(calc(-100% - var(--qx-hdr-h,62px)));
}

.home-browse-heading {
  padding: 10px 2px 12px;
}

.home-browse-heading h2 {
  font-size: var(--qx-fs-xl);
  line-height: 1.4;
  margin: 0 0 4px;
}

.home-browse-heading p {

  color: var(--qx-meta-color);
  margin: 0;
}

body:not(.inside-page) #title {

}

.hijri-info-close{position:absolute;top:12px;right:12px;margin:0;width:34px;height:34px;border:1px solid var(--qx-border);border-radius:50%;background:var(--qx-hover);color:var(--qx-text-color);font-size:20px;line-height:1;display:grid;place-items:center;cursor:pointer}

/* --- তালিকা প্যাটার্ন: একটা বর্ডারওয়ালা বাক্সে সারি --- */
.qx-list {
  background: var(--qx-card-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius);
  overflow: hidden;
  margin: 12px 0;
}

.qx-row {
  border: 0;
  display: grid;
  grid-template-columns: auto minmax(0,1fr) auto;
  align-items: center;
  gap: var(--qx-gap);
  width: 100%;
  padding: var(--qx-pad-item);
  text-align: left;
  background: none;
  color: var(--qx-text-color);
  cursor: pointer;
  border-top: 1px solid var(--qx-border);
}

.qx-row:first-child {
  border-top: 0;
}

.qx-row:hover {
  background: var(--qx-hover);
}

.qx-row-ic {
  display: flex;
  color: var(--qx-main-color);
}

.qx-row-tx {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.qx-row-tx b {
  font-size: var(--qx-fs);
}

.qx-row-tx small {
  font-size: var(--qx-fs-sm);
  color: var(--qx-meta-color);
}

.qx-row-go {
  color: var(--qx-meta-color);
}

.qx-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: var(--qx-pad-xl);
  text-align: center;
}

.qx-empty b {
  font-size: var(--qx-fs);
}

.qx-empty small {
  font-size: var(--qx-fs-sm);
  color: var(--qx-meta-color);
}

/* --- সংরক্ষিত --- */
.qx-seg {
  display: flex;
  gap: 4px;
  padding: 4px;
  margin: 12px 0;
  background: var(--qx-tile-bg);
  border: 1px solid var(--qx-border);

.qx-seg button {

  padding: 9px 6px;

  font-size: var(--qx-fs);
  font-weight: 600;

.qx-seg button.on {

}

.qx-gh {

.qx-saved {

}

.qx-saved .hadith-item {

  margin: 0;
}

.qx-sn {
  font-size: var(--qx-fs-md);
  margin: 4px 0;
}

.qx-saved-act,.qx-fbar {

  flex-wrap: wrap;
  gap: 4px 14px;
  padding: 2px 2px 0;
}

.qx-fbar {

}

.qx-link {
  border: 0;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 8px 2px;
  background: none;
  color: var(--qx-main-color);
  font-size: var(--qx-fs-sm);
  font-weight: 600;
  cursor: pointer;
}

.qx-link.danger {

}

.qx-btn {
  border: 0;
  display: block;
  width: 100%;
  margin: 12px 0 0;
  padding: var(--qx-pad-item);
  border-radius: var(--qx-radius);
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  font-size: var(--qx-fs);

.qx-btn.danger {

.qx-btn.ghost {

  color: var(--qx-text-color);

}

.qx-input {
  width: 100%;
  padding: var(--qx-pad-item);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius);

  color: var(--qx-text-color);

/* PC reading width: default narrow, toggle in header (>=900px only), choice saved */
#widthToggle { display: none; }
#widthToggle .wt-narrow { display: none; }
body.read-wide #widthToggle .wt-wide { display: none; }
body.read-wide #widthToggle .wt-narrow { display: block; }
@media (min-width:900px) {
  #widthToggle { display: flex; }
  body:not(.read-wide) #app,
  body:not(.read-wide).inside-page #app { max-width: 720px; }
}

/* Quran lists (surah, para, topic): grid = 2 per row on phones, 3 per row on PC (>=900px); list = 1 per row */
.surah-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
.surah-grid .surah-item { margin: 0; min-height: 0; }
.surah-grid:not(.is-list) .surah-item { padding: 10px; gap: 6px 8px; flex-wrap: wrap; align-content: flex-start; }
.surah-grid:not(.is-list) .surah-item .num { order: 1; flex: 0 0 32px; min-width: 32px; height: 32px; font-size: var(--qx-fs-sm); }
.surah-grid:not(.is-list) .surah-item .ar-name { order: 2; margin-left: auto; max-width: none; font-size: var(--qx-fs-xl); }
.surah-grid:not(.is-list) .surah-item .mid { order: 3; flex: 1 1 100%; }
.surah-grid.is-list { grid-template-columns: minmax(0,1fr); }
.surah-grid.is-list .surah-item { padding: 10px 12px; gap: 12px; flex-wrap: nowrap; align-items: center; }
.surah-grid.is-list .surah-item .num { flex: 0 0 36px; min-width: 36px; height: 36px; font-size: var(--qx-fs-sm); }
.surah-grid.is-list .surah-item .mid { flex: 1 1 auto; min-width: 0; }
.surah-grid.is-list .surah-item .ar-name { margin-left: auto; max-width: none; font-size: var(--qx-fs-xl); }
@media (min-width:900px) {
  .surah-grid:not(.is-list) { grid-template-columns: repeat(3,minmax(0,1fr)); gap: 10px; }
}

/* B6: kalima/ramadan section cards — formerly repeated inline styles */
.qx-sec-page { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.qx-sec-page .item { margin: 0; border-radius: var(--qx-radius-lg); }
.ayah.qx-sec-card { margin: 0; padding: 14px 16px; box-shadow: none; }
.ayah.qx-sec-card .no { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
.ayah.qx-sec-card .bn { margin-top: 8px; padding-top: 0; border-top: none; }
.ayah.qx-sec-card .qx-sec-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; cursor: pointer; }
.ayah.qx-sec-card .qx-sec-head .qx-num-badge,
.ayah.qx-sec-card .qx-sec-head .qx-tri-badge { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background: var(--qx-badge-bg); color: var(--qx-main-color); font-weight: 700; font-size: var(--qx-fs-md); }
.ayah.qx-sec-card .qx-sec-head .qx-sec-title { border: none; background: none; color: var(--qx-main-color); padding: 0; font-size: var(--qx-fs-xl); font-weight: 700; min-height: 0; flex: 1; text-align: left; }
.ayah.qx-sec-card .qx-sec-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.ayah.qx-sec-card .qx-sec-body { display: none; }
.ayah.qx-sec-card.open .qx-sec-body { display: block; }

/* namaz shikkha: arrows, source chip, nav buttons (scoped under .qx-nm) */
.qx-nm .qx-nm-ic { display: inline-flex; align-items: center; justify-content: center; line-height: 0; }
.qx-nm .qx-nm-chev { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex: 0 0 32px; border-radius: 50%; background: var(--qx-main-soft); color: var(--qx-main-color); transition: transform .15s ease, background .15s ease; }
.qx-nm .item:hover .qx-nm-chev { transform: translateX(2px); background: var(--qx-main-color); color: var(--qx-on-main); }
.qx-nm .qx-nm-back, .qx-nm .qx-nm-prev, .qx-nm .qx-nm-next { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px 0 10px; border-radius: var(--qx-radius-pill); font-weight: 600; font-size: var(--qx-fs-md); cursor: pointer; background: var(--qx-main-soft); color: var(--qx-main-color); border: 1px solid transparent; }
.qx-nm .qx-nm-back { margin-bottom: 12px; }
.qx-nm .qx-nm-next { padding: 0 10px 0 14px; background: var(--qx-main-color); color: var(--qx-on-main); }
.qx-nm .qx-nm-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 16px; }
.qx-nm .qx-nm-nav .qx-nm-lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 36vw; }
.qx-nm .qx-nm-src { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--qx-border); }
.qx-nm .qx-nm-src-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 12px 0 9px; border-radius: var(--qx-radius-pill); background: var(--qx-card-bg); border: 1px solid var(--qx-border); color: var(--qx-main-color); font-size: var(--qx-fs-md); }
.qx-nm .qx-nm-src-chip b { font-weight: 600; color: var(--qx-text-color); }
.qx-nm .qx-nm-src-chip svg { width: 15px; height: 15px; }
.qx-nm .qx-nm-src-no { padding-left: 8px; margin-left: 2px; border-left: 1px solid var(--qx-border); color: var(--qx-meta-color); font-weight: 600; }
.qx-nm .qx-nm-grade { display: inline-flex; align-items: center; gap: 4px; min-height: 30px; padding: 0 12px 0 8px; border-radius: var(--qx-radius-pill); background: color-mix(in srgb, var(--qx-success) 14%, transparent); color: var(--qx-success); font-size: var(--qx-fs-md); font-weight: 700; }
.qx-nm .qx-nm-grade svg { width: 15px; height: 15px; }

/* খতম প্ল্যান: কাস্টম দিনের বাটন লাইন ভেঙে নামবে, আংশিক পড়া দিনের রং */
.pp-tabs.wrap { flex-wrap: wrap; }
.pp-tabs.wrap button { flex: 1 1 28%; }
.khatam-dot.part {
  background: color-mix(in srgb, var(--qx-main-color) 30%, var(--qx-card-bg));
  border-color: var(--qx-main-color);
}


/* খতম প্ল্যান: দিনের ঘরে টিক (ফেজ ২) */
.khatam-dot {
  position: relative;
  width: 28px;
  height: 30px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}

.khatam-dot.miss {
  border-color: var(--qx-danger);
  color: var(--qx-danger);
}

.khatam-dot.ticked {
  font-weight: 700;
}

.khatam-dot.ticked::after {
  content: "\2713";
  position: absolute;
  top: -6px;
  right: -5px;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 9px;
  line-height: 1;
  background: var(--qx-card-bg);
  color: var(--qx-main-color);
  border: 1px solid var(--qx-main-color);
}

.khatam-dot:focus-visible {
  outline: 2px solid var(--qx-main-color);
  outline-offset: 2px;
}

/* আইকন ফন্ট: লোড হওয়ার আগে লুকানো (blink বন্ধ), ব্যর্থ হলে চিহ্ন-ফলব্যাক */

body.no-icon-font .ms {

}

body.no-icon-font .ms::before {
  content: attr(data-g);
  font-size: 17px;
  line-height: 1;
  font-style: normal;
  font-weight: 400;
  text-align: center;
}

async function loadSurah(n){
  const API = "https://api.alquran.cloud/v1";
  const [ar, bn] = await Promise.all([
    fetch(`${API}/surah/${n}`).then(r=>r.json()),
    fetch(`${API}/surah/${n}/bn.bengali`).then(r=>r.json())
  ]);
  return { ar: ar.data, bn: bn.data };
}
window.loadSurah = loadSurah;

  function contentDb(){
    return new Promise(function(resolve,reject){
      var req=indexedDB.open(CONTENT_DB,1);
      req.onupgradeneeded=function(){ if(!req.result.objectStoreNames.contains(CONTENT_STORE)) req.result.createObjectStore(CONTENT_STORE); };
      req.onsuccess=function(){
        openContentDbs.add(req.result);
        req.result.onversionchange=function(){ closeContentDb(req.result); };
        resolve(req.result);
      };
      req.onerror=function(){ reject(req.error); };
    });
  }
  async function contentPut(key,value){
    var d=await contentDb();
    return new Promise(function(resolve,reject){
      var tx=d.transaction(CONTENT_STORE,'readwrite');
      tx.objectStore(CONTENT_STORE).put(value,key);
      tx.oncomplete=function(){closeContentDb(d);resolve();};
      tx.onerror=function(){var error=tx.error;closeContentDb(d);reject(error);};
      tx.onabort=function(){var error=tx.error;closeContentDb(d);reject(error);};
    });
  }
  async function contentGet(key){
    var d=await contentDb();
    return new Promise(function(resolve,reject){
      var q=d.transaction(CONTENT_STORE).objectStore(CONTENT_STORE).get(key);
      q.onsuccess=function(){var value=q.result||null;closeContentDb(d);resolve(value);};
      q.onerror=function(){var error=q.error;closeContentDb(d);reject(error);};
    });
  }
  async function contentDel(key){
    var d=await contentDb();
    return new Promise(function(resolve,reject){
      var tx=d.transaction(CONTENT_STORE,'readwrite');
      tx.objectStore(CONTENT_STORE).delete(key);
      tx.oncomplete=function(){closeContentDb(d);resolve();};
      tx.onerror=function(){var error=tx.error;closeContentDb(d);reject(error);};
      tx.onabort=function(){var error=tx.error;closeContentDb(d);reject(error);};
    });
  }

  function normalizeHadithRows(payload){
    var rows=Array.isArray(payload)?payload:(payload&&Array.isArray(payload.hadiths)?payload.hadiths:(payload&&Array.isArray(payload.data)?payload.data:(payload&&Array.isArray(payload.items)?payload.items:(payload&&Array.isArray(payload.hadith)?payload.hadith:null))));
    if(!rows && payload && payload.hadith) rows=[payload];
    if(!rows && payload && typeof payload==='object'){
      rows=Object.keys(payload).map(function(k){return payload[k];}).filter(function(v){return v&&typeof v==='object'&&(v.hadith||v.hadith_id||v.id);});
    }
    if(!Array.isArray(rows)) return [];
    return rows.map(function(item){var h=item&&item.hadith?item.hadith:item;return h&&typeof h==='object'?h:null;}).filter(function(h){
      var bn=h&&(h.bn||h.text||h.translation), ar=h&&(h.ar||h.arabic);
      return h && (h.hadith_id!==undefined || h.id!==undefined) && String(bn||'').trim() && String(ar||'').trim();

  function hadithRangeCount(range){
    if(!range)return 0;

              var audioResponse=await fetch(urlFor(rec,surah.number,ai),{signal:job.controller.signal});

              blob=await audioResponse.blob();
              if(!blob || !blob.size) throw new Error('খালি অডিও ফাইল: '+surah.number+':'+ai);
              await put(audioKey,blob);
            }
            job.done++; job.bytes+=blob.size||0; job.message='অডিও ডাউনলোড হচ্ছে';
            if(job.done%5===0 || job.done===job.total) updatePackageProgress(job);
            if(job.done%20===0){ metaMap=packageMeta(); metaMap[key].done=job.done; metaMap[key].bytes=job.bytes; metaMap[key].updated=new Date().toISOString(); savePackageMeta(metaMap); }
          }
        }
      } else if(type==='hadith'){
        var collection=HADITH_CORPUS.find(function(c){return c.id===String(id);});
        if(!collection) throw new Error('হাদিসের সংগ্রহটি চেনা যায়নি');
        job.total=collection.chapters;
        var sourceMetaUrl=HADITH_CDN+collection.folder+'/Meta/'+collection.meta;
        var metaResponse=await fetch(sourceMetaUrl);
        if(!metaResponse.ok) throw new Error('হাদিসের অধ্যায়-তথ্য পাওয়া যায়নি (HTTP '+metaResponse.status+')');
        var chapterMeta=await metaResponse.json();
        if(!chapterMeta || typeof chapterMeta!=='object') throw new Error('অধ্যায়-তথ্য অসম্পূর্ণ; প্যাকেজ সম্পূর্ণ করা হয়নি');
        for (let hm=1;hm<=collection.chapters;hm++){
          var metaEntry=chapterMeta[hadithMetaIndex(collection,hm)];
          if(!metaEntry || !String(metaEntry.title||'').trim() || !String(metaEntry.hadis_range||'').trim()) throw new Error('অধ্যায়-তথ্যে ঘাটতি: '+collection.name+' · অধ্যায় '+hm);
        }
        await contentPut(hadithMetaKey(collection.id),chapterMeta);
        for (let hc=1;hc<=collection.chapters;hc++){
          await jobPauseWait(job);
          var hKey=hadithChapterKey(collection.id,hc), cached=await contentGet(hKey);
          var chapterInfo=chapterMeta[hadithMetaIndex(collection,hc)];
          var expectedHadiths=hadithRangeCount(chapterInfo.hadis_range);
          var cachedValid=Array.isArray(cached) && cached.length>0 && cached.every(function(h){return h && (h.hadith_id!==undefined || h.id!==undefined) && String(h.bn||h.text||h.translation||'').trim() && String(h.ar||h.arabic||'').trim();}) && (!expectedHadiths || cached.length===expectedHadiths);
          if(!cachedValid){
            job.controller=new AbortController();
            var hResponse=await fetch(hadithChapterUrl(collection,hc),{signal:job.controller.signal});
            if(!hResponse.ok) throw new Error(collection.name+' · অধ্যায় '+hc+' (HTTP '+hResponse.status+')');
            var hPayload=await hResponse.json();
            cached=normalizeHadithRows(hPayload);
            if(!cached.length) throw new Error(collection.name+' · অধ্যায় '+hc+'-এ আরবি ও বাংলা উভয় পাঠসহ ব্যবহারযোগ্য হাদিস পাওয়া যায়নি');
            if(expectedHadiths && cached.length!==expectedHadiths) throw new Error(collection.name+' · অধ্যায় '+hc+'-এ হাদিসসংখ্যা মেলেনি (পাওয়া '+cached.length+', প্রত্যাশিত '+expectedHadiths+')');
            await contentPut(hKey,cached);
          }
          job.done=hc; job.bytes+=new Blob([JSON.stringify(cached)]).size;
          job.message=collection.name+' ডাউনলোড হচ্ছে'; updatePackageProgress(job);
          metaMap=packageMeta(); metaMap[key].done=job.done; metaMap[key].bytes=job.bytes; metaMap[key].updated=new Date().toISOString(); savePackageMeta(metaMap);
        }
      } else {
        throw new Error('অজানা প্যাকেজের ধরন');
      }
      if(job.cancelled) throw new Error('cancelled');
      job.finished=true; job.message='ডাউনলোড সম্পন্ন'; job.done=job.total; updatePackageProgress(job);
      metaMap=packageMeta(); metaMap[key]={type:type,id:String(id),label:label,status:'complete',done:job.total,bytes:job.bytes,total:job.total,updated:new Date().toISOString()}; savePackageMeta(metaMap);
      showToast(label+' সম্পূর্ণ ডাউনলোড হয়েছে');
    }catch(error){
      job.finished=true;
      var cancelled=job.cancelled || error.name==='AbortError' || error.message==='cancelled';
      job.message=cancelled?'ডাউনলোড বাতিল':'ডাউনলোডে সমস্যা: '+error.message;
      metaMap=packageMeta();
      if(metaMap[key]){metaMap[key].status=cancelled?'paused':'incomplete';metaMap[key].done=job.done;metaMap[key].bytes=job.bytes;metaMap[key].updated=new Date().toISOString();savePackageMeta(metaMap);}
      showToast(cancelled?'ডাউনলোড থামানো হয়েছে':'ডাউনলোড সম্পূর্ণ হয়নি: '+error.message);
    }
    packageJob=null;
    renderDownloadsPopup();
  }

  async function deletePackage(type,id){
    var key=packageKey(type,id), m=packageMeta();
    if(!m[key]) return;
    if(!confirm('“'+(m[key].label||'প্যাকেজ')+'” ডাউনলোড মুছে ফেলবে?')) return;
    if(type==='translation' || type==='tafsir'){
      for (let n=1;n<=114;n++) await contentDel((type==='translation'?'translation':'tafsir')+'|'+id+'|'+n);
    } else if(type==='hadith'){
      var hc=HADITH_CORPUS.find(function(c){return c.id===String(id);});
      if(hc){for (let hn=1;hn<=hc.chapters;hn++) await contentDel(hadithChapterKey(hc.id,hn));await contentDel(hadithMetaKey(hc.id));}
    } else if(type==='audio'){
      var list=await allSurahList();
      var audioMeta=meta();
      // Keep any audio files that are also part of a separately downloaded single-surah package.
      for (let si=0;si<list.length;si++){
        var singleKey=list[si].number+'|'+id;
        if(audioMeta[singleKey]) continue;
        for (let ai=1;ai<=Number(list[si].numberOfAyahs);ai++) await del(keyFor(String(id),list[si].number,ai));
      }
    }
    delete m[key]; savePackageMeta(m); showToast('প্যাকেজ মুছে ফেলা হয়েছে'); renderDownloadsPopup(); refreshDlBar();
  }

    return {usage:0,quota:0};
  }

function renderAsma(){if(typeof showOther==='function')showOther('{{auto_awesome}} আসমাউল হুসনা');const appEl = document.getElementById('app');var favs={};try{favs=JSON.parse(localStorage.getItem('quranix_asma_fav')||'{}');}catch(e){}var counts={};try{counts=JSON.parse(localStorage.getItem('quranix_asma_count')||'{}');}catch(e){}var t=asmaToday();var top=document.createElement('div');top.className='asma-top';top.innerHTML='<small>{{auto_awesome}} আজকের নাম · '+(ASMA_DATA.indexOf(t)+1)+' / ৯৯</small><div class="ar">'+t[0]+'</div><b>'+t[1]+' — '+t[2]+'</b><div><small>রেফারেন্স: সূরা '+t[3]+' · '+t[4]+'</small></div>';top.onclick=function(){openAsmaDetail(ASMA_DATA.indexOf(t));};appEl.appendChild(top);var info=document.createElement('div');info.className='trk-mini';info.style.textAlign='center';info.textContent='৯৯টি নাম মুখস্থ করো, প্রতিটা নামে ট্যাপ করে অর্থ + কুরআনের রেফারেন্স দেখো। {{star:f}} প্রিয় করো, {{bubble_chart}} জিকির করো।';appEl.appendChild(info);var search=document.createElement('input');search.className='asma-search';search.placeholder='নাম খুঁজুন... যেমন: রহমান, গাফুর, রজ্জাক';appEl.appendChild(search);var grid=document.createElement('div');grid.className='asma-grid';appEl.appendChild(grid);function draw(filter){grid.innerHTML='';ASMA_DATA.forEach(function(item,i){var txt=(item[1]+' '+item[2]+' '+item[0]).toLowerCase();if(filter&&txt.indexOf(filter.toLowerCase())<0)return;var c=document.createElement('div');c.className='asma-card'+(favs[i]?' fav':'');c.innerHTML='<div class="ar">'+item[0]+'</div><b>'+(typeof toBn==='function'?toBn(i+1):i+1)+'. '+item[1]+'</b><small>'+item[2]+'</small><div class="trk-mini">সূরা '+item[3]+(counts[i]?' · {{bubble_chart}} '+counts[i]+' বার':'')+'</div>';c.onclick=function(){openAsmaDetail(i);};grid.appendChild(c);});}search.oninput=function(){draw(search.value);};draw('');}
function openAsmaDetail(idx){var item=ASMA_DATA[idx];var favs={};try{favs=JSON.parse(localStorage.getItem('quranix_asma_fav')||'{}');}catch(e){}var counts={};try{counts=JSON.parse(localStorage.getItem('quranix_asma_count')||'{}');}catch(e){}var ov=document.createElement('div');ov.className='ac-ov';ov.style.zIndex='130';var box=document.createElement('div');box.className='ac-box';box.innerHTML='<div class="ac-head"><span>'+(typeof toBn==='function'?toBn(idx+1):idx+1)+' / ৯৯ — '+item[1]+'</span><button id="asmaX">{{close}}</button></div><div style="text-align:center"><div style="font-family:var(--qx-font-arabic);font-size:48px;color:var(--qx-main-color);direction:rtl;line-height:1.6">'+item[0]+'</div><b style="font-size:var(--qx-fs-xl)">'+item[1]+'</b><div style="color:var(--qx-meta-color)">'+item[2]+'</div></div><div class="trk-cat" style="margin:12px 0 0"><b>{{menu_book}} সংক্ষিপ্ত পরিচয়</b><div style="margin-top:6px;line-height:1.7">'+item[4]+'</div><div class="trk-mini" style="margin-top:8px">{{auto_stories}} কুরআন রেফারেন্স: <b>সূরা '+item[3]+'</b> — এই নামটি এই সূরায় এসেছে।</div></div><div class="ac-row"><button class="ac-btn ghost" id="asmaFav">'+(favs[idx]?'{{star:f}} প্রিয় থেকে সরাও':'{{star}} প্রিয় করো')+'</button><button class="ac-btn" id="asmaTasbih">{{bubble_chart}} জিকির +১ (<span id="asmaCnt">'+(counts[idx]||0)+'</span>)</button></div><div class="ac-row"><button class="ac-btn ghost" id="asmaPrev">← আগের নাম</button><button class="ac-btn ghost" id="asmaNext">পরের নাম →</button></div><div class="ac-row"><button class="ac-btn" id="asmaShare">{{share}} এই নাম শেয়ার করো</button></div>';ov.appendChild(box);document.body.appendChild(ov);var close=function(){ov.remove();if(typeof mode!=='undefined'&&mode==='asma')renderAsma();};box.querySelector('#asmaX').onclick=close;ov.onclick=function(e){if(e.target===ov)close();};box.querySelector('#asmaFav').onclick=function(){if(favs[idx])delete favs[idx];else favs[idx]=1;localStorage.setItem('quranix_asma_fav',JSON.stringify(favs));this.textContent=favs[idx]?'{{star:f}} প্রিয় থেকে সরাও':'{{star}} প্রিয় করো';};box.querySelector('#asmaTasbih').onclick=function(){counts[idx]=(counts[idx]||0)+1;localStorage.setItem('quranix_asma_count',JSON.stringify(counts));box.querySelector('#asmaCnt').textContent=counts[idx];if(typeof showToast==='function')showToast(item[1]+' — '+counts[idx]+' বার');};box.querySelector('#asmaPrev').onclick=function(){ov.remove();openAsmaDetail((idx+98)%99);};box.querySelector('#asmaNext').onclick=function(){ov.remove();openAsmaDetail((idx+1)%99);};box.querySelector('#asmaShare').onclick=async function(){var text=''+item[1]+' — '+item[2]+'\n'+item[4]+'\nরেফারেন্স: সূরা '+item[3]+'\n— Quranix · আসমাউল হুসনা';await shareTextOrCopy(text,item[1],'শেয়ার করা যায়নি, টেক্সট কপি করা হয়েছে!');};}
window.renderAsma=renderAsma;window.buildAsmaCard=buildAsmaCard;window.openAsmaDetail=openAsmaDetail;

// Keep the page behind dialogs and sheets from scrolling (including on mobile Safari).
(function(){
  var body = document.body;
  var root = document.documentElement;
  var locked = false;
  var savedScrollY = 0;
  var savedStyles = null;
  var overlaySelector = ".modal-overlay, .ac-ov, .sheet-ov, #gridPopupOverlay.open";

  function syncScrollLock(){
    var shouldLock = !!document.querySelector(overlaySelector);
    if (shouldLock && !locked) {
      locked = true;
      savedScrollY = window.scrollY || window.pageYOffset || 0;
      savedStyles = {
        position: body.style.position,
        top: body.style.top,
        left: body.style.left,
        right: body.style.right,
        width: body.style.width
      };
      root.classList.add("qx-modal-open");
      body.classList.add("qx-modal-open");
      body.style.position = "fixed";
      body.style.top = (-savedScrollY) + "px";
      body.style.left = "0";
      body.style.right = "0";
      body.style.width = "100%";
    } else if (!shouldLock && locked) {
      locked = false;
      root.classList.remove("qx-modal-open");
      body.classList.remove("qx-modal-open");
      body.style.position = savedStyles.position;
      body.style.top = savedStyles.top;
      body.style.left = savedStyles.left;
      body.style.right = savedStyles.right;
      body.style.width = savedStyles.width;
      window.scrollTo(0, savedScrollY);
      savedStyles = null;
    }
  }

  var observer = new MutationObserver(syncScrollLock);
  observer.observe(body, { childList: true, subtree: true, attributes: true, attributeFilter: ["class"] });
  syncScrollLock();
})();

/* {{icon}} / {{icon:f}} tokens in any text become Material icon spans (also for dynamically added text) */
(function(){
  var RX=/\{\{([a-z_0-9]+)(:f)?\}\}/g, SKIP={OPTION:1,TITLE:1,TEXTAREA:1}, NOCONV={SCRIPT:1,STYLE:1};
  function conv(n){
    var s=n.nodeValue; if(!s||s.indexOf('{{')<0) return;
    var p=n.parentNode; if(!p||NOCONV[p.nodeName]) return;
    if(SKIP[p.nodeName]){ n.nodeValue=s.replace(RX,'').replace(/^\s+/,''); return; }
    var f=document.createDocumentFragment(), last=0, m; RX.lastIndex=0;
    while((m=RX.exec(s))){
      if(m.index>last) f.appendChild(document.createTextNode(s.slice(last,m.index)));
      var i=document.createElement('span'); i.className='ms'+(m[2]?' f':''); i.setAttribute('aria-hidden','true'); i.textContent=m[1]; f.appendChild(i);
      last=RX.lastIndex;
    }
    if(last<s.length) f.appendChild(document.createTextNode(s.slice(last)));
    p.replaceChild(f,n);
  }
  function walk(r){
    if(r.nodeType===3){ conv(r); return; }
    if(r.nodeType!==1||r.nodeName==='SCRIPT'||r.nodeName==='STYLE') return;
    var w=document.createTreeWalker(r,NodeFilter.SHOW_TEXT,null), a=[], x;
    while((x=w.nextNode())) if(x.nodeValue.indexOf('{{')>=0) a.push(x);
    a.forEach(conv);
  }
  walk(document.body);
  new MutationObserver(function(ms){
    ms.forEach(function(m){
      if(m.type==='characterData') conv(m.target);
      else m.addedNodes.forEach(walk);
    });
  }).observe(document.body,{childList:true,subtree:true,characterData:true});
})();

function toggleReadAyah(k){
  if (goalData.date !== todayStr()) {
    goalData = { target: goalData.target || 10, date: todayStr(), readKeys: [] };
  }
  const idx = goalData.readKeys.indexOf(k);
  let marked = false;
  if (idx >= 0) {
    goalData.readKeys.splice(idx, 1);
  } else {
    goalData.readKeys.push(k);
    marked = true;
  }
  lsSet("goal", goalData);
  try { if (window.qxKhatamOnRead) window.qxKhatamOnRead(k, marked); } catch(e) {}
  return marked;
}

function buildGoalCard(){
  if (goalData.date !== todayStr()) {
    goalData = { target: goalData.target || 10, date: todayStr(), readKeys: [] };
    lsSet("goal", goalData);
  }
  const count = goalData.readKeys.length;
  const target = goalData.target || 10;
  const pct = Math.min(100, Math.round((count / target) * 100));

  const box = document.createElement("div");
  box.className = "goal-bar";

  const top = document.createElement("div");
  top.className = "goal-top";
  const left = document.createElement("span");
  left.innerHTML = `{{target}} আজকের পঠন লক্ষ্য: <b>${toBn(count)} / ${toBn(target)}</b> আয়াত (${toBn(pct)}%)`;

  const editBtn = document.createElement("button");
  editBtn.textContent = "লক্ষ্য পরিবর্তন";
  editBtn.style.cssText = "padding:3px 8px;font-size:var(--qx-fs-xs);border-radius:var(--qx-radius);cursor:pointer;";
  editBtn.onclick = () => {
    const val = prompt("প্রতিদিন কয়টি আয়াত পড়ার লক্ষ্য রাখতে চান? (যেমন: ১০, ২০, ৫০)", String(target));
    const num = parseInt(val, 10);
    if (num && num > 0 && num <= 6236) {
      goalData.target = num;
      lsSet("goal", goalData);
      box.replaceWith(buildGoalCard());
      showToast("দৈনিক লক্ষ্য আপডেট হয়েছে: " + toBn(num) + " আয়াত");
    }
  };
  top.appendChild(left);
  top.appendChild(editBtn);

  const track = document.createElement("div");
  track.className = "goal-track";
  const fill = document.createElement("div");
  fill.className = "goal-fill";
  fill.style.width = pct + "%";
  track.appendChild(fill);

  box.appendChild(top);
  box.appendChild(track);
  return box;
}

/* --- দ্রুত সূরা ও আয়াত নেভিগেশন (Quick Jump) --- */
function initQuickJump(){
  const sSel = document.getElementById("jumpSurah");
  const aInp = document.getElementById("jumpAyah");
  const goBtn = document.getElementById("jumpGo");
  if (!sSel || !aInp || !goBtn) return;
  sSel.innerHTML = "";
  let ayahList = document.getElementById("jumpAyahSuggestions");
  if (!ayahList) {
    ayahList = document.createElement("datalist");
    ayahList.id = "jumpAyahSuggestions";
    document.body.appendChild(ayahList);
  }
  aInp.setAttribute("list", "jumpAyahSuggestions");
  aInp.setAttribute("autocomplete", "off");
  aInp.setAttribute("inputmode", "numeric");
  aInp.placeholder = "আয়াত নং (তালিকা থেকে বাছুন)";
  const refreshAyahSuggestions = () => {
    const selected = surahs.find(x => x.number === +sSel.value);
    const count = selected ? selected.numberOfAyahs : 286;
    aInp.max = count;
    ayahList.innerHTML = "";
    for (let n = 1; n <= count; n++) {
      const option = document.createElement("option");
      option.value = String(n);
      option.label = `আয়াত ${toBn(n)}`;
      ayahList.appendChild(option);
    }
  };
  surahs.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s.number;
    opt.textContent = `${toBn(s.number)}. ${s.englishName} (${toBn(s.numberOfAyahs)})`;
    sSel.appendChild(opt);
  });
  sSel.onchange = () => {
    refreshAyahSuggestions();
    aInp.value = "";
  };
  const doJump = () => {
    const sn = +sSel.value || 1;
    const s = surahs.find(x => x.number === sn);
    const maxA = s ? s.numberOfAyahs : 286;
    let an = parseInt(aInp.value, 10) || 1;
    if (an < 1) an = 1;
    if (an > maxA) {
      showToast(`এই সূরায় মোট আয়াত ${toBn(maxA)}টি`);
      an = maxA;
    }
    openSurah(sn, 0, an);
  };
  refreshAyahSuggestions();
  goBtn.onclick = doJump;
  aInp.onkeydown = (e) => { if (e.key === "Enter") doJump(); };
}

const DAILY_AYAHS = [
  { s: 94, a: 5, name: "Al-Inshirah" }, { s: 2, a: 286, name: "Al-Baqarah" },
  { s: 2, a: 152, name: "Al-Baqarah" }, { s: 65, a: 3, name: "At-Talaq" },
  { s: 3, a: 139, name: "Ali 'Imran" }, { s: 13, a: 28, name: "Ar-Ra'd" },
  { s: 39, a: 53, name: "Az-Zumar" }, { s: 2, a: 186, name: "Al-Baqarah" },
  { s: 16, a: 97, name: "An-Nahl" }, { s: 29, a: 69, name: "Al-'Ankabut" },
  { s: 8, a: 46, name: "Al-Anfal" }, { s: 40, a: 60, name: "Ghafir" },
  { s: 3, a: 173, name: "Ali 'Imran" }, { s: 55, a: 13, name: "Ar-Rahman" }
];

let aotdOffset = 0;
function getTodayAyah(){
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const dayOfYear = Math.floor((now - start) / 86400000);
  const idx = (dayOfYear + aotdOffset) % DAILY_AYAHS.length;
  return DAILY_AYAHS[idx];
}

function buildAotdCard(){
  const base = getTodayAyah();
  // আরবি ও অনুবাদ সরাসরি অ্যাপের লাইসেন্স-যাচাইযোগ্য লোকাল ডেটা থেকে (হাতে লেখা নয়)
  const item = LOCAL && LOCAL.ar[base.s-1] ? { ...base, ar: LOCAL.ar[base.s-1][base.a-1] || "", bn: (LOCAL.bn[base.s-1] || [])[base.a-1] || "" } : null;
  if (!item || !item.ar) return document.createElement("div");
  const sObj = surahs.find(x => x.number === item.s);
  const sName = sObj ? sObj.englishName : item.name;
  const label = `${sName} · আয়াত ${toBn(item.a)}`;

  const card = document.createElement("div");
  card.className = "aotd-card";

  const head = document.createElement("div");
  head.className = "aotd-head";
  const badge = document.createElement("span");
  badge.className = "aotd-badge";
  badge.textContent = "{{stars}} আজকের বিশেষ আয়াত";
  const ref = document.createElement("span");
  ref.className = "aotd-ref";
  ref.textContent = label;
  head.appendChild(badge);
  head.appendChild(ref);

  const ar = document.createElement("div");
  ar.className = "aotd-ar";
  ar.textContent = item.ar;

  const bn = document.createElement("div");
  bn.className = "aotd-bn";
  bn.textContent = item.bn;

  const foot = document.createElement("div");
  foot.className = "aotd-foot";

  const openBtn = document.createElement("button");
  openBtn.className = "aotd-link";
  openBtn.textContent = "সূরায় পড়ুন →";
  openBtn.onclick = () => openSurah(item.s);

  const acts = document.createElement("div");
  acts.className = "ayah-actions";

  const playBtn = document.createElement("button");
  playBtn.className = "icon-btn";
  playBtn.title = "তেলাওয়াত শুনুন";
  playBtn.textContent = "{{volume_up}}";
  playBtn.onclick = () => {
    const aObj = { s: { number: item.s, englishName: sName }, no: item.a, ar: item.ar, bn: item.bn };
    playAyahFromList([aObj], item.s, item.a);
  };

  const copyBtn = document.createElement("button");
  copyBtn.type = "button";
  copyBtn.setAttribute("aria-label", "আয়াত কপি করুন");
  copyBtn.className = "icon-btn";
  copyBtn.title = "কপি করুন";
  copyBtn.textContent = "{{content_copy}}";
  copyBtn.onclick = () => {
    const text = `[${label}]\n${item.ar}\n\n${item.bn}\n— Quranix`;
    copyText(text, "আয়াত কপি হয়েছে!");
  };

  const nextBtn = document.createElement("button");
  nextBtn.className = "icon-btn";
  nextBtn.title = "অন্য আয়াত দেখুন";
  nextBtn.textContent = "{{refresh}}";
  nextBtn.onclick = () => {
    aotdOffset = (aotdOffset + 1) % DAILY_AYAHS.length;
    const fresh = buildAotdCard();
    card.replaceWith(fresh);
  };

  acts.appendChild(playBtn);
  acts.appendChild(copyBtn);
  acts.appendChild(nextBtn);

  foot.appendChild(openBtn);
  foot.appendChild(acts);

  card.appendChild(head);
  card.appendChild(ar);
  card.appendChild(bn);
  card.appendChild(foot);
  return card;
}

let currentReciter = lsGet("reciter", "Saood_ash-Shuraym_128kbps");
if (!RECITERS.some(r => r[0] === currentReciter)) currentReciter = RECITERS[0][0];
let autoPlayNext = lsGet("autoPlayNext", true);
let currentPlaylist = [];

const audioObj = new Audio();

const audioReciterLabel = document.getElementById("audioReciterLabel");
const audioPlayPause = document.getElementById("audioPlayPause");

function pad3(n){ return String(n).padStart(3, "0"); }
function getReciterName(id){ const f = RECITERS.find(r => r[0] === id); return f ? f[1] : RECITERS[0][1]; }

function updateAudioBarPos(){
  const navVisible = navEl && navEl.style.display !== "none";
  audioBar.classList.toggle("with-nav", navVisible);
}

function highlightPlayingCard(surahNo, ayahNo){
  document.querySelectorAll(".ayah.playing").forEach(el => el.classList.remove("playing"));
  const card = document.querySelector(`.ayah[data-key="${surahNo}:${ayahNo}"]`);
  if (card) {
    card.classList.add("playing");
    card.scrollIntoView({ behavior: "smooth", block: "center" });
  }
}

function playAyahAtIndex(idx){
  if (idx < 0 || idx >= currentPlaylist.length) {
    stopAudio();
    return;
  }
  currentPlayIdx = idx;
  const item = currentPlaylist[idx];
  const url = `https://everyayah.com/data/${currentReciter}/${pad3(item.s.number)}${pad3(item.no)}.mp3`;
  audioObj.src = url;
  audioObj.playbackRate = SPEEDS[audioSpeedIdx] || 1;
  audioTitle.textContent = `${item.s.englishName} · আয়াত ${toBn(item.no)}`;
  audioReciterLabel.textContent = getReciterName(currentReciter);
  audioBar.style.display = "block";
  updateAudioBarPos();
  audioAuto.classList.toggle("on", autoPlayNext);
  highlightPlayingCard(item.s.number, item.no);
  audioObj.play().then(() => {
    audioPlayPause.textContent = "{{pause}}";
    audioPlayPause.setAttribute("aria-label", "অডিও বিরতি দাও");
  }).catch(() => {
    showToast("অডিও লোড করা যায়নি। ইন্টারনেট সংযোগ চেক করুন।");
    audioPlayPause.textContent = "{{play_arrow}}";
    audioPlayPause.setAttribute("aria-label", "আবার চালাও");
  });
}

function playAyahFromList(list, targetSurah, targetAyah){
  currentPlaylist = list;
  const idx = list.findIndex(x => x.s.number === targetSurah && x.no === targetAyah);
  if (idx >= 0) playAyahAtIndex(idx);
}

function stopAudio(){
  audioObj.pause();
  audioObj.src = "";
  audioBar.style.display = "none";
  currentPlayIdx = -1;
  document.querySelectorAll(".ayah.playing").forEach(el => el.classList.remove("playing"));
}

audioPlayPause.onclick = () => {
  if (!audioObj.src) return;
  if (audioObj.paused) {
    audioObj.play().then(() => audioPlayPause.textContent = "{{pause}}").catch(() => {});
  } else {
    audioObj.pause();
    audioPlayPause.textContent = "{{play_arrow}}";
  }
};
document.getElementById("audioPrev").onclick = () => {
  if (currentPlayIdx > 0) playAyahAtIndex(currentPlayIdx - 1);
};
document.getElementById("audioNext").onclick = () => {
  if (currentPlayIdx + 1 < currentPlaylist.length) playAyahAtIndex(currentPlayIdx + 1);
};
audioAuto.onclick = () => {
  autoPlayNext = !autoPlayNext;
  lsSet("autoPlayNext", autoPlayNext);
  audioAuto.classList.toggle("on", autoPlayNext);
  showToast(autoPlayNext ? "অটো-প্লে চালু হয়েছে" : "অটো-প্লে বন্ধ হয়েছে");
};
document.getElementById("audioClose").onclick = stopAudio;
audioObj.onended = () => {
  if (autoPlayNext && currentPlayIdx + 1 < currentPlaylist.length) {
    playAyahAtIndex(currentPlayIdx + 1);
  } else {
    audioPlayPause.textContent = "{{play_arrow}}";
  }
};

/* Phase 4: accessible playback progress, network feedback and lock-screen controls */
(function(){
  const seek=document.getElementById('audioSeek');
  const current=document.getElementById('audioCurrentTime');
  const duration=document.getElementById('audioDuration');
  const status=document.getElementById('audioStatus');
  if(!seek||!current||!duration||!status) return;
  const bnTime=function(seconds){
    if(!Number.isFinite(seconds)||seconds<0) seconds=0;
    const m=Math.floor(seconds/60), sec=Math.floor(seconds%60);
    return toBn(m)+':'+toBn(String(sec).padStart(2,'0'));
  };
  const updateProgress=function(){
    const d=audioObj.duration, t=audioObj.currentTime||0;
    current.textContent=bnTime(t);
    if(Number.isFinite(d)&&d>0){
      duration.textContent=bnTime(d);
      if(document.activeElement!==seek) seek.value=String(Math.round(t/d*1000));
      seek.disabled=false;
    }else{duration.textContent='০:০০';seek.value='0';seek.disabled=true;}
  };
  seek.addEventListener('input',function(){
    if(Number.isFinite(audioObj.duration)&&audioObj.duration>0){
      audioObj.currentTime=(Number(seek.value)/1000)*audioObj.duration;
      updateProgress();
    }
  });
  audioObj.addEventListener('timeupdate',updateProgress);
  audioObj.addEventListener('durationchange',updateProgress);
  audioObj.addEventListener('loadedmetadata',function(){updateProgress();status.textContent='অডিও চলছে';});
  audioObj.addEventListener('waiting',function(){status.textContent='অডিও লোড হচ্ছে…';});
  audioObj.addEventListener('playing',function(){status.textContent='অডিও চলছে';audioPlayPause.textContent='{{pause}}';});
  audioObj.addEventListener('pause',function(){if(audioObj.src)status.textContent='বিরতি';});
  audioObj.addEventListener('error',function(){
    if(!audioObj.src)return;
    status.textContent=navigator.onLine?'অডিও পাওয়া যাচ্ছে না — আবার চেষ্টা করো':'ইন্টারনেট সংযোগ নেই';
    audioPlayPause.textContent='{{play_arrow}}';
  });
  audioObj.addEventListener('emptied',function(){seek.value='0';seek.disabled=true;current.textContent='০:০০';duration.textContent='০:০০';status.textContent='বন্ধ';});
  window.addEventListener('online',function(){if(status.textContent==='ইন্টারনেট সংযোগ নেই')status.textContent='সংযোগ ফিরে এসেছে';});
  window.addEventListener('offline',function(){if(audioObj.paused)status.textContent='অফলাইন — সংরক্ষিত অডিও থাকলে চালানো যাবে';});
  if('mediaSession' in navigator){
    const action=function(name,handler){try{navigator.mediaSession.setActionHandler(name,handler);}catch(e){}}
    action('play',function(){audioObj.play().catch(function(){});});
    action('pause',function(){audioObj.pause();});
    action('previoustrack',function(){if(currentPlayIdx>0)playAyahAtIndex(currentPlayIdx-1);});
    action('nexttrack',function(){if(currentPlayIdx+1<currentPlaylist.length)playAyahAtIndex(currentPlayIdx+1);});
    audioObj.addEventListener('loadedmetadata',function(){
      const item=currentPlaylist[currentPlayIdx];
      if(item&&'MediaMetadata' in window){
        try{navigator.mediaSession.metadata=new MediaMetadata({title:'আয়াত '+toBn(item.no),artist:getReciterName(currentReciter),album:item.s.englishName+' · Quranix'});}catch(e){}
      }
      updateProgress();
    });
    audioObj.addEventListener('timeupdate',function(){
      if(navigator.mediaSession.setPositionState&&Number.isFinite(audioObj.duration)&&audioObj.duration>0){
        try{navigator.mediaSession.setPositionState({duration:audioObj.duration,playbackRate:audioObj.playbackRate,position:Math.min(audioObj.currentTime,audioObj.duration)});}catch(e){}
      }
    });
  }
  updateProgress();
})();


function lsGet(k,d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
function lsSet(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

function safeHtml(html){
  const doc = new DOMParser().parseFromString("<div>" + String(html) + "</div>", "text/html");
  const root = doc.body.firstChild;
  root.querySelectorAll("script,style,iframe,object,embed,link,meta,form,input,button,textarea,svg,math").forEach(n => n.remove());
  root.querySelectorAll("*").forEach(el => {
    Array.from(el.attributes).forEach(a => {
      const n = a.name.toLowerCase();
      if (n.startsWith("on") || n === "href" || n === "src" || n === "xlink:href" || n === "style") el.removeAttribute(a.name);
    });
  });
  return root.innerHTML;
}
