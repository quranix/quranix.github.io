<link rel="icon" type="image/png" sizes="32x32" href="icon-32x32.png?v=8">
<link rel="icon" type="image/png" sizes="48x48" href="icon-48x48.png?v=8">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192x192.png?v=8">

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f5;--outer-bg:#e5e7eb;--card:#fff;--text:#1d1d1b;--muted:#6b6b66;--accent:#0f6b4f;--line:#e5e5e5;--fs:30px;--tile-bg:#f5f5f5;--tile-hover:#e5e7eb;--tile-shadow:0 2px 10px rgba(0,0,0,0.05)}
@media (prefers-color-scheme:dark){:root{--bg:#121413;--outer-bg:#121413;--card:#1b1e1c;--text:#ecebe6;--muted:#9a9a93;--accent:#4cc79b;--line:#2a2e2b;--tile-bg:#232825;--tile-hover:#2e3531;--tile-shadow:0 4px 14px rgba(0,0,0,0.22)}}
[data-theme="dark"]{--bg:#121413;--outer-bg:#121413;--card:#1b1e1c;--text:#ecebe6;--muted:#9a9a93;--accent:#4cc79b;--line:#2a2e2b;--tile-bg:#232825;--tile-hover:#2e3531;--tile-shadow:0 4px 14px rgba(0,0,0,0.22)}
[data-theme="light"]{--bg:#f5f5f5;--outer-bg:#e5e7eb;--card:#fff;--text:#1d1d1b;--muted:#6b6b66;--accent:#0f6b4f;--line:#e5e5e5;--tile-bg:#f5f5f5;--tile-hover:#e5e7eb;--tile-shadow:0 2px 10px rgba(0,0,0,0.05)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--outer-bg);color:var(--text);font-family:"Hind Siliguri",sans-serif;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;background:var(--bg);z-index:5;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));height:auto;min-height:62px;display:flex;align-items:center;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;width:100%;min-height:38px}
h1{font-size:20px;margin:0;flex:1;color:var(--accent)}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:6px 12px}
input{width:100%;margin-top:8px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
.tabs{display:flex;gap:8px;margin-top:8px;overflow-x:auto}
.tabs button{white-space:nowrap}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
main{padding:10px 14px 90px;max-width:720px;margin:auto;background:var(--bg);min-height:calc(100vh - 62px)}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;cursor:pointer}
.num{min-width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.mid{flex:1}.mid b{display:block}.mid small{color:var(--muted)}
.ar-name{font-family:"Amiri Quran","Traditional Arabic",serif;font-size:22px;color:var(--accent)}
.ayah{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.ayah .ar{font-family:"Amiri Quran","Traditional Arabic",serif;font-size:var(--fs);line-height:2.1;direction:rtl;text-align:right}
.ayah .bn{margin-top:10px;line-height:1.7;color:var(--text)}
.ayah .no{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.ayah-actions{display:flex;gap:6px;align-items:center}
.icon-btn{border:0;background:none;font-size:16px;cursor:pointer;padding:4px 6px;border-radius:6px;color:var(--muted)}
.icon-btn:hover{background:var(--line);color:var(--text)}
.star{border:0;background:none;font-size:22px;color:var(--accent);padding:0 4px}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:6px 14px;border-radius:20px;font-size:13px;z-index:99;animation:fadeInOut 2s ease}
@keyframes fadeInOut{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1;transform:translate(-50%,0)}80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-10px)}}
.resume{background:var(--accent);color:#fff;border-radius:12px;padding:12px;margin:8px 0;cursor:pointer;text-align:center}
.bism{font-family:"Amiri Quran","Traditional Arabic",serif;font-size:calc(var(--fs) + 2px);text-align:center;direction:rtl;margin:16px 0;color:var(--accent)}
.sh{margin:22px 0 6px;padding:10px;border-radius:10px;background:var(--accent);color:#fff;text-align:center}
.msg{text-align:center;color:var(--muted);padding:30px 0}

nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;border-radius:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;font-size:11px;color:var(--muted)}
nav button b{font-size:20px;font-weight:400}
nav button.on{color:var(--accent);font-weight:600}
select{font:inherit;width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.hero{background:var(--accent);color:#fff;border-radius:14px;padding:18px 12px;text-align:center;margin:8px 0}
.hero small{opacity:.85}.hero .big{font-size:26px;font-weight:700;margin:4px 0}.hero .cd{font-size:20px;font-variant-numeric:tabular-nums}
.prow{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:8px 0}
.prow.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.prow.on b{color:var(--accent)}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:14px}
.tw{display:flex;flex-direction:column;align-items:center;gap:16px;margin:10px 0}
.tbtn{width:210px;height:210px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.tbtn:active{transform:scale(.97)}
.tcount{font-size:60px;font-weight:700;line-height:1}
.tbtn small{margin-top:8px;opacity:.9}
.src{font-size:12px;color:var(--muted);margin-top:8px}

.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-content{background:var(--card);color:var(--text);border-radius:14px;max-width:600px;width:100%;max-height:80vh;overflow-y:auto;padding:20px;border:1px solid var(--line);box-shadow:0 10px 25px rgba(0,0,0,0.2)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:8px}
.modal-header h3{margin:0;color:var(--accent);font-size:18px}
.close-btn{background:none;border:0;font-size:20px;cursor:pointer;color:var(--muted)}
.tafseer-body{line-height:1.8;font-size:15px}
.header-tools{display:flex;align-items:center;gap:8px;height:100%}
.header-tools input{margin:0;width:115px;padding:6px 10px;font-size:13px;border-radius:8px}
.header-btn{padding:6px 10px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--tile-bg);color:var(--text);border-radius:10px;cursor:pointer;font-size:16px;height:38px;min-width:38px;transition:background 0.2s ease, border-color 0.2s ease}

.ayah.playing{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);background:color-mix(in srgb, var(--accent) 6%, var(--card))}
.audio-bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:20;display:none;box-shadow:0 -4px 16px rgba(0,0,0,0.12)}
.audio-bar.with-nav{bottom:58px}
.audio-inner{max-width:720px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.audio-info{flex:1;min-width:0}
.audio-info b{display:block;font-size:13px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.audio-info small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.audio-ctrls{display:flex;align-items:center;gap:6px}
.audio-ctrls button{padding:6px 10px;border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.audio-ctrls button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.audio-ctrls button.on{border-color:var(--accent);color:var(--accent)}

.aotd-card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:14px;margin:10px 0 14px;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.aotd-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.aotd-badge{font-size:12px;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:5px}
.aotd-ref{font-size:12px;color:var(--muted)}
.aotd-ar{font-family:"Amiri Quran","Traditional Arabic",serif;font-size:calc(var(--fs) - 4px);line-height:2;direction:rtl;text-align:right;margin:6px 0}
.aotd-bn{font-size:14px;line-height:1.65;color:var(--text);margin-top:6px}
.aotd-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.aotd-link{font-size:12px;color:var(--accent);background:none;border:0;padding:4px 0;cursor:pointer;font-weight:600}

.quick-jump{display:flex;gap:6px;margin-top:8px}
.quick-jump select,.quick-jump input{margin:0;padding:7px 9px;font-size:13px;border-radius:8px;height:36px}
.quick-jump button{padding:6px 12px;font-size:13px;border-radius:8px;background:var(--accent);color:#fff;border:0;cursor:pointer;white-space:nowrap;height:36px}
.goal-bar{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;display:flex;flex-direction:column;gap:8px}
.goal-top{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.goal-track{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.goal-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}
.note-box{margin-top:10px;padding:10px 12px;background:color-mix(in srgb, var(--accent) 7%, var(--card));border-left:3px solid var(--accent);border-radius:8px;font-size:13px;line-height:1.6;color:var(--text)}
.note-box-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--accent);font-weight:600;margin-bottom:4px}
.ayah.read-done{border-left:3px solid var(--accent)}
.speed-btn{font-size:12px!important;font-weight:600;min-width:42px}

.p3-tabs{display:flex;gap:8px;margin-bottom:12px}
.p3-tabs button{flex:1;padding:8px;border-radius:10px;font-weight:600;cursor:pointer}
.p3-tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.p3-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.p3-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.p3-grid label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.p3-grid input,.p3-grid select{margin:0;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.qibla-box{display:flex;flex-direction:column;align-items:center;padding:16px 10px;text-align:center}
.compass-dial{position:relative;width:230px;height:230px;border-radius:50%;border:4px solid var(--accent);background:var(--card);box-shadow:0 6px 20px rgba(0,0,0,0.08);margin:14px auto;display:flex;align-items:center;justify-content:center}
.compass-ring{position:absolute;inset:0;transition:transform 0.15s ease-out}
.compass-mark{position:absolute;font-size:13px;font-weight:700;color:var(--muted)}
.compass-mark.n{top:8px;left:50%;transform:translateX(-50%);color:#d9534f}
.compass-mark.s{bottom:8px;left:50%;transform:translateX(-50%)}
.compass-mark.e{right:10px;top:50%;transform:translateY(-50%)}
.compass-mark.w{left:10px;top:50%;transform:translateY(-50%)}
.kaaba-pointer{position:absolute;inset:14px;transition:transform 0.2s ease-out}
.kaaba-badge{position:absolute;top:-6px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:3px 8px;border-radius:12px;font-size:13px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,0.2)}
.kaaba-needle{position:absolute;top:24px;bottom:50%;left:50%;width:4px;margin-left:-2px;background:var(--accent);border-radius:4px}
.compass-center{width:14px;height:14px;border-radius:50%;background:var(--accent);z-index:2;border:2px solid var(--card)}
.qibla-aligned{border-color:#16a34a!important;box-shadow:0 0 0 4px rgba(22,163,74,0.2)!important}
.alert-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.alert-row:last-child{border-bottom:0}
.switch-btn{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer}
.switch-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}

:root{--ar-font:"Amiri Quran","Traditional Arabic",serif;--bn-font:"Hind Siliguri",sans-serif;--bn-fs:16px}
html,body,button,input,select,textarea{font-family:var(--bn-font)}
body{font-size:var(--bn-fs)}
.ayah .ar,.ar-name,.bism,.aotd-ar{font-family:var(--ar-font)}
.ayah .bn,.aotd-bn{font-size:var(--bn-fs)}
.set-sec{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.set-sec:first-child{border-top:0;padding-top:0;margin-top:0}
.set-title{font-weight:700;font-size:14px;margin-bottom:8px;color:var(--accent);display:flex;align-items:center;gap:6px}
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
.btn-danger{color:#dc2626;border-color:#dc2626}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.offline-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 8px;border-radius:12px;background:color-mix(in srgb, var(--accent) 12%, var(--card));color:var(--accent);font-weight:600}
.help-step{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px;line-height:1.6}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ===== Top bar: search icon removed, only Quranix + Moon + Grid ===== */
#q{ display:none !important; }
header{ background:var(--bg); border-bottom:1px solid var(--line); }
h1{ color:var(--accent) !important; }
#controls{ display:none !important; }
.aotd-card, .goal-bar, .resume{ display:none !important; }
.home-hero{ display:flex; overflow:hidden; border:1px solid var(--line); border-radius:16px; background:var(--card); margin:10px 0 12px; }
.home-hero-left{ flex:1; background:var(--accent); color:#fff; padding:14px; display:flex; align-items:center; gap:10px; cursor:pointer; }
.home-hero-left .play{ font-size:22px; }
.home-hero-left .lbl{ font-size:13px; opacity:.9; }
.home-hero-left .val{ font-size:16px; font-weight:700; line-height:1.3; }
.home-hero-right{ flex:1; padding:14px; cursor:pointer; }
.home-hero-right .top{ display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--accent); }
.home-hero-right .val{ font-size:16px; font-weight:700; color:var(--text); margin:6px 0 8px; }
.home-hero-right .track{ height:6px; background:var(--line); border-radius:99px; overflow:hidden; }
.home-hero-right .fill{ height:100%; background:var(--accent); border-radius:99px; }
.item{ border-radius:16px !important; padding:14px !important; }
.num{ min-width:48px !important; height:48px !important; font-size:18px !important; }
/* Grid dropdown - only list, no collapsible expansion */
.header-tools{ position:relative; }
#gridDropdown{ display:none; position:absolute; top:52px; right:0; width:280px; max-height:calc(100vh - 150px - env(safe-area-inset-bottom)); overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; z-index:60; background:var(--tile-bg); border:1px solid var(--line); border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,.25); padding:8px; text-align:left; }
#gridDropdown.open{ display:block; }
.g-menu-item{ display:flex; align-items:center; justify-content:space-between; width:100%; min-height:48px; padding:13px 12px; border:1px solid transparent; border-bottom:1px solid var(--line); background:var(--tile-bg); color:var(--text); font:inherit; font-size:14px; cursor:pointer; text-align:left; border-radius:10px; margin:4px 0; box-sizing:border-box; transition:background 0.2s ease, border-color 0.2s ease, transform 0.15s ease; }
.g-menu-item:last-child{ border-bottom:none; }
.g-menu-item:hover{ background:var(--tile-hover); border-color:var(--line); }
.g-menu-item:active{ background:var(--line); transform:scale(0.98); }
.g-menu-item small{ color:var(--muted); }
.install-menu-item{background:linear-gradient(110deg,rgba(15,107,79,.12),rgba(15,107,79,.035));border:1px solid rgba(15,107,79,.28);margin-top:8px}
.install-menu-item:hover{background:linear-gradient(110deg,rgba(15,107,79,.20),rgba(15,107,79,.08));border-color:var(--accent)}
.install-menu-copy{display:flex;flex-direction:column;gap:2px;min-width:0}
.install-menu-copy strong{font-size:14px;font-weight:700;color:var(--accent);line-height:1.35}
.install-menu-copy small{font-size:11px;color:var(--muted);font-weight:400}
.install-menu-item>#gPwaMini{flex-shrink:0;color:var(--accent);font-size:12px;font-weight:600;margin-left:8px}
[data-theme="dark"] .install-menu-item{background:linear-gradient(110deg,rgba(76,199,155,.16),rgba(76,199,155,.05));border-color:rgba(76,199,155,.32)}
[data-theme="dark"] .install-menu-copy strong,[data-theme="dark"] .install-menu-item>#gPwaMini{color:var(--accent)}
/* Center Popup - middle of screen */
#gridPopupOverlay{ display:none; position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.55); align-items:center; justify-content:center; padding:16px; touch-action:manipulation; }
#gridPopupOverlay.open{ display:flex; }
#gridPopupBox{ width:100%; max-width:360px; max-height:82vh; overflow-y:auto; background:var(--tile-bg); border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:0 20px 40px rgba(0,0,0,.3); }
#gridPopupBox h3{ margin:0 0 12px; font-size:16px; }
#gridPopupBox{position:relative}
.pp-close{position:absolute;top:10px;right:10px;z-index:2;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:20px;line-height:1;cursor:pointer;color:var(--text);padding:0}
#gridPopupBox h3{min-height:36px;padding:5px 48px 0 0;display:flex;align-items:center}
.pp-tabs{ display:flex; gap:6px; margin-bottom:12px; }
.pp-tabs button{ flex:1; padding:9px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); font:inherit; font-size:13px; cursor:pointer; }
.pp-tabs button.on{ background:var(--accent); color:#fff; border-color:var(--accent); }

<script>
/* {{icon}} / {{icon:f}} tokens in any text become Material icon spans (also for dynamically added text) */
(function(){
  var RX=/\{\{([a-z_0-9]+)(:f)?\}\}/g, SKIP={OPTION:1,TITLE:1,TEXTAREA:1}, NOCONV={SCRIPT:1,STYLE:1};
  function conv(n){
    var s=n.nodeValue; if(!s||s.indexOf('{{')<0) return;
    var p=n.parentNode; if(!p||NOCONV[p.nodeName]) return;
    if(SKIP[p.nodeName]){ n.nodeValue=s.replace(RX,'').replace(/^\s+/,''); return; }
    var f=document.createDocumentFragment(), last=0, m; RX.lastIndex=0;
    while((m=RX.exec(s))){
      if(m.index>last) f.appendChild(document.createTextNode(s.slice(last,m.index)));
      var i=document.createElement('span'); i.className='ms'+(m[2]?' f':''); i.setAttribute('aria-hidden','true'); i.textContent=m[1]; f.appendChild(i);
      last=RX.lastIndex;
    }
    if(last<s.length) f.appendChild(document.createTextNode(s.slice(last)));
    p.replaceChild(f,n);
  }
  function walk(r){
    if(r.nodeType===3){ conv(r); return; }
    if(r.nodeType!==1||r.nodeName==='SCRIPT'||r.nodeName==='STYLE') return;
    var w=document.createTreeWalker(r,NodeFilter.SHOW_TEXT,null), a=[], x;
    while((x=w.nextNode())) if(x.nodeValue.indexOf('{{')>=0) a.push(x);
    a.forEach(conv);
  }
  walk(document.body);
  new MutationObserver(function(ms){
    ms.forEach(function(m){
      if(m.type==='characterData') conv(m.target);
      else m.addedNodes.forEach(walk);
    });
  }).observe(document.body,{childList:true,subtree:true,characterData:true});
})();
</script>

<script>
const LOCAL = window.QURAN || null;
const API = "https://api.alquran.cloud/v1";

/* --- অডিও স্পিড কন্ট্রোল --- */
const SPEEDS = [1, 1.25, 1.5, 0.75];
let audioSpeedIdx = lsGet("audioSpeedIdx", 0);
const audioSpeedBtn = document.getElementById("audioSpeed");
if (audioSpeedBtn) {
  audioSpeedBtn.textContent = SPEEDS[audioSpeedIdx] + "x";
  audioSpeedBtn.onclick = () => {
    audioSpeedIdx = (audioSpeedIdx + 1) % SPEEDS.length;
    lsSet("audioSpeedIdx", audioSpeedIdx);
    const rate = SPEEDS[audioSpeedIdx];
    audioObj.playbackRate = rate;
    audioSpeedBtn.textContent = rate + "x";
    showToast("তেলাওয়াতের গতি: " + rate + "x");
  };
}

/* --- ব্যক্তিগত আয়াত নোট (Personal Notes) --- */
let ayahNotes = lsGet("notes", {});
function saveAyahNote(k, text){
  const trimmed = text.trim();
  if (trimmed) ayahNotes[k] = trimmed;
  else delete ayahNotes[k];
  lsSet("notes", ayahNotes);
}

function openNoteEditor(surahNo, ayahNo, label, onSaved){
  const k = surahNo + ":" + ayahNo;
  const overlay = document.createElement("div"); overlay.className = "modal-overlay";
  const content = document.createElement("div"); content.className = "modal-content";

  const header = document.createElement("div"); header.className = "modal-header";
  const h3 = document.createElement("h3"); h3.textContent = "ব্যক্তিগত নোট · " + label;
  const close = document.createElement("button"); close.className = "close-btn"; close.textContent = "{{close}}";
  close.onclick = () => overlay.remove();
  header.appendChild(h3); header.appendChild(close);
  content.appendChild(header);

  const ta = document.createElement("textarea");
  ta.rows = 5;
  ta.placeholder = "এই আয়াত সম্পর্কে আপনার নোট বা শিক্ষা লিখে রাখুন...";
  ta.style.cssText = "width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;resize:vertical;";
  ta.value = ayahNotes[k] || "";
  content.appendChild(ta);

  const row = document.createElement("div");
  row.style.cssText = "display:flex;gap:8px;margin-top:12px;justify-content:flex-end;";
  if (ayahNotes[k]) {
    const delBtn = document.createElement("button");
    delBtn.textContent = "মুছুন";
    delBtn.style.color = "#d9534f";
    delBtn.onclick = () => {
      saveAyahNote(k, "");
      overlay.remove();
      showToast("নোট মুছে ফেলা হয়েছে");
      if (onSaved) onSaved("");
    };

function todayStr(){

  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
let goalData = lsGet("goal", { target: 10, date: todayStr(), readKeys: [] });
if (goalData.date !== todayStr()) {
  goalData = { target: goalData.target || 10, date: todayStr(), readKeys: [] };

}

function toggleReadAyah(k){
  if (goalData.date !== todayStr()) {
    goalData = { target: goalData.target || 10, date: todayStr(), readKeys: [] };
  }
  const idx = goalData.readKeys.indexOf(k);
  let marked = false;
  if (idx >= 0) {

function buildGoalCard(){

  const count = goalData.readKeys.length;

/* --- দ্রুত সূরা ও আয়াত নেভিগেশন (Quick Jump) --- */
function initQuickJump(){
  const sSel = document.getElementById("jumpSurah");
  const aInp = document.getElementById("jumpAyah");
  const goBtn = document.getElementById("jumpGo");
  if (!sSel || !aInp || !goBtn) return;
  sSel.innerHTML = "";
  surahs.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s.number;
    opt.textContent = `${toBn(s.number)}. ${s.englishName} (${toBn(s.numberOfAyahs)})`;
    sSel.appendChild(opt);
  });
  sSel.onchange = () => {
    const s = surahs.find(x => x.number === +sSel.value);
    if (s) aInp.max = s.numberOfAyahs;
  };
  const doJump = () => {
    const sn = +sSel.value || 1;
    const s = surahs.find(x => x.number === sn);
    const maxA = s ? s.numberOfAyahs : 286;
    let an = parseInt(aInp.value, 10) || 1;
    if (an < 1) an = 1;
    if (an > maxA) {
      showToast(`এই সূরায় মোট আয়াত ${toBn(maxA)}টি`);
      an = maxA;
    }
    openSurah(sn, 0, an);
  };
  goBtn.onclick = doJump;
  aInp.onkeydown = (e) => { if (e.key === "Enter") doJump(); };
}

function lsGet(k,d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
function lsSet(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

function safeHtml(html){
  const doc = new DOMParser().parseFromString("<div>" + String(html) + "</div>", "text/html");
  const root = doc.body.firstChild;
  root.querySelectorAll("script,style,iframe,object,embed,link,meta,form,input,button,textarea,svg,math").forEach(n => n.remove());
  root.querySelectorAll("*").forEach(el => {
    Array.from(el.attributes).forEach(a => {
      const n = a.name.toLowerCase();
      if (n.startsWith("on") || n === "href" || n === "src" || n === "xlink:href" || n === "style") el.removeAttribute(a.name);
    });
  });
  return root.innerHTML;
}

const TAFSIRS = [[381,"তাফসির ফাতহুল মাজীদ","bn-tafisr-fathul-majid"]];
const TAFSIR_CDN = "https://cdn.jsdelivr.net/gh/spa5k/tafsir_api@v1.2.3/tafsir/";
function getTafsirSlug(id){ const item=TAFSIRS.find(t=>Number(t[0])===Number(id)); return item?item[2]:""; }

function copyText(text, okMsg){
  const done = () => showToast(okMsg || "কপি হয়েছে!");
  const fallback = () => {
    try {
      const t = document.createElement("textarea");
      t.value = text; t.setAttribute("readonly", "");
      t.style.cssText = "position:fixed;top:0;left:0;opacity:0;";
      document.body.appendChild(t); t.select(); t.setSelectionRange(0, text.length);
      const ok = document.execCommand("copy"); t.remove();
      ok ? done() : showToast("কপি করা যায়নি।");
    } catch(e) { showToast("কপি করা যায়নি।"); }
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done).catch(fallback);
  else fallback();
}
async function openTafseer(surahNo, ayahNo, label){
  const tfName = (TAFSIRS.find(t => t[0] === tafsirId) || TAFSIRS[0])[1];
  const overlay = document.createElement("div"); overlay.className = "modal-overlay";
  const content = document.createElement("div"); content.className = "modal-content";
  
  const header = document.createElement("div"); header.className = "modal-header";
  const h3 = document.createElement("h3"); h3.textContent = tfName + " · " + label;
  const close = document.createElement("button"); close.className = "close-btn"; close.textContent = "{{close}}";
  close.onclick = () => overlay.remove();
  header.appendChild(h3); header.appendChild(close);
  content.appendChild(header);
  
  const body = document.createElement("div"); body.className = "tafseer-body";
  body.textContent = "তাফসির লোড হচ্ছে…";
  content.appendChild(body);
  overlay.appendChild(content);
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  document.body.appendChild(overlay);

  try {
    const cacheKey = `tafseer:${tafsirId}:${surahNo}:${ayahNo}`;
    const cached = cacheGet(cacheKey);
    if (cached) {
      body.innerHTML = safeHtml(cached);
      return;
    }
    if (window.quranixPackageStore) {
      const offlineTafsir = await window.quranixPackageStore.getTafsir(tafsirId, surahNo, ayahNo);
      if (offlineTafsir) {
        body.innerHTML = safeHtml(offlineTafsir);
        return;
      }
    }
    const tafsirSlug = getTafsirSlug(tafsirId);
    if (!tafsirSlug) throw new Error("Unknown tafsir edition");
    const r = await fetch(`${TAFSIR_CDN}${tafsirSlug}/${surahNo}/${ayahNo}.json`);
    if (r.status === 404) {
      body.textContent = "এই আয়াতের জন্য নির্বাচিত তাফসিরে আলাদা ব্যাখ্যা নেই।";
      return;
    }
    if (!r.ok) throw new Error("Tafsir API HTTP " + r.status);
    const j = await r.json();
    if (j && j.text) {
      cacheSet(cacheKey, j.text);
      body.innerHTML = safeHtml(j.text);
    } else {
      body.textContent = "এই আয়াতের তাফসির পাওয়া যায়নি।";
    }
  } catch(e) {
    body.textContent = "তাফসির লোড করা যায়নি। ইন্টারনেট সংযোগ চেক করুন।";
  }
}

async function getZakariaSurahTranslation(surahNo){
  const cacheKey = `quranenc_zakaria:${surahNo}`;

  const r = await fetch(`https://quranenc.com/api/v1/translation/sura/bengali_zakaria/${surahNo}`);
  if (!r.ok) throw new Error("QuranEnc HTTP " + r.status);
  const j = await r.json();
  const rows = Array.isArray(j) ? j : (Array.isArray(j.result) ? j.result : (Array.isArray(j.translations) ? j.translations : []));
  if (!rows.length) throw new Error("QuranEnc অনুবাদের ডেটা পাওয়া যায়নি");
  const cleaned = rows.slice().sort((a,b)=>Number(a.aya||a.ayah||0)-Number(b.aya||b.ayah||0)).map(row => String(row.translation || row.text || "").replace(/<sup[^>]*>.*?<\/sup>/gi, "").replace(/<[^>]+>/g, "").trim());
  if (cleaned.some(text => !text)) throw new Error("QuranEnc অনুবাদে খালি আয়াত রয়েছে");
  cacheSet(cacheKey, cleaned);
  return cleaned;
}

async function getQuranComTrans(endpoint, resourceId){
  const cacheKey = `qcom_tr:${resourceId}:${endpoint}`;
  const cached = cacheGet(cacheKey);
  if (cached) return cached;
  const r = await fetch(`https://api.quran.com/api/v4/quran/translations/${resourceId}?${endpoint}`);
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  if (!j || !j.translations) throw new Error("API error");
  const cleaned = j.translations.map(t => (t.text || "").replace(/<sup[^>]*>.*?<\/sup>/gi, "").replace(/<[^>]+>/g, "").trim());
  cacheSet(cacheKey, cleaned);
  return cleaned;
}

async function loadSurahAyahs(n){
  if (window.quranixPackageStore) {
    try {
      const offlineChapter = await window.quranixPackageStore.getTranslation(currentEdition, n);
      if (offlineChapter && offlineChapter.length) {
        const meta = (LOCAL && LOCAL.meta[n-1]) || (surahs.find(x => x.number === n) || {});
        const chapterInfo = {number:n, name:meta.name || "", englishName:meta.en || meta.englishName || "সূরা " + n};
        return offlineChapter.map(row => ({s:chapterInfo, no:row.no, ar:row.ar, bn:row.bn || ""}));
      }
    } catch(e) {}
  }
  if (LOCAL && currentEdition === "bn.bengali") {
    const m = LOCAL.meta[n-1], s = {number:n,name:m.name,englishName:m.en};
    return LOCAL.ar[n-1].map((t,i) => ({s,no:i+1,ar:t,bn:LOCAL.bn[n-1][i] || ""}));
  }
  if (currentEdition === "bn.zakaria") {
    const trList = await getZakariaSurahTranslation(n);
    if (LOCAL) {
      const m = LOCAL.meta[n-1], s = {number:n,name:m.name,englishName:m.en};
      return LOCAL.ar[n-1].map((t,i) => ({s,no:i+1,ar:t,bn:trList[i] || ""}));
    }
    const d = await getJSON("/surah/" + n + "/quran-uthmani");
    const s = {number:n,name:d.name,englishName:d.englishName};
    return d.ayahs.map((a,i) => ({s,no:a.numberInSurah,ar:a.text,bn:trList[i] || ""}));
  }
  const d = await getJSON("/surah/" + n + "/editions/quran-uthmani," + currentEdition);
  const s = {number:n,name:d[0].name,englishName:d[0].englishName};
  return d[0].ayahs.map((a,i) => ({s,no:a.numberInSurah,ar:a.text,bn:d[1].ayahs[i] ? d[1].ayahs[i].text : ""}));
}

async function loadJuzAyahs(j){
  if (LOCAL && currentEdition === "bn.bengali") {
    const out = [];
    LOCAL.juz.forEach((arr, si) => arr.forEach((jj, i) => {
      if (jj === j) { const m = LOCAL.meta[si]; out.push({s:{number:si+1,name:m.name,englishName:m.en},no:i+1,ar:LOCAL.ar[si][i],bn:LOCAL.bn[si][i] || ""}); }
    }));
    return out;
  }
  if (currentEdition === "bn.zakaria") {
    if (LOCAL) {
      const translations = {};
      for (let si=0;si<LOCAL.juz.length;si++) {
        if (LOCAL.juz[si].some(jj => jj === j)) translations[si+1] = await getZakariaSurahTranslation(si+1);
      }
      const out = [];
      LOCAL.juz.forEach((arr, si) => arr.forEach((jj, i) => {
        if (jj === j) { const m=LOCAL.meta[si]; out.push({s:{number:si+1,name:m.name,englishName:m.en},no:i+1,ar:LOCAL.ar[si][i],bn:translations[si+1][i]||""}); }
      }));
      return out;
    }
    const d = await getJSON("/juz/" + j + "/quran-uthmani");
    const translations = {};
    const surahNumbers = Array.from(new Set(d.ayahs.map(a=>a.surah.number)));
    for (const sn of surahNumbers) translations[sn] = await getZakariaSurahTranslation(sn);
    return d.ayahs.map(a => ({s:{number:a.surah.number,name:a.surah.name,englishName:a.surah.englishName},no:a.numberInSurah,ar:a.text,bn:translations[a.surah.number][a.numberInSurah-1]||""}));
  }
  const d = await getJSON("/juz/" + j + "/editions/quran-uthmani," + currentEdition);
  return d[0].ayahs.map((a,i) => ({s:{number:a.surah.number,name:a.surah.name,englishName:a.surah.englishName},no:a.numberInSurah,ar:a.text,bn:d[1].ayahs[i] ? d[1].ayahs[i].text : ""}));
}

const D2R = Math.PI / 180;
const dsin = d => Math.sin(d*D2R), dcos = d => Math.cos(d*D2R), dtan = d => Math.tan(d*D2R);
const darcsin = x => Math.asin(x)/D2R, darccos = x => Math.acos(x)/D2R;
const darctan2 = (y,x) => Math.atan2(y,x)/D2R, darccot = x => Math.atan(1/x)/D2R;
const fixA = a => a - 360*Math.floor(a/360), fixH = a => a - 24*Math.floor(a/24);

/* হিসাব পদ্ধতিসমূহ (Calculation Methods) */

  karachi: { name: "করাচি (ইসলামিক সায়েন্সেস বিশ্ববিদ্যালয়)", fajr: 18, isha: 18, ishaMin: 0 },
  mwl:     { name: "মুসলিম ওয়ার্ল্ড লীগ (MWL)", fajr: 18, isha: 17, ishaMin: 0 },
  isna:    { name: "ইসনা (ISNA - উত্তর আমেরিকা)", fajr: 15, isha: 15, ishaMin: 0 },
  egypt:   { name: "মিশরীয় জেনারেল অথরিটি", fajr: 19.5, isha: 17.5, ishaMin: 0 },
  makkah:  { name: "উম্মুল কুরা (মক্কা)", fajr: 18.5, isha: 0, ishaMin: 90 }
};

let lastTriggeredKey = "";

function playAdhanTone(type){
  if (type === "silent") return;
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const notes = type === "adhan"
      ? [[440, 0, 0.55], [493.88, 0.6, 0.55], [523.25, 1.2, 0.9], [493.88, 2.2, 0.55], [440, 2.8, 1.1]]
      : [[587.33, 0, 0.25], [880, 0.3, 0.45]];
    notes.forEach(([freq, start, dur]) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type === "adhan" ? "sine" : "triangle";
      osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
      gain.gain.setValueAtTime(0.001, ctx.currentTime + start);
      gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + start + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + dur + 0.05);
    });
  } catch(e){}
}

    } catch(e){}
  }
}

function julian(y,m,d){ if (m <= 2) { y -= 1; m += 12; } const A = Math.floor(y/100), B = 2 - A + Math.floor(A/4); return Math.floor(365.25*(y+4716)) + Math.floor(30.6001*(m+1)) + d + B - 1524.5; }
function sunPos(jd){
  const D = jd - 2451545.0, g = fixA(357.529 + 0.98560028*D), q = fixA(280.459 + 0.98564736*D);
  const L = fixA(q + 1.915*dsin(g) + 0.020*dsin(2*g)), e = 23.439 - 0.00000036*D;
  const RA = darctan2(dcos(e)*dsin(L), dcos(L))/15;
  return { eqt: q/15 - fixH(RA), decl: darcsin(dsin(e)*dsin(L)) };
}
function getEffectiveTz(date){
  const baseTz = tzMode === "auto" ? (-date.getTimezoneOffset()/60) : Number(tzMode);
  return baseTz + (tzMode === "auto" ? 0 : (Number(dstAdd) || 0));
}
function calcDay(date, lat, lng, asrF){
  const m = CALC_METHODS[calcMethodKey] || CALC_METHODS.karachi;
  const tz = getEffectiveTz(date);
  const jd = julian(date.getFullYear(), date.getMonth()+1, date.getDate()) - lng/360;
  const pos = t => sunPos(jd + t), mid = t => fixH(12 - pos(t).eqt);
  const ang = (a, t, ccw) => {
    const p = pos(t), x = (-dsin(a) - dsin(p.decl)*dsin(lat)) / (dcos(p.decl)*dcos(lat));
    if (x > 1 || x < -1) return NaN;
    const v = darccos(x)/15; return mid(t) + (ccw ? -v : v);
  };
  const asr = t => ang(-darccot(asrF + dtan(Math.abs(lat - pos(t).decl))), t, false);
  const maghribH = ang(0.833, 18/24, false);
  const ishaH = m.ishaMin > 0 ? (maghribH + m.ishaMin/60) : ang(m.isha, 18/24, false);
  const raw = {
    fajr: ang(m.fajr, 5/24, true),
    sunrise: ang(0.833, 6/24, true),
    dhuhr: mid(12/24) + 1/60,
    asr: asr(13/24),
    maghrib: maghribH,
    isha: ishaH
  };
  const base = new Date(date.getFullYear(), date.getMonth(), date.getDate()).getTime(), out = {};
  for (const k in raw) { const h = raw[k] + tz - lng/15; out[k] = isNaN(h) ? null : new Date(Math.round((base + h*3600000)/60000)*60000); }
  return out;
}

function fmtTime(d){ if (!d) return "—"; let h = d.getHours(); const m = d.getMinutes(), ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return toBn(String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0")) + " " + ap; }
function fmtCd(ms){ const s = Math.max(0, Math.floor(ms/1000)); return toBn([Math.floor(s/3600), Math.floor(s%3600/60), s%60].map(v => String(v).padStart(2,"0")).join(":")); }
function nextPrayer(now){
  const t = calcDay(now, loc.lat, loc.lng, asrF);
  for (const [k,l] of PRAYERS) { if (k !== "sunrise" && t[k] && t[k] > now) return { k, l, at:t[k], today:true }; }
  const t2 = calcDay(new Date(now.getFullYear(), now.getMonth(), now.getDate()+1), loc.lat, loc.lng, asrF);
  return { k:"fajr", l:"ফজর", at:t2.fajr, today:false };
}
function addOpt(sel, v, text){ const o = document.createElement("option"); o.value = String(v); o.textContent = text; sel.appendChild(o); }
function useGps(status){
  if (!navigator.geolocation) { if (status) status.textContent = "এই ডিভাইসে লোকেশন সাপোর্ট নেই। তালিকা থেকে শহর বেছে নিন।"; return; }
  if (status) status.textContent = "লোকেশন খোঁজা হচ্ছে…";
  navigator.geolocation.getCurrentPosition(p => {
    loc = { n:"আপনার অবস্থান (GPS)", lat:Number(p.coords.latitude.toFixed(4)), lng:Number(p.coords.longitude.toFixed(4)), gps:true };
    lsSet("loc", loc); renderPrayer();
  }, () => { if (status) status.textContent = "লোকেশন পাওয়া যায়নি। অনুমতি দিন বা ম্যানুয়াল লোকেশন ব্যবহার করুন।"; renderPrayerSelectReset(); }, { timeout:12000 });
}

/* --- কিবলা দিক ও দূরত্ব গণনা (Great Circle Bearing) --- */
function calcQiblaInfo(lat, lng){
  const kLat = 21.422487 * D2R;
  const kLng = 39.826206 * D2R;
  const pLat = lat * D2R;
  const pLng = lng * D2R;
  const dLng = kLng - pLng;
  const y = Math.sin(dLng);
  const x = Math.cos(pLat) * Math.tan(kLat) - Math.sin(pLat) * Math.cos(dLng);
  let deg = Math.atan2(y, x) / D2R;
  deg = (deg + 360) % 360;

  // Haversine distance to Kaaba in km
  const R = 6371;
  const a = Math.sin((kLat - pLat)/2)**2 + Math.cos(pLat)*Math.cos(kLat)*Math.sin(dLng/2)**2;
  const dist = Math.round(2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
  return { deg: Math.round(deg * 10) / 10, dist };
}

let compassCleanup = null;
function stopCompass(){
  if (compassCleanup) { compassCleanup(); compassCleanup = null; }
}

function renderQiblaView(){
  stopCompass();
  const qInfo = calcQiblaInfo(loc.lat, loc.lng);
  const card = mk("div", "p3-card qibla-box");
  card.appendChild(mk("b", null, `{{location_on}} ${loc.n} (${toBn(loc.lat)}°, ${toBn(loc.lng)}°)`));
  card.appendChild(mk("div", "note", `কাবা শরীফের দিক: উত্তর দিক থেকে ${toBn(qInfo.deg)}° · দূরত্ব: প্রায় ${toBn(qInfo.dist)} কি.মি.`));

  const dial = mk("div", "compass-dial");
  const ring = mk("div", "compass-ring");
  const mN = mk("span", "compass-mark n", "N");
  const mS = mk("span", "compass-mark s", "S");
  const mE = mk("span", "compass-mark e", "E");
  const mW = mk("span", "compass-mark w", "W");
  ring.appendChild(mN); ring.appendChild(mS); ring.appendChild(mE); ring.appendChild(mW);

  const pointer = mk("div", "kaaba-pointer");
  pointer.style.transform = `rotate(${qInfo.deg}deg)`;
  const badge = mk("div", "kaaba-badge", "{{mosque}} কিবলা");
  const needle = mk("div", "kaaba-needle");
  pointer.appendChild(badge);
  pointer.appendChild(needle);
  ring.appendChild(pointer);

  const center = mk("div", "compass-center");
  dial.appendChild(ring);
  dial.appendChild(center);
  card.appendChild(dial);

  const sensorStatus = mk("div", "note", "ফোনটি সমতল রেখে ঘোরান — সেন্সর সাপোর্ট থাকলে কম্পাস স্বয়ংক্রিয়ভাবে ঘুরবে।");
  card.appendChild(sensorStatus);

  const btnRow = mk("div", "row2");
  btnRow.style.width = "100%";
  const sensorBtn = mk("button", null, "{{explore}} সেন্সর চালু করুন");
  const gpsBtn = mk("button", null, "{{location_on}} GPS আপডেট");
  gpsBtn.onclick = () => useGps(sensorStatus);

  const attachOrientation = () => {
    stopCompass();
    const handler = (e) => {
      let heading = null;
      if (typeof e.webkitCompassHeading === "number") heading = e.webkitCompassHeading;
      else if (e.absolute === true && typeof e.alpha === "number") heading = 360 - e.alpha; // relative (non-absolute) ইভেন্ট বাদ
      if (heading !== null && !isNaN(heading)) {
        ring.style.transform = `rotate(${-heading}deg)`;
        const diff = Math.abs(((heading - qInfo.deg + 540) % 360) - 180);
        dial.classList.toggle("qibla-aligned", diff <= 6);
        sensorStatus.textContent = diff <= 6
          ? `{{check_circle:f}} আপনি ঠিক কিবলামুখী আছেন! (${toBn(Math.round(heading))}°)`
          : `ডিভাইসের দিক: ${toBn(Math.round(heading))}° · কিবলা: ${toBn(qInfo.deg)}°`;
      }
    };
    window.addEventListener("deviceorientationabsolute", handler, true);
    window.addEventListener("deviceorientation", handler, true);
    compassCleanup = () => {
      window.removeEventListener("deviceorientationabsolute", handler, true);
      window.removeEventListener("deviceorientation", handler, true);
    };
  };

  sensorBtn.onclick = async () => {
    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
      try {
        const perm = await DeviceOrientationEvent.requestPermission();
        if (perm === "granted") {
          attachOrientation();
          showToast("কম্পাস সেন্সর চালু হয়েছে");
        } else {
          sensorStatus.textContent = "কম্পাস সেন্সর অনুমতি দেওয়া হয়নি। ডায়ালে দেখানো ডিগ্রি অনুসরণ করুন।";
        }
      } catch(e) {
        sensorStatus.textContent = "সেন্সর চালু করা যায়নি।";
      }
    } else {
      attachOrientation();
      showToast("কম্পাস সেন্সর সক্রিয়");
    }
  };
  attachOrientation();

  btnRow.appendChild(sensorBtn);
  btnRow.appendChild(gpsBtn);
  card.appendChild(btnRow);
  app.appendChild(card);
}

function renderPrayer(){
  stopCompass();
  showOther("নামাজ ও কিবলা");

  // Sub-navigation tabs for Prayer Times, Qibla Compass, and Adhan Alerts
  const subTabs = mk("div", "p3-tabs");
  [["times","{{mosque}} নামাজের সময়"],["qibla","{{explore}} কিবলা কম্পাস"],["alerts","{{notifications}} আজান অ্যালার্ট"]].forEach(([k, label]) => {
    const b = mk("button", prayerSubTab === k ? "on" : "", label);
    b.onclick = () => { prayerSubTab = k; renderPrayer(); };
    subTabs.appendChild(b);
  });
  app.appendChild(subTabs);

  if (prayerSubTab === "qibla") return renderQiblaView();
  if (prayerSubTab === "alerts") return renderAlertsView();

  const now = new Date(), t = calcDay(now, loc.lat, loc.lng, asrF), nx = nextPrayer(now);
  let ds = ""; try { ds = now.toLocaleDateString("bn-BD", { weekday:"long", day:"numeric", month:"long", year:"numeric" }); } catch(e){}
  const hero = mk("div","hero");
  hero.appendChild(mk("small", null, "পরবর্তী নামাজ · " + loc.n));
  hero.appendChild(mk("div","big", nx.l + (nx.at ? " · " + fmtTime(nx.at) : "")));
  const cd = mk("div","cd", nx.at ? "আর " + fmtCd(nx.at - now) + " বাকি" : "");
  hero.appendChild(cd);
  if (ds) hero.appendChild(mk("small", null, ds));
  app.appendChild(hero);

  // Location & Asr method row
  const row = mk("div","row2");
  const sel = document.createElement("select"); prayerSel = sel;
  if (loc.gps) addOpt(sel, "cur", "আপনার অবস্থান (GPS)");
  if (loc.manual) addOpt(sel, "manual", "" + loc.n);
  CITIES.forEach((c,i) => addOpt(sel, i, c[0]));
  addOpt(sel, "gps", "GPS দিয়ে খুঁজুন");
  addOpt(sel, "set_manual", "ম্যানুয়াল লোকেশন দিন");

    const c = CITIES[+v]; loc = { n:c[0], lat:c[1], lng:c[2] }; lsSet("loc", loc); renderPrayer();
  };
  const as = document.createElement("select");

const DHIKR = [["sub","সুবহানাল্লাহ","سُبْحَانَ اللَّهِ"],["ham","আলহামদুলিল্লাহ","الْحَمْدُ لِلَّهِ"],["akb","আল্লাহু আকবার","اللَّهُ أَكْبَرُ"],["free","ফ্রি",""]];
function duaTabs(cur){
  const w = mk("div","p3-tabs");
  [["dua","দোয়া ও আযকার"],["tasbih","তাসবিহ"]].forEach(([k,t]) => {
    const b = mk("button", k === cur ? "on" : "", t);
    b.onclick = () => { if (k !== cur) setMode(k); };
    w.appendChild(b);
  });
  return w;
}
let ts = lsGet("tasbih", { k:"sub", c:{ sub:0, ham:0, akb:0, free:0 }, t:33 });
if (!ts.c) ts.c = {};
function renderTasbih(){
  showOther("তাসবিহ");
  app.appendChild(duaTabs("tasbih"));
  const cur = DHIKR.find(d => d[0] === ts.k) || DHIKR[0];
  const chips = mk("div","tabs"); chips.style.marginTop = "0";
  DHIKR.forEach(d => {
    const b = mk("button", d[0] === ts.k ? "on" : "", d[1]);
    b.onclick = () => { ts.k = d[0]; lsSet("tasbih", ts); renderTasbih(); };
    chips.appendChild(b);
  });
  app.appendChild(chips);
  if (cur[2]) app.appendChild(mk("div","bism", cur[2]));
  const wrap = mk("div","tw");
  const btn = mk("button","tbtn"), cnt = mk("div","tcount"), sub = mk("small");
  btn.appendChild(cnt); btn.appendChild(sub);
  const upd = () => { const c = ts.c[ts.k] || 0; cnt.textContent = toBn(c); sub.textContent = ts.t ? (c >= ts.t ? "{{check}} লক্ষ্য পূর্ণ" : "লক্ষ্য " + toBn(ts.t)) : "অসীম"; };
  btn.onclick = () => {
    const c = (ts.c[ts.k] || 0) + 1; ts.c[ts.k] = c; lsSet("tasbih", ts); upd();
    try { if (navigator.vibrate) navigator.vibrate(ts.t && c % ts.t === 0 ? [120,60,120] : 12); } catch(e){}
  };
  upd();
  wrap.appendChild(btn);
  const tg = mk("div","tabs"); tg.style.justifyContent = "center";
  [33,99,100,0].forEach(n => {
    const b = mk("button", ts.t === n ? "on" : "", n ? toBn(n) : "∞");

    tg.appendChild(b);
  });
  wrap.appendChild(tg);
  const rs = mk("button", null, "রিসেট");
  rs.onclick = () => { ts.c[ts.k] = 0; lsSet("tasbih", ts); upd(); };
  wrap.appendChild(rs);
  app.appendChild(wrap);
}

// Theme Toggle Logic
const savedTheme = lsGet("theme", null);
if (savedTheme) {
  document.documentElement.setAttribute("data-theme", savedTheme);
  document.getElementById("themeToggle").textContent = savedTheme === "dark" ? "{{light_mode}}" : "{{dark_mode}}";
} else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
  document.getElementById("themeToggle").textContent = "{{light_mode}}";
}

document.getElementById("themeToggle").onclick = () => {
  const current = document.documentElement.getAttribute("data-theme");
  let next = "dark";
  if (current === "dark") next = "light";
  else if (current === "light") next = "dark";
  else {
    next = window.matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark";
  }
  document.documentElement.setAttribute("data-theme", next);
  lsSet("theme", next);
  document.getElementById("themeToggle").textContent = next === "dark" ? "{{light_mode}}" : "{{dark_mode}}";
};

// Android WebView / Browser Back Button Navigation Handling
function handleBackNavigation(){
  const openModal = document.querySelector(".modal-overlay");
  if (openModal) { openModal.remove(); return true; }
  if (reading) {
    saveScroll();
    reading = null;
    renderHome();
    return true;
  }
  if (mode !== "quran") {
    setMode("quran");
    return true;
  }
  return false;
}

// Backup & Restore Utilities
async function exportUserBackup(){
  const backup = {
    app: "Quranix",
    version: 4,
    exportedAt: new Date().toISOString(),
    data: {
      bm: lsGet("bm", []),
      last: lsGet("last", null),
      notes: lsGet("notes", {}),
      goal: lsGet("goal", null),
      tasbih: lsGet("tasbih", null),
      loc: lsGet("loc", null),
      asr: lsGet("asr", 2),
      calcMethod: lsGet("calcMethod", "karachi"),
      tzMode: lsGet("tzMode", "auto"),
      dstAdd: lsGet("dstAdd", 0),
      prayerAlerts: lsGet("prayerAlerts", null),
      edition: lsGet("edition", "bn.bengali"),
      reciter: lsGet("reciter", "Saood_ash-Shuraym_128kbps"),
      fs: parseInt(localStorage.getItem("fs")) || 30,
      theme: lsGet("theme", null),
      appPrefs
    }
  };
  const text = JSON.stringify(backup, null, 2);
  const fname = `quranix-backup-${todayStr()}.json`;
  const CapP = window.Capacitor && window.Capacitor.Plugins;
  if (CapP && CapP.Filesystem && CapP.Share) {
    try {
      const r = await CapP.Filesystem.writeFile({ path: fname, data: text, directory: "CACHE", encoding: "utf8" });
      await CapP.Share.share({ title: fname, url: r.uri });
      showToast("ব্যাকআপ ফাইল তৈরি হয়েছে");
      return;
    } catch(e) { if (/cancel/i.test(String((e && e.message) || e))) return; }
  }
  const blob = new Blob([text], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = fname;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast("ব্যাকআপ ফাইল ডাউনলোড হয়েছে");
}

function importUserBackup(file, onDone){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!parsed || parsed.app !== "Quranix" || !parsed.data) {
        showToast("এটি সঠিক Quranix ব্যাকআপ ফাইল নয়");
        return;
      }
      const d = parsed.data;
      if (Array.isArray(d.bm)) { bms = d.bm; lsSet("bm", bms); }
      if (d.last && (d.last.t === "s" || d.last.t === "j") && Number.isFinite(d.last.n)) { last = d.last; lsSet("last", last); }
      if (d.notes && typeof d.notes === "object") { ayahNotes = d.notes; lsSet("notes", ayahNotes); }
      if (d.goal && Array.isArray(d.goal.readKeys)) { goalData = d.goal; lsSet("goal", goalData); }
      if (d.tasbih && d.tasbih.c && typeof d.tasbih.c === "object") { ts = d.tasbih; lsSet("tasbih", ts); }
      if (d.loc && Number.isFinite(d.loc.lat) && Number.isFinite(d.loc.lng) && typeof d.loc.n === "string") { loc = d.loc; lsSet("loc", loc); }
      if (d.asr === 1 || d.asr === 2) { asrF = d.asr; lsSet("asr", asrF); }
      if (d.calcMethod && CALC_METHODS[d.calcMethod]) { calcMethodKey = d.calcMethod; lsSet("calcMethod", calcMethodKey); }
      if (d.tzMode !== undefined) { tzMode = d.tzMode; lsSet("tzMode", tzMode); }
      if (d.dstAdd !== undefined) { dstAdd = d.dstAdd; lsSet("dstAdd", dstAdd); }
      if (d.prayerAlerts && d.prayerAlerts.prayers && typeof d.prayerAlerts.prayers === "object") { alertCfg = d.prayerAlerts; lsSet("prayerAlerts", alertCfg); }
      if (d.edition === "bn.bengali" || d.edition === "bn.zakaria") {
        currentEdition = d.edition;
        lsSet("edition", currentEdition);
        const trSel = document.getElementById("transSel");
        if (trSel) trSel.value = currentEdition;
      }
      if (d.reciter && RECITERS.some(r => r[0] === d.reciter)) { currentReciter = d.reciter; lsSet("reciter", currentReciter); }
      if (d.fs) { fs = d.fs; document.documentElement.style.setProperty("--fs", fs + "px"); localStorage.setItem("fs", fs); }
      if (d.theme) {
        document.documentElement.setAttribute("data-theme", d.theme);
        lsSet("theme", d.theme);
        document.getElementById("themeToggle").textContent = d.theme === "dark" ? "{{light_mode}}" : "{{dark_mode}}";
      }
      if (d.appPrefs) { appPrefs = { ...appPrefs, ...d.appPrefs }; lsSet("appPrefs", appPrefs); applyAppPrefs(); }
      showToast("ব্যাকআপ সফলভাবে রিস্টোর হয়েছে!");
      if (onDone) onDone();
      renderHome();
    } catch(e) {
      showToast("ফাইলটি পড়া যায়নি। সঠিক JSON ব্যাকআপ দিন।");
    }
  };
  reader.readAsText(file);
}

function checkPrayerAlerts(){
  if (!alertCfg.enabled) return;
  const n = new Date(), t = calcDay(n, loc.lat, loc.lng, asrF);
  for (const [pk, pl] of PRAYERS) {
    if (pk === "sunrise" || !alertCfg.prayers[pk] || !t[pk]) continue;
    const diff = n.getTime() - t[pk].getTime();
    if (diff >= 0 && diff < 60000) triggerPrayerAlert(pk, pl, fmtTime(t[pk]));
  }
}

  function renderNumSearch(body){
    var list=(typeof surahs!=='undefined'&&surahs&&surahs.length)?surahs:BN_SURAH.map(function(n,i){ return {number:i+1,englishName:n,englishNameTranslation:'',name:'',numberOfAyahs:286}; });
    function toAscii(t){ return String(t).replace(/[\u09E6-\u09EF]/g,function(c){return c.charCodeAt(0)-0x09E6;}).replace(/[\u0660-\u0669]/g,function(c){return c.charCodeAt(0)-0x0660;}); }
    function norm(t){ return String(t).toLowerCase().replace(/[\s\-_'\u2019`.,:;\/]/g,''); }
    function bn(n){ return BN_SURAH[n-1]||''; }
    function num(n){ return typeof toBn==='function'?toBn(n):n; }
    body.innerHTML='<input class="pp-input" id="ppQuick" autocomplete="off" placeholder="লিখুন: বাকারা ২৫৫ বা ২:২৫৫ বা baqarah 255"><div id="ppSug"></div>'+
      '<div class="pp-mini" style="margin:8px 0 6px">অথবা তালিকা থেকে বেছে নিন</div>'+
      '<div class="pp-row"><select class="pp-input" id="ppSurahSel" style="flex:2"></select><select class="pp-input" id="ppAyahSel" style="flex:1"></select></div>'+
      '<button class="pp-btn" id="ppGoBtn">যান →</button>';
    var qin=document.getElementById('ppQuick'), sug=document.getElementById('ppSug'), ss=document.getElementById('ppSurahSel'), as=document.getElementById('ppAyahSel');
    ss.innerHTML=list.map(function(s){ return '<option value="'+s.number+'">'+s.number+'. '+(bn(s.number)||s.englishName)+' · '+s.englishName+'</option>'; }).join('');
    function fillAyah(){ var s=list[parseInt(ss.value,10)-1]; var n=s?s.numberOfAyahs:286; var h='<option value="0">পুরো সূরা</option>'; for(var i=1;i<=n;i++) h+='<option value="'+i+'">আয়াত '+i+'</option>'; as.innerHTML=h; }
    ss.onchange=fillAyah; fillAyah();
    function go(s,a){ closePopup(); if(typeof openSurah!=='function') return; if(a) openSurah(s,a); else openSurah(s); }
    document.getElementById('ppGoBtn').onclick=function(){ go(parseInt(ss.value,10),parseInt(as.value,10)||0); };
    var firstGo=null;
    function suggest(){
      firstGo=null;
      var raw=toAscii(qin.value).trim(); if(!raw){ sug.innerHTML=''; return; }
      var nums=(raw.match(/\d+/g)||[]).map(Number);
      var text=norm(raw.replace(/\d+/g,' '));
      var cands=[], ay=null;
      if(text){
        list.forEach(function(s){ if(norm(s.englishName+' '+(s.englishNameTranslation||'')+' '+bn(s.number)+' '+(s.name||'')).indexOf(text)>-1) cands.push(s); });
        if(nums.length) ay=nums[0];
      } else if(nums.length>=2){
        if(nums[0]>=1&&nums[0]<=list.length) cands.push(list[nums[0]-1]); ay=nums[1];
      } else if(nums.length===1){
        var p=String(nums[0]); list.forEach(function(s){ if(String(s.number).indexOf(p)===0) cands.push(s); });
        cands.sort(function(a,b){ return (String(a.number)===p?-1:0)-(String(b.number)===p?-1:0); });
      }
      var out='';
      cands.slice(0,6).forEach(function(s){
        var nm=s.number+'. '+(bn(s.number)||s.englishName)+' · '+s.englishName;
        if(ay!==null){
          if(ay>=1&&ay<=s.numberOfAyahs){ out+='<div class="pp-result" data-s="'+s.number+'" data-a="'+ay+'"><b>'+nm+'</b><small>আয়াত '+num(ay)+' এ যান</small></div>'; if(!firstGo) firstGo=[s.number,ay]; }
          else out+='<div class="pp-result" data-s="'+s.number+'" data-a="0"><b>'+nm+'</b><small>এই সূরায় মাত্র '+num(s.numberOfAyahs)+'টি আয়াত — সূরাটি খুলুন</small></div>';
        } else { out+='<div class="pp-result" data-s="'+s.number+'" data-a="0"><b>'+nm+'</b><small>'+(s.revelationType==='Meccan'?'মাক্কী':s.revelationType?'মাদানী':'')+(s.numberOfAyahs?' · আয়াত '+num(s.numberOfAyahs):'')+'</small></div>'; if(!firstGo) firstGo=[s.number,0]; }
      });
      if(!out) out='<div class="pp-mini">মিল পাওয়া যায়নি। সূরার নাম বা নম্বর লিখুন।</div>';
      sug.innerHTML=out;
      sug.querySelectorAll('[data-s]').forEach(function(el){ el.onclick=function(){ go(parseInt(el.dataset.s,10),parseInt(el.dataset.a,10)||0); }; });
    }
    qin.oninput=suggest;
    qin.onkeydown=function(e){ if(e.key==='Enter'&&firstGo){ e.preventDefault(); go(firstGo[0],firstGo[1]); } };
  }
  function doWordSearch(word){
    var resEl=document.getElementById('ppWordResults'); if(!resEl) return;
    if(!word){ resEl.innerHTML=''; return; }
    var lw=word.toLowerCase();
    var out='';
    // Surah name matches
    var sList=(typeof surahs!=='undefined'?surahs:[]).filter(function(s){ return String(s.number)===word || s.englishName.toLowerCase().includes(lw) || (s.englishNameTranslation||'').toLowerCase().includes(lw) || (s.name||'').includes(word); });
    sList.slice(0,8).forEach(function(s){
      out+='<div class="pp-result" data-surah="'+s.number+'"><b>'+s.number+'. '+s.englishName+' - '+s.name+'</b><small>'+(s.englishNameTranslation||'')+' · '+(s.revelationType==='Meccan'?'মাক্কী':'মাদানী')+' · আয়াত '+s.numberOfAyahs+'</small></div>';
    });
    // Ayah text matches (LOCAL bn/ar)
    var ayahCount=0;
    try{
      if(typeof LOCAL!=='undefined' && LOCAL && LOCAL.bn){
        for(var si=0; si<LOCAL.bn.length && ayahCount<8; si++){
          var arr=LOCAL.bn[si]||[];
          for(var ai=0; ai<arr.length && ayahCount<8; ai++){
            var bnTxt=arr[ai]||'';
            var arTxt=(LOCAL.ar && LOCAL.ar[si] && LOCAL.ar[si][ai])?LOCAL.ar[si][ai]:'';
            if(bnTxt.includes(word) || arTxt.includes(word)){
              var sObj=(typeof surahs!=='undefined')?surahs.find(function(x){return x.number===si+1}):null;
              var sName=sObj?sObj.englishName:'সূরা '+(si+1);
              out+='<div class="pp-result" data-ayah="'+(si+1)+':'+(ai+1)+'"><b>'+sName+' · আয়াত '+(ai+1)+'</b><small>'+bnTxt.slice(0,120)+'</small></div>';
              ayahCount++;
            }
          }
        }
      }
    }catch(e){}
    if(!out) out='<div class="pp-mini">কিছু পাওয়া যায়নি। অন্য শব্দ দিয়ে চেষ্টা করুন।</div>';
    resEl.innerHTML=out;
    resEl.querySelectorAll('[data-surah]').forEach(function(el){ el.onclick=function(){ closePopup(); if(typeof openSurah==='function') openSurah(parseInt(el.dataset.surah,10)); }; });
    resEl.querySelectorAll('[data-ayah]').forEach(function(el){ el.onclick=function(){ closePopup(); var parts=el.dataset.ayah.split(':'); if(typeof openSurah==='function') openSurah(parseInt(parts[0],10), parseInt(parts[1],10)); }; });
    // Also sync home list filtering
    if(qEl){ qEl.value=word; }
  }

      '<div class="frow"><span>আরবি ফন্টের সাইজ (<b>'+arFs+'px</b>)</span><span class="fsz"><button id="ppArMinus" title="ছোট"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button><button id="ppArReset" title="রিসেট"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg></button><button id="ppArPlus" title="বড়"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg></button></span></div>';

  function renderBackupPopup(){

  }
  refreshMinis();
  // ---- Home Hero ----
  var origRenderQuranHome = window.renderQuranHome;
  function buildHero(){

    var lastNm='শুরু করুন'; var lastAction=function(){ openSurah(1); };

    var cnt=0, tgt=10; try{ if(typeof goalData!=='undefined'){ cnt=goalData.readKeys?goalData.readKeys.length:0; tgt=goalData.target||10; } }catch(e){}
    var defs=[
      ['history_edu','শেষ পড়া',lastNm,function(){ lastAction(); }],
      ['auto_stories','আজকের পড়া',toBn(cnt)+'/'+toBn(tgt),function(){ openTodaySheet(); }],
      ['auto_awesome','৯৯ নাম','আসমাউল হুসনা',function(){ if(typeof setMode==='function') setMode('asma'); }],
      ['calendar_month','খতম প্ল্যান','পরিকল্পনা',function(){ openPopup('khatam'); }]
    ];
    var row=document.createElement('div'); row.className='home-tiles';
    defs.forEach(function(d){
      var t=document.createElement('div'); t.className='home-tile';
      t.innerHTML='<span class="t-ic">{{'+d[0]+'}}</span><b>'+d[1]+'</b><small>'+d[2]+'</small>';
      t.onclick=d[3]; row.appendChild(t);

    appEl.prepend(row);

  if(origRenderQuranHome){ window.renderQuranHome=function(){ origRenderQuranHome(); buildHero(); }; setTimeout(function(){ if(typeof renderHome==='function') renderHome(); }, 100); }
})();
