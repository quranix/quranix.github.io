<style>


@font-face {
  font-family:"Hind Siliguri";font-style:normal;font-weight:300;font-display:swap;src:url(fonts/hind-siliguri-300.woff) format("woff")
}

@font-face {
  font-family:"Hind Siliguri";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/hind-siliguri-400.woff) format("woff")
}

@font-face {
  font-family:"Hind Siliguri";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/hind-siliguri-500.woff) format("woff")
}

@font-face {
  font-family:"Hind Siliguri";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/hind-siliguri-600.woff) format("woff")
}

@font-face {
  font-family:"Hind Siliguri";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/hind-siliguri-700.woff) format("woff")
}

@font-face {
  font-family:"Noto Naskh Arabic";font-style:normal;font-weight:400 700;font-display:swap;src:url(fonts/noto-naskh-arabic.woff) format("woff")
}

@font-face {
  font-family:"Amiri Quran";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/amiri-quran.woff2) format("woff2")
}

@font-face {
  font-family:"Noto Serif Bengali";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/noto-serif-bengali-400.woff2) format("woff2")
}

@font-face {
  font-family:"Noto Serif Bengali";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/noto-serif-bengali-700.woff2) format("woff2")
}

@font-face {
  font-family:"Kalpurush";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/kalpurush.woff2) format("woff2")
}

@font-face {
  font-family:'MSLocal';font-style:normal;font-weight:200;font-display:block;src:url(fonts/material-symbols-rounded.woff2) format('woff2')
}

:root {
  /* palette (raw colours) */
  --qx-c-white: #ffffff;
  --qx-c-offwhite: #f5f5f5;
  --qx-c-ink: #2b2b2b;
  --qx-c-navy: #1f2a44;
  --qx-c-gray: #e5e7eb;
  --qx-c-mist: #d9dee7;
  --qx-c-meta: #6b6b6b;
  --qx-c-green: #4cc79b;
  --qx-c-teal: #0f766e;
  --qx-c-teal-deep: #0b5c56;
  --qx-c-mint-hc: #7fffd0;
  --qx-c-night: #0a1625;
  --qx-c-night-outer: #08101b;
  --qx-c-night-ink: #0b1727;
  --qx-c-night-chip: #11253d;
  --qx-c-night-raise: #273449;
  --qx-c-night-border: #4a5a6a;
  --qx-c-night-muted: #a7b0be;

  /* roles (light) */
  --qx-bg: var(--qx-c-white);
  --qx-outer-bg: var(--qx-c-offwhite);
  --qx-card-bg: var(--qx-c-offwhite);
  --qx-text-color: var(--qx-c-ink);
  --qx-meta-color: var(--qx-c-meta);
  --qx-main-color: var(--qx-c-teal);
  --qx-main-soft: rgba(15,118,110,.10);
  --qx-on-main: var(--qx-c-white);
  --qx-on-teal: #fff;
  --qx-knob: #fff;
  --qx-badge-bg: #d9d9d9;
  --qx-border: var(--qx-c-gray);
  --qx-tile-bg: var(--qx-c-offwhite);
  --qx-hover: var(--qx-c-mist);
  --qx-shadow: 0 2px 10px rgba(0,0,0,0.05);
  --qx-highlight: #cfd3d8;
  --qx-danger: #d32f2f;
  --qx-success: #2e7d32;
  --qx-event: #e67e22;
  --qx-tj-ghunnah: #e67e22;
  --qx-tj-qalqalah: #2563eb;
  --qx-tj-ikhfa: var(--qx-success);
  --qx-tj-idgham: #9333ea;
  --qx-tj-iqlab: #db2777;
  --qx-tj-madd: var(--qx-danger);
  --qx-tj-lam: #0891b2;

  /* size, font, layout */
  --qx-pad-sm: 10px;
  --qx-pad-item: 14px 18px;
  --qx-pad: 20px;
  --qx-pad-xl: 60px 0;
  --qx-gap: 10px;
  --qx-radius: 8px;
  --qx-radius-lg: 12px;
  --qx-radius-pill: 999px;
  --qx-fs-xs: 11px;
  --qx-fs-sm: 12px;
  --qx-fs-md: 13px;
  --qx-fs: 14px;
  --qx-fs-lg: 16px;
  --qx-fs-xl: 18px;
  --qx-fs-ar: 30px;
  --qx-fs-bn: 16px;
  --qx-font-arabic: "Amiri Quran","Noto Naskh Arabic","Traditional Arabic",serif;
  --qx-font: "Hind Siliguri","Noto Serif Bengali","Kalpurush","Noto Sans Bengali",sans-serif;
  --qx-content-max: 720px;
  --qx-gutter: 14px;
  --qx-z-header: 50;
  --qx-z-search-panel: 40;
  --qx-z-nav: 30;
  --qx-z-modal: 100;
  --qx-z-toast: 120;
  --qx-z-dropdown: 90;
}

[data-theme="dark"] {
  --qx-bg: var(--qx-c-night);
  --qx-outer-bg: var(--qx-c-night-outer);
  --qx-card-bg: var(--qx-c-night);
  --qx-text-color: var(--qx-c-offwhite);
  --qx-meta-color: var(--qx-c-night-muted);
  --qx-main-color: var(--qx-c-green);
  --qx-main-soft: rgba(76,199,155,.16);
  --qx-on-main: var(--qx-c-night-ink);
  --qx-border: var(--qx-c-night-border);
  --qx-tile-bg: var(--qx-c-night-chip);
  --qx-hover: var(--qx-c-night-raise);
  --qx-badge-bg: var(--qx-c-night-raise);
  --qx-shadow: 0 4px 14px rgba(0,0,0,0.22);
  --qx-highlight: #4b544e;
  --qx-danger: #f87171;
  --qx-success: #4ade80;
  --qx-tj-qalqalah: #60a5fa;
  --qx-tj-idgham: #c084fc;
  --qx-tj-iqlab: #f472b6;
}

[data-hc=""] {
  --qx-text-color: #000;
  --qx-meta-color: #333;
  --qx-border: #777;
  --qx-main-color: var(--qx-c-teal-deep);
  --qx-tile-bg: #fff;
  --qx-hover: var(--qx-c-gray);
}

[data-theme="dark"][data-hc=""] {
  --qx-text-color: #fff;
  --qx-meta-color: #e5e5e5;
  --qx-border: #aaa;
  --qx-main-color: var(--qx-c-mint-hc);
  --qx-tile-bg: #111;
  --qx-hover: #333;
}

[data-reduced-motion=""] *,[data-reduced-motion=""] *::before,[data-reduced-motion=""] *::after {
  scroll-behavior: auto;
  animation-duration: .01ms;
  animation-iteration-count: 1;
  transition-duration: .01ms;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: var(--qx-outer-bg);
  color: var(--qx-text-color);
  padding-top: 0;
  padding-bottom: env(safe-area-inset-bottom);
  font-size: var(--qx-fs-bn);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}

header {
  position: sticky;
  top: 0;
  background: var(--qx-bg);
  z-index: var(--qx-z-header);
  padding: 12px 14px;
  padding-top: calc(12px + env(safe-area-inset-top));
  height: auto;
  min-height: 62px;
  display: flex;
  align-items: center;
  border-bottom: 1px solid var(--qx-border);
  transition: transform .25s ease;
  padding-bottom: 12px;
  padding-left: var(--qx-gutter);
  padding-right: var(--qx-gutter);
}

.reader-progress {
  position: fixed;
  left: 0;
  right: 0;
  top: 0;
  z-index: 9999;
  height: 2px;
  background: transparent;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease;
}

.reader-progress-fill {
  height: 100%;
  width: 0;
  background: var(--qx-main-color);
  transition: width .12s linear;
}

body.reader-active .reader-progress {
  opacity: 1;
}

.bar {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 38px;
}

h1 {
  font-size: var(--qx-fs-xl);
  margin: 0;
  flex: 1;
  color: var(--qx-main-color);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

button {
  font: inherit;
  border: 1px solid var(--qx-border);
  background: var(--qx-card-bg);
  color: var(--qx-text-color);
  border-radius: var(--qx-radius-lg);
  padding: 6px 12px;
}

input {
  width: 100%;
  margin-top: 8px;
  padding: 10px 12px;
  border-radius: var(--qx-radius-lg);
  border: 1px solid var(--qx-border);
  background: var(--qx-card-bg);
  color: var(--qx-text-color);
  font: inherit;
}

.tabs {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  overflow-x: auto;
}

.tabs button {
  white-space: nowrap;
}

.tabs button.on {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-color: var(--qx-main-color);
}

main {
  padding: clamp(12px,2.2vw,24px) clamp(12px,2.4vw,24px) 104px;
  max-width: 100%;
  width: 100%;
  margin: 0 auto;
  background: var(--qx-bg);
  min-height: calc(100vh - 62px);
  padding-left: var(--qx-gutter);
  padding-right: var(--qx-gutter);
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
}

#app {
  width: 100%;
  min-width: 0;
  max-width: 100%;
  margin: 0 auto;
}

.item {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--qx-card-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  padding: 14px;
  margin: 8px 0;
  cursor: pointer;
}

.num {
  min-width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--qx-fs-xl);
}

.mid {
  flex: 1;
}

.mid b {
  display: block;
}

.mid small {
  color: var(--qx-meta-color);
}

.ar-name {
  font-size: 20px;
  color: var(--qx-main-color);
}

.ayah {
  background: var(--qx-card-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  padding: clamp(15px,2.4vw,22px);
  margin: 12px auto;
  max-width: 900px;
  box-shadow: 0 2px 8px rgba(0,0,0,.025);
}

.ayah .ar {
  font-size: clamp(20px,var(--qx-fs-ar),48px);
  line-height: 2.15;
  direction: rtl;
  text-align: right;
  overflow-wrap: anywhere;
  padding: 5px 1px 10px;
  letter-spacing: 0;
}

.ayah .bn {
  margin-top: 8px;
  padding-top: 12px;
  border-top: 1px solid var(--qx-border);
  line-height: 1.9;
  color: var(--qx-text-color);
  font-size: clamp(15px,1.6vw,17px);
  text-align: justify;
  text-justify: inter-word;
}

.ayah .no {
  font-size: var(--qx-fs-sm);
  color: var(--qx-meta-color);
  margin-bottom: 8px;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 8px 10px;
  min-height: 36px;
  border-bottom: 1px solid var(--qx-border);
  padding-bottom: 7px;
}

/* আয়াত নম্বরকে নরম অ্যাকসেন্ট ব্যাকগ্রাউন্ডের গোল ব্যাজ */
.ayah .no > .ayah-number {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 32px;
  padding: 0 12px;
  border-radius: var(--qx-radius-pill);
  background: var(--qx-tile-bg);
  color: var(--qx-main-color);
  font-weight: 600;
  white-space: nowrap;
}

/* অ্যাকশন আইকনগুলোতে আলাদা টাইল ব্যাকগ্রাউন্ড থাকবে না */
.ayah-actions > .icon-btn,
.ayah-actions > .star {
  background: transparent;
}

.ayah-actions > .icon-btn:hover,
.ayah-actions > .star:hover {
  background: var(--qx-border);
}

.ayah-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  flex: 0 1 auto;
  min-width: 0;
  position: relative;
}

.icon-btn {
  border: 0;
  background: var(--qx-tile-bg);
  font-size: var(--qx-fs-xl);
  cursor: pointer;
  padding: 8px;
  min-width: 40px;
  min-height: 40px;
  border-radius: var(--qx-radius);
  color: var(--qx-meta-color);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.icon-btn:hover {
  background: var(--qx-border);
  color: var(--qx-text-color);
}

.star {
  border: 0;
  background: var(--qx-tile-bg);
  font-size: 21px;
  color: var(--qx-main-color);
  padding: 7px;
  min-width: 40px;
  min-height: 40px;
  border-radius: var(--qx-radius);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.toast {
  position: fixed;
  bottom: calc(76px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  background: var(--qx-text-color);
  color: var(--qx-bg);
  padding: 6px 14px;
  border-radius: var(--qx-radius-lg);
  font-size: var(--qx-fs-md);
  z-index: 99;
  animation: fadeInOut 2s ease;
  max-width: 90vw;
  text-align: center;
}

.resume {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-radius: var(--qx-radius-lg);
  padding: 12px;
  margin: 8px 0;
  cursor: pointer;
  text-align: center;
}

.bism {
  font-size: clamp(22px,calc(var(--qx-fs-ar) + 2px),50px);
  text-align: center;
  direction: rtl;
  margin: 16px 0;
  color: var(--qx-main-color);
}

.sh {
  margin: 22px 0 6px;
  padding: 10px;
  border-radius: var(--qx-radius-lg);
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  text-align: center;
}

.msg {
  text-align: center;
  color: var(--qx-meta-color);
  padding: 30px 0;
}

nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  background: var(--qx-card-bg);
  border-top: 1px solid var(--qx-border);
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 6;
  transition: transform .25s ease;
  justify-content: center;
  padding-left: 0;
  padding-right: 0;
}

nav button {
  flex: 1 1 0;
  min-width: 0;
  border: 0;
  border-radius: 0;
  background: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 4px;
  padding: 8px 2px 8px;
  min-height: 52px;
  font-size: var(--qx-fs-xs);
  color: var(--qx-meta-color);
  text-align: center;
}

nav button b {
  font-size: 20px;
  font-weight: 400;
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  line-height: 1;
  flex-shrink: 0;
}

nav button span {
  font-size: var(--qx-fs-xs);
  line-height: 1.15;
  white-space: normal;
  text-align: center;
  display: block;
  max-width: 100%;
}

nav button .ms {
  font-size: 20px;
  line-height: 1;
}

.dua-ic {
  width: 22px;
  height: 22px;
  display: block;
  margin: auto;
}

nav button.on {
  color: var(--qx-main-color);
  font-weight: 600;
}

@keyframes qxMorePulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.2); opacity: .7; }
}

/* কুরআন বাটন: ফুটারের মাঝখানে, সামান্য উপরে ওঠা গোল বাটন */
nav button[data-m="quran"] b {
  position: relative;
  transform: translateY(-12px);
}

nav button[data-m="quran"] b::before {
  content: "";
  position: absolute;
  inset: -9px;
  border-radius: 50%;
  background: var(--qx-card-bg);
  border: 1px solid var(--qx-border);
  box-shadow: var(--qx-shadow);
  z-index: -1;
}

nav button[data-m="quran"].on b {
  color: var(--qx-on-main);
}

nav button[data-m="quran"].on b::before {
  background: var(--qx-main-color);
  border-color: var(--qx-main-color);
}

body .audio-bar.with-nav {
  bottom: calc(66px + env(safe-area-inset-bottom));
}

@media (max-height:480px) and (orientation:landscape) {
  nav button[data-m="quran"] b { transform: none; }
  nav button[data-m="quran"] b::before { display: none; }
  nav button[data-m="quran"].on b { color: var(--qx-main-color); }
  body .audio-bar.with-nav { bottom: calc(36px + env(safe-area-inset-bottom)); }
}

/* সার্চ বার (বিষয়ভিত্তিক ট্যাব) */
.qx-search {
  position: relative;
  display: flex;
  align-items: center;
  margin: 0 0 10px auto;
  width: min(100%, 220px);
}

.qx-search-ic {
  position: absolute;
  left: 10px;
  display: inline-flex;
  color: var(--qx-meta-color);
  font-size: 17px;
  pointer-events: none;
}

.qx-search input {
  width: 100%;
  padding: 7px 12px 7px 32px;
  font-size: var(--qx-fs-sm);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-pill);
  background: var(--qx-card-bg);
  color: var(--qx-text-color);
  font: inherit;
  box-shadow: var(--qx-shadow);
}

.qx-search input::placeholder {
  color: var(--qx-meta-color);
}

.qx-search input:focus {
  outline: none;
  border-color: var(--qx-main-color);
  box-shadow: 0 0 0 3px var(--qx-main-soft);
}

/* দোয়া ও তাসবিহ — নতুন ডিজাইন */
.qx-dua-act {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 10px;
}

.qx-tsb-sel {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.qx-tsb-chip {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 0;
  padding: 10px 6px;
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  background: var(--qx-card-bg);
  color: var(--qx-text-color);
  font: inherit;
  cursor: pointer;
}

.qx-tsb-chip b {
  font-size: var(--qx-fs-sm);
  text-align: center;
}

.qx-tsb-chip small {
  color: var(--qx-meta-color);
}

.qx-tsb-chip.on {
  background: var(--qx-main-color);
  border-color: var(--qx-main-color);
  color: var(--qx-on-main);
}

.qx-tsb-chip.on small {
  color: inherit;
  opacity: .9;
}

.qx-tsb-phrase {
  text-align: center;
}

.qx-tsb-wrap {
  display: flex;
  justify-content: center;
  margin: 6px 0;
}

.qx-tsb-btn {
  position: relative;
  display: grid;
  place-items: center;
  width: min(240px, 70vw);
  aspect-ratio: 1;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: var(--qx-card-bg);
  box-shadow: var(--qx-shadow);

  font: inherit;
  font-size: var(--qx-fs);
  cursor: pointer;
  transition: border-color .18s ease, box-shadow .18s ease;
}

.set-select:hover {
  border-color: var(--qx-main-color);
}

.set-select:focus-visible {
  outline: none;
  border-color: var(--qx-main-color);
  box-shadow: 0 0 0 3px var(--qx-main-soft);
}

.set-stepper {
  display: flex;
  align-items: stretch;
  flex-shrink: 0;
  overflow: hidden;
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  background: var(--qx-tile-bg);
}

.set-stepper button {
  min-width: 42px;
  min-height: 36px;
  padding: 0 10px;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--qx-text-color);
  font-size: var(--qx-fs);
  font-weight: 600;
  cursor: pointer;
  transition: background-color .18s ease, color .18s ease;
}

.set-stepper button + button {
  border-left: 1px solid var(--qx-border);
}

.set-stepper button:hover {
  background: var(--qx-main-soft);
  color: var(--qx-main-color);
}

.set-stepper button:focus-visible {
  outline: 2px solid var(--qx-main-color);
  outline-offset: -2px;
}

.set-switch {
  -webkit-appearance: none;
  appearance: none;
  position: relative;
  flex-shrink: 0;
  width: 34px;
  height: 20px;
  margin: 0;
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-pill);
  background: var(--qx-border);
  cursor: pointer;
  transition: background-color .2s ease, border-color .2s ease;
}

.set-switch::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--qx-knob);
  box-shadow: 0 1px 3px rgba(0,0,0,.3);
  transition: transform .2s ease;
}

.set-switch:checked {
  background: var(--qx-main-color);
  border-color: var(--qx-main-color);
}

.set-switch:checked::after {
  transform: translateX(14px);
}

.set-switch:focus-visible {
  outline: 2px solid var(--qx-main-color);
  outline-offset: 2px;
}

.btn-danger {
  color: var(--qx-danger);
  border-color: var(--qx-danger);
}

.btn-accent {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-color: var(--qx-main-color);
  font-weight: 600;
}

.offline-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: var(--qx-fs-xs);
  padding: 3px 8px;
  border-radius: var(--qx-radius-lg);
  background: color-mix(in srgb, var(--qx-main-color) 12%, var(--qx-card-bg));
  color: var(--qx-main-color);
  font-weight: 600;
}

.help-step {
  background: var(--qx-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  padding: 10px 12px;
  margin-bottom: 8px;
  font-size: var(--qx-fs-md);
  line-height: 1.6;
}

button:focus-visible,select:focus-visible,input:focus-visible {
  outline: 2px solid var(--qx-main-color);
  outline-offset: 2px;
}

#q {
  display: none;
}

/* Header search opens the home search controls as a centered modal. */
#controls {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(560px, calc(100vw - 32px));
  max-height: min(82vh, 680px);
  overflow-y: auto;
  padding: 20px;
  gap: 12px;
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  background: var(--qx-card-bg);
  color: var(--qx-text-color);

  z-index: 201;
}

#controls #q {
  display: block;
  width: 100%;
  box-sizing: border-box;
  margin: 0;
  padding: 13px 14px;
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  background: var(--qx-bg);
  color: var(--qx-text-color);
  font: inherit;
  font-size: var(--qx-fs-lg);
}

#controls select,
#controls .quick-jump input,
#controls .quick-jump button,
#controls .tabs button {
  border-radius: var(--qx-radius-lg);
}

@media (max-width: 480px) {
  #controls {
    width: calc(100vw - 24px);
    max-height: 84vh;
    padding: 16px;
    border-radius: var(--qx-radius-lg);
  }

.aotd-card, .goal-bar, .resume {

}

.home-hero {

  border: 1px solid var(--qx-border);

}

.home-hero-left {

  align-items: center;
  gap: 10px;
  cursor: pointer;
}

.home-hero-left .play {
  font-size: 22px;
}

.home-hero-left .lbl {
  font-size: var(--qx-fs-md);
  opacity: .9;
}

.home-hero-left .val {
  font-size: var(--qx-fs-lg);
  font-weight: 700;
  line-height: 1.3;
}

.home-hero-right {
  flex: 1;
  padding: 14px;
  cursor: pointer;
}

.home-hero-right .top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: var(--qx-fs-md);
  color: var(--qx-main-color);
}

.home-hero-right .val {
  font-size: var(--qx-fs-lg);
  font-weight: 700;
  color: var(--qx-text-color);

}

.home-hero-right .track {

  overflow: hidden;
}

.home-hero-right .fill {
  height: 100%;
  background: var(--qx-main-color);
  border-radius: var(--qx-radius-pill);
}

#gridDropdown {
  display: none;
  position: fixed;
  top: calc(62px + env(safe-area-inset-top) + 8px);
  right: 12px;
  left: auto;
  width: min(300px,calc(100vw - 2*var(--qx-gutter)));

  max-height: calc(100vh - 80px);

  -webkit-overflow-scrolling: touch;

  background: var(--qx-tile-bg);

}

#gridDropdown.open {

}

.g-menu-item,
.g-quick-btn {

.g-quick-btn {

.install-menu-copy {

.install-menu-copy small {

#gridPopupOverlay {

#gridPopupBox {

.pp-row {

.pp-row input {

  color: var(--qx-text-color);
  font: inherit;
}

.pp-btn {
  width: 100%;
  min-height: 44px;

.pp-opt {

.home-tiles {

.home-tile {

.hijri-day.event:focus-visible,.hijri-upcoming:focus-visible{outline:2px solid var(--qx-main-color);outline-offset:2px}

/* --- তালিকা প্যাটার্ন: একটা বর্ডারওয়ালা বাক্সে সারি --- */
.qx-list {
  background: var(--qx-card-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius);
  overflow: hidden;
  margin: 12px 0;
}

.qx-row {
  border: 0;
  display: grid;
  grid-template-columns: auto minmax(0,1fr) auto;
  align-items: center;
  gap: var(--qx-gap);
  width: 100%;
  padding: var(--qx-pad-item);
  text-align: left;
  background: none;
  color: var(--qx-text-color);
  cursor: pointer;
  border-top: 1px solid var(--qx-border);
}

.qx-row:first-child {
  border-top: 0;
}

.qx-row:hover {
  background: var(--qx-hover);
}

.qx-row-ic {
  display: flex;
  color: var(--qx-main-color);
}

.qx-row-tx {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.qx-row-tx b {
  font-size: var(--qx-fs);
}

.qx-row-tx small {
  font-size: var(--qx-fs-sm);
  color: var(--qx-meta-color);
}

.qx-row-go {
  color: var(--qx-meta-color);
}

/* আরও পেজ: প্রতিটা সারি আলাদা বর্ডারওয়ালা বাক্স, মাঝে গ্যাপ */
.qx-list.qx-list-spaced {
  background: none;
  border: 0;
  border-radius: 0;
  overflow: visible;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.qx-list.qx-list-spaced .qx-row {
  background: var(--qx-card-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius);
}
.qx-list.qx-list-spaced .qx-row:hover {
  background: var(--qx-hover);
}

/* নামাজ শিক্ষা পেজ: উপরের ট্যাব বারের সাথে লেগে না যাওয়ার প্যাডিং */
.qx-nm {
  padding-top: 12px;
}

.qx-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: var(--qx-pad-xl);
  text-align: center;
}

.qx-empty b {
  font-size: var(--qx-fs);
}

.qx-empty small {
  font-size: var(--qx-fs-sm);
  color: var(--qx-meta-color);
}

/* --- সংরক্ষিত --- */
.qx-seg {
  display: flex;
  gap: 4px;
  padding: 4px;
  margin: 12px 0;
  background: var(--qx-tile-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius);
}

.qx-seg button {
  border: 0;
  flex: 1;
  padding: 9px 6px;
  border-radius: var(--qx-radius);
  background: none;
  color: var(--qx-text-color);
  font-size: var(--qx-fs);
  font-weight: 600;
  cursor: pointer;
}

.qx-seg button.on {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
}

.qx-gh {
  margin: 18px 2px 6px;
  font-size: var(--qx-fs);
  font-weight: 700;
  color: var(--qx-main-color);
}

.qx-saved {
  margin: 8px 0;
}

.qx-saved .ayah .star,.qx-saved .ayah .read-btn {
  display: none;
}

.qx-saved .hadith-item {
  cursor: default;
  margin: 0;
}

.qx-sn {
  font-size: var(--qx-fs-md);
  margin: 4px 0;
}

.qx-saved-act,.qx-fbar {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  padding: 2px 2px 0;
}

.qx-fbar {
  margin: 10px 0 0;
}

.qx-link {
  border: 0;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 8px 2px;
  background: none;
  color: var(--qx-main-color);
  font-size: var(--qx-fs-sm);
  font-weight: 600;
  cursor: pointer;
}

.qx-link.danger {
  color: var(--qx-danger);
}

.qx-btn {
  border: 0;
  display: block;
  width: 100%;
  margin: 12px 0 0;
  padding: var(--qx-pad-item);
  border-radius: var(--qx-radius);
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  font-size: var(--qx-fs);
  font-weight: 700;
  cursor: pointer;
}

.qx-btn.danger {
  background: var(--qx-danger);
  color: var(--qx-c-white);
}

.qx-btn.ghost {
  background: var(--qx-tile-bg);
  color: var(--qx-text-color);
  border: 1px solid var(--qx-border);
}

.qx-input {
  width: 100%;
  padding: var(--qx-pad-item);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius);
  background: var(--qx-bg);
  color: var(--qx-text-color);
  font-size: var(--qx-fs);
}

.hadith-item {
  position: relative;
}

.hadith-item .ref {
  padding-right: 48px;
}

.hadith-item .qx-star {
  position: absolute;
  right: 8px;
  bottom: 8px;
}

/* PC reading width: default narrow, toggle in header (>=900px only), choice saved */
#widthToggle { display: none; }
#widthToggle .wt-narrow { display: none; }
body.read-wide #widthToggle .wt-wide { display: none; }
body.read-wide #widthToggle .wt-narrow { display: block; }
#widthToggle { margin-right: 6px; }
#widthToggle[aria-pressed="true"] { color: var(--qx-main-color); border-color: var(--qx-main-color); }
@media (min-width:900px) {
  #widthToggle { display: flex; }
  body:not(.read-wide) #app,
  body:not(.read-wide).inside-page #app { max-width: 720px; }
}

/* Quran lists (surah, para, topic): grid = 2 per row on phones, 3 per row on PC (>=900px); list = 1 per row */
.surah-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
.surah-grid .surah-item { margin: 0; min-height: 0; }
.surah-grid:not(.is-list) .surah-item { padding: 10px; gap: 6px 8px; flex-wrap: wrap; align-content: flex-start; }
.surah-grid:not(.is-list) .surah-item .num { order: 1; flex: 0 0 32px; min-width: 32px; height: 32px; font-size: var(--qx-fs-sm); }
.surah-grid:not(.is-list) .surah-item .ar-name { order: 2; margin-left: auto; max-width: none; font-size: var(--qx-fs-xl); }
.surah-grid:not(.is-list) .surah-item .mid { order: 3; flex: 1 1 100%; }
.surah-grid.is-list { grid-template-columns: minmax(0,1fr); }
.surah-grid.is-list .surah-item { padding: 10px 12px; gap: 12px; flex-wrap: nowrap; align-items: center; }
.surah-grid.is-list .surah-item .num { flex: 0 0 36px; min-width: 36px; height: 36px; font-size: var(--qx-fs-sm); }
.surah-grid.is-list .surah-item .mid { flex: 1 1 auto; min-width: 0; }
.surah-grid.is-list .surah-item .ar-name { margin-left: auto; max-width: none; font-size: var(--qx-fs-xl); }
@media (min-width:900px) {
  .surah-grid:not(.is-list) { grid-template-columns: repeat(3,minmax(0,1fr)); gap: 10px; }
}

/* B6: kalima/ramadan section cards — formerly repeated inline styles */
.qx-sec-page { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.qx-sec-page .item { margin: 0; border-radius: var(--qx-radius-lg); }
.ayah.qx-sec-card { margin: 0; padding: 14px 16px; box-shadow: none; }
.ayah.qx-sec-card .no { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
.ayah.qx-sec-card .bn { margin-top: 8px; padding-top: 0; border-top: none; }
.ayah.qx-sec-card .qx-sec-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; cursor: pointer; }
.ayah.qx-sec-card .qx-sec-head .qx-num-badge,
.ayah.qx-sec-card .qx-sec-head .qx-tri-badge { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background: var(--qx-badge-bg); color: var(--qx-main-color); font-weight: 700; font-size: var(--qx-fs-md); }
.ayah.qx-sec-card .qx-sec-head .qx-sec-title { border: none; background: none; color: var(--qx-main-color); padding: 0; font-size: var(--qx-fs-xl); font-weight: 700; min-height: 0; flex: 1; text-align: left; }
.ayah.qx-sec-card .qx-sec-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.ayah.qx-sec-card .qx-sec-body { display: none; }
.ayah.qx-sec-card.open .qx-sec-body { display: block; }

/* namaz shikkha: arrows, source chip, nav buttons (scoped under .qx-nm) */
.qx-nm .qx-nm-ic { display: inline-flex; align-items: center; justify-content: center; line-height: 0; }
.qx-nm .qx-nm-chev { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex: 0 0 32px; border-radius: 50%; background: var(--qx-main-soft); color: var(--qx-main-color); transition: transform .15s ease, background .15s ease; }
.qx-nm .item:hover .qx-nm-chev { transform: translateX(2px); background: var(--qx-main-color); color: var(--qx-on-main); }
.qx-nm .qx-nm-back, .qx-nm .qx-nm-prev, .qx-nm .qx-nm-next { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px 0 10px; border-radius: var(--qx-radius-pill); font-weight: 600; font-size: var(--qx-fs-md); cursor: pointer; background: var(--qx-main-soft); color: var(--qx-main-color); border: 1px solid transparent; }
.qx-nm .qx-nm-back { margin-bottom: 12px; }
.qx-nm .qx-nm-next { padding: 0 10px 0 14px; background: var(--qx-main-color); color: var(--qx-on-main); }
.qx-nm .qx-nm-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 16px; }
.qx-nm .qx-nm-nav .qx-nm-lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 36vw; }
.qx-nm .qx-nm-src { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--qx-border); }
.qx-nm .qx-nm-src-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 12px 0 9px; border-radius: var(--qx-radius-pill); background: var(--qx-card-bg); border: 1px solid var(--qx-border); color: var(--qx-main-color); font-size: var(--qx-fs-md); }
.qx-nm .qx-nm-src-chip b { font-weight: 600; color: var(--qx-text-color); }
.qx-nm .qx-nm-src-chip svg { width: 15px; height: 15px; }
.qx-nm .qx-nm-src-no { padding-left: 8px; margin-left: 2px; border-left: 1px solid var(--qx-border); color: var(--qx-meta-color); font-weight: 600; }
.qx-nm .qx-nm-grade { display: inline-flex; align-items: center; gap: 4px; min-height: 30px; padding: 0 12px 0 8px; border-radius: var(--qx-radius-pill); background: color-mix(in srgb, var(--qx-success) 14%, transparent); color: var(--qx-success); font-size: var(--qx-fs-md); font-weight: 700; }
.qx-nm .qx-nm-grade svg { width: 15px; height: 15px; }

/* খতম প্ল্যান: কাস্টম দিনের বাটন লাইন ভেঙে নামবে, আংশিক পড়া দিনের রং */
.pp-tabs.wrap { flex-wrap: wrap; }
.pp-tabs.wrap button { flex: 1 1 28%; }
.khatam-dot.part {
  background: color-mix(in srgb, var(--qx-main-color) 30%, var(--qx-card-bg));
  border-color: var(--qx-main-color);
}


/* খতম প্ল্যান: দিনের ঘরে টিক (ফেজ ২) */
.khatam-dot {
  position: relative;
  width: 28px;
  height: 30px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}

.khatam-dot.miss {
  border-color: var(--qx-danger);
  color: var(--qx-danger);
}

.khatam-dot.ticked {
  font-weight: 700;
}

.khatam-dot.ticked::after {
  content: "\2713";
  position: absolute;
  top: -6px;
  right: -5px;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 9px;
  line-height: 1;
  background: var(--qx-card-bg);
  color: var(--qx-main-color);
  border: 1px solid var(--qx-main-color);
}

.khatam-dot:focus-visible {
  outline: 2px solid var(--qx-main-color);
  outline-offset: 2px;
}

/* আইকন ফন্ট: লোড হওয়ার আগে লুকানো (blink বন্ধ), ব্যর্থ হলে চিহ্ন-ফলব্যাক */
html.icons-pending .ms {
  visibility: hidden;
}

body.no-icon-font .ms {
  font-family: var(--qx-font), sans-serif;
  font-size: 0;
  width: 20px;
  height: 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  overflow: visible;
  vertical-align: middle;
  font-variation-settings: normal;
}

body.no-icon-font .ms::before {
  content: attr(data-g);
  font-size: 17px;
  line-height: 1;
  font-style: normal;
  font-weight: 400;
  text-align: center;
}
</style>
