<script>
(function(){
  var lastY=window.scrollY, ticking=false;
  window.addEventListener('scroll',function(){
    if(ticking) return; ticking=true;
    requestAnimationFrame(function(){
      var y=window.scrollY, d=y-lastY;
      var dd=document.getElementById('gridDropdown'), ov=document.getElementById('gridPopupOverlay');
      var busy=(dd&&dd.classList.contains('open'))||(ov&&ov.classList.contains('open'))||document.querySelector('.modal-overlay,.sheet-ov');
      if(busy||y<60){ document.body.classList.remove('bars-hidden'); lastY=y; }
      else if(d>8){ document.body.classList.add('bars-hidden'); lastY=y; }
      else if(d<-8){ document.body.classList.remove('bars-hidden'); lastY=y; }
      ticking=false;
    });
  },{passive:true});
})();
</script>



<script>
/* ===== STEP 1: HIFZ MODE ===== */
(function(){
  var MODE = localStorage.getItem('quranix_hifz_mode') || 'off'; // off | bn | ar | both
  var MEM = {}; try{ MEM = JSON.parse(localStorage.getItem('quranix_hifz_mem')||'{}'); }catch(e){ MEM={}; }
  function save(){ localStorage.setItem('quranix_hifz_mode', MODE); localStorage.setItem('quranix_hifz_mem', JSON.stringify(MEM)); }
  function applyMode(){
    document.body.classList.toggle('hifz-on', MODE!=='off');
    document.querySelectorAll('#hifzBar .hifz-chip').forEach(function(c){ c.classList.toggle('on', c.dataset.hifz===MODE); });
    var t=document.getElementById('hifzToggle'); if(t) t.classList.toggle('on', MODE!=='off');
    document.querySelectorAll('.ayah').forEach(applyToCard);
    updateProgress();
  }
  function applyToCard(card){
    var ar=card.querySelector('.ar'), bn=card.querySelector('.bn');
    if(ar) ar.classList.toggle('hifz-hide', MODE==='ar'||MODE==='both');
    if(bn) bn.classList.toggle('hifz-hide', MODE==='bn'||MODE==='both');
    // tap to reveal / hide again
    [ar,bn].forEach(function(el){ if(!el||el.dataset.hifzBound) return; el.dataset.hifzBound='1';
      el.addEventListener('click', function(e){ if(!el.classList.contains('hifz-hide')) return; e.stopPropagation(); el.classList.toggle('revealed'); });
    });
    // per-ayah eye + memorized tick
    var acts=card.querySelector('.ayah-actions'); if(acts && !acts.dataset.hifzBound){ acts.dataset.hifzBound='1';
      var eye=document.createElement('button'); eye.className='hifz-eye'; eye.title='এই আয়াত লুকাও / দেখাও'; eye.textContent='{{visibility}}';
      eye.onclick=function(e){ e.stopPropagation(); var a=card.querySelector('.ar'), b=card.querySelector('.bn');
        var hiding = !(a&&a.classList.contains('hifz-hide')) || !(b&&b.classList.contains('hifz-hide'));
        [a,b].forEach(function(el){ if(el){ el.classList.toggle('hifz-hide', hiding); el.classList.remove('revealed'); }});
        eye.classList.toggle('on', hiding); };
      var tick=document.createElement('button'); tick.className='hifz-eye'; tick.title='মুখস্থ হয়েছে'; tick.textContent='{{psychology}}';
      var key=card.dataset.key||'';
      function paintTick(){ tick.classList.toggle('on', !!MEM[key]); card.classList.toggle('hifz-memorized', !!MEM[key]); tick.textContent = MEM[key] ? '{{check_circle:f}}' : '{{psychology}}'; }
      tick.onclick=function(e){ e.stopPropagation(); if(!key) return; if(MEM[key]) delete MEM[key]; else MEM[key]=1; save(); paintTick(); updateProgress();
        if(typeof showToast==='function') showToast(MEM[key] ? 'মুখস্থ হিসেবে চিহ্নিত' : 'মুখস্থ চিহ্ন সরানো হয়েছে'); };
      paintTick(); acts.prepend(tick); acts.prepend(eye);
    }
  }
  function updateProgress(){
    var el=document.getElementById('hifzProgress'); if(!el) return;
    var cards=document.querySelectorAll('.ayah').length;
    var done=Object.keys(MEM).length;
    el.textContent = cards ? ('এই পেজে '+cards+' আয়াত · মোট মুখস্থ '+done+'টি') : ('মোট মুখস্থ '+done+'টি');
  }
  // Header toggle button
  function addToggle(){
    var tools=document.getElementById('gQuick'); if(!tools||document.getElementById('hifzToggle')) return;
    var b=document.createElement('button'); b.id='hifzToggle'; b.className='g-quick-btn'; b.title='হিফজ মোড'; b.innerHTML='{{psychology}}<span>হিফজ</span>';
    b.onclick=function(){ MODE = (MODE==='off' ? 'bn' : 'off'); save(); applyMode();
      if(typeof showToast==='function') showToast(MODE==='off' ? 'হিফজ মোড বন্ধ' : 'হিফজ মোড চালু — বাংলা লুকানো আছে'); };
    tools.insertBefore(b, tools.firstChild);
  }
  document.querySelectorAll('#hifzBar .hifz-chip').forEach(function(c){
    c.onclick=function(){ MODE=c.dataset.hifz; save(); applyMode(); };
  });
  // Watch for new ayah cards (Surah / Juz load)
  var obs=new MutationObserver(function(){ applyMode(); });
  obs.observe(document.getElementById('app')||document.body, {childList:true, subtree:true});
  // Also re-apply after any click that opens a surah (delayed render)
  document.addEventListener('click', function(){ setTimeout(applyMode, 350); });
  addToggle(); setTimeout(addToggle, 500); applyMode();
  window.quranixHifz = { getMode:function(){return MODE;}, setMode:function(m){MODE=m;save();applyMode();} };
})();
</script>

<script>
/* ===== STEP 2: KHATAM PLANNER ===== */
(function(){
  var KEY='quranix_khatam';
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||'null')||null; }catch(e){ return null; } }
  function save(p){ localStorage.setItem(KEY, JSON.stringify(p)); }
  function todayStr2(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
  function fmtDate(s){ try{ return new Date(s+'T00:00:00').toLocaleDateString('bn-BD',{day:'numeric',month:'long',year:'numeric'}); }catch(e){ return s; } }
  // global ayah index (0-based) -> {surah, ayah}
  function fromGlobal(idx){
    idx=Math.max(0,Math.min(6235,idx));
    var acc=0;
    for(var i=0;i<(window.surahs||[]).length;i++){
      var n=(window.surahs[i].numberOfAyahs||0);
      if(idx < acc+n) return {s:window.surahs[i].number, a:idx-acc+1, name:window.surahs[i].englishName};
      acc+=n;
    }
    return {s:114,a:6,name:'An-Nas'};
  }
  function toGlobal(s,a){ var acc=0; for(var i=0;i<(window.surahs||[]).length;i++){ if(window.surahs[i].number===s) return acc+(a-1); acc+=(window.surahs[i].numberOfAyahs||0);} return 0; }
  function refStr(g){ var r=fromGlobal(g); return r.name+' · আয়াত '+ (window.toBn?toBn(r.a):r.a); }
  function getPlan(){ var p=load(); if(!p) return null; return p; }
  function planStats(p){
    var total=6236, done=p.current||0, perDay=Math.ceil(total/(p.days||30));
    var elapsed=Math.max(0, daysBetween(p.start, todayStr2()));
    var dayNo=Math.min(p.days, elapsed+1);
    var expected=Math.min(total, dayNo*perDay);
    var todayStart=Math.min(total, (dayNo-1)*perDay);
    var todayEnd=Math.min(total, dayNo*perDay);
    var endDate=new Date(p.start+'T00:00:00'); endDate.setDate(endDate.getDate()+(p.days-1));
    var remain=Math.max(0, daysBetween(todayStr2(), endDate.toISOString().slice(0,10))+1);
    var pct=Math.round(done/total*100);
    var onTrack = done>=expected;
    return {total:total,done:done,perDay:perDay,dayNo:dayNo,expected:expected,todayStart:todayStart,todayEnd:todayEnd,endDate:endDate.toISOString().slice(0,10),remain:remain,pct:pct,onTrack:onTrack};
  }
  function buildKhatamCard(){
    var box=document.createElement('div'); box.className='khatam-card';
    var p=getPlan();
    if(!p){
      box.innerHTML='<b>{{calendar_month}} খতম প্ল্যান</b><div class="khatam-row"><span>এখনো কোনো প্ল্যান নেই — ৩০ দিন / রমজান / ১ বছরে পুরো কুরআন শেষ করো</span></div><div class="khatam-row"><span style="color:var(--accent);font-weight:700">+ প্ল্যান বানাও →</span><span>৬,২৩৬ আয়াত</span></div>';
      box.onclick=function(){ renderKhatamPopup(); };
      return box;
    }
    var st=planStats(p);
    var todayDone = p.doneDays && p.doneDays[todayStr2()];
    box.innerHTML='<div class="khatam-row"><b>{{calendar_month}} খতম প্ল্যান — '+ (window.toBn?toBn(st.dayNo):st.dayNo)+' / '+ (window.toBn?toBn(p.days):p.days)+' দিন</b><span>'+ (st.onTrack?'{{check_circle:f}} ট্র্যাকে আছো':'{{warning}} একটু পিছিয়ে') +'</span></div>'
      +'<div class="khatam-row"><span>আজকের পড়া</span><b>'+refStr(st.todayStart)+' → '+refStr(Math.max(st.todayStart, st.todayEnd-1))+'</b></div>'
      +'<div class="khatam-row"><span>শেষ হবে</span><b>'+fmtDate(st.endDate)+' · আর '+ (window.toBn?toBn(st.remain):st.remain) +' দিন</b></div>'
      +'<div class="goal-track" style="margin:8px 0"><div class="goal-fill" style="width:'+st.pct+'%"></div></div>'
      +'<div class="khatam-row"><span>'+ (window.toBn?toBn(st.done):st.done) +' / '+ (window.toBn?toBn(st.total):st.total) +' আয়াত ('+ (window.toBn?toBn(st.pct):st.pct) +'%)</span><span>'+ (todayDone?'{{check_circle:f}} আজ শেষ':'{{hourglass_top}} আজ বাকি') +'</span></div>'
      +'<div class="khatam-row"><span style="color:var(--accent);font-weight:700">আজকের পড়া শুরু করো →</span><span>প্ল্যান দেখো</span></div>';
    box.onclick=function(e){
      // first click: jump to today's reading; popup opens via small delay? Use direct jump
      var r=fromGlobal(st.todayStart);
      if(typeof openSurah==='function') openSurah(r.s, 0, r.a);
    };
    return box;
  }
  window.buildKhatamCard=buildKhatamCard;

  function renderKhatamPopup(){
    // reuse grid popup box if available, else fallback to full view
    var box=document.getElementById('gridPopupBox'), overlay=document.getElementById('gridPopupOverlay');
    if(!box||!overlay){ openKhatamView(); return; }
    overlay.classList.add('open');
    var p=getPlan();
    if(!p){
      box.innerHTML='<button class="pp-close" onclick="document.getElementById(\'gridPopupOverlay\').classList.remove(\'open\')">{{close}}</button><h3>{{calendar_month}} খতম প্ল্যান বানাও</h3>'
        +'<div class="khatam-setup"><label>কত দিনে শেষ করবা?</label>'
        +'<div class="pp-tabs" id="khDays"><button data-d="30" class="on">৩০ দিন</button><button data-d="60">৬০ দিন</button><button data-d="90">৯০ দিন</button><button data-d="365">১ বছর</button></div>'
        +'<label>শুরু</label><input type="date" class="pp-input" id="khStart" value="'+todayStr2()+'">'
        +'<div class="pp-mini" id="khPreview"></div>'
        +'<button class="pp-btn" id="khCreate">{{check_circle:f}} প্ল্যান শুরু করো</button></div>';
      var days=30;
      function upd(){ var per=Math.ceil(6236/days); var el=document.getElementById('khPreview'); if(el) el.innerHTML='প্রতিদিন প্রায় <b>'+(window.toBn?toBn(per):per)+' আয়াত</b> · শেষ হবে <b>'+fmtDate(new Date(document.getElementById('khStart').value+'T00:00:00').toISOString().slice(0,10)==='Invalid Date'?'—':fmtDate(new Date(new Date(document.getElementById('khStart').value+'T00:00:00').setDate(new Date(document.getElementById('khStart').value+'T00:00:00').getDate()+days-1)).toISOString().slice(0,10)))+'</b>'; }
      document.querySelectorAll('#khDays button').forEach(function(b){ b.onclick=function(){ document.querySelectorAll('#khDays button').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); days=parseInt(b.dataset.d,10); upd(); }; });
      document.getElementById('khStart').onchange=upd; upd();
      document.getElementById('khCreate').onclick=function(){
        var np={days:days, start:document.getElementById('khStart').value||todayStr2(), current:0, doneDays:{}, created:todayStr2()};
        save(np); overlay.classList.remove('open');
        if(typeof showToast==='function') showToast('খতম প্ল্যান শুরু! প্রতিদিন '+ (window.toBn?toBn(Math.ceil(6236/days)):Math.ceil(6236/days)) +' আয়াত');
        if(typeof renderHome==='function') renderHome();
      };
      return;
    }
    var st=planStats(p);
    var dots=''; for(var i=1;i<=p.days;i++){ var d=new Date(p.start+'T00:00:00'); d.setDate(d.getDate()+i-1); var ds=d.toISOString().slice(0,10); dots+='<span class="khatam-dot'+(p.doneDays&&p.doneDays[ds]?' done':'')+(i===st.dayNo?' today':'')+'" title="'+ds+'">'+(window.toBn?toBn(i):i)+'</span>'; }
    box.innerHTML='<button class="pp-close" onclick="document.getElementById(\'gridPopupOverlay\').classList.remove(\'open\')">{{close}}</button><h3>{{calendar_month}} খতম প্ল্যান</h3>'
      +'<div class="khatam-row"><b>দিন '+ (window.toBn?toBn(st.dayNo):st.dayNo) +' / '+ (window.toBn?toBn(p.days):p.days) +'</b><span>'+(st.onTrack?'{{check_circle:f}} ট্র্যাকে':'{{warning}} পিছিয়ে')+'</span></div>'
      +'<div class="khatam-row"><span>আজকের পড়া</span><b>'+refStr(st.todayStart)+' → '+refStr(Math.max(st.todayStart, st.todayEnd-1))+'</b></div>'
      +'<div class="khatam-row"><span>আজ পড়তে হবে</span><b>'+ (window.toBn?toBn(st.perDay):st.perDay) +' আয়াত</b></div>'
      +'<div class="goal-track" style="margin:8px 0"><div class="goal-fill" style="width:'+st.pct+'%"></div></div>'
      +'<div class="khatam-row"><span>মোট</span><b>'+ (window.toBn?toBn(st.done):st.done) +' / ৬,২৩৬ ('+ (window.toBn?toBn(st.pct):st.pct) +'%)</b></div>'
      +'<div class="khatam-row"><span>শেষ হবে</span><b>'+fmtDate(st.endDate)+'</b></div>'
      +'<div class="pp-mini">দিনগুলো — সবুজ = শেষ, বর্ডার = আজ</div><div class="khatam-dots">'+dots+'</div>'
      +'<button class="pp-btn" id="khGo">{{play_arrow}} আজকের পড়া শুরু করো</button><div style="height:8px"></div>'
      +'<button class="pp-btn" id="khDone" style="background:var(--card);color:var(--text);border:1px solid var(--line)">'+(p.doneDays&&p.doneDays[todayStr2()]?'{{undo}} আজকের টিক সরাও':'{{check_circle:f}} আজকের পড়া শেষ বলে মার্ক করো')+'</button><div style="height:8px"></div>'
      +'<button class="pp-btn" id="khReset" style="background:none;color:#dc2626;border:1px solid #dc2626">{{delete}} প্ল্যান মুছে ফেলো</button>';
    document.getElementById('khGo').onclick=function(){ overlay.classList.remove('open'); var r=fromGlobal(st.todayStart); if(typeof openSurah==='function') openSurah(r.s,0,r.a); };
    document.getElementById('khDone').onclick=function(){
      var td=todayStr2(); p.doneDays=p.doneDays||{};
      if(p.doneDays[td]){ delete p.doneDays[td]; p.current=Math.max(0, st.todayStart); }
      else { p.doneDays[td]=1; p.current=Math.max(p.current||0, st.todayEnd); if(p.current>=6236){ p.current=6236; } }
      save(p); if(typeof showToast==='function') showToast(p.doneDays[td]?'আজকের পড়া শেষ':'আজকের টিক সরানো হয়েছে'); renderKhatamPopup(); if(typeof renderHome==='function') renderHome();
    };
    document.getElementById('khReset').onclick=function(){ if(confirm('খতম প্ল্যান মুছে ফেলবা?')){ localStorage.removeItem(KEY); overlay.classList.remove('open'); if(typeof renderHome==='function') renderHome(); } };
    var mini=document.getElementById('gKhatamMini'); if(mini) mini.textContent=(window.toBn?toBn(st.pct):st.pct)+'% ›';
  }
  window.renderKhatamPopup=renderKhatamPopup;
  function openKhatamView(){ renderKhatamPopup(); }
  // Keep progress in sync when user marks ayahs read in reader (goalData)
  // Khatam progress is manual via "আজ শেষ" button, so it never auto-drifts.
})();
</script>

<script>
/* ===== STEP 3: OFFLINE AUDIO (IndexedDB) ===== */
(function(){
  var DB='quranix-audio', STORE='audio';
  function db(){ return new Promise(function(res,rej){ var r=indexedDB.open(DB,1); r.onupgradeneeded=function(){ try{r.result.createObjectStore(STORE);}catch(e){} }; r.onsuccess=function(){res(r.result)}; r.onerror=function(){rej(r.error)}; }); }
  function put(key, blob){ return db().then(function(d){ return new Promise(function(res,rej){ var tx=d.transaction(STORE,'readwrite'); tx.objectStore(STORE).put(blob,key); tx.oncomplete=function(){res()}; tx.onerror=function(){rej(tx.error)}; }); }); }
  function get(key){ return db().then(function(d){ return new Promise(function(res,rej){ var q=d.transaction(STORE).objectStore(STORE).get(key); q.onsuccess=function(){res(q.result||null)}; q.onerror=function(){rej(q.error)}; }); }); }
  function del(key){ return db().then(function(d){ return new Promise(function(res,rej){ var tx=d.transaction(STORE,'readwrite'); tx.objectStore(STORE).delete(key); tx.oncomplete=function(){res()}; tx.onerror=function(){rej(tx.error)}; }); }); }
  function keys(){ return db().then(function(d){ return new Promise(function(res,rej){ var q=d.transaction(STORE).objectStore(STORE).getAllKeys(); q.onsuccess=function(){res(q.result||[])}; q.onerror=function(){rej(q.error)}; }); }); }
  function meta(){ try{ return JSON.parse(localStorage.getItem('quranix_dl_meta')||'{}'); }catch(e){ return {}; } }
  function saveMeta(m){ localStorage.setItem('quranix_dl_meta', JSON.stringify(m)); }
  function pad(n){ return String(n).padStart(3,'0'); }
  function urlFor(rec, s, a){ return 'https://everyayah.com/data/'+rec+'/'+pad(s)+pad(a)+'.mp3'; }
  function keyFor(rec,s,a){ return rec+'/'+pad(s)+pad(a); }
  function currentSurah(){
    var list=window._activeAyahList||[];
    if(list.length && list[0] && list[0].s) return {n:list[0].s.number, name:list[0].s.englishName, count:list.length, list:list};
    if(typeof reading!=='undefined' && reading && reading.t==='s'){ var s=(window.surahs||[]).find(function(x){return x.number===reading.n}); if(s) return {n:s.number,name:s.englishName,count:s.numberOfAyahs,list:null}; }
    return null;
  }
  function currentReciter(){ return (typeof currentReciter!=='undefined'?currentReciter:localStorage.getItem('reciter')) || 'Saood_ash-Shuraym_128kbps'; }
  // NOTE: currentReciter is a let in main script; accessing it here via window may fail - read from ls instead
  function reciterNow(){ try{ var v=localStorage.getItem('reciter'); return v?JSON.parse(v):'Saood_ash-Shuraym_128kbps'; }catch(e){ return 'Saood_ash-Shuraym_128kbps'; } }
  function reciterName(id){ var f=(typeof RECITERS!=='undefined'?RECITERS:[]).find(function(r){return r[0]===id}); return f?f[1]:id; }

  var downloading=false;
  async function refreshDlBar(){
    var bar=document.getElementById('dlBar'); if(!bar) return;
    var cur=currentSurah();
    // show only inside a surah reader (nav hidden = reader open)
    var nav=document.getElementById('nav');
    var inReader = nav && nav.style.display==='none' && cur;
    bar.classList.toggle('show', !!inReader);
    if(!inReader) return;
    var rec=reciterNow(); var m=meta(); var k=cur.n+'|'+rec;
    var info=m[k];
    var fullPackage=packageMeta()['audio|'+rec];
    var hasFullPackage=!!(fullPackage && fullPackage.status==='complete');
    document.getElementById('dlTitle').textContent='{{download}} '+cur.name+' — তেলাওয়াত';
    var btn=document.getElementById('dlBtn');
    if(info || hasFullPackage){
      var savedCount=info?info.count:cur.count;
      document.getElementById('dlSub').innerHTML='<span class="offline-badge2">{{check_circle:f}} অফলাইন</span> '+savedCount+' আয়াত · '+reciterName(rec)+' · ডাটা ছাড়াই চলবে'+(hasFullPackage?' · সম্পূর্ণ কুরআন ডাউনলোড করা':'');
      btn.textContent=info?'{{delete}} মুছুন':'সম্পূর্ণ প্যাকেজ ডাউনলোডেড';
      btn.disabled=!info;
    } else { document.getElementById('dlSub').textContent=cur.count+' আয়াত · '+reciterName(rec)+' · একবার ডাউনলোড করলেই অফলাইনে চলবে'; btn.textContent='{{download}} ডাউনলোড'; btn.disabled=downloading; }
  }
  async function downloadCurrent(){
    if(downloading) return; var cur=currentSurah(); if(!cur) return;
    var rec=reciterNow(); var m=meta(); var k=cur.n+'|'+rec;
    var btn=document.getElementById('dlBtn');
    if(m[k]){ // delete
      if(!confirm('এই সূরার ডাউনলোড মুছে ফেলবা?')) return;
      var count=Number(cur.count||0);
      // Reader list may be unavailable after navigation; use canonical surah metadata as fallback.
      if(!count && window.surahs){var sm=window.surahs.find(function(x){return Number(x.number)===Number(cur.n);});count=sm?Number(sm.numberOfAyahs||0):0;}
      if(cur.list && cur.list.length){for(var i=0;i<cur.list.length;i++){try{await del(keyFor(rec,cur.list[i].s.number,cur.list[i].no));}catch(e){}}}
      else {for(var ai=1;ai<=count;ai++){try{await del(keyFor(rec,cur.n,ai));}catch(e){}}}
      delete m[k]; saveMeta(m); if(typeof showToast==='function') showToast('ডাউনলোড মুছে ফেলা হয়েছে'); refreshDlBar(); return;
    }
    if(!navigator.onLine){ if(typeof showToast==='function') showToast('ডাউনলোডের জন্য ইন্টারনেট লাগবে'); return; }
    downloading=true; refreshDlBar();
    try{
      var list=cur.list||[];
      // if list missing, build from surahs count (fetch ayahs via openSurah already loaded, so list should exist)
      var done=0, failed=0;
      for(var i=0;i<list.length;i++){
        var a=list[i]; var key=keyFor(rec,a.s.number,a.no);
        try{ var ex=await get(key); if(!ex){ var r=await fetch(urlFor(rec,a.s.number,a.no)); if(!r.ok) throw new Error('HTTP '+r.status); await put(key, await r.blob()); } done++; }
        catch(e){ failed++; }
        if(btn) btn.textContent='{{hourglass_top}} '+Math.round((i+1)/list.length*100)+'% ('+(window.toBn?toBn(i+1):i+1)+'/'+(window.toBn?toBn(list.length):list.length)+')';
        if((i%5)===4) await new Promise(function(r){setTimeout(r,30)});
      }
      var mm=meta();
      if(failed===0 && done===list.length){mm[k]={count:done, at:new Date().toISOString(), reciter:rec, name:cur.name};saveMeta(mm);}
      else {delete mm[k];saveMeta(mm);}
      if(typeof showToast==='function') showToast(failed?('ডাউনলোড অসম্পূর্ণ — '+done+'টি হয়েছে, '+failed+'টি হয়নি। আবার চেষ্টা করো।'):'{{check_circle:f}} ডাউনলোড শেষ! এখন অফলাইনে চলবে');
    }catch(e){ if(typeof showToast==='function') showToast('ডাউনলোড হয়নি, আবার চেষ্টা করো'); }
    downloading=false; refreshDlBar();
  }
  document.getElementById('dlBtn').onclick=downloadCurrent;
  document.getElementById('dlManageBtn').onclick=function(){ if(window.openGridPopup) window.openGridPopup('downloads'); };
  setInterval(refreshDlBar, 800);
  document.addEventListener('click', function(){ setTimeout(refreshDlBar, 400); });

  // --- Playback: use the IndexedDB Blob directly when it is available offline ---
  var origPlay = window.playAyahAtIndex;
  var offlineAudioObjectUrl = null;
  window.playAyahAtIndex = async function(idx){
    try{
      // currentPlaylist and audioObj are top-level lexical bindings, not window properties.
      var list = (typeof currentPlaylist !== 'undefined' && currentPlaylist.length)
        ? currentPlaylist
        : (window._activeAyahList || []);
      var item = list[idx];
      if(item){
        var rec = reciterNow();
        var blob = await get(keyFor(rec, item.s.number, item.no));
        if(blob){
          if(offlineAudioObjectUrl) URL.revokeObjectURL(offlineAudioObjectUrl);
          offlineAudioObjectUrl = URL.createObjectURL(blob);
          currentPlayIdx = idx;
          audioObj.src = offlineAudioObjectUrl;
          audioObj.playbackRate = SPEEDS[audioSpeedIdx] || 1;
          audioTitle.textContent = item.s.englishName + ' · আয়াত ' + toBn(item.no);
          audioReciterLabel.textContent = reciterName(rec) + ' · অফলাইন';
          audioBar.style.display = 'block';
          updateAudioBarPos();
          audioAuto.classList.toggle('on', autoPlayNext);
          highlightPlayingCard(item.s.number, item.no);
          await audioObj.play();
          audioPlayPause.textContent = '{{pause}}';
          return;
        }
      }
    }catch(e){
      // If the offline blob is missing or cannot be played, use the normal online player.
    }
    if(offlineAudioObjectUrl){ URL.revokeObjectURL(offlineAudioObjectUrl); offlineAudioObjectUrl=null; }
    return origPlay(idx);
  };
  try{ playAyahAtIndex = window.playAyahAtIndex; }catch(e){}

  var packageJob = null;
  var CONTENT_DB = 'quranix-content';
  var CONTENT_STORE = 'chapters';
  function contentDb(){
    return new Promise(function(resolve,reject){
      var req=indexedDB.open(CONTENT_DB,1);
      req.onupgradeneeded=function(){ if(!req.result.objectStoreNames.contains(CONTENT_STORE)) req.result.createObjectStore(CONTENT_STORE); };
      req.onsuccess=function(){ resolve(req.result); };
      req.onerror=function(){ reject(req.error); };
    });
  }
  async function contentPut(key,value){
    var d=await contentDb();
    return new Promise(function(resolve,reject){ var tx=d.transaction(CONTENT_STORE,'readwrite'); tx.objectStore(CONTENT_STORE).put(value,key); tx.oncomplete=function(){d.close();resolve();}; tx.onerror=function(){d.close();reject(tx.error);}; });
  }
  async function contentGet(key){
    var d=await contentDb();
    return new Promise(function(resolve,reject){ var q=d.transaction(CONTENT_STORE).objectStore(CONTENT_STORE).get(key); q.onsuccess=function(){d.close();resolve(q.result||null);}; q.onerror=function(){d.close();reject(q.error);}; });
  }
  async function contentDel(key){
    var d=await contentDb();
    return new Promise(function(resolve,reject){ var tx=d.transaction(CONTENT_STORE,'readwrite'); tx.objectStore(CONTENT_STORE).delete(key); tx.oncomplete=function(){d.close();resolve();}; tx.onerror=function(){d.close();reject(tx.error);}; });
  }
  function packageMeta(){ try{return JSON.parse(localStorage.getItem('quranix_content_packages')||'{}');}catch(e){return {};} }
  function savePackageMeta(m){ localStorage.setItem('quranix_content_packages',JSON.stringify(m)); }
  function editionLabel(){
    var sel=document.getElementById('transSel');
    if(!sel) return currentEdition;
    var opt=sel.options[sel.selectedIndex]; return opt ? opt.textContent.trim() : currentEdition;
  }
  function tafsirLabel(id){ var item=(typeof TAFSIRS!=='undefined'?TAFSIRS:[]).find(function(x){return Number(x[0])===Number(id);}); return item?item[1]:'তাফসির '+id; }
  function packageKey(type,id){ return type+'|'+String(id); }
  // Hadith corpus source: KafelaNetwork's public six-collection JSON repository.
  // Keep source attribution visible; this community dataset is not an official publisher API.
  var HADITH_CORPUS=[
    {id:'Bukhari',name:'সহিহ আল-বুখারি',chapters:97,meta:'bukhari.json',folder:'Bukhari'},
    {id:'Muslim',name:'সহিহ মুসলিম',chapters:56,meta:'muslim.json',folder:'Muslim'},
    {id:'AbuDaud',name:'সুনান আবু দাউদ',chapters:43,meta:'abudaud.json',folder:'AbuDaud'},
    {id:'At-tirmizi',name:'জামে আত-তিরমিজি',chapters:46,meta:'at-tirmizi.json',folder:'At-tirmizi'},
    {id:'Al-Nasai',name:'সুনান আন-নাসাঈ',chapters:50,meta:"nasa'i.json",folder:'Al-Nasai'},
    {id:'Ibne-Mazah',name:'সুনান ইবনে মাজাহ',chapters:37,meta:'ibnemajah.json',folder:'Ibne-Mazah'}
  ];
  var HADITH_CDN='https://cdn.jsdelivr.net/gh/kafelanetwork/hadith-api@main/';
  function normalizeHadithRows(payload){
    var rows=Array.isArray(payload)?payload:(payload&&Array.isArray(payload.hadiths)?payload.hadiths:(payload&&Array.isArray(payload.data)?payload.data:(payload&&Array.isArray(payload.items)?payload.items:(payload&&Array.isArray(payload.hadith)?payload.hadith:null))));
    if(!rows && payload && payload.hadith) rows=[payload];
    if(!rows && payload && typeof payload==='object'){
      rows=Object.keys(payload).map(function(k){return payload[k];}).filter(function(v){return v&&typeof v==='object'&&(v.hadith||v.hadith_id||v.id);});
    }
    if(!Array.isArray(rows)) return [];
    return rows.map(function(item){var h=item&&item.hadith?item.hadith:item;return h&&typeof h==='object'?h:null;}).filter(function(h){
      var bn=h&&(h.bn||h.text||h.translation), ar=h&&(h.ar||h.arabic);
      return h && (h.hadith_id!==undefined || h.id!==undefined) && String(bn||'').trim() && String(ar||'').trim();
    });
  }
  function hadithChapterUrl(collection,chapter){return HADITH_CDN+collection.folder+'/Chapter/'+chapter+'.json';}
  function hadithChapterKey(collectionId,chapter){return 'hadith|'+collectionId+'|'+chapter;}
  function hadithMetaKey(collectionId){return 'hadith-meta|'+collectionId;}
  function hadithMetaIndex(collection,chapter){return collection.id==='Ibne-Mazah'?String(chapter-1):String(chapter);}
  function hadithRangeCount(range){
    if(!range)return 0;
    var normalized=String(range).replace(/[০-৯]/g,function(d){return '০১২৩৪৫৬৭৮৯'.indexOf(d);}).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d);});
    var nums=normalized.match(/\d+/g);
    return nums&&nums.length>=2?Math.max(0,Number(nums[1])-Number(nums[0])+1):0;
  }
  function allSurahList(){
    if(window.surahs && window.surahs.length) return Promise.resolve(window.surahs);
    return loadSurahList();
  }
  function jobPauseWait(job){
    return new Promise(function(resolve,reject){
      function check(){ if(job.cancelled){reject(new Error('cancelled'));return;} if(!job.paused){resolve();return;} setTimeout(check,250); }
      check();
    });
  }
  function updatePackageProgress(job){
    var p=document.getElementById('qxPackageProgress');
    var t=document.getElementById('qxPackageStatus');
    var action=document.getElementById('qxPackageAction');
    if(p) p.value=job.total?Math.min(100,Math.round(job.done/job.total*100)):0;
    if(t) t.textContent=job.message+' · '+job.done+'/'+job.total;
    if(action) action.textContent=job.paused?'আবার চালু':'বিরতি';
  }
  async function loadSurahAyahsForEdition(edition, surahNo){
    if(LOCAL && edition === 'bn.bengali'){
      var localMeta = LOCAL.meta[surahNo-1];
      if(!localMeta || !LOCAL.ar[surahNo-1] || !LOCAL.bn[surahNo-1]) throw new Error('স্থানীয় অনুবাদ পাওয়া যায়নি: সূরা '+surahNo);
      return LOCAL.ar[surahNo-1].map(function(ar,i){
        return {no:i+1,ar:ar,bn:LOCAL.bn[surahNo-1][i]||''};
      });
    }
    if(edition === 'bn.zakaria'){
      var zakaria = await getZakariaSurahTranslation(surahNo);
      if(LOCAL && LOCAL.meta[surahNo-1]){
        return LOCAL.ar[surahNo-1].map(function(ar,i){return {no:i+1,ar:ar,bn:zakaria[i]||''};});
      }
      var arabicData = await getJSON('/surah/'+surahNo+'/quran-uthmani');
      return arabicData.ayahs.map(function(a,i){return {no:a.numberInSurah,ar:a.text,bn:zakaria[i]||''};});
    }
    var data = await getJSON('/surah/'+surahNo+'/editions/quran-uthmani,'+edition);
    if(!Array.isArray(data) || !data[0] || !data[1] || !Array.isArray(data[0].ayahs) || !Array.isArray(data[1].ayahs)){
      throw new Error('অনুবাদের ডেটা অসম্পূর্ণ: সূরা '+surahNo);
    }
    return data[0].ayahs.map(function(a,i){return {no:a.numberInSurah,ar:a.text,bn:data[1].ayahs[i]?data[1].ayahs[i].text:''};});
  }

  async function runPackage(type,id,label){
    if(packageJob && !packageJob.finished){ showToast('আগের ডাউনলোডটি আগে শেষ বা বাতিল করো'); return; }
    if(!navigator.onLine){ showToast('ডাউনলোডের জন্য ইন্টারনেট সংযোগ প্রয়োজন'); return; }
    if(type==='audio' && !confirm('সম্পূর্ণ কুরআনের ৬,২৩৬টি অডিও ফাইল ডাউনলোড হবে। এতে অনেক স্টোরেজ ও ডেটা লাগতে পারে। চালিয়ে যাবে?')) return;
    if(navigator.storage && navigator.storage.estimate){
      try{
        var estimate=await navigator.storage.estimate();
        if(estimate.quota && estimate.usage/estimate.quota>.95){ showToast('ডিভাইসের স্টোরেজ প্রায় পূর্ণ। আগে জায়গা খালি করো।'); return; }
      }catch(e){}
    }
    if(navigator.storage && navigator.storage.persist){
      try{ await navigator.storage.persist(); }catch(e){}
    }
    var surahList;
    try{ surahList=await allSurahList(); }catch(e){ showToast('সূরার তালিকা পাওয়া যায়নি: '+e.message); return; }
    if(!surahList || surahList.length!==114){ showToast('পূর্ণ ১১৪ সূরার তালিকা যাচাই করা যায়নি'); return; }
    var totalAyahs=surahList.reduce(function(sum,item){return sum+Number(item.numberOfAyahs||0);},0);
    if(totalAyahs!==6236){ showToast('আয়াতের মোট সংখ্যা যাচাইয়ে সমস্যা হয়েছে ('+totalAyahs+')'); return; }

    var job={type:type,id:String(id),label:label,done:0,bytes:0,total:type==='audio'?totalAyahs:(type==='hadith'?(HADITH_CORPUS.find(function(c){return c.id===String(id);})||{chapters:0}).chapters:114),paused:false,cancelled:false,finished:false,message:'প্রস্তুতি চলছে',controller:null};
    packageJob=job;
    renderDownloadsPopup().then(function(){updatePackageProgress(job);});
    var metaMap=packageMeta(), key=packageKey(type,id);
    var previous=metaMap[key]||{};
    metaMap[key]={type:type,id:String(id),label:label,status:'downloading',done:0,bytes:previous.bytes||0,total:job.total,updated:new Date().toISOString()};
    savePackageMeta(metaMap);
    try{
      if(type==='translation'){
        for(var sn=1;sn<=114;sn++){
          await jobPauseWait(job);
          var storeKey='translation|'+id+'|'+sn;
          var existing=await contentGet(storeKey);
          var expected=Number(surahList[sn-1].numberOfAyahs||0);
          var validChapter=Array.isArray(existing) && existing.length===expected && existing.every(function(a,i){return Number(a.no)===i+1 && String(a.ar||'').trim() && String(a.bn||'').trim();});
          if(!validChapter){
            var chapter=await loadSurahAyahsForEdition(String(id),sn);
            if(!chapter || chapter.length!==expected) throw new Error('অনুবাদের আয়াতসংখ্যা মেলেনি: সূরা '+sn);
            existing=chapter.map(function(a){return {no:Number(a.no),ar:String(a.ar||''),bn:String(a.bn||'')};});
            if(!existing.every(function(a,i){return a.no===i+1 && a.ar.trim() && a.bn.trim();})) throw new Error('অনুবাদের কিছু আয়াতের আরবি বা অনুবাদ খালি: সূরা '+sn);
            await contentPut(storeKey,existing);
          }
          job.done=sn;
          job.bytes+=new Blob([JSON.stringify(existing)]).size;
          job.message='অনুবাদ ডাউনলোড হচ্ছে'; updatePackageProgress(job);
          metaMap=packageMeta(); metaMap[key].done=job.done; metaMap[key].bytes=job.bytes; metaMap[key].updated=new Date().toISOString(); savePackageMeta(metaMap);
        }
      } else if(type==='tafsir'){
        var tafsirSlug=getTafsirSlug(id);
        if(!tafsirSlug) throw new Error('নির্বাচিত তাফসিরের ডেটাসেট পাওয়া যায়নি');
        for(var ts=1;ts<=114;ts++){
          await jobPauseWait(job);
          var tafKey='tafsir|'+id+'|'+ts;
          var tafData=await contentGet(tafKey);
          var tafExpected=Number(surahList[ts-1].numberOfAyahs||0);
          function validTafsirRows(rows){
            if(!Array.isArray(rows) || !rows.length) return false;
            var seen={};
            return rows.every(function(row){
              var n=Number(row&&row.verse_number);
              if(!row || !Number.isInteger(n) || n<1 || n>tafExpected || !String(row.text||'').trim() || seen[n]) return false;
              seen[n]=true; return true;
            });
          }
          if(!validTafsirRows(tafData)){
            job.controller=new AbortController();
            // spa5k/tafsir_api returns the surah's available tafsir rows as an array,
            // not { ayahs: [...] }. Ayahs without commentary are intentionally omitted.
            var url=TAFSIR_CDN+tafsirSlug+'/'+ts+'.json';
            var response=await fetch(url,{signal:job.controller.signal});
            if(!response.ok) throw new Error('তাফসির API HTTP '+response.status+' (সূরা '+ts+')');
            var payload=await response.json();
            var sourceRows=Array.isArray(payload)?payload:(payload&&Array.isArray(payload.ayahs)?payload.ayahs:(payload&&Array.isArray(payload.data)?payload.data:null));
            if(!sourceRows) throw new Error('তাফসিরের ডেটা কাঠামো সঠিক নয়: সূরা '+ts);
            tafData=sourceRows.map(function(row){
              var n=Number(row&& (row.ayah||row.verse_number||row.verse||row.number)||0);
              return {verse_number:n,verse_key:ts+':'+n,text:String(row&&row.text||'').trim()};
            }).filter(function(row){return row.verse_number>0 && row.text;});
            if(!validTafsirRows(tafData)) throw new Error('তাফসিরের সূরা '+ts+'-এর ডেটা খালি, ত্রুটিপূর্ণ বা পুনরাবৃত্ত আয়াতযুক্ত');
            await contentPut(tafKey,tafData);
          }
          job.done=ts; job.bytes+=new Blob([JSON.stringify(tafData)]).size; job.message='তাফসির ডাউনলোড হচ্ছে'; updatePackageProgress(job);
          metaMap=packageMeta(); metaMap[key].done=job.done; metaMap[key].bytes=job.bytes; metaMap[key].updated=new Date().toISOString(); savePackageMeta(metaMap);
        }
      } else if(type==='audio'){
        var rec=String(id);
        for(var si=0;si<surahList.length;si++){
          var surah=surahList[si];
          for(var ai=1;ai<=Number(surah.numberOfAyahs);ai++){
            await jobPauseWait(job);
            var audioKey=keyFor(rec,surah.number,ai);
            var blob=await get(audioKey);
            if(!blob){
              job.controller=new AbortController();
              var audioResponse=await fetch(urlFor(rec,surah.number,ai),{signal:job.controller.signal});
              if(!audioResponse.ok) throw new Error('অডিও ফাইল পাওয়া যায়নি: '+surah.number+':'+ai+' (HTTP '+audioResponse.status+')');
              blob=await audioResponse.blob();
              if(!blob || !blob.size) throw new Error('খালি অডিও ফাইল: '+surah.number+':'+ai);
              await put(audioKey,blob);
            }
            job.done++; job.bytes+=blob.size||0; job.message='অডিও ডাউনলোড হচ্ছে';
            if(job.done%5===0 || job.done===job.total) updatePackageProgress(job);
            if(job.done%20===0){ metaMap=packageMeta(); metaMap[key].done=job.done; metaMap[key].bytes=job.bytes; metaMap[key].updated=new Date().toISOString(); savePackageMeta(metaMap); }
          }
        }
      } else if(type==='hadith'){
        var collection=HADITH_CORPUS.find(function(c){return c.id===String(id);});
        if(!collection) throw new Error('হাদিসের সংগ্রহটি চেনা যায়নি');
        job.total=collection.chapters;
        var sourceMetaUrl=HADITH_CDN+collection.folder+'/Meta/'+collection.meta;
        var metaResponse=await fetch(sourceMetaUrl);
        if(!metaResponse.ok) throw new Error('হাদিসের অধ্যায়-তথ্য পাওয়া যায়নি (HTTP '+metaResponse.status+')');
        var chapterMeta=await metaResponse.json();
        if(!chapterMeta || typeof chapterMeta!=='object') throw new Error('অধ্যায়-তথ্য অসম্পূর্ণ; প্যাকেজ সম্পূর্ণ করা হয়নি');
        for(var hm=1;hm<=collection.chapters;hm++){
          var metaEntry=chapterMeta[hadithMetaIndex(collection,hm)];
          if(!metaEntry || !String(metaEntry.title||'').trim() || !String(metaEntry.hadis_range||'').trim()) throw new Error('অধ্যায়-তথ্যে ঘাটতি: '+collection.name+' · অধ্যায় '+hm);
        }
        await contentPut(hadithMetaKey(collection.id),chapterMeta);
        for(var hc=1;hc<=collection.chapters;hc++){
          await jobPauseWait(job);
          var hKey=hadithChapterKey(collection.id,hc), cached=await contentGet(hKey);
          var chapterInfo=chapterMeta[hadithMetaIndex(collection,hc)];
          var expectedHadiths=hadithRangeCount(chapterInfo.hadis_range);
          var cachedValid=Array.isArray(cached) && cached.length>0 && cached.every(function(h){return h && (h.hadith_id!==undefined || h.id!==undefined) && String(h.bn||h.text||h.translation||'').trim() && String(h.ar||h.arabic||'').trim();}) && (!expectedHadiths || cached.length===expectedHadiths);
          if(!cachedValid){
            job.controller=new AbortController();
            var hResponse=await fetch(hadithChapterUrl(collection,hc),{signal:job.controller.signal});
            if(!hResponse.ok) throw new Error(collection.name+' · অধ্যায় '+hc+' (HTTP '+hResponse.status+')');
            var hPayload=await hResponse.json();
            cached=normalizeHadithRows(hPayload);
            if(!cached.length) throw new Error(collection.name+' · অধ্যায় '+hc+'-এ আরবি ও বাংলা উভয় পাঠসহ ব্যবহারযোগ্য হাদিস পাওয়া যায়নি');
            if(expectedHadiths && cached.length!==expectedHadiths) throw new Error(collection.name+' · অধ্যায় '+hc+'-এ হাদিসসংখ্যা মেলেনি (পাওয়া '+cached.length+', প্রত্যাশিত '+expectedHadiths+')');
            await contentPut(hKey,cached);
          }
          job.done=hc; job.bytes+=new Blob([JSON.stringify(cached)]).size;
          job.message=collection.name+' ডাউনলোড হচ্ছে'; updatePackageProgress(job);
          metaMap=packageMeta(); metaMap[key].done=job.done; metaMap[key].bytes=job.bytes; metaMap[key].updated=new Date().toISOString(); savePackageMeta(metaMap);
        }
      } else {
        throw new Error('অজানা প্যাকেজের ধরন');
      }
      if(job.cancelled) throw new Error('cancelled');
      job.finished=true; job.message='ডাউনলোড সম্পন্ন'; job.done=job.total; updatePackageProgress(job);
      metaMap=packageMeta(); metaMap[key]={type:type,id:String(id),label:label,status:'complete',done:job.total,bytes:job.bytes,total:job.total,updated:new Date().toISOString()}; savePackageMeta(metaMap);
      showToast(label+' সম্পূর্ণ ডাউনলোড হয়েছে');
    }catch(error){
      job.finished=true;
      var cancelled=job.cancelled || error.name==='AbortError' || error.message==='cancelled';
      job.message=cancelled?'ডাউনলোড বাতিল':'ডাউনলোডে সমস্যা: '+error.message;
      metaMap=packageMeta();
      if(metaMap[key]){metaMap[key].status=cancelled?'paused':'incomplete';metaMap[key].done=job.done;metaMap[key].bytes=job.bytes;metaMap[key].updated=new Date().toISOString();savePackageMeta(metaMap);}
      showToast(cancelled?'ডাউনলোড থামানো হয়েছে':'ডাউনলোড সম্পূর্ণ হয়নি: '+error.message);
    }
    packageJob=null;
    renderDownloadsPopup();
  }

  async function deletePackage(type,id){
    var key=packageKey(type,id), m=packageMeta();
    if(!m[key]) return;
    if(!confirm('“'+(m[key].label||'প্যাকেজ')+'” ডাউনলোড মুছে ফেলবে?')) return;
    if(type==='translation' || type==='tafsir'){
      for(var n=1;n<=114;n++) await contentDel((type==='translation'?'translation':'tafsir')+'|'+id+'|'+n);
    } else if(type==='hadith'){
      var hc=HADITH_CORPUS.find(function(c){return c.id===String(id);});
      if(hc){for(var hn=1;hn<=hc.chapters;hn++) await contentDel(hadithChapterKey(hc.id,hn));await contentDel(hadithMetaKey(hc.id));}
    } else if(type==='audio'){
      var list=await allSurahList();
      var audioMeta=meta();
      // Keep any audio files that are also part of a separately downloaded single-surah package.
      for(var si=0;si<list.length;si++){
        var singleKey=list[si].number+'|'+id;
        if(audioMeta[singleKey]) continue;
        for(var ai=1;ai<=Number(list[si].numberOfAyahs);ai++) await del(keyFor(String(id),list[si].number,ai));
      }
    }
    delete m[key]; savePackageMeta(m); showToast('প্যাকেজ মুছে ফেলা হয়েছে'); renderDownloadsPopup(); refreshDlBar();
  }
  async function getPackageStorage(){
    try{ if(navigator.storage&&navigator.storage.estimate){var e=await navigator.storage.estimate();return {usage:e.usage||0,quota:e.quota||0};} }catch(e){}
    return {usage:0,quota:0};
  }
  function formatBytes(bytes){ if(!bytes) return '—'; var units=['B','KB','MB','GB']; var i=0; while(bytes>=1024&&i<3){bytes/=1024;i++;} return bytes.toFixed(i?1:0)+' '+units[i]; }

    if(!entries.length) html+='<div class="pp-mini">এখনো কোনো প্যাকেজ ডাউনলোড করা হয়নি।</div>';
    entries.forEach(function(k){

    html+='<div class="pp-mini" style="margin-top:10px">স্টোরেজ ব্যবহার: '+(storage.quota?formatBytes(storage.usage)+' / '+formatBytes(storage.quota):'ব্রাউজার তথ্য দেয়নি')+'. অডিও প্যাকেজের জন্য উল্লেখযোগ্য জায়গা প্রয়োজন হতে পারে।</div>';
    html+='<h4 style="margin:16px 0 8px">সূরা-ভিত্তিক অডিও ডাউনলোড</h4>';
    var m=meta(), ks=Object.keys(m);
    if(!ks.length) html+='<div class="pp-mini">এখনো কোনো সূরা-ভিত্তিক অডিও ডাউনলোড করা নেই।</div>';
    else ks.forEach(function(k){var info=m[k],parts=k.split('|'),sn=parseInt(parts[0],10); html+='<div class="dl-item"><div><b>'+(info.name||('সূরা '+sn))+'</b><br><small>'+getReciterName(info.reciter)+' · '+info.count+' আয়াত</small></div><button class="dl-btn ghost" data-del="'+k+'">{{delete}}</button></div>';});
    box.innerHTML=html;
    var bind=function(id,fn){var el=box.querySelector('#'+id);if(el)el.onclick=fn;};
    bind('qxDownloadTranslation',function(){runPackage('translation',selectedEdition,'অনুবাদ · '+editionLabel());});
    bind('qxDownloadTafsir',function(){runPackage('tafsir',selectedTafsir,'তাফসির · '+tafsirLabel(selectedTafsir));});
    bind('qxDownloadAudio',function(){runPackage('audio',selectedReciter,'অডিও · '+getReciterName(selectedReciter));});
    box.querySelectorAll('[data-hadith-dl]').forEach(function(b){b.onclick=function(){var c=HADITH_CORPUS.find(function(x){return x.id===b.dataset.hadithDl;});if(c)runPackage('hadith',c.id,c.name);};});
    bind('qxPackageAction',function(){if(!packageJob)return;packageJob.paused=!packageJob.paused;updatePackageProgress(packageJob);});
    bind('qxPackageCancel',function(){if(!packageJob)return;packageJob.cancelled=true;if(packageJob.controller)packageJob.controller.abort();});
    box.querySelectorAll('[data-pkgretry]').forEach(function(b){b.onclick=function(){var bits=b.dataset.pkgretry.split('|'),type=bits.shift(),id=bits.join('|'),item=packages[b.dataset.pkgretry];runPackage(type,id,item.label||'প্যাকেজ');};});
    box.querySelectorAll('[data-pkgdel]').forEach(function(b){b.onclick=function(){var bits=b.dataset.pkgdel.split('|');deletePackage(bits[0],bits.slice(1).join('|'));};});
    box.querySelectorAll('[data-del]').forEach(function(b){b.onclick=async function(){var k=b.dataset.del,info=m[k],parts=k.split('|'),sn=parseInt(parts[0],10);if(!confirm('এই সূরার অডিও ডাউনলোড মুছে ফেলবে?'))return;for(var i=1;i<=Number(info.count||0)+2;i++){try{await del(keyFor(info.reciter,sn,i));}catch(e){}}delete m[k];saveMeta(m);renderDownloadsPopup();refreshDlBar();};});
    var mini=document.getElementById('gDlMini'); if(mini) mini.textContent=entries.length+' প্যাকেজ ›';
  }
  window.quranixHadithCollections=HADITH_CORPUS;
  window.quranixPackageStore={
    getHadithChapter:async function(id,chapter){return contentGet(hadithChapterKey(id,chapter));},
    getHadithMeta:async function(id){return contentGet(hadithMetaKey(id));},
    getTranslation:async function(edition,surah){return contentGet('translation|'+edition+'|'+surah);},
    getTafsir:async function(id,surah,ayah){var rows=await contentGet('tafsir|'+id+'|'+surah);if(!Array.isArray(rows))return null;var row=rows.find(function(x){return Number(x.verse_number)===Number(ayah)||x.verse_key===surah+':'+ayah;});return row?(row.text||'এই আয়াতের জন্য এই তাফসিরে আলাদা ব্যাখ্যা পাওয়া যায়নি।'):'এই আয়াতের জন্য এই তাফসিরে আলাদা ব্যাখ্যা পাওয়া যায়নি।';}
  };
  window.renderDownloadsPopup=renderDownloadsPopup;
  window.quranixOffline={ refresh:refreshDlBar, download:downloadCurrent };
})();
</script>

<script>
/* ===== STEP 4: AYAH IMAGE CARD ===== */
window.openAyahCard = function(label, ar, bn){
  var THEMES=[
    {name:'সবুজ', bg:'#0f6b4f', bg2:'#083a2b', ar:'#ffffff', bn:'#e8f5ee', muted:'#bfe3d0', accent:'#ffd98a'},
    {name:'ক্রিম', bg:'#faf6ec', bg2:'#f0e6cc', ar:'#123f2c', bn:'#3a3a32', muted:'#7a7a68', accent:'#0f6b4f'},
    {name:'মধ্যরাত', bg:'#101820', bg2:'#1d2f3a', ar:'#ffffff', bn:'#cfe3e8', muted:'#8fa8b0', accent:'#ffd98a'},
    {name:'গোলাপি', bg:'#3b1f3a', bg2:'#5a2d57', ar:'#ffffff', bn:'#f5d9e8', muted:'#d9a8c8', accent:'#ffd98a'},
  ];
  var state={theme:0, aspect:'4:5', showBn:true, showRef:true};
  var ov=document.createElement('div'); ov.className='ac-ov';
  var box=document.createElement('div'); box.className='ac-box';
  box.innerHTML='<div class="ac-head"><span>{{image}} আয়াতের ছবি</span><button id="acClose">{{close}}</button></div>'
    +'<canvas id="acCanvas" class="ac-canvas"></canvas>'
    +'<div class="ac-chips" id="acThemes"></div>'
    +'<div class="ac-chips" id="acAspects"><button class="ac-chip" data-a="1:1">{{crop_square}} ১:১ পোস্ট</button><button class="ac-chip on" data-a="4:5">{{crop_portrait}} ৪:৫ পোস্ট</button><button class="ac-chip" data-a="9:16">{{smartphone}} ৯:১৬ স্টোরি</button></div>'
    +'<label class="ac-toggle"><span>বাংলা অনুবাদ দেখাও</span><input type="checkbox" id="acBn" checked></label>'
    +'<label class="ac-toggle"><span>সূরা · আয়াত রেফারেন্স দেখাও</span><input type="checkbox" id="acRef" checked></label>'
    +'<div class="ac-row"><button class="ac-btn ghost" id="acDl">{{download}} ডাউনলোড</button><button class="ac-btn" id="acShare">{{share}} শেয়ার করো</button></div>'
    +'<div class="pp-mini" style="text-align:center">ছবিতে Quranix লেখা থাকবে · ফেসবুক / WhatsApp / স্টোরিতে সরাসরি শেয়ার করা যাবে</div>';
  ov.appendChild(box); document.body.appendChild(ov);
  var canvas=box.querySelector('#acCanvas'); var ctx=canvas.getContext('2d');
  function sizes(){ if(state.aspect==='1:1') return [1080,1080]; if(state.aspect==='9:16') return [1080,1920]; return [1080,1350]; }
  function wrap(ctx, text, maxW){
    var words=String(text||'').split(/\s+/); var lines=[], line='';
    words.forEach(function(w){ var test=line?line+' '+w:w; if(ctx.measureText(test).width>maxW && line){ lines.push(line); line=w; } else line=test; });
    if(line) lines.push(line); return lines;
  }
  function draw(){
    var th=THEMES[state.theme]; var W,H=sizes(); canvas.width=W; canvas.height=H;
    var g=ctx.createLinearGradient(0,0,W,H); g.addColorStop(0,th.bg); g.addColorStop(1,th.bg2);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // border + corner ornaments
    ctx.strokeStyle=th.accent; ctx.globalAlpha=.55; ctx.lineWidth=3; ctx.strokeRect(36,36,W-72,H-72);
    ctx.globalAlpha=.25; ctx.strokeRect(52,52,W-104,H-104); ctx.globalAlpha=1;
    ctx.fillStyle=th.accent; ctx.font='600 34px system-ui'; ctx.textAlign='center';
    ctx.fillText('—  Quranix  —', W/2, 108);
    var y=200;
    // Arabic (RTL) - draw bottom-to-top lines reversed order handled by canvas RTL
    ctx.direction='rtl'; ctx.textAlign='right';
    var arSize = ar.length>220 ? 62 : ar.length>120 ? 72 : 84;
    ctx.font=arSize+'px "Amiri Quran", serif'; ctx.fillStyle=th.ar;
    var arLines=wrap(ctx, ar, W-180);
    // centre block: if too many lines, shrink
    while(arLines.length* (arSize*1.9) > H*0.52 && arSize>44){ arSize-=4; ctx.font=arSize+'px "Amiri Quran", serif'; arLines=wrap(ctx, ar, W-180); }
    // For RTL, canvas draws each line; start x = right margin
    arLines.forEach(function(l){ ctx.fillText(l, W-90, y); y+=arSize*1.9; });
    ctx.direction='ltr'; ctx.textAlign='center';
    y+=18; ctx.fillStyle=th.accent; ctx.fillRect(W/2-60, y, 120, 3); y+=58;
    if(state.showBn){
      ctx.font='28px "Hind Siliguri", sans-serif'; ctx.fillStyle=th.bn;
      var bnLines=wrap(ctx, bn, W-180);
      bnLines.forEach(function(l){ ctx.fillText(l, W/2, y); y+=44; });
      y+=20;
    }
    if(state.showRef){
      ctx.font='600 30px system-ui'; ctx.fillStyle=th.muted; ctx.fillText(label, W/2, H-110);
    }
    ctx.font='24px system-ui'; ctx.fillStyle=th.muted; ctx.fillText('Quranix', W/2, H-68);
  }
  function renderChips(){
    var tw=box.querySelector('#acThemes'); tw.innerHTML='';
    THEMES.forEach(function(th,i){ var b=document.createElement('button'); b.className='ac-chip'+(i===state.theme?' on':''); b.textContent=th.name; b.onclick=function(){ state.theme=i; renderChips(); draw(); }; tw.appendChild(b); });
    box.querySelectorAll('#acAspects .ac-chip').forEach(function(b){ b.classList.toggle('on', b.dataset.a===state.aspect); b.onclick=function(){ state.aspect=b.dataset.a; box.querySelectorAll('#acAspects .ac-chip').forEach(function(x){x.classList.remove('on')}); b.classList.add('on'); draw(); }; });
  }
  box.querySelector('#acBn').onchange=function(){ state.showBn=this.checked; draw(); };
  box.querySelector('#acRef').onchange=function(){ state.showRef=this.checked; draw(); };
  box.querySelector('#acClose').onclick=function(){ ov.remove(); };
  ov.onclick=function(e){ if(e.target===ov) ov.remove(); };
  async function toBlob(){ return new Promise(function(res){ canvas.toBlob(res, 'image/png'); }); }
  box.querySelector('#acDl').onclick=async function(){ var blob=await toBlob(); var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='quranix-ayah.png'; a.click(); if(typeof showToast==='function') showToast('ছবি ডাউনলোড হয়েছে'); };
  box.querySelector('#acShare').onclick=async function(){
    var blob=await toBlob(); var file=new File([blob], 'quranix-ayah.png', {type:'image/png'});
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({title:label, text:'['+label+']\n'+bn+'\n— Quranix', files:[file]}); return; }catch(e){}
    }
    // fallback: download
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='quranix-ayah.png'; a.click();
    if(typeof showToast==='function') showToast('শেয়ার সমর্থিত নয়, ছবি ডাউনলোড করে দিলাম');
  };
  renderChips();
  // wait for Arabic font, then draw
  if(document.fonts && document.fonts.load){ document.fonts.load('84px "Amiri Quran"').catch(function(){}).finally(function(){ draw(); setTimeout(draw, 300); }); }
  draw();
};
</script>

<script>
/* ===== STEP 5: TRACKER WINDOW - MULTI CATEGORY ===== */
function trkToday(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function trkLoad(){ try{ return JSON.parse(localStorage.getItem('quranix_tracker')||'null')||{namaz:{},roza:{},dhikr:{},habits:[]}; }catch(e){ return {namaz:{},roza:{},dhikr:{},habits:[]}; } }
function trkSave(d){ localStorage.setItem('quranix_tracker', JSON.stringify(d)); }
function trkDateOffset(n){ var d=new Date(); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function trkBn(n){ return (typeof toBn==='function'?toBn(n):String(n)); }
function trkDots(getDone){
  var w=document.createElement('div'); w.className='trk-dots';
  var labels=['রবি','সোম','মঙ্গল','বুধ','বৃহ','শুক্র','শনি'];
  for(var i=-6;i<=0;i++){ var ds=trkDateOffset(i); var d=new Date(ds+'T00:00:00');
    var s=document.createElement('span'); s.className='trk-dot'+(getDone(ds)?' done':'')+(i===0?' today':''); s.title=ds;
    s.textContent = i===0?'আজ':labels[d.getDay()]; w.appendChild(s); }
  return w;
}
function trkRow(label, sub, done, onToggle){
  var row=document.createElement('div'); row.className='trk-row';
  var l=document.createElement('div'); l.innerHTML='<b>'+label+'</b>'+(sub?'<div class="trk-mini">'+sub+'</div>':'');
  var b=document.createElement('button'); b.className='trk-tick'+(done?' on':''); b.textContent=done?'{{check}}':'';
  b.onclick=function(){ onToggle(!done); };
  row.appendChild(l); row.appendChild(b); return row;
}
function buildTrackerCard(){
  var d=trkLoad(); var td=trkToday();
  var nm=d.namaz[td]||{}; var nDone=Object.keys(nm).filter(function(k){return nm[k]}).length;
  var dh=d.dhikr[td]||{}; var dhDone=Object.keys(dh).filter(function(k){return dh[k]}).length;
  var box=document.createElement('div'); box.className='khatam-card';
  var score=Math.round(((nDone/5)*0.6+(dhDone/4)*0.2+((d.roza[td]?1:0)*0.2))*100);
  box.innerHTML='<div class="khatam-row"><b>{{bar_chart}} আজকের ট্র্যাকার</b><span>'+trkBn(score)+'%</span></div>'
    +'<div class="khatam-row"><span>{{mosque}} নামাজ '+trkBn(nDone)+'/৫</span><span>{{nights_stay}} রোজা '+(d.roza[td]?'{{check_circle:f}}':'{{hourglass_top}}')+'</span><span>{{bubble_chart}} জিকির '+trkBn(dhDone)+'/৪</span></div>'
    +'<div class="goal-track" style="margin:8px 0"><div class="goal-fill" style="width:'+score+'%"></div></div>'
    +'<div class="khatam-row"><span style="color:var(--accent);font-weight:700">ট্র্যাকার খোলো →</span><span>সব ক্যাটাগরি এক জায়গায়</span></div>';
  box.onclick=function(){ if(typeof setMode==='function') setMode('tracker'); };
  return box;
}
function renderTracker(){
  if(typeof showOther==='function') showOther('{{bar_chart}} ট্র্যাকার');
  var d=trkLoad(); var td=trkToday();
  var appEl=document.getElementById('app');
  // overall
  var nm=d.namaz[td]||{}, nDone=Object.keys(nm).filter(function(k){return nm[k]}).length;
  var dh=d.dhikr[td]||{}, dhDone=Object.keys(dh).filter(function(k){return dh[k]}).length;
  var habitDone=d.habits.filter(function(h){ return h.days && h.days[td]; }).length;
  var head=document.createElement('div'); head.className='trk-head';
  var dateStr=new Date().toLocaleDateString('bn-BD',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  head.innerHTML='<small>'+dateStr+'</small><div class="big">আজকের আমল</div><div>{{mosque}} '+trkBn(nDone)+'/৫ নামাজ &nbsp;·&nbsp; {{nights_stay}} '+(d.roza[td]?'রোজা {{check_circle:f}}':'রোজা {{hourglass_top}}')+' &nbsp;·&nbsp; {{bubble_chart}} '+trkBn(dhDone)+'/৪ জিকির</div>';
  appEl.appendChild(head);

  // 1. NAMAZ
  var c1=document.createElement('div'); c1.className='trk-cat';
  c1.innerHTML='<h3>{{mosque}} নামাজ ট্র্যাকার</h3><div class="sub">আজ কোন ওয়াক্ত পড়লা, টিক দাও — জামাতে পড়লে মনে মনে নোট রাখো</div>';
  c1.appendChild(trkDots(function(ds){ var x=d.namaz[ds]||{}; return Object.keys(x).filter(function(k){return x[k]}).length>=5; }));
  var prayers=[['fajr','ফজর'],['dhuhr','যোহর'],['asr','আসর'],['maghrib','মাগরিব'],['isha','এশা']];
  prayers.forEach(function(p){
    c1.appendChild(trkRow('{{mosque}} '+p[1], '', !!(d.namaz[td]||{})[p[0]], function(v){
      d.namaz[td]=d.namaz[td]||{}; if(v) d.namaz[td][p[0]]=1; else delete d.namaz[td][p[0]]; trkSave(d); renderTracker();
      if(v && typeof showToast==='function') showToast(p[1]+' নামাজ');
    }));
  });
  var wk=document.createElement('div'); wk.className='trk-mini'; wk.style.marginTop='6px';
  var last7=0; for(var i=-6;i<=0;i++){ var x=d.namaz[trkDateOffset(i)]||{}; last7+=Object.keys(x).filter(function(k){return x[k]}).length; }
  wk.textContent='গত ৭ দিনে মোট '+trkBn(last7)+' ওয়াক্ত পড়া হয়েছে';
  c1.appendChild(wk); appEl.appendChild(c1);

  // 2. QURAN
  var c2=document.createElement('div'); c2.className='trk-cat';
  var todayRead=0; try{ todayRead=(typeof goalData!=='undefined' && goalData.date===td)?goalData.readKeys.length:0; }catch(e){}
  var kh=null; try{ kh=JSON.parse(localStorage.getItem('quranix_khatam')||'null'); }catch(e){}
  c2.innerHTML='<h3>{{menu_book}} কুরআন ট্র্যাকার</h3><div class="sub">আজ '+trkBn(todayRead)+' আয়াত পড়া হয়েছে'+(kh?' · খতম প্ল্যান চলছে ('+trkBn(kh.days)+' দিনের)':'')+'</div>';
  var goBtn=document.createElement('button'); goBtn.className='dl-btn'; goBtn.style.marginTop='6px'; goBtn.textContent='{{menu_book}} কুরআন পড়তে যাও';
  goBtn.onclick=function(){ if(typeof setMode==='function') setMode('quran'); };
  var khBtn=document.createElement('button'); khBtn.className='dl-btn ghost'; khBtn.style.marginTop='6px'; khBtn.style.marginLeft='6px'; khBtn.textContent='{{calendar_month}} খতম প্ল্যান দেখো';
  khBtn.onclick=function(){ if(typeof renderKhatamPopup==='function') renderKhatamPopup(); };
  c2.appendChild(goBtn); c2.appendChild(khBtn); appEl.appendChild(c2);

  // 3. HIFZ
  var c3=document.createElement('div'); c3.className='trk-cat';
  var mem={}; try{ mem=JSON.parse(localStorage.getItem('quranix_hifz_mem')||'{}'); }catch(e){}
  var memCount=Object.keys(mem).length;
  c3.innerHTML='<h3>{{psychology}} হিফজ ট্র্যাকার</h3><div class="sub">মোট মুখস্থ মার্ক করা আয়াত: <b>'+trkBn(memCount)+'টি</b></div><div class="trk-mini">নতুন আয়াত মুখস্থ করতে সূরা খুলে {{psychology}} হিফজ মোড চালু করো, মুখস্থ হলে {{check_circle:f}} মার্ক করো</div>';
  appEl.appendChild(c3);

  // 4. ROZA
  var c4=document.createElement('div'); c4.className='trk-cat';
  c4.innerHTML='<h3>{{nights_stay}} রোজা ট্র্যাকার</h3><div class="sub">নফল রোজা / কাজা রোজা — আজ রাখলে টিক দাও</div>';
  c4.appendChild(trkDots(function(ds){ return !!d.roza[ds]; }));
  var thisMonth=0; Object.keys(d.roza).forEach(function(ds){ if(ds.slice(0,7)===td.slice(0,7)) thisMonth++; });
  c4.appendChild(trkRow('{{nights_stay}} আজ রোজা রেখেছি', 'এই মাসে '+trkBn(thisMonth)+'টি রোজা', !!d.roza[td], function(v){ if(v) d.roza[td]=1; else delete d.roza[td]; trkSave(d); renderTracker(); }));
  appEl.appendChild(c4);

  // 5. DHIKR / AZKAR
  var c5=document.createElement('div'); c5.className='trk-cat';
  c5.innerHTML='<h3>{{bubble_chart}} জিকির / আজকার ট্র্যাকার</h3><div class="sub">দৈনিক আজকার — সকাল / সন্ধ্যা / ঘুমের আগে</div>';
  c5.appendChild(trkDots(function(ds){ var x=d.dhikr[ds]||{}; return Object.keys(x).filter(function(k){return x[k]}).length>=4; }));
  var dz=[['morning','{{wb_sunny}} সকালের আজকার'],['evening','{{wb_twilight}} সন্ধ্যার আজকার'],['sleep','{{bedtime}} ঘুমের আগের দোয়া'],['durud','{{front_hand}} দুরুদ ১০০ বার']];
  dz.forEach(function(z){
    c5.appendChild(trkRow(z[1], '', !!(d.dhikr[td]||{})[z[0]], function(v){ d.dhikr[td]=d.dhikr[td]||{}; if(v) d.dhikr[td][z[0]]=1; else delete d.dhikr[td][z[0]]; trkSave(d); renderTracker(); }));
  });
