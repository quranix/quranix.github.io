function openAsmaDetail(idx){var item=ASMA_DATA[idx];var favs={};try{favs=JSON.parse(localStorage.getItem('quranix_asma_fav')||'{}');}catch(e){}var counts={};try{counts=JSON.parse(localStorage.getItem('quranix_asma_count')||'{}');}catch(e){}var ov=document.createElement('div');ov.className='ac-ov';ov.style.zIndex='130';var box=document.createElement('div');box.className='ac-box';box.innerHTML='<div class="ac-head"><span>'+(typeof toBn==='function'?toBn(idx+1):idx+1)+' / ৯৯ — '+item[1]+'</span><button id="asmaX">{{close}}</button></div><div style="text-align:center"><div style="font-family:Amiri Quran,serif;font-size:48px;color:var(--accent);direction:rtl;line-height:1.6">'+item[0]+'</div><b style="font-size:18px">'+item[1]+'</b><div style="color:var(--muted)">'+item[2]+'</div></div><div class="trk-cat" style="margin:12px 0 0"><b>{{menu_book}} সংক্ষিপ্ত পরিচয়</b><div style="margin-top:6px;line-height:1.7">'+item[4]+'</div><div class="trk-mini" style="margin-top:8px">{{auto_stories}} কুরআন রেফারেন্স: <b>সূরা '+item[3]+'</b> — এই নামটি এই সূরায় এসেছে।</div></div><div class="ac-row"><button class="ac-btn ghost" id="asmaFav">'+(favs[idx]?'{{star:f}} প্রিয় থেকে সরাও':'{{star}} প্রিয় করো')+'</button><button class="ac-btn" id="asmaTasbih">{{bubble_chart}} জিকির +১ (<span id="asmaCnt">'+(counts[idx]||0)+'</span>)</button></div><div class="ac-row"><button class="ac-btn ghost" id="asmaPrev">← আগের নাম</button><button class="ac-btn ghost" id="asmaNext">পরের নাম →</button></div><div class="ac-row"><button class="ac-btn" id="asmaShare">{{share}} এই নাম শেয়ার করো</button></div>';ov.appendChild(box);document.body.appendChild(ov);var close=function(){ov.remove();if(typeof mode!=='undefined'&&mode==='asma')renderAsma();};box.querySelector('#asmaX').onclick=close;ov.onclick=function(e){if(e.target===ov)close();};box.querySelector('#asmaFav').onclick=function(){if(favs[idx])delete favs[idx];else favs[idx]=1;localStorage.setItem('quranix_asma_fav',JSON.stringify(favs));this.textContent=favs[idx]?'{{star:f}} প্রিয় থেকে সরাও':'{{star}} প্রিয় করো';};box.querySelector('#asmaTasbih').onclick=function(){counts[idx]=(counts[idx]||0)+1;localStorage.setItem('quranix_asma_count',JSON.stringify(counts));box.querySelector('#asmaCnt').textContent=counts[idx];if(typeof showToast==='function')showToast(item[1]+' — '+counts[idx]+' বার');};box.querySelector('#asmaPrev').onclick=function(){ov.remove();openAsmaDetail((idx+98)%99);};box.querySelector('#asmaNext').onclick=function(){ov.remove();openAsmaDetail((idx+1)%99);};box.querySelector('#asmaShare').onclick=async function(){var text=''+item[1]+' — '+item[2]+'\n'+item[4]+'\nরেফারেন্স: সূরা '+item[3]+'\n— Quranix · আসমাউল হুসনা';if(navigator.share){try{await navigator.share({title:item[1],text:text});}catch(e){}}else if(typeof copyText==='function')copyText(text,'কপি হয়েছে!');};}
window.renderAsma=renderAsma;window.buildAsmaCard=buildAsmaCard;window.openAsmaDetail=openAsmaDetail;
</script>

<script>
/* ===== TAJWEED COLOR CODE ===== */
(function(){
  var ON = localStorage.getItem('quranix_tajweed')==='1';
  window.tajweedOn = ON;
  function isComb(ch){ var c=ch.charCodeAt(0); return (c>=0x064B && c<=0x0652) || c===0x0670 || c===0x0653 || c===0x0654 || c===0x0655; }
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  // Split into clusters: base char + following combining marks
  function clusters(text){
    var out=[]; var cur='';
    for(var i=0;i<text.length;i++){ var ch=text[i]; if(isComb(ch) && cur){ cur+=ch; } else { if(cur) out.push(cur); cur=ch; } }
    if(cur) out.push(cur); return out;
  }
  function baseOf(cl){ return cl[0]; }
  function has(cl, code){ return cl.indexOf(code)>=0; }
  function renderTajweed(text){
    if(!text) return '';
    var cls=clusters(text);
    var IKHFA=['ت','ث','ج','د','ذ','ز','س','ش','ص','ض','ط','ظ','ف','ق','ك'];
    var IDGHAM=['ي','ر','م','ل','و','ن'];
    var QAL=['ق','ط','ب','ج','د'];
    var out='';
    for(var i=0;i<cls.length;i++){
      var cl=cls[i]; var b=baseOf(cl); var next = cls[i+1] ? baseOf(cls[i+1]) : '';
      var hasSukun = has(cl, '\u0652');
      var hasTanween = has(cl,'\u064B')||has(cl,'\u064C')||has(cl,'\u064D');
      var hasShadda = has(cl,'\u0651');
      var hasMadd = has(cl,'\u0653')||has(cl,'\u0670');
      var klass='';
      // Madd: madda sign OR long vowel with superscript alef
      if(hasMadd) klass='tj-madd';
      // Ghunnah: nun/mim mushaddad
      else if(hasShadda && (b==='ن'||b==='م')) klass='tj-ghunnah';
      // Qalqalah: qalb letters with sukun
      else if(hasSukun && QAL.indexOf(b)>=0) klass='tj-qalqalah';
      // Nun sakinah / tanween rules - look at next base letter
      else if((hasSukun||hasTanween) && b==='ن'){
        if(next==='ب') klass='tj-iqlab';
        else if(IDGHAM.indexOf(next)>=0) klass='tj-idgham';
        else if(IKHFA.indexOf(next)>=0) klass='tj-ikhfa';
      }
      // Tanween on other letters (e.g. ً on ا/ت etc) - same nun rules
      else if(hasTanween && next){
        if(next==='ب') klass='tj-iqlab';
        else if(IDGHAM.indexOf(next)>=0) klass='tj-idgham';
        else if(IKHFA.indexOf(next)>=0) klass='tj-ikhfa';
      }
      // Mim sakinah + ba = ikhfa shafawi (pink-ish: use ikhfa)
      else if(hasSukun && b==='م' && next==='ب') klass='tj-ikhfa';
      // Lam of Allah? keep default - skip to avoid false positives
      if(klass) out+='<span class="'+klass+'">'+esc(cl)+'</span>'; else out+=esc(cl);
    }
    return out;
  }
  window.renderTajweed=renderTajweed;
  function apply(){
    window.tajweedOn=ON;
    localStorage.setItem('quranix_tajweed', ON?'1':'0');
    document.querySelectorAll('.ayah .ar').forEach(function(el){
      var raw=el.dataset.raw||el.textContent;
      el.dataset.raw=raw;
      if(ON) el.innerHTML=renderTajweed(raw); else el.textContent=raw;
    });
    var leg=document.getElementById('tajweedLegend'); if(leg) leg.classList.toggle('show', ON);
    var tg=document.getElementById('tajweedToggle'); if(tg) tg.classList.toggle('on', ON);
    var mini=document.getElementById('gTajweedMini'); if(mini) mini.textContent=ON?'চালু ›':'বন্ধ ›';
    if(ON && typeof showToast==='function') showToast('তাজভিদ কালার চালু');
  }
  window.toggleTajweed=function(){ ON=!ON; apply(); };
  window.setTajweed=function(v){ ON=!!v; apply(); };
  // Tajweed Color shortcut is placed in the first quick-grid row.
  function addTajweedQuick(){
    var tools=document.getElementById('gQuick');
    if(!tools || document.getElementById('tajweedQuickToggle')) return;
    var b=document.createElement('button');
    b.id='tajweedQuickToggle'; b.className='g-quick-btn'; b.title='তাজভিদ কালার';
    b.innerHTML='{{palette}}<span>তাজভিদ কালার</span>';
    b.onclick=function(){ window.toggleTajweed(); };
    tools.appendChild(b);
    b.classList.toggle('on', ON);
  }
  addTajweedQuick(); setTimeout(addTajweedQuick, 700);
  // Keep the quick-grid button state synchronized with the setting.
  var oldApply=apply;
  apply=function(){ oldApply(); var quick=document.getElementById('tajweedQuickToggle'); if(quick) quick.classList.toggle('on', ON); };
  // Tajweed color remains available from the grid navigation quick row.
  var lc=document.getElementById('tajweedLegendClose');
  if(lc) lc.onclick=function(){ ON=false; apply(); };
  // Apply after surah loads (ayahCards render later)
  document.addEventListener('click', function(){ setTimeout(apply, 400); });
  setTimeout(apply, 800);
})();
</script>

<script>
/* ===== WORD-BY-WORD TRANSLATION ===== */
(function(){
  var ON = localStorage.getItem('quranix_ww')==='1';
  window.wwOn = ON;
  // Common words fallback dictionary (word without diacritics -> meaning)
  var DICT = {
    'الله':'আল্লাহ','الرحمن':'পরম করুণাময়','الرحيم':'অতি দয়ালু','رب':'প্রতিপালক','العالمين':'সব জগতের','مالك':'মালিক','يوم':'দিন','الدين':'বিচার / প্রতিদান','إياك':'শুধু তোমারই','نعبد':'আমরা ইবাদত করি','نستعين':'আমরা সাহায্য চাই','اهدنا':'আমাদের পথ দেখাও','الصراط':'পথ','المستقيم':'সোজা, সরল','الذين':'যারা','أنعمت':'তুমি অনুগ্রহ করেছ','عليهم':'তাদের উপর','المغضوب':'ক্রোধপ্রাপ্ত','الضالين':'পথভ্রষ্ট','قل':'বলো','هو':'তিনি','أحد':'এক, অদ্বিতীয়','الصمد':'অমুখাপেক্ষী','لم':'না, কখনো না','يلد':'জন্�্ম দেন','يولد':'জন্ম নেন','كفوا':'সমকক্ষ','من':'থেকে / যে','شر':'অনিষ্ট','ما':'যা','خلق':'সৃষ্টি করেছেন','الناس':'মানুষ','الفلق':'ভোর / ফেটে ওঠা','الناس':'মানুষ','ملك':'বাদশাহ','إله':'ইলাহ, উপাস্য','الوسواس':'কুমন্ত্রণাদাতা','الخناس':'আত্মগোপনকারী','صدور':'বুকসমূহ','الجنة':'জিন','الحمد':'সব প্রশংসা','لله':'আল্লাহর জন্য','الذي':'যিনি','كان':'ছিলেন','ما':'যা / না','في':'মধ্যে','إلى':'দিকে','على':'উপর','إن':'নিশ্চয়ই','أن':'যে','لا':'না','قد':'নিশ্চয়ই','كل':'সব','هذا':'এই','ذلك':'ওই','كان':'ছিল','قال':'বললেন','آمنوا':'ঈমান এনেছে','كفروا':'কুফরি করেছে','الذين':'যারা','رسول':'রাসূল','كتاب':'কিতাব','آية':'আয়াত / নিদর্শন','سماء':'আসমান','أرض':'জমিন','نار':'আগুন','جنة':'জান্নাত','ماء':'পানি','نور':'আলো','ظلمات':'অন্ধকার','حق':'সত্য','باطل':'মিথ্যা','صبر':'ধৈর্য','صلاة':'নামাজ','زكاة':'যাকাত','صوم':'রোজা','حج':'হজ','مؤمن':'মুমিন','كافر':'কাফের','ظالم':'জালিম','متقون':'মুত্তাকি','رحمة':'রহমত, দয়া','عذاب':'শাস্তি','مغفرة':'ক্ষমা','توبة':'তওবা','دعاء':'দোয়া','شكر':'কৃতজ্ঞতা','خير':'কল্যাণ','شر':'অকল্যাণ','حياة':'জীবন','موت':'মৃত্যু','آخرة':'আখিরাত','دنيا':'দুনিয়া','قلب':'অন্তর','علم':'জ্ঞান','عمل':'আমল','نفس':'আত্মা','روح':'রূহ'
  };
  function stripDiacritics(s){ return s.replace(/[\u064B-\u0652\u0670\u0653\u0654\u0655\u0671]/g,'').replace(/[\u0640]/g,'').trim(); }
  function dictLookup(word){
    var clean=stripDiacritics(word);
    if(DICT[clean]) return DICT[clean];
    // try removing prefixes: ال, و, ف, ب, ل, من
    var variants=[clean.replace(/^و?ال/,'ال'), clean.replace(/^ال/,'') , clean.replace(/^[وفبل]/,'')];
    for(var i=0;i<variants.length;i++){ if(DICT[variants[i]]) return DICT[variants[i]]; }
    return null;
  }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  // Cache: ww:Surah:Ayah -> [{word, translit, meaning}]
  function cacheGet(s,a){ try{ return JSON.parse(localStorage.getItem('ww:'+s+':'+a)||'null'); }catch(e){ return null; } }
  function cacheSet(s,a,v){ try{ localStorage.setItem('ww:'+s+':'+a, JSON.stringify(v)); }catch(e){} }
  async function fetchWords(s,a){
    var cached=cacheGet(s,a); if(cached) return cached;
    try{
      var url='https://api.quran.com/api/v4/verses/by_key/'+s+':'+a+'?words=true&language=bn&word_fields=text_uthmani,transliteration';
      var r=await fetch(url); if(!r.ok) throw new Error('HTTP '+r.status);
      var j=await r.json(); var verse=j.verse||j;
      var words=verse.words||[];
      // Filter out end markers / pauses, keep real words
      var out=words.filter(function(w){ return w.char_type_name==='word'; }).map(function(w){
        var tr=''; if(w.transliteration) tr=w.transliteration.text||'';
        var mean=''; if(w.translation) mean=w.translation.text||'';
        // Quran.com word translation is often English when language=bn fails - keep it, fallback dict will override if English-looking? Keep as is
        return {word:w.text_uthmani||w.text, translit:tr, meaning:mean};
      });
      if(out.length) cacheSet(s,a,out);
      return out;
    }catch(e){ return null; }
  }
  window.quranixFetchWords=fetchWords;
  function renderAyahArabic(ar, surah, ayah){
    var base = (window.tajweedOn && window.renderTajweed) ? window.renderTajweed(ar) : esc(ar);
    // If WW off, return base (tajweed or plain)
    if(!ON) return base;
    // Split original Arabic by spaces, apply tajweed per word if on, wrap each word
    var words=String(ar).split(/\s+/);
    var html=words.map(function(w,i){
      var inner = (window.tajweedOn && window.renderTajweed) ? window.renderTajweed(w) : esc(w);
      return '<span class="ww-word" data-w="'+i+'" data-s="'+surah+'" data-a="'+ayah+'">'+inner+'</span>';
    }).join(' ');
    return html;
  }
  window.renderAyahArabic=renderAyahArabic;
  function apply(){
    window.wwOn=ON; localStorage.setItem('quranix_ww', ON?'1':'0');
    document.body.classList.toggle('ww-on', ON);
    var bar=document.getElementById('wwBar'); if(bar) bar.classList.toggle('show', ON);
    var tg=document.getElementById('wwToggle'); if(tg) tg.classList.toggle('on', ON);
    var mini=document.getElementById('gWwMini'); if(mini) mini.textContent=ON?'চালু ›':'বন্ধ ›';
    document.querySelectorAll('.ayah .ar').forEach(function(el){
      var raw=el.dataset.raw||el.textContent; el.dataset.raw=raw;
      el.innerHTML=renderAyahArabic(raw, parseInt(el.dataset.surah||0,10), parseInt(el.dataset.ayah||0,10));
    });
  }
  window.toggleWordMode=function(){ ON=!ON; apply(); if(ON && typeof showToast==='function') showToast('শব্দে শব্দে মোড চালু — যেকোনো শব্দে ট্যাপ করো'); };
  // Click delegation for words
  document.addEventListener('click', function(e){
    var w=e.target.closest('.ww-word'); if(!w) return;
    if(!ON) return;
    e.stopPropagation(); e.preventDefault();
    openWordSheet(w);
  });
  async function openWordSheet(el){
    var s=parseInt(el.dataset.s||0,10), a=parseInt(el.dataset.a||0,10), idx=parseInt(el.dataset.w||0,10);
    var wordText=el.textContent.trim();
    // close existing
    var old=document.querySelector('.ww-sheet'); if(old) old.remove();
    var sheet=document.createElement('div'); sheet.className='ww-sheet';
    sheet.innerHTML='<button class="ww-close" id="wwX">{{close}}</button><div class="ww-ar">'+esc(wordText)+'</div><div style="text-align:center;color:var(--muted);font-size:13px">সূরা '+s+' · আয়াত '+a+' · শব্দ '+(idx+1)+'</div><div id="wwBody" style="text-align:center;margin-top:10px">লোড হচ্ছে...</div>';
    document.body.appendChild(sheet);
    sheet.querySelector('#wwX').onclick=function(){ sheet.remove(); };
    var body=sheet.querySelector('#wwBody');
    // Try API first (has transliteration + meaning)
    var words= (s&&a) ? await fetchWords(s,a) : null;
    var entry = words && words[idx] ? words[idx] : null;
    var dictMean=dictLookup(wordText);
    var translit=entry&&entry.translit?entry.translit:'';
    var meaning=entry&&entry.meaning?entry.meaning:'';
    // If API meaning looks like English or empty, prefer dict
    if(!meaning || /^[A-Za-z]/.test(meaning)) { if(dictMean) meaning=dictMean; }
    if(!meaning) meaning='এই শব্দের বাংলা অর্থ ডাটাবেসে পাওয়া যায়নি — পুরো আয়াতের অনুবাদ দেখো।';
    var html='';
    if(translit) html+='<div style="font-size:15px;color:var(--accent);font-weight:700">'+esc(translit)+'</div>';
    html+='<div style="font-size:20px;font-weight:700;margin:8px 0">'+esc(meaning)+'</div>';
    html+='<div style="font-size:12px;color:var(--muted)">{{lightbulb}} টিপস: এই শব্দটা মনে রাখতে পুরো আয়াতটা ৩ বার পড়ো, তারপর শুধু এই শব্দটা ৩ বার বলো।</div>';
    html+='<div style="margin-top:12px;display:flex;gap:8px"><button class="ac-btn ghost" id="wwPrev">← আগের শব্দ</button><button class="ac-btn" id="wwNext">পরের শব্দ →</button></div>';
    body.innerHTML=html;
    var prevBtn=body.querySelector('#wwPrev'), nextBtn=body.querySelector('#wwNext');
    // Find sibling words in same ayah card
    var card=el.closest('.ayah'); var all=card?Array.from(card.querySelectorAll('.ww-word')):[];
    if(prevBtn) prevBtn.onclick=function(){ sheet.remove(); if(idx>0 && all[idx-1]) openWordSheet(all[idx-1]); };
    if(nextBtn) nextBtn.onclick=function(){ sheet.remove(); if(idx<all.length-1 && all[idx+1]) openWordSheet(all[idx+1]); };
  }
  function addBtn(){
    var tools=document.getElementById('gQuick'); if(!tools||document.getElementById('wwToggle')) return;
    var b=document.createElement('button'); b.id='wwToggle'; b.className='g-quick-btn'; b.title='শব্দে শব্দে অনুবাদ'; b.innerHTML='{{abc}}<span>শব্দে শব্দে</span>';
    b.onclick=function(){ window.toggleWordMode(); };
    tools.insertBefore(b, tools.firstChild);
  }
  addBtn(); setTimeout(addBtn, 600);
  var bc=document.getElementById('wwBarClose'); if(bc) bc.onclick=function(){ ON=false; apply(); };
  document.addEventListener('click', function(){ setTimeout(function(){ if(ON) apply(); }, 400); });
  setTimeout(apply, 800);
})();
</script>

<script>
/* ===== HIJRI CALENDAR ===== */
(function(){
  var MONTHS_BN=['মুহাররম','সফর','রবিউল আউয়াল','রবিউল আখির','জুমাদাল উলা','জুমাদাল আখিরা','রজব','শাবান','রমজান','শাওয়াল','জিলকদ','জিলহজ'];
  var MONTHS_AR=['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];
  function hijriParts(date){
    try{
      var fmt=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{day:'numeric',month:'numeric',year:'numeric'});
      var parts={}; fmt.formatToParts(date).forEach(function(p){ parts[p.type]=p.value; });
      return {day:parseInt(parts.day,10), month:parseInt(parts.month,10), year:parseInt(parts.year,10)};
    }catch(e){
      try{
        var fmt2=new Intl.DateTimeFormat('en-u-ca-islamic',{day:'numeric',month:'numeric',year:'numeric'});
        var p2={}; fmt2.formatToParts(date).forEach(function(p){ p2[p.type]=p.value; });
        return {day:parseInt(p2.day,10), month:parseInt(p2.month,10), year:parseInt(p2.year,10)};
      }catch(e2){ return null; }
    }
  }
  window.quranixHijriParts=hijriParts;
  function bnNum(n){ return (typeof toBn==='function'?toBn(n):String(n)); }
  function fmtGreg(d){ return d.toLocaleDateString('bn-BD',{day:'numeric',month:'long',year:'numeric'}); }
  function hijriStr(date){ var h=hijriParts(date); if(!h) return '—'; return bnNum(h.day)+' '+MONTHS_BN[h.month-1]+' '+bnNum(h.year)+' হিজরি'; }
  function findNextHijri(m, day){
    var today=new Date(); today.setHours(0,0,0,0);
    for(var i=0;i<400;i++){
      var d=new Date(today); d.setDate(d.getDate()+i);
      var h=hijriParts(d); if(h && h.month===m && h.day===day) return {date:d, days:i};
    }
    return null;
  }
  var EVENTS=[
    {m:1,d:1,name:'হিজরি নববর্ষ',desc:'নতুন হিজরি বছরের শুরু'},
    {m:1,d:10,name:'আশুরা',desc:'মুহাররমের ১০ তারিখ — রোজা রাখা সুন্নত'},
    {m:3,d:12,name:'ঈদে মিলাদুন্নবী ﷺ',desc:'রাসূল ﷺ-এর জন্মদিন'},
    {m:7,d:27,name:'শবে মেরাজ',desc:'মেরাজের রাত — ২৭ রজব'},
    {m:8,d:15,name:'শবে বরাত',desc:'১৫ শাবান — ক্ষমার রাত'},
    {m:9,d:1,name:'রমজান শুরু',desc:'রহমত, মাগফিরাত, নাজাতের মাস'},
    {m:9,d:27,name:'শবে কদর (সম্ভাব্য)',desc:'২৭ রমজান — হাজার মাসের চেয়ে উত্তম'},
    {m:10,d:1,name:'ঈদুল ফিতর',desc:'রমজান শেষে ঈদ'},
    {m:12,d:9,name:'আরাফার দিন',desc:'৯ জিলহজ — হজের মূল দিন, রোজা সুন্নত'},
    {m:12,d:10,name:'ঈদুল আজহা',desc:'কুরবানির ঈদ'},
  ];
  function nextEvent(){
    var best=null;
    EVENTS.forEach(function(ev){
      var f=findNextHijri(ev.m, ev.d);
      if(f && (!best || f.days<best.days)) best={ev:ev, date:f.date, days:f.days};
    });
    return best;
  }
  function buildHijriCard(){
    var h=hijriParts(new Date()); var ne=nextEvent();
    var box=document.createElement('div'); box.className='khatam-card';
    box.innerHTML='<div class="khatam-row"><b>{{nights_stay}} হিজরি ক্যালেন্ডার</b><span>আজ</span></div>'
      +'<div style="text-align:center;font-size:18px;font-weight:700;color:var(--accent)">'+(h?hijriStr(new Date()):'—')+'</div>'
      +(ne?'<div class="khatam-row"><span>{{hourglass_top}} পরের ইভেন্ট: <b>'+ne.ev.name+'</b></span><span>'+(ne.days===0?'আজই!':bnNum(ne.days)+' দিন বাকি')+'</span></div>':'')
      +'<div class="khatam-row"><span style="color:var(--accent);font-weight:700">হিজরি ক্যালেন্ডার দেখো →</span><span>রমজান / ঈদ কবে?</span></div>';
    box.onclick=function(){ if(typeof setMode==='function') setMode('hijri'); };
    return box;
  }
  function renderHijri(){
    if(typeof showOther==='function') showOther('{{nights_stay}} হিজরি ক্যালেন্ডার');
    var appEl=document.getElementById('app');
    var h=hijriParts(new Date());
    if(!h){
      var unavailable=document.createElement('div'); unavailable.className='hijri-top';
      unavailable.textContent='এই ব্রাউজারে হিজরি ক্যালেন্ডার গণনা সমর্থিত নয়। আপডেটেড Chrome বা অন্য আধুনিক ব্রাউজারে চেষ্টা করুন।';
      appEl.appendChild(unavailable);
      return;
    }
    var top=document.createElement('div'); top.className='hijri-top';
    top.innerHTML='<small>আজ · '+fmtGreg(new Date())+'</small><div class="big">{{nights_stay}} '+hijriStr(new Date())+'</div><div><small>হিজরি ক্যালেন্ডার (উম্মুল কুরা) — চাঁদ দেখার উপর ১ দিন এদিক-ওদিক হতে পারে</small></div>';
    appEl.appendChild(top);
    // Next event
    var ne=nextEvent();
    if(ne){
      var nx=document.createElement('div'); nx.className='hijri-event next';
      nx.innerHTML='<div><b>{{hourglass_top}} পরের ইভেন্ট: '+ne.ev.name+'</b><div class="trk-mini">'+ne.ev.desc+' · '+fmtGreg(ne.date)+'</div></div><div style="text-align:center"><b style="font-size:20px;color:var(--accent)">'+(ne.days===0?'আজই!':bnNum(ne.days))+'</b><div class="trk-mini">'+(ne.days===0?'':'দিন বাকি')+'</div></div>';
      appEl.appendChild(nx);
    }
    // Month calendar
    var calHead=document.createElement('h3'); calHead.style.cssText='margin:14px 0 4px;color:var(--accent)'; calHead.textContent='{{calendar_month}} এই হিজরি মাস: '+MONTHS_BN[h.month-1]+' '+bnNum(h.year);
    appEl.appendChild(calHead);
    var cal=document.createElement('div'); cal.className='hijri-cal';
    var wd=['রবি','সোম','মঙ্গল','বুধ','বৃহ','শুক্র','শনি'];
    wd.forEach(function(w){ var d=document.createElement('div'); d.className='trk-mini'; d.style.textAlign='center'; d.textContent=w; cal.appendChild(d); });
    // Find start of Hijri month
    var start=new Date(); start.setHours(0,0,0,0);
    for(var i=0;i<35;i++){ var hh=hijriParts(start); if(hh && hh.day===1) break; start.setDate(start.getDate()-1); }
    // Offset for weekday
    var offset=start.getDay();
    for(var k=0;k<offset;k++){ cal.appendChild(document.createElement('div')); }
    // Days of month (until next month starts, max 30)
    var cur=new Date(start);
    for(var dnum=1; dnum<=30; dnum++){
      var hh2=hijriParts(cur); if(!hh2 || hh2.month!==h.month || hh2.year!==h.year) break;
      var cell=document.createElement('div'); cell.className='hijri-day'+(hh2.day===h.day?' today':'');
      var evToday=EVENTS.filter(function(ev){ return ev.m===hh2.month && ev.d===hh2.day; });
      if(evToday.length) cell.classList.add('event');
      cell.innerHTML='<div class="hnum">'+bnNum(hh2.day)+'</div><div>'+cur.toLocaleDateString('bn-BD',{day:'numeric',month:'short'})+'</div>'+(evToday.length?'<div style="font-size:9px;color:#e67e22">● '+evToday[0].name+'</div>':'');
      (function(evList, date){ cell.onclick=function(){ if(evList.length){ if(typeof showToast==='function') showToast(evList[0].name+' — '+fmtGreg(date)+' · '+evList[0].desc); } }; })(evToday, new Date(cur));
      cal.appendChild(cell);
      cur.setDate(cur.getDate()+1);
    }
    appEl.appendChild(cal);
    var note=document.createElement('div'); note.className='trk-mini'; note.style.textAlign='center'; note.textContent='ক্যালেন্ডারের তারিখ চাঁদ দেখার উপর নির্ভর করে ১ দিন এদিক-ওদিক হতে পারে — রমজান / ঈদের চূড়ান্ত তারিখের জন্য স্থানীয় ঘোষণা দেখো।';
    appEl.appendChild(note);
    // All events sorted
    var evHead=document.createElement('h3'); evHead.style.cssText='margin:14px 0 4px;color:var(--accent)'; evHead.textContent='{{event}} আসছে ইসলামিক দিনগুলো';
    appEl.appendChild(evHead);
    var sorted=EVENTS.map(function(ev){ var f=findNextHijri(ev.m, ev.d); return {ev:ev, date:f?f.date:null, days:f?f.days:999}; }).sort(function(a,b){ return a.days-b.days; });
    sorted.forEach(function(it){
      var row=document.createElement('div'); row.className='hijri-event'+(it.days===0?' next':'');
      row.innerHTML='<div><b>'+it.ev.name+'</b><div class="trk-mini">'+it.ev.desc+' · হিজরি '+bnNum(it.ev.d)+' '+MONTHS_BN[it.ev.m-1]+'</div></div><div style="text-align:center"><b>'+(it.date?fmtGreg(it.date):'তারিখ অনুপলব্ধ')+'</b><div class="trk-mini">'+(it.days===0?'আজই!':bnNum(it.days)+' দিন বাকি')+'</div></div>';
      appEl.appendChild(row);
    });
    var mini=document.getElementById('gHijriMini'); if(mini) mini.textContent=h?hijriStr(new Date()).slice(0,12)+' ›':'›';
  }
  window.renderHijri=renderHijri; window.buildHijriCard=buildHijriCard; window.quranixHijri={hijriStr:hijriStr, nextEvent:nextEvent};
})();
</script>

<script>
/* ===== PWA: install + service worker ===== */
(function(){
  var deferred=null;
  window.quranixInstallAvailable=false;
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferred=e; window.quranixInstallAvailable=true; showBanner(); });
  window.addEventListener('appinstalled', function(){ hideBanner(); if(typeof showToast==='function') showToast('Quranix ইনস্টল হয়েছে'); });
  function showBanner(){ var b=document.getElementById('pwaBanner'); if(b) b.classList.add('show'); }
  function hideBanner(){ var b=document.getElementById('pwaBanner'); if(b) b.classList.remove('show'); }
  function isInstalled(){ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true; }
  if(isInstalled()){ /* already installed - no banner */ }
  else { setTimeout(function(){ if(deferred) showBanner(); }, 2500); }
  var ib=document.getElementById('pwaInstallBtn');
  if(ib) ib.onclick=function(){ doInstall(); };
  var bc=document.getElementById('pwaBannerClose');
  if(bc) bc.onclick=function(){ hideBanner(); localStorage.setItem('quranix_pwa_dismiss','1'); };
  async function doInstall(){
    if(isInstalled()){ if(typeof showToast==='function') showToast('Quranix ইতিমধ্যে ইনস্টল করা আছে'); return; }
    if(deferred){
      var promptEvent=deferred;
      deferred=null;
      try{
        await promptEvent.prompt();
        var choice=await promptEvent.userChoice;
        if(choice && choice.outcome==='accepted') hideBanner();
        else if(typeof showToast==='function') showToast('ইনস্টল বাতিল করা হয়েছে');
      }catch(err){
        if(typeof showToast==='function') showToast('ইনস্টল প্রম্পট খোলা যায়নি; ব্রাউজার মেনু ব্যবহার করুন');
      }
      return;
    }
    var isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);
    var isAndroid=/Android/i.test(navigator.userAgent);
    if(isIOS){ alert('iPhone-এ Safari খুলে Share → Add to Home Screen → Add চাপুন।'); }
    else if(isAndroid){ alert('Chrome-এর ⋮ মেনু → Install app / Add to Home screen নির্বাচন করুন।'); }
    else { alert('PC-তে Chrome বা Edge-এর address bar-এর Install আইকন, অথবা মেনু → Install Quranix নির্বাচন করুন।'); }
  }
  window.quranixInstall=doInstall;
  // Service worker - only on http/https, not file://
  if('serviceWorker' in navigator && location.protocol!=='file:'){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').then(function(){ console.log('Quranix SW ok'); }).catch(function(e){ console.log('SW fail', e); });
    });
  }
  // Update mini label
  var mini=document.getElementById('gPwaMini'); if(mini) mini.textContent=isInstalled()?'ইনস্টল করা ›':'›';
})();

  for(var i=1;i<=collection.chapters;i++){var chapter=await window.quranixPackageStore.getHadithChapter(collection.id,i);var chapterInfo=hadithMeta[collection.id==='Ibne-Mazah'?String(i-1):String(i)]||{};if(Array.isArray(chapter))chapter.forEach(function(h){var copy=Object.assign({},h);copy._qxChapterTitle=chapterInfo.title||'';rows.push(copy);});}
  function draw(q){list.innerHTML='';var term=(q||'').toLowerCase();rows.forEach(function(h){var ar=h.ar||h.arabic||'',bn=h.bn||h.text||h.translation||'',narrator=h.narrator||'',grade=h.grade||'',chapterTitle=h._qxChapterTitle||'';var hay=(ar+' '+bn+' '+narrator+' '+grade+' '+chapterTitle).toLowerCase();if(term&&hay.indexOf(term)<0)return;var card=document.createElement('div');card.className='hadith-item';var title=document.createElement('b');title.textContent='হাদিস '+(h.hadith_id||h.id||'');var arabic=document.createElement('div');arabic.className='ar';arabic.textContent=ar;var body=document.createElement('div');body.style.cssText='font-size:14px;line-height:1.7;margin:5px 0';body.textContent=bn;var ref=document.createElement('div');ref.className='ref';ref.textContent=[narrator,grade,chapterTitle||('অধ্যায় '+((h.chapter&&h.chapter.chapter_number)||''))].filter(Boolean).join(' · ');card.appendChild(title);if(ar)card.appendChild(arabic);card.appendChild(body);card.appendChild(ref);list.appendChild(card);});if(!list.children.length)list.textContent='এই অনুসন্ধানে কোনো হাদিস পাওয়া যায়নি।';}
  search.oninput=function(){draw(search.value);};draw('');
}
function renderHadith(){if(typeof showOther==='function')showOther('{{history_edu}} হাদিস প্যাকেজ');var appEl=document.getElementById('app');var info=document.createElement('div');info.className='trk-mini';info.style.textAlign='center';info.textContent='সব হাদিস না — শুধু প্যাকেজ আকারের বইগুলো। একে একে পড়ো, মুখস্থ হলে {{check_circle:f}} মার্ক করো।';appEl.appendChild(info);var pkgs=[{k:'nawawi',icon:'{{menu_book}}',name:'৪০ হাদিস (ইমাম নববী)',desc:'ইসলামের মূল ৪২টি হাদিস — প্রতিটা মুসলিমের জানা উচিত',count:HADITH_DATA.nawawi.length},{k:'qudsi',icon:'{{auto_awesome}}',name:'হাদিসে কুদসি',desc:'আল্লাহর কথা, রাসূল ﷺ-এর ভাষায় — ২০টি নির্বাচিত',count:HADITH_DATA.qudsi.length},{k:'short',icon:'{{lightbulb}}',name:'ছোট হাদিস — দৈনন্দিন জীবন',desc:'ছোট ছোট হাদিস, মুখস্থ করা সহজ — প্রতিদিন ১টা',count:HADITH_DATA.short.length}];pkgs.forEach(function(pk){var mem={};try{mem=JSON.parse(localStorage.getItem('quranix_hadith_mem')||'{}');}catch(e){}var done=0;for(var i=0;i<pk.count;i++){if(mem[pk.k+':'+i])done++;}var card=document.createElement('div');card.className='hadith-pkg';card.innerHTML='<h3>'+pk.icon+' '+pk.name+'</h3><div class="sub">'+pk.desc+'</div><div class="khatam-row" style="margin-top:8px"><span>'+(typeof toBn==='function'?toBn(pk.count):pk.count)+'টি হাদিস</span><span>মুখস্থ: '+(typeof toBn==='function'?toBn(done):done)+'/'+(typeof toBn==='function'?toBn(pk.count):pk.count)+'</span><span style="color:var(--accent);font-weight:700">খোলো →</span></div><div class="goal-track"><div class="goal-fill" style="width:'+Math.round(done/pk.count*100)+'%" ></div></div>';card.onclick=function(){renderHadithList(pk.k,pk.name);};appEl.appendChild(card);});var today=hadithToday();var tc=document.createElement('div');tc.className='hadith-pkg';tc.innerHTML='<h3>{{history_edu}} আজকের হাদিস</h3><div class="ar" style="font-family:Amiri Quran,serif;font-size:22px;direction:rtl;text-align:right;color:var(--accent)">'+today.ar+'</div><b>'+today.title+'</b><div class="trk-mini">'+today.bn+'</div><div class="ref" style="font-size:11px;color:var(--muted)">{{auto_stories}} '+today.ref+'</div>';tc.onclick=function(){openHadithDetail(today.pkg,today.idx);};appEl.appendChild(tc);renderOfflineHadithCollections(appEl);}
function renderHadithList(pkgKey,pkgName){if(typeof showOther==='function')showOther('{{history_edu}} '+pkgName);var appEl=document.getElementById('app');var back=document.createElement('button');back.className='dl-btn ghost';back.textContent='← সব প্যাকেজ';back.onclick=function(){renderHadith();};appEl.appendChild(back);var search=document.createElement('input');search.className='asma-search';search.placeholder='হাদিস খুঁজুন... যেমন: নিয়ত, রাগ, ধৈর্য';appEl.appendChild(search);var list=document.createElement('div');appEl.appendChild(list);function draw(f){list.innerHTML='';var mem={};try{mem=JSON.parse(localStorage.getItem('quranix_hadith_mem')||'{}');}catch(e){}HADITH_DATA[pkgKey].forEach(function(h,i){if(f&&(h[0]+h[2]+h[3]).toLowerCase().indexOf(f.toLowerCase())<0)return;var item=document.createElement('div');item.className='hadith-item'+(mem[pkgKey+':'+i]?' done':'');item.innerHTML='<div class="ar">'+h[1]+'</div><b>'+(typeof toBn==='function'?toBn(i+1):i+1)+'. '+h[0]+'</b><div style="font-size:13px;margin:4px 0">'+h[2]+'</div><div class="ref">{{auto_stories}} '+h[3]+(mem[pkgKey+':'+i]?' · {{check_circle:f}} মুখস্থ':'')+'</div>';item.onclick=function(){openHadithDetail(pkgKey,i);};list.appendChild(item);});}search.oninput=function(){draw(search.value);};draw('');}
function openHadithDetail(pkgKey,idx){var h=HADITH_DATA[pkgKey][idx];var mem={};try{mem=JSON.parse(localStorage.getItem('quranix_hadith_mem')||'{}');}catch(e){}var key=pkgKey+':'+idx;var ov=document.createElement('div');ov.className='ac-ov';ov.style.zIndex='130';var box=document.createElement('div');box.className='ac-box';box.innerHTML='<div class="ac-head"><span>{{history_edu}} '+(pkgKey==='nawawi'?'৪০ হাদিস':pkgKey==='qudsi'?'হাদিসে কুদসি':'ছোট হাদিস')+' · '+(typeof toBn==='function'?toBn(idx+1):idx+1)+'</span><button id="hX">{{close}}</button></div><div class="ar" style="font-family:Amiri Quran,serif;font-size:26px;direction:rtl;text-align:center;color:var(--accent);line-height:1.8">'+h[1]+'</div><b style="font-size:18px">'+h[0]+'</b><div style="line-height:1.7;margin:10px 0">'+h[2]+'</div><div class="trk-mini">{{auto_stories}} রেফারেন্স: '+h[3]+'</div><div class="trk-mini" style="margin-top:6px">{{lightbulb}} এই হাদিসটা আজকের দিনে কীভাবে আমল করবা, একটু ভেবে নাও। মুখস্থ হলে {{check_circle:f}} চাপ দাও।</div><div class="ac-row"><button class="ac-btn ghost" id="hMem">'+(mem[key]?'{{check_circle:f}} মুখস্থ — সরাও':'{{star}} মুখস্থ মার্ক করো')+'</button><button class="ac-btn" id="hShare">{{share}} শেয়ার করো</button></div><div class="ac-row"><button class="ac-btn ghost" id="hPrev">← আগের হাদিস</button><button class="ac-btn ghost" id="hNext">পরের হাদিস →</button></div>';ov.appendChild(box);document.body.appendChild(ov);var close=function(){ov.remove();if(typeof mode!=='undefined'&&mode==='hadith'){};};box.querySelector('#hX').onclick=close;ov.onclick=function(e){if(e.target===ov)close();};box.querySelector('#hMem').onclick=function(){if(mem[key])delete mem[key];else mem[key]=1;localStorage.setItem('quranix_hadith_mem',JSON.stringify(mem));this.textContent=mem[key]?'{{check_circle:f}} মুখস্থ — সরাও':'{{star}} মুখস্থ মার্ক করো';if(typeof showToast==='function')showToast(mem[key]?'মুখস্থ মার্ক হয়েছে':'মার্ক সরানো হয়েছে');};box.querySelector('#hShare').onclick=async function(){var text=''+h[0]+'\n'+h[1]+'\n'+h[2]+'\n'+h[3]+'\n— Quranix · হাদিস প্যাকেজ';if(navigator.share){try{await navigator.share({title:h[0],text:text});}catch(e){}}else if(typeof copyText==='function')copyText(text,'কপি হয়েছে!');};box.querySelector('#hPrev').onclick=function(){ov.remove();openHadithDetail(pkgKey,(idx+HADITH_DATA[pkgKey].length-1)%HADITH_DATA[pkgKey].length);};box.querySelector('#hNext').onclick=function(){ov.remove();openHadithDetail(pkgKey,(idx+1)%HADITH_DATA[pkgKey].length);};}
window.renderHadith=renderHadith;window.openOfflineHadithCollection=openOfflineHadithCollection;window.buildHadithCard=buildHadithCard;window.openHadithDetail=openHadithDetail;window.renderHadithList=renderHadithList;
