.ayah-actions > .star:hover {

.ayah-actions {

  align-items: center;
  justify-content: center;
}

.icon-btn:hover {
  background: var(--qx-border);
  color: var(--qx-text-color);
}

.star {
  border: 0;
  background: var(--qx-tile-bg);
  font-size: calc(21px * var(--qx-scale));
  color: var(--qx-main-color);
  padding: calc(7px * var(--qx-scale));
  min-width: calc(40px * var(--qx-scale));
  min-height: calc(40px * var(--qx-scale));

  justify-content: center;
}
.resume {

.bism {

}

.sh {

}

.qx-surah-header {

  align-items: center;
  justify-content: space-between;
  gap: 12px;
  text-align: start;
}

 .qx-surah-header-name {
  min-width: 0;
  font-weight: 700;
}

/* [SURAH-BANNER] start — Makki teal / Madani navy, abstract pattern at 8% */
.qx-surah-banner {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  min-height: 82px;
  padding: 16px 18px;
  border: 0;
  color: #fff;
  background: #0f766e;
  border-radius: var(--qx-radius-lg);
  box-shadow: 0 8px 22px color-mix(in srgb, #0f766e 22%, transparent);
}
.qx-surah-banner.madani {
  background: #1e3a8a;
  box-shadow: 0 8px 22px color-mix(in srgb, #1e3a8a 22%, transparent);
}
.qx-surah-banner::before {
  content: "";
  position: absolute;
  inset: -20%;
  z-index: -1;
  opacity: .08;
  background: repeating-linear-gradient(45deg, transparent 0 18px, #fff 18px 20px), repeating-linear-gradient(-45deg, transparent 0 28px, #fff 28px 30px);
  transform: rotate(-8deg);
  pointer-events: none;
}
.qx-surah-banner-text {
  display: flex;
  min-width: 0;
  flex-direction: column;
  gap: 4px;
}
.qx-surah-banner .qx-surah-header-name {
  font-size: 1.16em;
  line-height: 1.35;
}
.qx-surah-banner-sub {
  color: color-mix(in srgb, #fff 82%, transparent);
  font-size: .88em;
  line-height: 1.4;
}
/* [SURAH-BANNER] end */

.qx-surah-audio-btn {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 42px;
  height: 42px;
  border: 1px solid color-mix(in srgb, var(--qx-on-main) 40%, transparent);
  border-radius: 50%;
  background: color-mix(in srgb, var(--qx-on-main) 12%, transparent);
  color: var(--qx-on-main);
  font: inherit;
  cursor: pointer;
}

.qx-surah-audio-btn.on {
  background: color-mix(in srgb, var(--qx-on-main) 24%, transparent);
}

.msg {
  text-align: center;
  color: var(--qx-meta-color);
  padding: calc(30px * var(--qx-scale)) 0;
}
.ayah.playing {
  border-color: var(--qx-main-color);
  box-shadow: 0 0 0 2px var(--qx-main-color);
  background: color-mix(in srgb, var(--qx-main-color) 6%, var(--qx-card-bg));
}
.ayah.read-done {
  border-left: 3px solid var(--qx-main-color);
}
/* [AYAH-CARD] end */

/* [ANIMATION qxMorePulse] start */
@keyframes qxMorePulse {
  0%, 100% { transform: scale(1);
  opacity: .7;
  }
  50% { transform: scale(1.2);
  }
}
/* [ANIMATION qxMorePulse] end */

/* [SEARCH-BOX] start */
.qx-search {
  position: relative;
  display: flex;
  align-items: center;
  margin: 0 0 10px auto;
  width: min(100%, 220px);
}

.surah-list-heading .qx-search {
  width: 100%;
  margin: 0 0 10px 0;
  flex: 1 1 100%;
  order: 2;
}

.qx-search-ic {
  position: absolute;
  left: 10px;
  display: inline-flex;
  color: var(--qx-meta-color);
  font-size: calc(17px * var(--qx-scale));
  pointer-events: none;
}

.qx-search input {
  width: 100%;
  padding: calc(7px * var(--qx-scale)) calc(12px * var(--qx-scale)) calc(7px * var(--qx-scale)) calc(32px * var(--qx-scale));
  font-size: var(--qx-fs-sm);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-pill);
  background: var(--qx-card-bg);
  color: var(--qx-text-color);
  font: inherit;
  box-shadow: var(--qx-shadow);
}

.qx-search input::placeholder {
  color: var(--qx-meta-color);
}

.qx-search input:focus {
  outline: none;
  border-color: var(--qx-main-color);
  box-shadow: 0 0 0 3px var(--qx-main-soft);
}
/* [SEARCH-BOX] end */

/* [CLASS qx-tsb-*] start */
.qx-tsb-sel {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.qx-tsb-chip {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 0;
  padding: calc(10px * var(--qx-scale)) calc(6px * var(--qx-scale));
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  background: var(--qx-card-bg);
  color: var(--qx-text-color);
  font: inherit;
  cursor: pointer;
}

.qx-tsb-chip b {
  font-size: var(--qx-fs-sm);
  text-align: center;
}

.qx-tsb-chip small {
  color: var(--qx-meta-color);
}

.qx-tsb-chip.on {
  background: var(--qx-main-color);
  border-color: var(--qx-main-color);
  color: var(--qx-on-main);
}

.qx-tsb-chip.on small {
  color: inherit;
  opacity: .9;
}

.qx-tsb-phrase {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 12px;
  width: 100%;
  max-width: 100%;
  text-align: center;
}

.qx-tsb-wrap {
  display: flex;
  justify-content: center;
  margin: 6px 0;
}

.qx-tsb-btn {
  position: relative;
  display: grid;
  place-items: center;
  width: min(240px, 70vw);
  aspect-ratio: 1;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: var(--qx-card-bg);
  box-shadow: var(--qx-shadow);
  color: var(--qx-text-color);
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: transform .12s ease, box-shadow .2s ease;
  overflow: hidden;
  will-change: transform;
  -webkit-touch-callout: none;
}

.qx-tsb-btn:active {
  transform: scale(.96);
}

.qx-tsb-btn svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.qx-tsb-track,
.qx-tsb-arc {
  fill: none;
  stroke-width: 10;
}

.qx-tsb-track {
  stroke: var(--qx-border);
}

.qx-tsb-arc {
  stroke: var(--qx-main-color);
  stroke-linecap: round;
  transition: stroke-dashoffset .3s cubic-bezier(.22,.8,.3,1), opacity .15s ease;
}

.qx-tsb-in {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  z-index: 1;
  max-width: 74%;
  text-align: center;
}

.qx-tsb-count {
  font-size: calc(56px * var(--qx-scale));
  font-weight: 700;
  line-height: 1;
  color: var(--qx-main-color);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;
  min-width: 2ch;
}

.qx-tsb-in small {
  color: var(--qx-meta-color);
  font-size: var(--qx-fs-md);
  line-height: 1.3;
  text-wrap: balance;
}

.qx-tsb-ctl {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: center;
  margin-top: 6px;
}

.qx-tsb-opt {
  padding: calc(8px * var(--qx-scale)) calc(16px * var(--qx-scale));
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-pill);
  background: var(--qx-card-bg);
  color: var(--qx-text-color);
  font: inherit;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: calc(44px * var(--qx-scale));
  min-width: calc(44px * var(--qx-scale));
  line-height: 1;
  transition: background-color .15s ease, border-color .15s ease, transform .1s ease;
}

.qx-tsb-opt.on {
  background: var(--qx-main-color);
  border-color: var(--qx-main-color);
  color: var(--qx-on-main);
}

.qx-tsb-opt.danger {
  color: var(--qx-danger);
  border-color: var(--qx-danger);
}
/* [CLASS qx-tsb-*] end */

/* [CONTROLS] start */
.tabs {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  overflow-x: auto;
}

.tabs button {
  white-space: nowrap;
}

.tabs button.on {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-color: var(--qx-main-color);
}
select {
  font: inherit;
  width: 100%;
  padding: calc(9px * var(--qx-scale)) calc(10px * var(--qx-scale));
  border-radius: var(--qx-radius-lg);
  border: 1px solid var(--qx-border);
  background: var(--qx-card-bg);
  color: var(--qx-text-color);
}
/* [CONTROLS] end */

/* [CLASS .row2] start */
.row2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 10px 0;
}
/* [CLASS .row2] end */

/* [HERO] start */
.hero {
  position: relative;
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-radius: var(--qx-radius-lg);
  padding: calc(18px * var(--qx-scale)) calc(12px * var(--qx-scale));
  text-align: center;
  margin: 8px 0;
  box-shadow: var(--qx-shadow);
}

.hero small {
  opacity: .85;
}

.hero-date {
  position: absolute;
  top: 10px;
  left: 10px;
  width: calc(44px * var(--qx-scale));
  overflow: hidden;
  border-radius: var(--qx-radius-lg);
  background: rgba(255,255,255,.18);
  line-height: 1;
}

.hero-date .hd-m {
  display: block;
  padding: 3px 0;
  background: rgba(255,255,255,.28);
  font-size: var(--qx-fs-xs);
}

.hero-date .hd-d {
  display: block;
  padding: calc(5px * var(--qx-scale)) 0 calc(6px * var(--qx-scale));
  font-size: var(--qx-fs-xl);
}

.hero .big {
  font-size: calc(26px * var(--qx-scale));
  font-weight: 700;
  margin: 4px 0;
}

.hero .cd {
  font-size: calc(20px * var(--qx-scale));
  font-variant-numeric: tabular-nums;
}
/* [HERO] end */

/* [CLASS .prow] start */
.prow {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--qx-card-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  padding: calc(14px * var(--qx-scale));
  margin: 8px 0;
}

.prow.on {
  border-color: var(--qx-main-color);
  box-shadow: 0 0 0 1px var(--qx-main-color);
}

.prow.on b {
  color: var(--qx-main-color);
}
/* [CLASS .prow] end */

/* [AYAH-NOTE-SPEED] start */
.note {
  font-size: var(--qx-fs-sm);
  color: var(--qx-meta-color);
  line-height: 1.6;
  margin-top: 14px;
  font-style: italic;
  font-weight: 500;
}

.note::before {
  content: "* ";
  font-weight: 700;
  color: var(--qx-main-color);
}
.note-box {
  margin-top: 10px;
  padding: calc(10px * var(--qx-scale)) calc(12px * var(--qx-scale));
  background: color-mix(in srgb, var(--qx-main-color) 7%, var(--qx-card-bg));
  border-left: 3px solid var(--qx-main-color);
  border-radius: var(--qx-radius);
  font-size: var(--qx-fs-md);
  line-height: 1.6;
  color: var(--qx-text-color);
  font-style: italic;
  font-weight: 500;
}

.note-box-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: var(--qx-fs-xs);
  color: var(--qx-main-color);
  font-weight: 600;
  margin-bottom: 4px;
}
.speed-btn {
  font-size: var(--qx-fs-sm);
  font-weight: 600;
  min-width: calc(42px * var(--qx-scale));
}
/* [AYAH-NOTE-SPEED] end */

/* [TASBIH] start */
.tw {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  margin: 10px 0;
}

.tbtn {
  width: 200px;
  height: 200px;
  border-radius: 50%;
  border: 0;
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  box-shadow: var(--qx-shadow);
  transition: transform .08s ease, box-shadow .08s ease;
  aspect-ratio: 1 / 1;
}

.tbtn:active {
  transform: scale(.97);
  box-shadow: var(--qx-shadow);
}

.tcount {
  font-size: calc(50px * var(--qx-scale));
  font-weight: 700;
  line-height: 1;
}

.tbtn small {
  margin-top: 2px;
  opacity: .85;
  font-size: 12px;
}
.tasbih-wrap, .tasbih-circle-wrap {
  display: flex;
  justify-content: center;
  padding: 16px 0;
}

.tbtn .tcount {
  font-size: 34px;
  font-weight: 700;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
/* [TASBIH] end */

/* [CLASS .src] start */
.src {
  font-size: var(--qx-fs-sm);
  color: var(--qx-meta-color);
  margin-top: 8px;
}
/* [CLASS .src] end */

/* [BASE] start */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: var(--qx-outer-bg);
  color: var(--qx-text-color);
  padding-top: 0;
  padding-bottom: env(safe-area-inset-bottom);
  font-size: var(--qx-fs-bn);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}
button {
  font: inherit;
  border: 1px solid var(--qx-border);
  background: var(--qx-card-bg);
  color: var(--qx-text-color);
  border-radius: var(--qx-radius-lg);
  padding: calc(6px * var(--qx-scale)) calc(12px * var(--qx-scale));
}

input {
  width: 100%;
  margin-top: 8px;
  padding: calc(10px * var(--qx-scale)) calc(12px * var(--qx-scale));
  border-radius: var(--qx-radius-lg);
  border: 1px solid var(--qx-border);
  background: var(--qx-card-bg);
  color: var(--qx-text-color);
  font: inherit;
}
main {
  padding: clamp(12px,2.2vw,calc(24px * var(--qx-scale))) clamp(12px,2.4vw,calc(24px * var(--qx-scale))) calc(104px * var(--qx-scale));
  max-width: 100%;
  width: 100%;
  margin: 0 auto;
  background: var(--qx-bg);
  min-height: calc(100vh - 62px);
  padding-left: var(--qx-gutter);
  padding-right: var(--qx-gutter);
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
}

#app {
  width: 100%;
  min-width: 0;
  max-width: 100%;
  margin: 0 auto;
}
html.qx-modal-open {
  overflow: hidden;
  overscroll-behavior: none;
}

body.qx-modal-open {
  overflow: hidden;
  overscroll-behavior: none;
}
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

html,body {
  overflow-x: clip;
}

img,svg,canvas,video {
  max-width: 100%;
}
body.inside-page h1 {
  display: flex;
  align-items: center;
  gap: 8px;
}
/* [BASE] end */

/* [TAFSEER] start */
.tafseer-body {
  line-height: 1.95;
  font-size: var(--qx-fs-lg);
  color: var(--qx-text-color);
  max-width: 74ch;
  margin: 0 auto;
  padding: calc(12px * var(--qx-scale)) calc(6px * var(--qx-scale));
  overflow-wrap: anywhere;
}
.tafseer-body p {
  margin: 0 0 1.15em;
  text-align: justify;
  text-wrap: pretty;
}
.tafseer-body h1,
.tafseer-body h2,
.tafseer-body h3,
.tafseer-body h4 {
  color: var(--qx-main-color);
  line-height: 1.5;
  margin: 1.45em 0 .65em;
  font-weight: 700;
  text-align: start;
}
.tafseer-body h1 { font-size: 1.35em; }
.tafseer-body h2 { font-size: 1.22em; }
.tafseer-body h3,
.tafseer-body h4 { font-size: 1.08em; }
.tafseer-body ul,
.tafseer-body ol {
  padding-inline-start: 1.6em;
  margin: .6em 0 1.2em;
}
.tafseer-body li { margin: .35em 0; padding-inline-start: .2em; }
.tafseer-body blockquote {
  margin: 1em 0;
  padding: .75em 1em;
  border-inline-start: 3px solid var(--qx-main-color);
  border-radius: var(--qx-radius);

}
.tafseer-body strong,
.tafseer-body b { color: var(--qx-text-color); }
.tafseer-body hr {
  border: 0;
  border-top: 1px solid var(--qx-border);
  margin: 1.4em 0;
}
.tafseer-body.tafseer-ibn-kathir p { margin-bottom: 1.35em; }
.tafseer-body.tafseer-ibn-kathir h2,
.tafseer-body.tafseer-ibn-kathir h3 { padding-bottom: .35em; border-bottom: 1px solid var(--qx-border); }
/* [TAFSEER] end */

/* [AUDIO-BAR] start */
/* [AUDIO-BAR > container] player bar fixed above the footer menu */
.audio-bar {
  display: none;
  position: fixed;
  left: 0;
  right: 0;
  bottom: env(safe-area-inset-bottom);
  z-index: 50;
  background: var(--qx-main-soft);
  border-top: 1px solid var(--qx-border);
  box-shadow: 0 -4px 16px rgba(0,0,0,.08);
}
.audio-bar.show,
.audio-bar.on,
.audio-bar.open,
.audio-bar.active,
.audio-bar.visible {
  display: block;
}
.audio-bar.with-nav {
  bottom: calc(66px * var(--qx-scale) + env(safe-area-inset-bottom));
}

html.qx-audio-open,
body.qx-audio-open {
  overflow: hidden;
}
.audio-bar .audio-inner {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
}
.audio-bar .audio-progress-top {
  top: 0;
  left: 0;
  right: 0;
}
.audio-info {
  display: flex;
  flex-direction: column;
}
.audio-info b {
  font-size: var(--qx-fs-md);
}
.audio-info small,
.audio-status {
  font-size: 11px;
  color: var(--qx-meta-color);
}
.audio-top-row .audio-info small {
  color: #47645E;
}
.audio-status {
  text-align: center;
  padding: 0 14px 6px;
}
.audio-status:empty {
  display: none;
}
.audio-progress-top {
  margin: 0;
}

.audio-progress-fill::after {
  content: "";
  position: absolute;
  right: -6px;
  top: 50%;
  transform: translateY(-50%);
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid var(--qx-main-color);
  box-shadow: 0 1px 4px rgba(0,0,0,.15);
}
.audio-top-row {
  background: #D9E6E5;
  color: #18322E;
}

.audio-top-actions button {
  color: #18322E;
}
.audio-ctrls.qx-audio-ctrls-v3 {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  width: 100%;
  padding: 12px 12px 6px;
}
.qx-side-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--qx-text-color);
  display: grid;
  place-items: center;
  cursor: pointer;
}
.qx-side-btn .ms {
  font-size: 26px;
}
.qx-side-btn.on {
  background: var(--qx-main-soft);
  color: var(--qx-main-color);
}
.qx-center-btn {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: var(--qx-main-color);
  color: #fff;
  border: none;
  display: grid;
  place-items: center;
  cursor: pointer;
  box-shadow: 0 2px 12px rgba(0,0,0,.12);
}
.qx-center-btn .ms {
  font-size: 32px;
}
.qx-center-btn:focus-visible,
.qx-side-btn:focus-visible,
.audio-top-actions button:focus-visible {
  outline: 2px solid var(--qx-main-color);
  outline-offset: 2px;
}

/* [AUDIO-BAR > dark-mode controls] start */
[data-theme="dark"] .audio-top-row {
  background: color-mix(in srgb, var(--qx-card-bg) 88%, var(--qx-main-color));
  color: var(--qx-text-color);
  border-bottom: 1px solid var(--qx-border);
}
[data-theme="dark"] .audio-top-row .audio-info small { color: var(--qx-meta-color); }
[data-theme="dark"] .audio-top-actions button {
  color: var(--qx-text-color);
  background: color-mix(in srgb, var(--qx-card-bg) 85%, var(--qx-main-color));
  border: 1px solid var(--qx-border);
  border-radius: 10px;
}
[data-theme="dark"] .qx-center-btn {
  background: var(--qx-main-color);
  color: #fff;
  border: 1px solid color-mix(in srgb, var(--qx-main-color) 65%, #fff);
  box-shadow: 0 2px 10px rgba(0,0,0,.35);
}
[data-theme="dark"] .qx-side-btn { color: var(--qx-text-color); }
[data-theme="dark"] .qx-side-btn.on {
  color: var(--qx-main-color);
  background: color-mix(in srgb, var(--qx-main-color) 20%, var(--qx-card-bg));
}
/* [AUDIO-BAR > dark-mode controls] end */

/* [AUDIO-BAR] end */

/* [QUICK-JUMP] start */
.quick-jump {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  min-width: 0;
}

.quick-jump select,.quick-jump input {
  margin: 0;
  padding: calc(7px * var(--qx-scale)) calc(9px * var(--qx-scale));
  font-size: var(--qx-fs-md);
  border-radius: var(--qx-radius);
  height: calc(36px * var(--qx-scale));
}

.quick-jump button {
  padding: calc(6px * var(--qx-scale)) calc(12px * var(--qx-scale));
  font-size: var(--qx-fs-md);
  border-radius: var(--qx-radius);
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border: 0;
  cursor: pointer;
  white-space: nowrap;
  height: calc(36px * var(--qx-scale));
}
#controls select,
#controls .quick-jump input,
#controls .quick-jump button,
#controls .tabs button {
  border-radius: var(--qx-radius-lg);
}
/* [QUICK-JUMP] end */

/* [READING-GOAL] start */
.goal-bar {
  background: var(--qx-card-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  padding: calc(12px * var(--qx-scale)) calc(14px * var(--qx-scale));
  margin: 8px 0;
  flex-direction: column;
  gap: 8px;
}

.goal-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: var(--qx-fs-md);
}

.goal-track {
  height: 8px;
  background: var(--qx-border);
  border-radius: var(--qx-radius-pill);
  overflow: hidden;
}

.goal-fill {
  height: 100%;
  background: var(--qx-main-color);
  border-radius: var(--qx-radius-pill);
  transition: width .3s ease;
}
.sheet-box .goal-bar {
  display: flex;
}
/* [READING-GOAL] end */

/* [CLASS p3-*] start */
.p3-tabs {
  display: flex;
  gap: 5px;
  margin-bottom: 12px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 3px;
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  background: var(--qx-tile-bg);
}

.p3-tabs button {
  flex: 1 0 auto;
  white-space: nowrap;
  padding: calc(9px * var(--qx-scale)) calc(12px * var(--qx-scale));
  border-radius: var(--qx-radius);
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
}

.p3-tabs button.on {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-color: var(--qx-main-color);
}

.p3-card {
  background: var(--qx-card-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  padding: calc(14px * var(--qx-scale));
  margin: 8px 0;
  box-shadow: var(--qx-shadow);
}

.p3-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 8px;
}

.p3-grid label {
  font-size: var(--qx-fs-sm);
  color: var(--qx-meta-color);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
/* [CLASS p3-*] end */

/* [QIBLA] start */
.qibla-box {
  width: 100%;
  max-width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px var(--qx-gutter);
  text-align: center;
  gap: 8px;
}

.compass-dial {
  position: relative;
  width: min(80vw, 300px);
  height: min(80vw, 300px);
  border-radius: 50%;
  border: 4px solid var(--qx-main-color);
  background: var(--qx-card-bg);
  box-shadow: var(--qx-shadow);
  margin: 14px auto;
  display: flex;
  align-items: center;
  justify-content: center;
  max-width: 300px;
  max-height: 300px;
  border-width: 3px;
}

.compass-ring {
  position: absolute;
  inset: 0;
  transition: transform 0.15s ease-out;
}

.compass-mark {
  position: absolute;
  font-size: var(--qx-fs-md);
  font-weight: 700;
  color: var(--qx-meta-color);
}

.compass-mark.n {
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  color: var(--qx-danger);
}

.compass-mark.s {
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
}

.compass-mark.e {
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
}

.compass-mark.w {
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
}

.kaaba-pointer {
  position: absolute;
  inset: 14px;
  transition: transform 0.2s ease-out;
}

.kaaba-badge {
  position: absolute;
  top: 2px;
  left: 50%;
  transform: translateX(-50%);
  background: #16a34a;
  color: var(--qx-on-main);
  padding: 0;
  border-radius: 50%;
  font-size: 17px;
  font-weight: 700;
  box-shadow: var(--qx-shadow);
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
}

.kaaba-needle {
  position: absolute;
  top: 30px;
  bottom: 50%;
  left: 50%;
  width: 8px;
  margin-left: -4px;
  background: #16a34a;
  border-radius: 5px;
}

.compass-center {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #16a34a;
  z-index: 2;
  border: 2px solid var(--qx-card-bg);
}

.qibla-aligned {
  border-color: var(--qx-success);
  box-shadow: 0 0 0 4px rgba(22,163,74,0.2);
}

.alert-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--qx-border);
  gap: 12px;
  flex-wrap: wrap;
}

.alert-row:last-child {
  border-bottom: 0;
}
.alert-row>span:first-child {
  font-weight: 600;
}
.qibla-box .note {
  max-width: 42rem;
  line-height: 1.55;
}

/* [QIBLA] end */

/* [SETTINGS] start */
.settings-modal-title {
  flex: 1;
  margin: 0;
  font-size: var(--qx-fs-xl);
  font-weight: 600;
  color: var(--qx-text-color);
  display: flex;
  align-items: center;
  gap: 10px;
}
.settings-body {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: calc(4px * var(--qx-scale)) 2px calc(6px * var(--qx-scale));
  font-size: var(--qx-fs-lg);
  line-height: 1.4;
}
.switch-btn {
  padding: calc(8px * var(--qx-scale)) calc(13px * var(--qx-scale));
  border-radius: var(--qx-radius-lg);
  font-size: var(--qx-fs-sm);
  font-weight: 600;
  cursor: pointer;
  min-width: 88px;
  border: 1px solid var(--qx-border);
  background: var(--qx-tile-bg);
  color: var(--qx-text-color);
}

.switch-btn.on {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-color: var(--qx-main-color);
}
.set-sec {
  padding: calc(10px * var(--qx-scale)) calc(4px * var(--qx-scale));
}

.set-title {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0;
  font-size: var(--qx-fs-lg);
  font-weight: 600;
  color: var(--qx-text-color);
}

summary.set-title {
  list-style: none;
  cursor: pointer;
  padding: calc(4px * var(--qx-scale)) 0;
}

summary.set-title::-webkit-details-marker {
  display: none;
}

summary.set-title::after {
  content: "";
  flex-shrink: 0;
  width: calc(8px * var(--qx-scale));
  height: calc(8px * var(--qx-scale));
  margin: 0 calc(6px * var(--qx-scale)) 0 auto;
  border-right: 2px solid var(--qx-meta-color);
  border-bottom: 2px solid var(--qx-meta-color);
  transform: rotate(45deg);
  transition: transform .2s ease;
}

.set-sec[open] > summary.set-title::after {
  transform: rotate(-135deg);
}

summary.set-title:focus-visible {
  outline: 2px solid var(--qx-main-color);
  outline-offset: 2px;
  border-radius: var(--qx-radius);
}

.set-title .ms,
.set-ico {
  display: grid;
  place-items: center;
  flex-shrink: 0;
  width: calc(44px * var(--qx-scale));
  height: calc(44px * var(--qx-scale));
  border-radius: var(--qx-radius-lg);
  background: var(--qx-main-soft);
  color: var(--qx-main-color);
  font-size: calc(24px * var(--qx-scale));
}
.set-ico .ms {
  font-size: 1em;
}

.set-sec > :not(.set-title) ~ * {
  border-top: 1px solid var(--qx-border);
}

.set-row {
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: calc(52px * var(--qx-scale));
  padding: calc(10px * var(--qx-scale)) calc(16px * var(--qx-scale));
  margin: 0 calc(16px * var(--qx-scale)) calc(8px * var(--qx-scale));
  border-radius: var(--qx-radius-lg);
  background: var(--qx-card-bg);
  box-shadow: var(--qx-shadow);
  font-size: var(--qx-fs);
  color: var(--qx-text-color);
  cursor: pointer;
  border: 0;
  transition: transform .12s, box-shadow .15s;
}
.set-row:active {
  transform: scale(.98);
  box-shadow: var(--qx-shadow);
}

label.set-row {
  cursor: pointer;
}

.set-label {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-width: 0;
  gap: 2px;
}

.set-label small {
  color: var(--qx-meta-color);
  font-size: var(--qx-fs-sm);
  line-height: 1.35;
  font-weight: 400;
}

.set-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: calc(10px * var(--qx-scale)) 0 calc(6px * var(--qx-scale));
}

.set-field .set-label {
  flex: none;
  color: var(--qx-meta-color);
  font-size: var(--qx-fs-md);
}
.set-stepper {
  display: flex;
  align-items: stretch;
  flex-shrink: 0;
  overflow: hidden;
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  background: var(--qx-tile-bg);
}

.set-stepper button {
  min-width: calc(48px * var(--qx-scale));
  min-height: calc(42px * var(--qx-scale));
  padding: 0 calc(10px * var(--qx-scale));
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--qx-text-color);
  font-size: var(--qx-fs-lg);
  font-weight: 600;
  cursor: pointer;
  transition: background-color .18s ease, color .18s ease;
}

.set-stepper button + button {
  border-left: 1px solid var(--qx-border);
}

.set-stepper button:hover {
  background: var(--qx-main-soft);
  color: var(--qx-main-color);
}

.set-stepper button:focus-visible {
  outline: 2px solid var(--qx-main-color);
  outline-offset: -2px;
}

.set-switch {
  -webkit-appearance: none;
  appearance: none;
  position: relative;
  flex-shrink: 0;
  width: calc(42px * var(--qx-scale));
  height: calc(26px * var(--qx-scale));
  margin: 0 0 0 auto;
  padding: 0;
  border: 0;
  border-radius: 999px;
  background: var(--qx-border);
  cursor: pointer;
  transition: background-color .22s ease;
}

.set-switch::after {
  content: "";
  position: absolute;
  top: calc(2px * var(--qx-scale));
  left: calc(2px * var(--qx-scale));
  width: calc(22px * var(--qx-scale));
  height: calc(22px * var(--qx-scale));
  border-radius: 50%;
  background: var(--qx-card-bg);
  box-shadow: var(--qx-shadow);
  transition: transform .22s cubic-bezier(.2,.7,.3,1);
}

.set-switch:checked {
  background: var(--qx-main-color);
  border-color: var(--qx-main-color);
}
.set-switch:checked::after {
  transform: translateX(calc(16px * var(--qx-scale)));
}

.set-switch:focus-visible {
  outline: 2px solid var(--qx-main-color);
  outline-offset: 2px;
}
/* [SETTINGS] end */

/* [CLASS btn-*] start */
.btn-danger {
  color: var(--qx-danger);
  border-color: var(--qx-danger);
}

.btn-accent {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-color: var(--qx-main-color);
  font-weight: 600;
}
/* [CLASS btn-*] end */

/* [CLASS help-*] start */
.help-step {
  background: var(--qx-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  padding: calc(10px * var(--qx-scale)) calc(12px * var(--qx-scale));
  margin-bottom: 8px;
  font-size: var(--qx-fs-md);
  line-height: 1.6;
}
/* [CLASS help-*] end */

/* [CONTROLS] start */
.p3-grid input,.p3-grid select {
  margin: 0;
  padding: calc(8px * var(--qx-scale));
  border-radius: var(--qx-radius);
  border: 1px solid var(--qx-border);
  background: var(--qx-bg);
  color: var(--qx-text-color);
  font: inherit;
}
html,body,button,input,select,textarea {
  font-family: var(--qx-font);
}
.set-select {
  display: block;
  width: 100%;
  min-height: calc(48px * var(--qx-scale));
  padding: calc(9px * var(--qx-scale)) calc(12px * var(--qx-scale));
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  background: var(--qx-tile-bg);
  color: var(--qx-text-color);
  font: inherit;
  font-size: var(--qx-fs-lg);
  cursor: pointer;
  transition: border-color .18s ease, box-shadow .18s ease;
}

.set-select:hover {
  border-color: var(--qx-main-color);
}

.set-select:focus-visible {
  outline: none;
  border-color: var(--qx-main-color);
  box-shadow: 0 0 0 3px var(--qx-main-soft);
}

#q {
  display: none;
}

#controls {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(560px, calc(100vw - 32px));
  max-height: min(82vh, 680px);
  overflow-y: auto;
  padding: calc(20px * var(--qx-scale));
  gap: 12px;
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  background: var(--qx-card-bg);
  color: var(--qx-text-color);
  box-shadow: 0 22px 70px rgba(0,0,0,.32), 0 5px 18px rgba(0,0,0,.16);
  z-index: 201;
}

#controls #q {
  display: block;
  width: 100%;
  box-sizing: border-box;
  margin: 0;
  padding: calc(13px * var(--qx-scale)) calc(14px * var(--qx-scale));
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  background: var(--qx-bg);
  color: var(--qx-text-color);
  font: inherit;
  font-size: var(--qx-fs-lg);
}
#transSel {
  display: none;
}
.controls-trans-wrap {
  margin-top: 8px;
}
/* [CONTROLS] end */

/* [MORE-MENU] start */
.g-settings-panel {
  color: var(--qx-text-color);
  text-align: left;
}

#gridDropdown.g-settings-view > :not(.g-settings-panel) {
  display: none;
}
#gridDropdown {
  display: none;
  position: fixed;
  top: calc(62px + env(safe-area-inset-top) + 8px);
  right: 12px;
  left: auto;
  width: min(360px, calc(100vw - 2 * var(--qx-gutter)));
  height: auto;
  max-height: calc(100vh - 80px);
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  z-index: 120;
  background: var(--qx-tile-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  box-shadow: 0 6px 20px rgba(0,0,0,.22);
  padding: calc(8px * var(--qx-scale));
  text-align: left;
  box-sizing: border-box;
}

#gridDropdown.open {
  display: block;
}

.g-menu-item,
.g-quick-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  border: 1px solid var(--qx-border);
  background: var(--qx-tile-bg);
  color: var(--qx-text-color);
  font: inherit;
  font-weight: 400;
  cursor: pointer;
  text-align: left;
  line-height: 1.4;
  gap: 10px;
  transition: background-color .18s ease, border-color .18s ease, color .18s ease, transform .15s ease, box-shadow .18s ease;
}

.g-menu-item {
  margin: 2px 0;
  border: 0;
  background: transparent;
  padding: calc(10px * var(--qx-scale)) calc(12px * var(--qx-scale));
  font-size: var(--qx-fs-lg);
  border-radius: var(--qx-radius-lg);
}

.g-menu-item[data-popup="settings"] {
  border: 0;
  background: transparent;
  border-top: 1px solid var(--qx-border);
  margin-top: 8px;
  padding-top: 12px;
}

.g-menu-item small {
  display: flex;
  align-items: center;
  gap: 2px;
  color: var(--qx-meta-color);
  flex-shrink: 0;
  text-align: right;
  font-size: var(--qx-fs-md);
}

.g-menu-item:hover,
.g-quick-btn:hover {
  background: var(--qx-hover);
  border-color: var(--qx-main-color);
  color: var(--qx-text-color);
  box-shadow: 0 2px 7px rgba(0,0,0,.07);
}

.g-menu-item:active,
.g-quick-btn:active {
  background: var(--qx-border);
  transform: scale(.98);
  box-shadow: none;
}

.g-quick-btn {
  flex: 1 1 30%;
  min-width: 0;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
  padding: 12px 6px;
  font-size: 12px;
  text-align: center;
  border-radius: var(--qx-radius-lg);
  align-items: center;
  font-weight: 500;
  line-height: 1.3;
}

.g-quick-btn .ms {
  width: 28px;
  height: 28px;
  flex: 0 0 28px;
  font-size: 28px;
  line-height: 28px;
}

.g-quick-btn.on {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-color: var(--qx-main-color);
}

.g-quick-btn.on .ms {
  color: var(--qx-on-main);
}

.install-menu-copy {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.install-menu-copy strong {
  font-size: inherit;
  font-weight: 600;
  color: inherit;
  line-height: 1.35;
}

.ayah-menu {
  display: none;

  top: 100%;
  right: 0;

.ayah-menu.open {

.ayah-menu.align-left {

.ayah-menu.open-up {

.ayah .ar.hifz-hide.revealed {

  align-items: center;
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  padding: calc(10px * var(--qx-scale));
  margin: 8px 0;
  font-size: var(--qx-fs-md);
}

.offline-badge2 {
  display: inline-block;
  font-size: var(--qx-fs-xs);
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  padding: 2px calc(8px * var(--qx-scale));
  border-radius: var(--qx-radius-pill);
}
.mid,.audio-info,.dl-txt {
  min-width: 0;
}
/* [DOWNLOAD] end */

/* [CLASS ac-*] start */
.ac-ov {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 120;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.ac-box {
  width: 100%;
  max-width: 560px;
  max-height: 92vh;
  overflow: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  background: var(--qx-bg);
  border-radius: var(--qx-radius-lg) var(--qx-radius-lg) 0 0;
  padding: calc(14px * var(--qx-scale)) calc(14px * var(--qx-scale)) calc(18px + env(safe-area-inset-bottom));
}

.ac-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 700;
  color: var(--qx-main-color);
  margin-bottom: 10px;
}

.ac-head button {
  border: 0;
  background: none;
  font-size: calc(20px * var(--qx-scale));
  cursor: pointer;
  color: var(--qx-meta-color);
}

.ac-canvas {
  width: 100%;
  border-radius: var(--qx-radius-lg);
  display: block;
  background: var(--qx-main-color);
}

.ac-chips {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin: 10px 0;
}

.ac-chip {
  border: 1px solid var(--qx-border);
  background: var(--qx-card-bg);
  color: var(--qx-text-color);
  border-radius: var(--qx-radius-pill);
  padding: calc(7px * var(--qx-scale)) calc(12px * var(--qx-scale));
  font-size: var(--qx-fs-sm);
  font-weight: 600;
  cursor: pointer;
}

.ac-chip.on {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-color: var(--qx-main-color);
}

.ac-row {
  display: flex;
  gap: 8px;
  margin: 8px 0;
}

.ac-row .ac-btn {
  flex: 1;
}

.ac-btn {
  border: 1px solid var(--qx-border);
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-radius: var(--qx-radius-lg);
  padding: calc(11px * var(--qx-scale));
  font-size: var(--qx-fs);
  font-weight: 600;
  cursor: pointer;
}

.ac-btn.ghost {
  background: var(--qx-card-bg);
  color: var(--qx-text-color);
}

.ac-toggle {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: var(--qx-fs-md);
  padding: calc(8px * var(--qx-scale)) 0;
  border-bottom: 1px solid var(--qx-border);
}

.ac-toggle input {
  width: calc(44px * var(--qx-scale));
  height: calc(24px * var(--qx-scale));
  accent-color: var(--qx-main-color);
}
/* [CLASS ac-*] end */

/* [TRACKER] start */
.trk-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: calc(9px * var(--qx-scale)) calc(6px * var(--qx-scale));
  border-bottom: 1px solid var(--qx-border);
  font-size: var(--qx-fs);
  gap: 10px;
  min-height: calc(42px * var(--qx-scale));
}

.trk-row:last-child {
  border-bottom: 0;
}

.trk-row b .ms {
  margin-inline-end: calc(6px * var(--qx-scale));
}

.trk-tick {
  width: calc(32px * var(--qx-scale));
  height: calc(32px * var(--qx-scale));
  border-radius: 50%;
  border: 2px solid var(--qx-border);
  background: var(--qx-card-bg);
  font-size: var(--qx-fs-lg);
  cursor: pointer;
  flex-shrink: 0;
}

.trk-tick.on {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-color: var(--qx-main-color);
}

.trk-dots {
  display: flex;
  gap: 6px;
  margin: 6px 0 2px;
  width: 100%;
  flex-wrap: nowrap;
  overflow-x: auto;
}

.trk-dot {
  width: auto;
  height: calc(30px * var(--qx-scale));
  border-radius: var(--qx-radius-pill);
  border: 1px solid var(--qx-border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--qx-fs-xs);
  background: var(--qx-card-bg);
  flex: 1 1 0;
  min-width: 0;
}

.trk-dot.done {
  background: var(--qx-main-soft);
  border-color: var(--qx-main-color);
  color: var(--qx-main-color);
}

.trk-dot.today {
  box-shadow: 0 0 0 2px var(--qx-main-color);
}
.trk-row:focus-within {
  background: var(--qx-main-soft);
}
.trk-row>div {
  min-width: 0;
  overflow-wrap: anywhere;
}
/* [TRACKER] end */

/* [ASMA-UL-HUSNA] start */
.asma-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 10px 0;
}

.asma-card {
  background: var(--qx-card-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  padding: 12px;
  text-align: center;
  cursor: pointer;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  line-height: 1.6;
}

.asma-card .ar {
  grid-column: 2;
  grid-row: 1;
  font-size: 22px;
  line-height: 1.6;
  color: var(--qx-main-color);
  direction: rtl;
  text-align: right;
}

.asma-card b {
  grid-column: 1;
  grid-row: 1;
  text-align: left;
  display: block;
  font-size: var(--qx-fs);
  line-height: 1.5;
  margin-top: 6px;
  overflow-wrap: anywhere;
}

.asma-card small {
  grid-column: 1;
  grid-row: 2;
  text-align: left;
  display: block;
  color: var(--qx-meta-color);
  font-size: var(--qx-fs-sm);
  line-height: 1.5;
  margin-top: 2px;
  overflow-wrap: anywhere;
}

.asma-card .trk-mini {
  grid-column: 2;
  grid-row: 2;
}

.asma-card.fav {
  border-color: var(--qx-main-color);
  box-shadow: 0 0 0 1px var(--qx-main-color);
}

.asma-search {
  width: 100%;
  padding: calc(11px * var(--qx-scale));
  border-radius: var(--qx-radius-lg);
  border: 1px solid var(--qx-border);
  background: var(--qx-card-bg);
  color: var(--qx-text-color);
  font: inherit;
  margin: 8px 0;
}

.asma-top {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-radius: var(--qx-radius-lg);
  padding: 14px;
  text-align: center;
  margin: 8px 0;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 6px;
  line-height: 1.6;
}

.asma-top .ar {
  font-size: calc(38px * var(--qx-scale));
  line-height: 1.6;
}
.qx-nm {
  padding-top: 12px;
}
/* [ASMA-UL-HUSNA] end */

/* [TAJWEED] start */
.tj-ghunnah {
  color: var(--qx-tj-ghunnah);
  font-weight: 700;
}

.tj-qalqalah {
  color: var(--qx-tj-qalqalah);
  font-weight: 700;
}

.tj-ikhfa {
  color: var(--qx-tj-ikhfa);
  font-weight: 700;
}

.tj-idgham {
  color: var(--qx-tj-idgham);
  font-weight: 700;
}

.tj-iqlab {
  color: var(--qx-tj-iqlab);
  font-weight: 700;
}

.tj-madd {
  color: var(--qx-tj-madd);
  font-weight: 700;
}

.tj-lam {
  color: var(--qx-tj-lam);
  font-weight: 700;
}

#tajweedLegend {
  display: none;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  background: var(--qx-card-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  padding: calc(8px * var(--qx-scale)) calc(10px * var(--qx-scale));
  margin: 8px 0;
  font-size: var(--qx-fs-xs);
}

#tajweedLegend.show {
  display: flex;
}

.tj-dot {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  vertical-align: middle;
  margin-right: 4px;
}

#tajweedToggle.on {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-color: var(--qx-main-color);
}
/* [TAJWEED] end */

/* [WORD-BY-WORD] start */
.ar,.ayah .ar,.ar-name,.bism,.aotd-ar,.asma-card .ar,.asma-top .ar,.ww-sheet .ww-ar,.hadith-item .ar,.surah-item .ar-name {
  font-family: var(--qx-font-arabic), "Noto Naskh Arabic", serif;
}
.ww-word {
  cursor: pointer;
  border-radius: var(--qx-radius);
  padding: 0 2px;
}

.ww-word:hover {
  background: color-mix(in srgb, var(--qx-main-color) 18%, transparent);
}

body.ww-on .ayah .ar .ww-word {
  border-bottom: 2px dotted var(--qx-main-color);
}

.ww-sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 140;
  background: var(--qx-card-bg);
  border-top: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg) var(--qx-radius-lg) 0 0;
  padding: calc(14px * var(--qx-scale)) calc(16px * var(--qx-scale)) calc(18px + env(safe-area-inset-bottom));
  box-shadow: 0 -10px 30px rgba(0,0,0,.25);
  max-height: 55vh;
  overflow: auto;
}

.ww-sheet .ww-ar {
  font-size: calc(44px * var(--qx-scale));
  line-height: 1.6;
  direction: rtl;
  text-align: center;
  color: var(--qx-main-color);
}

.ww-close {
  float: right;
  border: 0;
  background: none;
  font-size: calc(20px * var(--qx-scale));
  cursor: pointer;
  color: var(--qx-meta-color);
}

#wwToggle.on {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-color: var(--qx-main-color);
}

.ww-bar {
  display: none;
  gap: 8px;
  align-items: center;
  background: var(--qx-card-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  padding: calc(8px * var(--qx-scale)) calc(10px * var(--qx-scale));
  margin: 8px 0;
  font-size: var(--qx-fs-sm);
  color: var(--qx-meta-color);
}

.ww-bar.show {
  display: flex;
}
/* [WORD-BY-WORD] end */

/* [HIJRI-CALENDAR] start */
.hijri-top {
  background: linear-gradient(135deg,var(--qx-c-teal),var(--qx-c-teal-deep));
  color: var(--qx-on-teal);
  border-radius: var(--qx-radius-lg);
  padding: calc(16px * var(--qx-scale)) calc(12px * var(--qx-scale));
  text-align: center;
  margin: 8px 0;
}

.hijri-top .big {
  font-size: calc(26px * var(--qx-scale));
  font-weight: 700;
}

.hijri-cal {
  display: grid;
  grid-template-columns: repeat(7,1fr);
  gap: 4px;
  margin: 10px 0;
}

.hijri-day {
  background: var(--qx-card-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius);
  padding: calc(6px * var(--qx-scale)) 2px;
  text-align: center;
  font-size: var(--qx-fs-xs);
  min-height: calc(40px * var(--qx-scale));
  transition: background .18s ease,border-color .18s ease,transform .15s ease;
}

.hijri-day.today {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-color: var(--qx-main-color);
}

.hijri-day.event {
  border-color: var(--qx-event);
  box-shadow: inset 0 0 0 1px var(--qx-event);
  background: color-mix(in srgb,var(--qx-event) 16%,var(--qx-card-bg));
  cursor: pointer;
}

.hijri-day:hover {
  background: var(--qx-hover);
  border-color: var(--qx-main-color);
  transform: translateY(-2px);
}

.hijri-day.today:hover {
  background: var(--qx-main-color);
}

.hijri-day .hnum {
  font-weight: 700;
  font-size: var(--qx-fs-md);
}

.hijri-event {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  padding: calc(10px * var(--qx-scale));
  margin: 8px 0;
  background: var(--qx-card-bg);
  font-size: var(--qx-fs-md);
}

.hijri-event.next {
  border-color: var(--qx-main-color);
  box-shadow: 0 0 0 1px var(--qx-main-color);
}

.hijri-upcoming {
  gap: 14px;
  padding: calc(16px * var(--qx-scale)) calc(16px * var(--qx-scale));
  cursor: pointer;
}

.hijri-upcoming .he-main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.hijri-upcoming .he-name {
  font-size: var(--qx-fs-xl);
  line-height: 1.3;
  font-weight: 700;
}

.hijri-upcoming .trk-mini {
  font-size: var(--qx-fs-sm);
  line-height: 1.4;
}
.hijri-event.next .he-date-en {
  color: var(--qx-meta-color);
}

.hijri-upcoming .he-side {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
/* [HIJRI-CALENDAR] end */

/* [CLASS he-*] start */
.he-date-en {
  display: inline-block;
  font-size: var(--qx-fs-sm);
  color: var(--qx-meta-color);
  background: color-mix(in srgb, var(--qx-meta-color) 16%, transparent);
  padding: 3px calc(10px * var(--qx-scale));
  border-radius: var(--qx-radius);
  margin-top: 2px;
  letter-spacing: .1px;
  line-height: 1.35;
  align-self: flex-start;
}
.he-ring {
  position: relative;
  width: calc(62px * var(--qx-scale));
  height: calc(62px * var(--qx-scale));
}

.he-ring svg {
  display: block;
  width: 100%;
  height: 100%;
}

.he-ring circle {
  fill: none;
  stroke-width: 4;
}

.he-ring .he-track {
  stroke: var(--qx-border);
}

.he-ring .he-arc {
  stroke: var(--qx-main-color);
  stroke-linecap: round;
}

.he-ring .he-days {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  line-height: 1.1;
  font-size: var(--qx-fs-xs);
  font-weight: 700;
  color: var(--qx-main-color);
}

.he-ring .he-days b {
  font-size: var(--qx-fs-lg);
}

.he-ring .he-days small {
  font-size: calc(8px * var(--qx-scale));
  font-weight: 400;
  color: var(--qx-meta-color);
}

.he-ic {
  display: flex;
  align-items: center;
  justify-content: center;
  width: calc(38px * var(--qx-scale));
  height: calc(38px * var(--qx-scale));
  border-radius: var(--qx-radius-lg);
  background: color-mix(in srgb,var(--qx-main-color) 12%,transparent);
}

.he-ic .ms {
  font-size: calc(22px * var(--qx-scale));
  color: var(--qx-main-color);
}
/* [CLASS he-*] end */

/* [PWA-INSTALL] start */
#pwaBanner {
  display: none;
  gap: 8px;
  align-items: center;
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-radius: var(--qx-radius-lg);
  padding: calc(10px * var(--qx-scale)) calc(12px * var(--qx-scale));
  margin: 8px 0;
  font-size: var(--qx-fs-md);
}

#pwaBanner.show {
  display: flex;
}

#pwaBanner button {
  border: 0;
  border-radius: var(--qx-radius);
  padding: calc(8px * var(--qx-scale)) calc(12px * var(--qx-scale));
  font-weight: 700;
  cursor: pointer;
  background: var(--qx-on-teal);
  color: var(--qx-main-color);
}

#pwaBanner .x {
  background: none;
  color: var(--qx-on-main);
  font-size: var(--qx-fs-lg);
  padding: calc(4px * var(--qx-scale));
}
/* [PWA-INSTALL] end */

/* [HADITH] start */
.hadith-pkg {
  background: var(--qx-card-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  cursor: pointer;
}

.hadith-pkg h3 {
  margin: 0;
  color: var(--qx-main-color);
}

.hadith-pkg .sub {
  font-size: var(--qx-fs-sm);
  color: var(--qx-meta-color);
}

.hadith-item {
  background: var(--qx-card-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  cursor: pointer;
  position: relative;
}

.hadith-item .ar {
  font-size: calc(22px * var(--qx-scale));
  direction: rtl;
  text-align: right;
  color: var(--qx-main-color);
}

.hadith-item b {
  font-size: var(--qx-fs);
}

.hadith-item .ref {
  font-size: var(--qx-fs-xs);
  color: var(--qx-meta-color);
  padding-right: 48px;
}

.hadith-item.done {
  border-color: var(--qx-main-color);
}
.hadith-item .qx-star {
  position: absolute;
  right: 8px;
  bottom: 8px;
}
/* [HADITH] end */

/* [TOPICS] start */
.qx-topic-sort {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 6px;
}

.surah-list-heading:has(.qx-topic-sort) {
  flex-wrap: nowrap;
  gap: 8px;
  justify-content: flex-start;
}

.surah-list-heading:has(.qx-topic-sort) span {
  flex: 0 0 auto;
}

.surah-list-heading:has(.qx-topic-sort) .qx-view-toggle {
  flex: 0 0 auto;
}
/* [TOPICS] end */

/* [BACK-LINK] start */
.qx-back-link {
  display: inline-block;
  min-height: 0;
  margin: 0 0 10px;
  padding: calc(6px * var(--qx-scale)) calc(4px * var(--qx-scale));
  border: none;
  background: none;
  color: var(--qx-main-color);
  font-weight: 600;
  cursor: pointer;
}
/* [BACK-LINK] end */

/* [AYAH-CARD] start */
.surah-item .num {
  flex: 0 0 36px;
  font-variant-numeric: tabular-nums;
}

.surah-item .mid {
  min-width: 0;
}

.surah-item .mid b {
  font-size: var(--qx-fs-lg);
  line-height: 1.35;
}

.surah-item .mid small {
  display: block;
  margin-top: 3px;
  line-height: 1.45;
  font-size: var(--qx-fs-sm);
}

.surah-item .ar-name {
  flex: 0 0 auto;
  max-width: 34%;
  overflow-wrap: anywhere;
  text-align: right;
  font-size: calc(22px * var(--qx-scale));
  line-height: 1.5;
  white-space: nowrap;
}

body.inside-page .ayah .ar {
  max-width: 100%;
}

body.inside-page .ayah .bn {
  max-width: 78ch;
}

body.inside-page .ayah .icon-btn:focus-visible, body.inside-page .ayah .star:focus-visible, body.inside-page .ayah .more-btn:focus-visible {
  outline: 2px solid var(--qx-main-color);
  outline-offset: 2px;
}
.mid b,.mid small {
  overflow-wrap: anywhere;
}
.ayah .ar, .ar-name {
  direction: rtl;
  unicode-bidi: isolate;
  line-height: 2.1;
}
.surah-grid:not(.is-list) .surah-item .num {
  order: 1;
  flex: 0 0 32px;
  min-width: calc(32px * var(--qx-scale));
  height: calc(32px * var(--qx-scale));
  font-size: var(--qx-fs-sm);
}

.surah-grid:not(.is-list) .surah-item .ar-name {
  order: 2;
  margin-left: auto;
  max-width: none;
  font-size: var(--qx-fs-xl);
}

.surah-grid:not(.is-list) .surah-item .mid {
  order: 3;
  flex: 1 1 100%;
}
.surah-grid.is-list .surah-item .num {
  flex: 0 0 36px;
  min-width: calc(36px * var(--qx-scale));
  height: calc(36px * var(--qx-scale));
  font-size: var(--qx-fs-sm);
}

.surah-grid.is-list .surah-item .mid {
  flex: 1 1 auto;
  min-width: 0;
}

.surah-grid.is-list .surah-item .ar-name {

.aotd-ref {

.aotd-bn {

.ayah .bn,.aotd-bn {

}
.aotd-card, .goal-bar, .resume {

}
.sheet-box .aotd-card {

}
.ayah .bn,.aotd-bn,.tafseer-body,.note-box {

/* [AYAH-OF-THE-DAY] end */

/* [FOOTER-MENU] start */
nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  gap: 0;
  background: none;
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 6;
  transition: transform .25s ease;
  justify-content: center;
  padding-left: 0;
  padding-right: 0;
  --qx-notch-r: calc(12px * var(--qx-scale) + 12px);
  --qx-notch-cy: calc(12px * var(--qx-scale) - 6px);
  border: 0;
  box-shadow: none;
}

nav button {
  flex: 1 1 0;
  min-width: 0;
  border: 0;
  border-radius: 0;
  background: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  font-size: var(--qx-fs-xs);
  color: var(--qx-nav-color);
  text-align: center;
}

nav button b {
  font-size: calc(20px * var(--qx-scale));
  font-weight: 400;
  width: calc(24px * var(--qx-scale));
  height: calc(24px * var(--qx-scale));
  display: grid;
  place-items: center;
  line-height: 1;
  flex-shrink: 0;
}

nav button span {
  font-size: var(--qx-fs-xs);
  line-height: 1.15;
  white-space: normal;
  text-align: center;
  display: block;
  max-width: 100%;
}

nav button .ms {
  font-size: calc(20px * var(--qx-scale));
  line-height: 1;
}
nav button.on {
  color: var(--qx-main-color);
  font-weight: 600;
}
nav button[data-m="quran"] b {
  position: relative;
  transform: translateY(-12px);
  margin-bottom: 0;
}

nav button[data-m="quran"] b::before {
  content: "";
  position: absolute;
  inset: -7px;
  border-radius: 50%;
  background: var(--qx-card-bg);
  border: 1px solid var(--qx-border);
  box-shadow: var(--qx-shadow);
  z-index: -1;
}

nav button[data-m="quran"].on b {
  color: var(--qx-on-main);
}

nav button[data-m="quran"].on b::before {
  background: var(--qx-main-color);
  border-color: var(--qx-main-color);
}

nav button[data-m="quran"] span {
  margin-top: 0;
}
body.bars-hidden nav {
  transform: translateY(calc(100% + 32px));
}
.ms.f,nav button.on .ms,button:active .ms,.g-menu-item:active .ms {
  font-variation-settings: 'FILL' 1;
}
nav button.on .dua-ic {
  stroke-width: 1.7;
}
html body .ms.qi.f::before,
html body nav button.on .ms.qi::before,
html body button:active .ms.qi::before,
html body .g-menu-item:active .ms.qi::before {
  content: var(--qi-s);
}
nav::before,
nav::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
}

nav::before {
  background: var(--qx-card-bg);
  border-top: 1px solid var(--qx-border);
  -webkit-mask-image: radial-gradient(circle at 50% var(--qx-notch-cy), transparent var(--qx-notch-r), #000 calc(var(--qx-notch-r) + .5px));
  mask-image: radial-gradient(circle at 50% var(--qx-notch-cy), transparent var(--qx-notch-r), #000 calc(var(--qx-notch-r) + .5px));
}

nav::after {
  background: radial-gradient(circle at 50% var(--qx-notch-cy),
    transparent calc(var(--qx-notch-r) - .5px),
    var(--qx-border) var(--qx-notch-r),
    var(--qx-border) calc(var(--qx-notch-r) + 1px),
    transparent calc(var(--qx-notch-r) + 1.5px));
}
nav button b .ms {
  margin: 0;
}
/* [FOOTER-MENU] end */

/* [SURAH-LIST] start */
.surah-list-heading {

}

.surah-list-heading span {

}

}

.surah-item:focus-visible {

}

.surah-meta .surah-meaning {

.surah-grid {

.surah-grid .surah-item {

}

.surah-grid:not(.is-list) .surah-item {

}
.surah-grid.is-list {

}

.surah-grid.is-list .surah-item {

}
.surah-grid:not(.is-list) .surah-item {

}
.surah-grid.is-list .surah-item {

/* [HOME-PAGE] start */
.home-hero {
  display: flex;
  overflow: hidden;
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  background: var(--qx-card-bg);
  margin: 10px 0 12px;
  flex-direction: column;
}

.home-hero-left {
  flex: 1;
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  padding: calc(14px * var(--qx-scale));
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
}

.home-hero-left .play {
  font-size: calc(22px * var(--qx-scale));
}

.home-hero-left .lbl {
  font-size: var(--qx-fs-md);
  opacity: .9;
}

.home-hero-left .val {
  font-size: var(--qx-fs-lg);
  font-weight: 700;
  line-height: 1.3;
}

.home-hero-right {
  flex: 1;
  padding: calc(14px * var(--qx-scale));
  cursor: pointer;
}

.home-hero-right .top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: var(--qx-fs-md);
  color: var(--qx-main-color);
}

.home-hero-right .val {
  font-size: var(--qx-fs-lg);
  font-weight: 700;
  color: var(--qx-text-color);
  margin: 6px 0 8px;
}

.home-hero-right .track {
  height: 6px;
  background: var(--qx-border);
  border-radius: var(--qx-radius-pill);
  overflow: hidden;
}

.home-hero-right .fill {
  height: 100%;
  background: var(--qx-main-color);
  border-radius: var(--qx-radius-pill);
}
.home-tiles {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));

  margin: 12px auto 18px;

  width: 100%;
}

.home-tile {
  min-width: 0;
  min-height: 76px;
  display: grid;
  grid-template-columns: auto minmax(0,1fr);
  align-items: center;
  gap: 6px;
  padding: calc(8px * var(--qx-scale)) calc(12px * var(--qx-scale));
  text-align: left;
  background: var(--qx-card-bg);
  border: 1px solid color-mix(in srgb,var(--qx-main-color) 35%,var(--qx-border));
  border-radius: var(--qx-radius-lg);
  cursor: pointer;
  box-shadow: var(--qx-shadow);
  transition: background 0.22s ease,transform 0.18s ease,box-shadow 0.22s ease,border-color 0.22s ease;
}

.home-tile:hover {
  background: var(--qx-hover);
  border-color: var(--qx-main-color);
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
  transform: translateY(-2px);
}

.home-tile:active {
  border-color: var(--qx-main-color);
  transform: translateY(0) scale(.985);
}
.home-tile .t-ic {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: var(--qx-radius-lg);
  background: color-mix(in srgb,var(--qx-main-color) 12%,transparent);
  line-height: 1;
  color: var(--qx-main-color);
}

.home-tile .t-ic .ms {
  font-size: 22px;
  line-height: 1;
  transition: transform 0.2s ease;
}

.home-tile:hover .t-ic .ms {
  transform: scale(1.08);
}

.home-tile .tile-copy {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 3px;
  min-width: 0;
}

.home-tile .tile-copy b {
  font-size: var(--qx-fs-sm);
  color: var(--qx-meta-color);
  font-weight: 600;
}

.home-tile .tile-copy strong {

  line-height: 1.35;
  color: var(--qx-text-color);

  text-overflow: ellipsis;
  white-space: nowrap;
}

.home-tile .tile-copy small {
  font-size: var(--qx-fs-xs);
  color: var(--qx-meta-color);
  line-height: 1.35;
}
.home-browse-nav {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  padding: 3px 1px calc(10px * var(--qx-scale));
  margin: 2px 0 10px;

  -webkit-overflow-scrolling: touch;
}

.home-browse-nav button {
  flex: 0 0 auto;
  min-height: calc(38px * var(--qx-scale));
  padding: calc(8px * var(--qx-scale)) calc(15px * var(--qx-scale));

  border-radius: var(--qx-radius-pill);
  background: var(--qx-card-bg);
  color: var(--qx-text-color);
  font: inherit;
  font-size: var(--qx-fs-md);
  font-weight: 600;
  cursor: pointer;
}

.home-browse-nav button.on {
  background: var(--qx-main-color);
  border-color: var(--qx-main-color);
  color: var(--qx-on-main);
}

.home-browse-nav.is-sticky {

  top: var(--qx-hdr-h,62px);

  border-bottom: 1px solid var(--qx-border);
  transition: transform .25s ease;
}

body.bars-hidden .home-browse-nav.is-sticky {
  transform: translateY(calc(-100% - var(--qx-hdr-h,62px)));
}

.home-browse-heading {

}

.home-browse-heading h2 {
  font-size: var(--qx-fs-xl);
  line-height: 1.4;
  margin: 0 0 4px;
}

.home-browse-heading p {
  font-size: var(--qx-fs-md);
  color: var(--qx-meta-color);

.hijri-info-date {

/* [EMPTY-STATE] start */
.qx-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: var(--qx-pad-xl);
  text-align: center;
}

.qx-empty b {
  font-size: var(--qx-fs);
}

.qx-empty small {
  font-size: var(--qx-fs-sm);
  color: var(--qx-meta-color);
}
/* [EMPTY-STATE] end */

/* [CLASS qx-gh-*] start */
.qx-gh {
  margin: 18px 2px 6px;
  font-size: var(--qx-fs);
  font-weight: 700;
  color: var(--qx-main-color);
}
/* [CLASS qx-gh-*] end */

/* [CLASS qx-sn-*] start */
.qx-sn {
  font-size: var(--qx-fs-md);
  margin: 4px 0;
}
/* [CLASS qx-sn-*] end */

/* [SAVED] start */
.qx-saved {
  margin: 8px 0;
}

.qx-saved .ayah .star,.qx-saved .ayah .read-btn {
  display: none;
}

.qx-saved .hadith-item {
  cursor: default;
  margin: 0;
}
.qx-saved-act,.qx-fbar {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  padding: 2px 2px 0;
}

.qx-fbar {
  margin: 10px 0 0;
}
/* [SAVED] end */

/* [UI-KIT] start */
.qx-seg {
  display: flex;
  gap: 4px;
  padding: calc(4px * var(--qx-scale));
  margin: 12px 0;
  background: var(--qx-tile-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius);
}

.qx-seg button {
  border: 0;
  flex: 1;
  padding: calc(9px * var(--qx-scale)) calc(6px * var(--qx-scale));
  border-radius: var(--qx-radius);
  background: none;
  color: var(--qx-text-color);
  font-size: var(--qx-fs);
  font-weight: 600;
  cursor: pointer;
}

.qx-seg button.on {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
}
.qx-link {
  border: 0;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: calc(8px * var(--qx-scale)) 2px;
  background: none;
  color: var(--qx-main-color);
  font-size: var(--qx-fs-sm);
  font-weight: 600;
  cursor: pointer;
}

.qx-link.danger {
  color: var(--qx-danger);
}

.qx-btn {
  border: 0;
  display: block;
  width: 100%;
  margin: 12px 0 0;
  padding: calc(16px * var(--qx-scale)) calc(20px * var(--qx-scale));
  border-radius: var(--qx-radius);
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  font-size: var(--qx-fs);
  font-weight: 700;
  cursor: pointer;
}

.qx-btn.danger {
  background: var(--qx-danger);
  color: var(--qx-c-white);
}

.qx-btn.ghost {
  background: var(--qx-tile-bg);
  color: var(--qx-text-color);
  border: 1px solid var(--qx-border);
}

.qx-input {
  width: 100%;
  padding: var(--qx-pad-item);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius);
  background: var(--qx-bg);
  color: var(--qx-text-color);
  font-size: var(--qx-fs);
}
/* [UI-KIT] end */

/* [PAGE-TOOLS] start */
.qx-sec-page {
  max-width: 900px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.qx-sec-page .item {
  margin: 0;
  border-radius: var(--qx-radius-lg);
}

.ayah.qx-sec-card {
  margin: 0;
  padding: calc(14px * var(--qx-scale)) calc(16px * var(--qx-scale));
  box-shadow: none;
}

.ayah.qx-sec-card .no {
  margin-bottom: 0;
  padding-bottom: 0;
  border-bottom: none;
}

.ayah.qx-sec-card .bn {
  margin-top: 8px;
  padding-top: 0;
  border-top: none;
}

.ayah.qx-sec-card .qx-sec-head {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  align-items: center;
  cursor: pointer;
}

.ayah.qx-sec-card .qx-sec-head .qx-num-badge,
.ayah.qx-sec-card .qx-sec-head .qx-tri-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: calc(32px * var(--qx-scale));
  height: calc(32px * var(--qx-scale));
  border-radius: 50%;
  background: var(--qx-badge-bg);
  color: var(--qx-main-color);
  font-weight: 700;
  font-size: var(--qx-fs-md);
}

.ayah.qx-sec-card .qx-sec-head .qx-sec-title {
  border: none;
  background: none;
  color: var(--qx-main-color);
  padding: 0;
  font-size: var(--qx-fs-xl);
  font-weight: 700;
  min-height: 0;
  flex: 1;
  text-align: left;
}

.ayah.qx-sec-card .qx-sec-left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
  min-width: 0;
}

.ayah.qx-sec-card .qx-sec-body {
  display: none;
}

.ayah.qx-sec-card.open .qx-sec-body {
  display: block;
}
/* [PAGE-TOOLS] end */

/* [ASMA-UL-HUSNA] start */
.qx-nm .qx-nm-ic {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  line-height: 0;
}

.qx-nm .surah-grid .surah-item {
  min-height: calc(76px * var(--qx-scale));
  padding: calc(14px * var(--qx-scale)) calc(14px * var(--qx-scale));
}

.qx-nm .qx-nm-chev {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: calc(32px * var(--qx-scale));
  height: calc(32px * var(--qx-scale));
  flex: 0 0 32px;
  border-radius: 50%;
  background: var(--qx-icon-bg);
  color: var(--qx-icon-color);
  transition: transform .15s ease, background .15s ease;
}

.qx-nm .qx-nm-chev:active {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
}

.qx-nm .item:hover .qx-nm-chev {
  transform: translateX(2px);
  background: var(--qx-main-color);
  color: var(--qx-on-main);
}

.qx-nm .qx-nm-back, .qx-nm .qx-nm-prev, .qx-nm .qx-nm-next {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: calc(40px * var(--qx-scale));
  padding: 0 calc(14px * var(--qx-scale)) 0 calc(10px * var(--qx-scale));
  border-radius: var(--qx-radius-pill);
  font-weight: 600;
  font-size: var(--qx-fs-md);
  cursor: pointer;
  background: var(--qx-icon-bg);
  color: var(--qx-icon-color);
  border: 1px solid transparent;
}

.qx-nm .qx-nm-back:active, .qx-nm .qx-nm-prev:active, .qx-nm .qx-nm-next:active {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
}

.qx-nm .qx-nm-back {
  margin-bottom: 12px;
}

.qx-nm .qx-nm-next {
  padding: 0 calc(10px * var(--qx-scale)) 0 calc(14px * var(--qx-scale));
  background: var(--qx-main-color);
  color: var(--qx-on-main);
}

.qx-nm .qx-nm-nav {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 16px;
}

.qx-nm .qx-nm-nav .qx-nm-lbl {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 36vw;
}

.qx-nm .qx-nm-src {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed var(--qx-border);
}

.qx-nm .qx-nm-src-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: calc(30px * var(--qx-scale));
  padding: 0 calc(12px * var(--qx-scale)) 0 calc(9px * var(--qx-scale));
  border-radius: var(--qx-radius-pill);
  background: var(--qx-card-bg);
  border: 1px solid var(--qx-border);
  color: var(--qx-main-color);
  font-size: var(--qx-fs-md);
}

.qx-nm .qx-nm-src-chip b {
  font-weight: 600;
  color: var(--qx-text-color);
}

.qx-nm .qx-nm-src-chip svg {
  width: calc(15px * var(--qx-scale));
  height: calc(15px * var(--qx-scale));
}

.qx-nm .qx-nm-src-no {
  padding-left: 8px;
  margin-left: 2px;
  border-left: 1px solid var(--qx-border);
  color: var(--qx-meta-color);
  font-weight: 600;
}

.qx-nm .qx-nm-grade {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: calc(30px * var(--qx-scale));
  padding: 0 calc(12px * var(--qx-scale)) 0 calc(8px * var(--qx-scale));
  border-radius: var(--qx-radius-pill);
  background: color-mix(in srgb, var(--qx-success) 14%, transparent);
  color: var(--qx-success);
  font-size: var(--qx-fs-md);
  font-weight: 700;
}

.qx-nm .qx-nm-grade svg {
  width: calc(15px * var(--qx-scale));
  height: calc(15px * var(--qx-scale));
}
/* [ASMA-UL-HUSNA] end */

/* [KHATAM] start */
.khatam-dot.part {
  background: color-mix(in srgb, var(--qx-main-color) 30%, var(--qx-card-bg));
  border-color: var(--qx-main-color);
}

.khatam-dot.miss {
  border-color: var(--qx-danger);
  color: var(--qx-danger);
}

.khatam-dot.ticked {
  font-weight: 700;
}

.khatam-dot.ticked::after {
  content: "\2713";
  position: absolute;
  top: -6px;
  right: -5px;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: calc(9px * var(--qx-scale));
  line-height: 1;
  background: var(--qx-card-bg);
  color: var(--qx-main-color);
  border: 1px solid var(--qx-main-color);
}

.khatam-dot:focus-visible {
  outline: 2px solid var(--qx-main-color);
  outline-offset: 2px;
}
/* [KHATAM] end */

/* [HOME-PAGE] start */
.home-section-title {
  margin: 14px 2px 8px;
  color: var(--qx-text-color);
  font-size: var(--qx-fs-lg);
  font-weight: 700;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.home-quick-actions {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 7px;
  margin: 0 auto 14px;
  width: 100%;
}

.home-quick-btn {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: calc(9px * var(--qx-scale)) calc(10px * var(--qx-scale));
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius);
  background: var(--qx-card-bg);
  color: var(--qx-text-color);
  text-align: left;
  cursor: pointer;
}

.home-quick-btn>.ms:first-child {
  display: grid;
  place-items: center;
  flex: 0 0 28px;
  width: 28px;
  height: 28px;
  border-radius: var(--qx-radius);
  color: var(--qx-icon-color);
  background: var(--qx-icon-bg);
  font-size: 20px;
}

.home-quick-btn:active>.ms:first-child {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
}

.home-quick-copy {
  display: flex;
  flex-direction: column;
  min-width: 0;
  gap: 2px;
}

.home-quick-copy b {
  font-size: var(--qx-fs-sm);
  font-weight: 700;
}

.home-quick-copy small {
  color: var(--qx-meta-color);
  font-size: var(--qx-fs-xs);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.home-quick-go {
  margin-left: auto;
  color: var(--qx-meta-color);
  font-size: calc(18px * var(--qx-scale));
}

.home-category-grid {
  margin-top: 0;
}

.home-category-grid .home-tile {
  min-height: calc(68px * var(--qx-scale));
}

.home-category-grid .t-ic {
  width: 28px;
  height: 28px;
  border-radius: var(--qx-radius);
}

.home-category-grid .t-ic .ms {
  font-size: 20px;
}
/* [HOME-PAGE] end */

/* [BASE] start */
html.theme-switching *,html.theme-switching *::before,html.theme-switching *::after {
  transition: none;
}
#app:focus {
  outline: none;
}
html.icons-pending .ms {
  visibility: hidden;
}

body.no-icon-font .ms {
  font-family: var(--qx-font), sans-serif;
  font-size: 0;
  width: calc(20px * var(--qx-scale));
  height: calc(20px * var(--qx-scale));
  display: inline-flex;
  align-items: center;
  justify-content: center;
  overflow: visible;
  vertical-align: middle;
  font-variation-settings: normal;
}

body.no-icon-font .ms::before {
  content: attr(data-g);
  font-size: calc(17px * var(--qx-scale));
  line-height: 1;
  font-style: normal;
  font-weight: 400;
  text-align: center;
}
html body .ms.qi::before {
  content: var(--qi-o);
  font-family: 'QXIslamic';
  font-style: normal;
  font-weight: 400;
  font-size: 1em;
  line-height: 1;
  display: block;
  text-align: center;
  text-transform: none;
  letter-spacing: normal;
  font-variation-settings: normal;
}
body.no-icon-font .ms.qi {
  font-size: 1.25em;
  width: 1em;
  height: auto;
  display: inline-block;
  overflow: hidden;
  vertical-align: -.22em;
}
/* [BASE] end */

/* [HEADER] start */
.app-logo {
  width: calc(32px * var(--qx-scale));
  height: calc(32px * var(--qx-scale));
  border-radius: var(--qx-radius);
  flex-shrink: 0;
  display: block;
  cursor: pointer;
  transition: transform 0.2s ease;
}

body.inside-page .app-logo {
  display: none;
}
.app-logo:hover {
  transform: scale(1.05);
}

.app-logo:active {
  transform: scale(0.92);
}
body:not(.inside-page) #title {
  cursor: pointer;
}
.back-btn-hidden {
  display: none;
}
#widthToggle {
  display: none;
  margin-right: 6px;
}

#widthToggle .wt-narrow {
  display: none;
}

body.read-wide #widthToggle .wt-wide {
  display: none;
}

body.read-wide #widthToggle .wt-narrow {
  display: block;
}

#widthToggle[aria-pressed="true"] {
  color: var(--qx-main-color);
  border-color: var(--qx-main-color);
}
.header-btn,
#back {
  width: calc(42px * var(--qx-scale));
  height: calc(42px * var(--qx-scale));
  min-width: calc(42px * var(--qx-scale));
  min-height: calc(42px * var(--qx-scale));
  padding: 0;
  border: 1px solid color-mix(in srgb, var(--qx-border) 50%, transparent);
  border-radius: var(--qx-radius-lg);
  background: var(--qx-tile-bg);
  color: var(--qx-text-color);
}

#back:not(.back-btn-hidden) {
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.header-btn .ms,
#back .ms {
  font-size: calc(24px * var(--qx-scale));
  line-height: 1;
  vertical-align: 0;
}

.header-btn svg {
  width: calc(22px * var(--qx-scale));
  height: calc(22px * var(--qx-scale));
}

.header-btn:hover,
#back:hover {
  border-color: var(--qx-main-color);
  color: var(--qx-main-color);
}
#gridPopupBox .pp-header {
  min-height: calc(44px * var(--qx-scale));
  margin-bottom: 14px;
}

.p3-header h3, .prayer-edu-header h3 {
  text-align: left;
  flex: 1;
  margin: 0;
}
.p3-header, .prayer-edu-header, .prayer-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
}

.p3-header .grid-icon-btn, .prayer-edu-header .grid-icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--qx-border);
  background: var(--qx-card-bg);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
/* [HEADER] end */

/* [SURAH-LIST] start */
.surah-meta .surah-revelation,
.surah-meta .surah-ayah-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: calc(26px * var(--qx-scale));
  padding: 0 calc(10px * var(--qx-scale));
  border: 0;
  border-radius: var(--qx-radius-pill);
  background: var(--qx-tile-bg);
  color: var(--qx-main-color);
  font-size: var(--qx-fs-sm);
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
}

html:not([data-theme="dark"]):not([data-hc]) .surah-meta .surah-revelation,
html:not([data-theme="dark"]):not([data-hc]) .surah-meta .surah-ayah-count {
  background: var(--qx-tag-bg);
  color: var(--qx-tag-text);
  border-color: transparent;
}
/* [SURAH-LIST] end */

/* [LIST-VIEW-ROWS] start */
.qx-view-btn,
.qx-view-btn.on {
  width: calc(40px * var(--qx-scale));
  height: calc(40px * var(--qx-scale));
  background: var(--qx-tile-bg);
  border: 1px solid var(--qx-border);
  color: var(--qx-main-color);
}
.qx-view-btn.on {
  border-color: var(--qx-main-color);
  background: var(--qx-hover);
}

.qx-view-btn .ms {
  font-size: calc(22px * var(--qx-scale));
  font-variation-settings: 'FILL' 1;
}

.qx-view-btn:hover {
  border-color: var(--qx-main-color);
  background: var(--qx-hover);
}
/* [LIST-VIEW-ROWS] end */

/* [DUA] start */
.dua-ic {
  width: calc(22px * var(--qx-scale));
  height: calc(22px * var(--qx-scale));
  display: block;
  margin: auto;
}
.qx-dua-act {
  display: flex;
  justify-content: flex-end;
  gap: 6px;
  margin-top: 8px;
}
.qx-dua-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px 8px;
  margin-top: 8px;
}

.qx-dua-foot .qx-dua-act {
  margin: 0 0 0 auto;
  flex: 0 0 auto;
}
/* [DUA] end */

/* [MORE-MENU] start */
.g-menu-item small .ms {
  font-size: calc(22px * var(--qx-scale));
  color: var(--qx-meta-color);
  vertical-align: middle;
  width: calc(22px * var(--qx-scale));
  height: calc(22px * var(--qx-scale));
  transition: transform .2s;
}
#gridDropdown.g-settings-view {
  width: min(420px, calc(100vw - 2 * var(--qx-gutter)));
}

.g-menu-item + .g-menu-item:hover {
  border-color: color-mix(in srgb, var(--qx-border) 55%, transparent);
}

.g-menu-item > span:first-child {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
}
.g-menu-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
  line-height: 1.25;
}
.g-menu-sub {
  font-size: var(--qx-fs-sm);
  font-weight: 400;
  color: var(--qx-meta-color);
}

.g-menu-item .ms,
.g-menu-item .ms-svg {
  flex: 0 0 auto;
  font-size: calc(24px * var(--qx-scale));
  width: calc(24px * var(--qx-scale));
  height: calc(24px * var(--qx-scale));
  color: var(--qx-main-color);
}
html.in-app #pwaBanner,
html.in-app .install-menu-item {
  display: none;
}

html.in-app .install-menu-item.show {
  display: flex;
}
.g-menu-item:active small .ms {
  transform: translateX(2px);
}
/* [MORE-MENU] end */

/* [GRID-POPUP] start */
.pp-btn, .dl-btn {
  min-height: calc(50px * var(--qx-scale));
  font-size: var(--qx-fs-lg);
}
/* [GRID-POPUP] end */

/* [AYAH-CARD] start */
.ayah-actions > .icon-btn,
.ayah-actions > .star,
.ayah-actions > .more-btn {
  width: calc(40px * var(--qx-scale));
  height: calc(40px * var(--qx-scale));
  min-width: calc(40px * var(--qx-scale));
  min-height: calc(40px * var(--qx-scale));
  padding: 0;
  font-size: calc(22px * var(--qx-scale));
  color: var(--qx-meta-color);
}

.ayah-actions > .star .ms.f,
.ayah-actions > .icon-btn.on,
.ayah-actions > .icon-btn.on .ms {
  color: var(--qx-main-color);
}

.ayah-actions > .more-btn {
  font-size: calc(24px * var(--qx-scale));
}

  top: 0;
  left: 0;
  right: 0;
}

}

.qx-fa-progress span {

  left: 0;

  color: #fff;

/* [HOME-THEMES] start */
.qx-home-theme-wrap{position:relative;overflow:hidden;border-radius:var(--qx-radius-lg);isolation:isolate}
