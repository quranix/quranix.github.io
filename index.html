  border-radius: 50%;

  box-shadow: var(--qx-shadow);

}

  border-color: var(--qx-main-color);
}

body .audio-bar.with-nav {
  bottom: calc(66px + env(safe-area-inset-bottom));
}

@media (max-height:480px) and (orientation:landscape) {
  nav button[data-m="quran"] b { transform: none; }
  nav button[data-m="quran"] b::before { display: none; }
  nav button[data-m="quran"].on b { color: var(--qx-main-color); }

  margin: 8px 0;
}

.p3-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 8px;
}

.p3-grid label {
  font-size: var(--qx-fs-sm);
  color: var(--qx-meta-color);
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.p3-grid input,.p3-grid select {
  margin: 0;
  padding: calc(8px * var(--qx-scale));
  border-radius: var(--qx-radius);
  border: 1px solid var(--qx-border);
  background: var(--qx-bg);
  color: var(--qx-text-color);
  font: inherit;
}

.qibla-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: calc(16px * var(--qx-scale)) calc(10px * var(--qx-scale));
  text-align: center;
}

.compass-dial {
  position: relative;
  width: 200px;
  height: 230px;
  border-radius: 50%;
  border: 4px solid var(--qx-main-color);
  background: var(--qx-card-bg);
  box-shadow: 0 6px 20px rgba(0,0,0,0.08);
  margin: 14px auto;
  display: flex;
  align-items: center;
  justify-content: center;
}

.compass-ring {
  position: absolute;
  inset: 0;
  transition: transform 0.15s ease-out;
}

.compass-mark {
  position: absolute;
  font-size: var(--qx-fs-md);
  font-weight: 700;
  color: var(--qx-meta-color);
}

.compass-mark.n {
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  color: #d9534f;
}

.compass-mark.s {
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
}

.compass-mark.e {
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
}

.compass-mark.w {
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
}

.kaaba-pointer {
  position: absolute;
  inset: 14px;
  transition: transform 0.2s ease-out;
}

.kaaba-badge {
  position: absolute;
  top: -6px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  padding: 3px calc(8px * var(--qx-scale));
  border-radius: var(--qx-radius-lg);
  font-size: var(--qx-fs-md);
  font-weight: 700;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

.kaaba-needle {
  position: absolute;
  top: 24px;
  bottom: 50%;
  left: 50%;
  width: 4px;
  margin-left: -2px;
  background: var(--qx-main-color);
  border-radius: 4px;
}

.compass-center {
  width: calc(14px * var(--qx-scale));
  height: calc(14px * var(--qx-scale));
  border-radius: 50%;
  background: var(--qx-main-color);
  z-index: 2;
  border: 2px solid var(--qx-card-bg);
}

.qibla-aligned {
  border-color: var(--qx-success);
  box-shadow: 0 0 0 4px rgba(22,163,74,0.2);
}

.alert-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: calc(8px * var(--qx-scale)) 0;
  border-bottom: 1px solid var(--qx-border);
}

.alert-row:last-child {
  border-bottom: 0;
}

.switch-btn {
  padding: calc(5px * var(--qx-scale)) calc(12px * var(--qx-scale));
  border-radius: var(--qx-radius-lg);
  font-size: var(--qx-fs-sm);
  font-weight: 600;
  cursor: pointer;
}

.switch-btn.on {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-color: var(--qx-main-color);
}

html,body,button,input,select,textarea {
  font-family: var(--qx-font);
}

.ar,.ayah .ar,.ar-name,.bism,.aotd-ar,.asma-card .ar,.asma-top .ar,.ww-sheet .ww-ar,.hadith-item .ar,.surah-item .ar-name {
  font-family: var(--qx-font-arabic), "Noto Naskh Arabic", serif;
}

.ayah .bn,.aotd-bn {
  font-size: var(--qx-fs-bn);
}

.set-sec {
  padding: calc(8px * var(--qx-scale)) calc(4px * var(--qx-scale));
}

.set-title {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 8px;
  font-size: var(--qx-fs);
  font-weight: 600;
  color: var(--qx-text-color);
}

.set-title .ms {
  display: grid;
  place-items: center;
  flex-shrink: 0;
  width: calc(30px * var(--qx-scale));
  height: calc(30px * var(--qx-scale));
  border-radius: var(--qx-radius);
  background: var(--qx-main-soft);
  color: var(--qx-main-color);
  font-size: var(--qx-fs-xl);
  vertical-align: baseline;
}

.set-sec > :not(.set-title) ~ * {
  border-top: 1px solid var(--qx-border);
}

.set-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: calc(48px * var(--qx-scale));
  padding: calc(6px * var(--qx-scale)) 0;
  font-size: var(--qx-fs);
  color: var(--qx-text-color);
}

label.set-row {
  cursor: pointer;
}

.set-label {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-width: 0;
}

.set-label small {
  color: var(--qx-meta-color);
  font-size: var(--qx-fs-sm);
}

.set-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: calc(10px * var(--qx-scale)) 0 calc(6px * var(--qx-scale));
}

.set-field .set-label {
  flex: none;
  color: var(--qx-meta-color);
  font-size: var(--qx-fs-md);
}

.set-select {
  display: block;
  width: 100%;
  min-height: calc(42px * var(--qx-scale));
  padding: calc(9px * var(--qx-scale)) calc(12px * var(--qx-scale));
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  background: var(--qx-tile-bg);
  color: var(--qx-text-color);
  font: inherit;
  font-size: var(--qx-fs);
  cursor: pointer;
  transition: border-color .18s ease, box-shadow .18s ease;
}

.set-select:hover {
  border-color: var(--qx-main-color);
}

.set-select:focus-visible {
  outline: none;
  border-color: var(--qx-main-color);
  box-shadow: 0 0 0 3px var(--qx-main-soft);
}

.set-stepper {
  display: flex;
  align-items: stretch;
  flex-shrink: 0;
  overflow: hidden;
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  background: var(--qx-tile-bg);
}

.set-stepper button {
  min-width: calc(42px * var(--qx-scale));
  min-height: calc(36px * var(--qx-scale));
  padding: 0 calc(10px * var(--qx-scale));
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--qx-text-color);
  font-size: var(--qx-fs);
  font-weight: 600;
  cursor: pointer;
  transition: background-color .18s ease, color .18s ease;
}

.set-stepper button + button {
  border-left: 1px solid var(--qx-border);
}

.set-stepper button:hover {
  background: var(--qx-main-soft);
  color: var(--qx-main-color);
}

.set-stepper button:focus-visible {
  outline: 2px solid var(--qx-main-color);
  outline-offset: -2px;
}

.set-switch {
  -webkit-appearance: none;
  appearance: none;
  position: relative;
  flex-shrink: 0;
  width: calc(34px * var(--qx-scale));
  height: calc(20px * var(--qx-scale));
  margin: 0;
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-pill);
  background: var(--qx-border);
  cursor: pointer;
  transition: background-color .2s ease, border-color .2s ease;
}

.set-switch::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: calc(14px * var(--qx-scale));
  height: calc(14px * var(--qx-scale));
  border-radius: 50%;
  background: var(--qx-knob);
  box-shadow: 0 1px 3px rgba(0,0,0,.3);
  transition: transform .2s ease;
}

.set-switch:checked {
  background: var(--qx-main-color);
  border-color: var(--qx-main-color);
}

.set-switch:checked::after {
  transform: translateX(14px);
}

.set-switch:focus-visible {
  outline: 2px solid var(--qx-main-color);
  outline-offset: 2px;
}

.btn-danger {
  color: var(--qx-danger);
  border-color: var(--qx-danger);
}

.btn-accent {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-color: var(--qx-main-color);
  font-weight: 600;
}

.offline-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: var(--qx-fs-xs);
  padding: 3px calc(8px * var(--qx-scale));
  border-radius: var(--qx-radius-lg);
  background: color-mix(in srgb, var(--qx-main-color) 12%, var(--qx-card-bg));
  color: var(--qx-main-color);
  font-weight: 600;
}

.help-step {
  background: var(--qx-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  padding: calc(10px * var(--qx-scale)) calc(12px * var(--qx-scale));
  margin-bottom: 8px;
  font-size: var(--qx-fs-md);
  line-height: 1.6;
}

button:focus-visible,select:focus-visible,input:focus-visible {
  outline: 2px solid var(--qx-main-color);
  outline-offset: 2px;
}

#q {
  display: none;
}

/* Header search opens the home search controls as a centered modal. */
#controls {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(560px, calc(100vw - 32px));
  max-height: min(82vh, 680px);
  overflow-y: auto;
  padding: calc(20px * var(--qx-scale));
  gap: 12px;
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  background: var(--qx-card-bg);
  color: var(--qx-text-color);
  box-shadow: 0 22px 70px rgba(0,0,0,.32), 0 5px 18px rgba(0,0,0,.16);
  z-index: 201;
}

#controls #q {
  display: block;
  width: 100%;
  box-sizing: border-box;
  margin: 0;
  padding: calc(13px * var(--qx-scale)) calc(14px * var(--qx-scale));
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  background: var(--qx-bg);
  color: var(--qx-text-color);
  font: inherit;
  font-size: var(--qx-fs-lg);
}

#controls select,
#controls .quick-jump input,
#controls .quick-jump button,
#controls .tabs button {
  border-radius: var(--qx-radius-lg);
}

@media (max-width: 480px) {
  #controls {
    width: calc(100vw - 24px);
    max-height: 84vh;
    padding: calc(16px * var(--qx-scale));
    border-radius: var(--qx-radius-lg);
  }
}

.aotd-card, .goal-bar, .resume {
  display: none;
}

.home-hero {
  display: flex;
  overflow: hidden;
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  background: var(--qx-card-bg);
  margin: 10px 0 12px;
  flex-direction: column;
}

.home-hero-left {
  flex: 1;
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  padding: calc(14px * var(--qx-scale));
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
}

.home-hero-left .play {
  font-size: calc(22px * var(--qx-scale));
}

.home-hero-left .lbl {
  font-size: var(--qx-fs-md);
  opacity: .9;
}

.home-hero-left .val {
  font-size: var(--qx-fs-lg);
  font-weight: 700;
  line-height: 1.3;
}

.home-hero-right {
  flex: 1;
  padding: calc(14px * var(--qx-scale));
  cursor: pointer;
}

.home-hero-right .top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: var(--qx-fs-md);
  color: var(--qx-main-color);
}

.home-hero-right .val {
  font-size: var(--qx-fs-lg);
  font-weight: 700;
  color: var(--qx-text-color);
  margin: 6px 0 8px;
}

.home-hero-right .track {
  height: 6px;
  background: var(--qx-border);
  border-radius: var(--qx-radius-pill);
  overflow: hidden;
}

.home-hero-right .fill {
  height: 100%;
  background: var(--qx-main-color);
  border-radius: var(--qx-radius-pill);
}

#gridDropdown {
  display: none;
  position: fixed;
  top: calc(62px + env(safe-area-inset-top) + 8px);
  right: 12px;
  left: auto;
  width: min(300px,calc(100vw - 2*var(--qx-gutter)));
  height: auto;
  max-height: calc(100vh - 80px);
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  z-index: 70;
  background: var(--qx-tile-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  box-shadow: 0 6px 20px rgba(0,0,0,.22);
  padding: calc(6px * var(--qx-scale));
  text-align: left;
  box-sizing: border-box;
}

#gridDropdown.open {
  display: block;
}

.g-menu-item,
.g-quick-btn {

  align-items: center;
  justify-content: space-between;
  width: 100%;
  min-height: calc(46px * var(--qx-scale));
  padding: calc(10px * var(--qx-scale));
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  background: var(--qx-tile-bg);
  color: var(--qx-text-color);
  font: inherit;
  font-size: var(--qx-fs);
  font-weight: 400;
  cursor: pointer;
  text-align: left;
  box-sizing: border-box;

}

.g-menu-item {
  margin: 4px 0;

}
.g-menu-item .ms-svg {

.g-menu-item small {

.g-menu-item:hover,
.g-quick-btn:hover {

}

.g-menu-item:active,
.g-quick-btn:active {

  box-shadow: none;

.g-quick-btn {

  min-width: 0;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
  padding: calc(8px * var(--qx-scale)) calc(4px * var(--qx-scale));
  font-size: var(--qx-fs-sm);
  text-align: center;
}

.g-quick-btn .ms {
  font-size: calc(22px * var(--qx-scale));
  color: var(--qx-main-color);
}

.g-quick-btn.on {

  color: var(--qx-on-main);

}

.g-quick-btn.on .ms {

.install-menu-copy {

}

.install-menu-copy strong {

  color: inherit;
  line-height: 1.35;
}

.install-menu-copy small {
  font-size: var(--qx-fs-xs);
  color: var(--qx-meta-color);
  font-weight: 400;
}

#gridPopupOverlay {

  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0,0,0,.55);

  justify-content: center;

  touch-action: manipulation;
}

#gridPopupOverlay.open {
  display: flex;
}

#gridPopupBox {

  box-sizing: border-box;
  width: min(440px,calc(100vw - 24px));

  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  background: var(--qx-tile-bg);
  border: 1px solid var(--qx-border);

  padding: calc(12px * var(--qx-scale));

.pp-close {

  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);

  line-height: 1;

  font-size: var(--qx-fs-md);

.pp-input {

  flex: 1;
  padding: calc(11px * var(--qx-scale));
  border-radius: var(--qx-radius-lg);
  border: 1px solid var(--qx-border);
  background: var(--qx-card-bg);
  color: var(--qx-text-color);
  font: inherit;

.pp-btn {

  min-height: calc(44px * var(--qx-scale));

  border-radius: var(--qx-radius-lg);
  background: var(--qx-main-color);

.pp-opt {

  font-size: var(--qx-fs);

.surah-grid.is-list .surah-item { padding: calc(10px * var(--qx-scale)) calc(12px * var(--qx-scale)); gap: 12px; flex-wrap: nowrap; align-items: center; }
.surah-grid.is-list .surah-item .num { flex: 0 0 36px; min-width: calc(36px * var(--qx-scale)); height: calc(36px * var(--qx-scale)); font-size: var(--qx-fs-sm); }

.qx-nm .qx-nm-back, .qx-nm .qx-nm-prev, .qx-nm .qx-nm-next { display: inline-flex; align-items: center; gap: 6px; min-height: calc(40px * var(--qx-scale)); padding: 0 calc(14px * var(--qx-scale)) 0 calc(10px * var(--qx-scale)); border-radius: var(--qx-radius-pill); font-weight: 600; font-size: var(--qx-fs-md); cursor: pointer; background: var(--qx-main-soft); color: var(--qx-main-color); border: 1px solid transparent; }

.qx-nm .qx-nm-grade svg { width: calc(15px * var(--qx-scale)); height: calc(15px * var(--qx-scale)); }

/* খতম প্ল্যান: কাস্টম দিনের বাটন লাইন ভেঙে নামবে, আংশিক পড়া দিনের রং */
.pp-tabs.wrap { flex-wrap: wrap; }

  background: color-mix(in srgb, var(--qx-main-color) 30%, var(--qx-card-bg));

}


/* খতম প্ল্যান: দিনের ঘরে টিক (ফেজ ২) */
.khatam-dot {
  position: relative;
  width: calc(28px * var(--qx-scale));
  height: calc(30px * var(--qx-scale));
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}

.khatam-dot.miss {
  border-color: var(--qx-danger);
  color: var(--qx-danger);
}

.khatam-dot.ticked {
  font-weight: 700;
}

.khatam-dot.ticked::after {
  content: "\2713";
  position: absolute;
  top: -6px;
  right: -5px;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: calc(9px * var(--qx-scale));
  line-height: 1;
  background: var(--qx-card-bg);
  color: var(--qx-main-color);
  border: 1px solid var(--qx-main-color);
}

.khatam-dot:focus-visible {
  outline: 2px solid var(--qx-main-color);
  outline-offset: 2px;
}

/* আইকন ফন্ট: লোড হওয়ার আগে লুকানো (blink বন্ধ), ব্যর্থ হলে চিহ্ন-ফলব্যাক */
html.icons-pending .ms {
  visibility: hidden;
}

body.no-icon-font .ms {
  font-family: var(--qx-font), sans-serif;
  font-size: 0;
  width: calc(20px * var(--qx-scale));
  height: calc(20px * var(--qx-scale));
  display: inline-flex;
  align-items: center;
  justify-content: center;
  overflow: visible;
  vertical-align: middle;
  font-variation-settings: normal;
}

body.no-icon-font .ms::before {
  content: attr(data-g);
  font-size: calc(17px * var(--qx-scale));
  line-height: 1;
  font-style: normal;
  font-weight: 400;
  text-align: center;
}


/* ===== Quranix V5: compact Home + balanced prayer/tracker page polish ===== */
.home-section-title {

}

.home-quick-go { margin-left:auto; color:var(--qx-meta-color); font-size:calc(18px * var(--qx-scale)); }
.home-category-grid { margin-top:0; }

/* Prayer sub-navigation and panels */
.p3-tabs { padding:3px; gap:5px; border:1px solid var(--qx-border); border-radius:var(--qx-radius-lg); background:var(--qx-tile-bg); }
.p3-tabs button { padding:calc(9px * var(--qx-scale)) calc(12px * var(--qx-scale)); border:1px solid transparent; border-radius:var(--qx-radius); }

.switch-btn { min-width:88px; padding:calc(8px * var(--qx-scale)) calc(13px * var(--qx-scale)); border:1px solid var(--qx-border); background:var(--qx-tile-bg); color:var(--qx-text-color); }

/* Tracker hierarchy: same palette and token registry, clearer grouping */
.trk-head { box-shadow:var(--qx-shadow); padding:calc(18px * var(--qx-scale)) calc(14px * var(--qx-scale)); }

.trk-tick:focus-visible,.switch-btn:focus-visible,.p3-tabs button:focus-visible,.qibla-box button:focus-visible,.alert-row button:focus-visible,.alert-row select:focus-visible {

  .compass-dial { width:min(76vw,230px); height:min(76vw,230px); }

/* ফেজ C: ট্র্যাকারের সাপ্তাহিক তালিকা পূর্ণ প্রস্থে */

/* ইসলামিক আইকন: fonts/islamic-icons.ttf (IslamicIcons, fontello)। data-i নাম → --qi-o আউটলাইন, --qi-s সলিড (সক্রিয়/.f অবস্থায়) */
.ms.qi[data-i="asma"] { --qi-o: "\e800"; --qi-s: "\e825"; }

.ms.qi[data-i="tasbih"] { --qi-o: "\e84a"; --qi-s: "\e83f"; }
.ms.qi[data-i="ramadan"] { --qi-o: "\e81c"; --qi-s: "\e82a"; }
.ms.qi[data-i="kalima"] { --qi-o: "\e847"; --qi-s: "\e843"; }
.ms.qi[data-i="hajj"] { --qi-o: "\e810"; --qi-s: "\e829"; }

html body button:active .ms.qi::before,
html body .g-menu-item:active .ms.qi::before {

/* ===== Phase 1 polish ===== */

/* Header: equal-size buttons, larger icons, softer border, even gaps */
.header-tools { gap: 6px; }
.header-btn,
#back {

  min-width: calc(42px * var(--qx-scale));

}
#back:not(.back-btn-hidden) { display: inline-flex; align-items: center; justify-content: center; }
.header-btn .ms,
#back .ms { font-size: calc(24px * var(--qx-scale)); line-height: 1; vertical-align: 0; }

  .header-btn .ms, #back .ms { font-size: calc(22px * var(--qx-scale)); }

}

/* Surah list: revelation / ayah-count tags use the ayah-number tag style */
.surah-meta .surah-revelation,
.surah-meta .surah-ayah-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: calc(26px * var(--qx-scale));

  line-height: 1;
  white-space: nowrap;
}
html:not([data-theme="dark"]):not([data-hc]) .surah-meta .surah-revelation,
html:not([data-theme="dark"]):not([data-hc]) .surah-meta .surah-ayah-count { background: var(--qx-tag-bg); color: var(--qx-tag-text); border-color: transparent; }
@media (max-width: 520px) {
  .surah-meta .surah-revelation,
  .surah-meta .surah-ayah-count { min-height: calc(24px * var(--qx-scale)); padding: 0 calc(8px * var(--qx-scale)); font-size: var(--qx-fs-xs); }
}

/* Grid / list toggle: dark chip with a clearly visible accent icon (it is a single always-on toggle) */
.qx-view-btn,
.qx-view-btn.on {
  width: calc(40px * var(--qx-scale));
  height: calc(40px * var(--qx-scale));
  background: var(--qx-tile-bg);

  color: var(--qx-main-color);
}

.qx-view-btn:hover { border-color: var(--qx-main-color); background: var(--qx-hover); }

/* Dua card footer: source on the left, quick buttons on the right */

  flex-wrap: wrap;

.qx-dua-foot .qx-nm-src-chip { display: inline-flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; min-height: calc(30px * var(--qx-scale)); padding: 0 calc(12px * var(--qx-scale)) 0 calc(9px * var(--qx-scale)); border-radius: var(--qx-radius-pill); background: var(--qx-card-bg); border: 1px solid var(--qx-border); color: var(--qx-main-color); font-size: var(--qx-fs-md); }
.qx-dua-foot .qx-nm-src-chip b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; color: var(--qx-text-color); }
.qx-dua-foot .qx-nm-src-chip svg { width: calc(15px * var(--qx-scale)); height: calc(15px * var(--qx-scale)); flex: 0 0 15px; }
.qx-dua-foot .qx-nm-ic { display: inline-flex; align-items: center; justify-content: center; line-height: 0; }
.qx-dua-foot .qx-nm-src-no { flex: 0 0 auto; padding-left: 8px; border-left: 1px solid var(--qx-border); color: var(--qx-meta-color); font-weight: 600; }
.qx-dua-foot .qx-nm-grade { display: inline-flex; align-items: center; gap: 4px; min-height: calc(30px * var(--qx-scale)); padding: 0 calc(12px * var(--qx-scale)) 0 calc(8px * var(--qx-scale)); border-radius: var(--qx-radius-pill); background: color-mix(in srgb, var(--qx-success) 14%, transparent); color: var(--qx-success); font-size: var(--qx-fs-md); font-weight: 700; }
.qx-dua-foot .qx-nm-grade svg { width: calc(15px * var(--qx-scale)); height: calc(15px * var(--qx-scale)); }

/* ===== Phase 2: grid menu, customization panel and popups ===== */

/* (a) Dropdown: wider, taller rows, one icon + label rhythm */
#gridDropdown {

  padding: calc(10px * var(--qx-scale)) calc(6px * var(--qx-scale));
  gap: 6px;
  font-size: var(--qx-fs-md);
  border-radius: var(--qx-radius-lg);
}
.g-quick-btn .ms { font-size: calc(26px * var(--qx-scale)); }
.g-menu-item {
  min-height: calc(54px * var(--qx-scale));
  margin: 2px 0;
  padding: calc(10px * var(--qx-scale)) calc(12px * var(--qx-scale));
  font-size: var(--qx-fs-lg);
  border-radius: var(--qx-radius-lg);
}
.g-menu-item + .g-menu-item { border-top: 1px solid color-mix(in srgb, var(--qx-border) 55%, transparent); }
.g-menu-item + .g-menu-item:hover { border-color: color-mix(in srgb, var(--qx-border) 55%, transparent); }
.g-menu-item > span:first-child { display: flex; align-items: center; gap: 14px; min-width: 0; }
.g-menu-item .ms,
.g-menu-item .ms-svg { flex: 0 0 auto; font-size: calc(24px * var(--qx-scale)); width: calc(24px * var(--qx-scale)); height: calc(24px * var(--qx-scale)); color: var(--qx-main-color); }
.g-menu-item .ms-svg { font-size: 1em; }
.g-menu-item small { font-size: var(--qx-fs-md); }
.g-menu-item small .ms { font-size: calc(22px * var(--qx-scale)); width: calc(22px * var(--qx-scale)); height: calc(22px * var(--qx-scale)); color: var(--qx-meta-color); }

/* (c) Customization panel: title left, a single close button right */
.settings-modal-header { padding: calc(6px * var(--qx-scale)) calc(4px * var(--qx-scale)) calc(12px * var(--qx-scale)); }
.settings-modal-title { display: flex; align-items: center; gap: 10px; font-size: var(--qx-fs-xl); }
.settings-modal-title .ms-svg { width: calc(24px * var(--qx-scale)); height: calc(24px * var(--qx-scale)); font-size: 1em; color: var(--qx-main-color); flex: 0 0 auto; }
.settings-modal-header .close-btn { width: calc(40px * var(--qx-scale)); height: calc(40px * var(--qx-scale)); font-size: calc(22px * var(--qx-scale)); }
.settings-body { gap: 8px; font-size: var(--qx-fs-lg); }
.set-sec { padding: calc(10px * var(--qx-scale)) calc(4px * var(--qx-scale)); }
.set-title { font-size: var(--qx-fs-lg); gap: 12px; margin-bottom: 10px; }
.set-title .ms { width: calc(34px * var(--qx-scale)); height: calc(34px * var(--qx-scale)); font-size: calc(22px * var(--qx-scale)); }
.set-row { min-height: calc(54px * var(--qx-scale)); font-size: var(--qx-fs-lg); }
.set-label small { font-size: var(--qx-fs-md); }
.set-select { min-height: calc(48px * var(--qx-scale)); font-size: var(--qx-fs-lg); }
.set-stepper button { min-width: calc(48px * var(--qx-scale)); min-height: calc(42px * var(--qx-scale)); font-size: var(--qx-fs-lg); }
.set-switch { width: calc(42px * var(--qx-scale)); height: calc(24px * var(--qx-scale)); }
.set-switch::after { width: calc(18px * var(--qx-scale)); height: calc(18px * var(--qx-scale)); }
.set-switch:checked::after { transform: translateX(18px); }

/* (d) Popups (backup, app install, search, translation, reciter ...): larger and easier to tap */
#gridPopupBox {
  width: min(540px, calc(100vw - 24px));
  max-width: 540px;
  padding: calc(18px * var(--qx-scale));
}
#gridPopupBox.wide { width: min(600px, calc(100vw - 24px)); max-width: 600px; padding: calc(20px * var(--qx-scale)); }
#gridPopupBox.wide-fixed { height: min(600px, 80vh); }
#gridPopupBox .pp-header { min-height: calc(44px * var(--qx-scale)); margin-bottom: 14px; }
#gridPopupBox .pp-header h3 { font-size: var(--qx-fs-xl); }
.pp-close { width: calc(40px * var(--qx-scale)); height: calc(40px * var(--qx-scale)); font-size: calc(22px * var(--qx-scale)); }
.pp-header .pp-close { flex: 0 0 40px; }
.pp-tabs button { padding: calc(12px * var(--qx-scale)) calc(10px * var(--qx-scale)); font-size: var(--qx-fs-lg); }
.pp-mini { font-size: var(--qx-fs-md); line-height: 1.7; }
#gridPopupBox .pp-input { padding: calc(13px * var(--qx-scale)) calc(14px * var(--qx-scale)); font-size: var(--qx-fs-lg); }
#gridPopupBox .pp-opt { min-height: calc(54px * var(--qx-scale)); padding: calc(12px * var(--qx-scale)) calc(14px * var(--qx-scale)); font-size: var(--qx-fs-lg); }
#gridPopupBox .pp-result { padding: calc(14px * var(--qx-scale)); }
.pp-result b { font-size: var(--qx-fs-lg); }
.pp-result small { font-size: var(--qx-fs-md); }
.pp-btn, .dl-btn { min-height: calc(50px * var(--qx-scale)); font-size: var(--qx-fs-lg); }
.pp-font-row { font-size: var(--qx-fs-lg); padding: calc(10px * var(--qx-scale)) 0; }
.pp-font-row button { padding: calc(8px * var(--qx-scale)) calc(16px * var(--qx-scale)); }
@media (max-width: 480px) {
  #gridDropdown { width: min(360px, calc(100vw - 20px)); right: 10px; }
  #gridPopupBox, #gridPopupBox.wide { width: calc(100vw - 20px); padding: calc(16px * var(--qx-scale)); }
}

/* ===== Phase 3: ayah quick row + bottom nav notch ===== */

/* Ayah quick row: audio, saved, copy, tafsir, more share one look */
.ayah-actions > .icon-btn,
.ayah-actions > .star,
.ayah-actions > .more-btn {
  width: calc(40px * var(--qx-scale));
  height: calc(40px * var(--qx-scale));
  min-width: calc(40px * var(--qx-scale));
  min-height: calc(40px * var(--qx-scale));
  padding: 0;
  font-size: calc(22px * var(--qx-scale));
  color: var(--qx-meta-color);
}
.ayah-actions > .star .ms.f,
.ayah-actions > .icon-btn.on,
.ayah-actions > .icon-btn.on .ms { color: var(--qx-main-color); }
.ayah-actions > .more-btn { font-size: calc(24px * var(--qx-scale)); }

/* Bottom nav: the Quran circle floats in a round cut-out; the border line runs in from both sides,
   curves down around the circle (with a small gap) and passes underneath it. */
nav {
  --qx-notch-r: 29px;   /* cut-out radius = circle radius (23px) + 6px gap */
  --qx-notch-cy: 4px;   /* circle centre, measured from the top edge of the nav */
  background: none;
  border: 0;
  box-shadow: none;
}
nav::before,
nav::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
}
nav::before {
  background: var(--qx-card-bg);
  border-top: 1px solid var(--qx-border);
  -webkit-mask-image: radial-gradient(circle at 50% var(--qx-notch-cy), transparent var(--qx-notch-r), #000 calc(var(--qx-notch-r) + .5px));
  mask-image: radial-gradient(circle at 50% var(--qx-notch-cy), transparent var(--qx-notch-r), #000 calc(var(--qx-notch-r) + .5px));
}
nav::after {
  background: radial-gradient(circle at 50% var(--qx-notch-cy),
    transparent calc(var(--qx-notch-r) - .5px),
    var(--qx-border) var(--qx-notch-r),
    var(--qx-border) calc(var(--qx-notch-r) + 1px),
    transparent calc(var(--qx-notch-r) + 1.5px));
}
nav button[data-m="quran"] b { transform: translateY(-16px); }
nav button[data-m="quran"] b::before { inset: -11px; }

@media (min-width: 900px) {
  nav {
    border: 0;
    border-radius: 0;
    filter: drop-shadow(0 -4px 10px rgba(0,0,0,.08));
  }
  nav::before {
    border: 1px solid var(--qx-border);
    border-bottom: 0;
    border-radius: var(--qx-radius-lg) var(--qx-radius-lg) 0 0;
  }
  nav::after { border-radius: var(--qx-radius-lg) var(--qx-radius-lg) 0 0; }
}

/* Short landscape screens: the circle is flattened, so the cut-out goes away too */
@media (max-height: 480px) and (orientation: landscape) {
  nav::after { display: none; }
  nav::before { -webkit-mask-image: none; mask-image: none; }
  nav button[data-m="quran"] b { transform: none; }
}

/* ===== Tasbih fine tuning ===== */
.qx-tsb-in { gap: 8px; }
.qx-tsb-count { font-variant-numeric: tabular-nums; letter-spacing: 0; }
.qx-tsb-in small { font-size: var(--qx-fs-md); line-height: 1.3; }
.qx-tsb-btn { transition: transform .12s ease, box-shadow .2s ease; }
.qx-tsb-btn:active { transform: scale(.96); }
.qx-tsb-btn:focus-visible { outline: 3px solid var(--qx-main-color); outline-offset: 4px; }
.qx-tsb-count.tap { animation: qxTsbTap .18s ease-out; }
@keyframes qxTsbTap { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
.qx-tsb-btn.cycle-done { animation: qxTsbDone .6s ease-out; }
@keyframes qxTsbDone { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--qx-main-color) 55%, transparent); } 100% { box-shadow: 0 0 0 22px transparent; } }
.qx-tsb-arc { transition: stroke-dashoffset .22s ease-out; }
.qx-tsb-ctl { gap: 10px; margin-top: 6px; }
.qx-tsb-opt { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: calc(44px * var(--qx-scale)); min-width: calc(44px * var(--qx-scale)); line-height: 1; transition: background-color .15s ease, border-color .15s ease, transform .1s ease; }
.qx-tsb-opt .ms { font-size: calc(20px * var(--qx-scale)); width: calc(20px * var(--qx-scale)); }
.qx-tsb-opt:active { transform: scale(.96); }
.qx-tsb-opt:focus-visible { outline: 2px solid var(--qx-main-color); outline-offset: 2px; }

/* আজান অ্যালার্টের টিক: বৃত্তের ভেতরে বৃত্ত না করে সরাসরি check_circle আইকন */
.trk-tick.az-tick {
  display: inline-grid;
  place-items: center;
  width: calc(36px * var(--qx-scale));
  height: calc(36px * var(--qx-scale));
  padding: 0;
  border: 0;
  background: none;
  color: var(--qx-meta-color);
}
.trk-tick.az-tick .ms { font-size: calc(30px * var(--qx-scale)); }
.trk-tick.az-tick.on { background: none; border: 0; color: var(--qx-main-color); }

/* fit_page_width: ফন্টে নেই, তাই ইনলাইন SVG (fill ধরনের আইকন) */
.ms-svg-fill { width: 1em; height: 1em; fill: currentColor; stroke: none; display: inline-block; vertical-align: -.2em; }

/* ===== তাসবিহ ফাইন টিউনিং (ফেজ ৪) ===== */
.qx-tsb-btn { overflow: hidden; will-change: transform; -webkit-touch-callout: none; }
.qx-tsb-btn::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--qx-main-color) 30%, transparent) 0, transparent 70%);
  opacity: 0;
  transform: scale(.6);
  pointer-events: none;
}
.qx-tsb-btn.ripple::after { animation: qxTsbRipple .38s ease-out; }
@keyframes qxTsbRipple { 0% { opacity: 1; transform: scale(.6); } 100% { opacity: 0; transform: scale(1.05); } }
.qx-tsb-in { z-index: 1; max-width: 74%; text-align: center; }
.qx-tsb-in small { text-wrap: balance; }
.qx-tsb-count { min-width: 2ch; }
/* অগ্রগতির রিং: শূন্যে গোল ক্যাপের ফোঁটা লুকানো, মসৃণ ইজ */
.qx-tsb-arc { transition: stroke-dashoffset .3s cubic-bezier(.22,.8,.3,1), opacity .15s ease; }
.qx-tsb-arc.empty { opacity: 0; }
.qx-tsb-opt.danger .ms { font-size: calc(20px * var(--qx-scale)); }

/* ===== অ্যাপের সাইজ: Small (এখনকার) / Medium / Lite (সবচেয়ে বড়) ===== */
html[data-size="medium"] { --qx-scale: 1.1; }

/* অ্যাপের ভিতরে ইনস্টল প্রম্পট/ব্যানার/মেনু আইটেম দেখাবে না */
html.in-app #pwaBanner,
html.in-app .install-menu-item { display: none !important; }
</style>
