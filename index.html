/* [HEADER] start */
header {
  position: sticky;
  top: 0;
  background: var(--qx-bg);
  z-index: var(--qx-z-header);
  padding: calc(12px * var(--qx-scale)) calc(14px * var(--qx-scale));
  padding-top: calc(12px + env(safe-area-inset-top));
  height: auto;
  min-height: calc(62px * var(--qx-scale));
  display: flex;
  align-items: center;
  border-bottom: 1px solid var(--qx-border);
  transition: transform .25s ease;
  padding-bottom: 12px;
  padding-left: var(--qx-gutter);
  padding-right: var(--qx-gutter);
}

.reader-progress {
  position: fixed;
  left: 0;
  right: 0;
  top: 0;
  z-index: 9999;
  height: 2px;
  background: transparent;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease;
}

.reader-progress-fill {
  height: 100%;
  width: 0;
  background: var(--qx-main-color);
  transition: width .12s linear;
}

body.reader-active .reader-progress {
  opacity: 1;
}

.bar {

  gap: 10px;
  width: 100%;
  min-height: calc(38px * var(--qx-scale));
}

  border-radius: var(--qx-radius);
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border: 0;
  cursor: pointer;
  white-space: nowrap;
  height: calc(36px * var(--qx-scale));
}
#controls select,
#controls .quick-jump input,
#controls .quick-jump button,
#controls .tabs button {
  border-radius: var(--qx-radius-lg);
}
/* [QUICK-JUMP] end */

/* [READING-GOAL] start */
.goal-bar {
  background: var(--qx-card-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  padding: calc(12px * var(--qx-scale)) calc(14px * var(--qx-scale));
  margin: 8px 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.goal-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: var(--qx-fs-md);
}

.goal-track {
  height: 8px;
  background: var(--qx-border);
  border-radius: var(--qx-radius-pill);
  overflow: hidden;
}

.goal-fill {
  height: 100%;
  background: var(--qx-main-color);
  border-radius: var(--qx-radius-pill);
  transition: width .3s ease;
}
.sheet-box .goal-bar {
  display: flex;
}
/* [READING-GOAL] end */




/* [CLASS p3-*] start */
.p3-tabs {
  display: flex;
  gap: 5px;
  margin-bottom: 12px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 3px;
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  background: var(--qx-tile-bg);
}

.p3-tabs button {
  flex: 1 0 auto;
  white-space: nowrap;
  padding: calc(9px * var(--qx-scale)) calc(12px * var(--qx-scale));
  border-radius: var(--qx-radius);
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
}

.p3-tabs button.on {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-color: var(--qx-main-color);
}

.p3-card {
  background: var(--qx-card-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  padding: calc(14px * var(--qx-scale));
  margin: 8px 0;
  box-shadow: var(--qx-shadow);
}

.p3-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 8px;
}

.p3-grid label {
  font-size: var(--qx-fs-sm);
  color: var(--qx-meta-color);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
/* [CLASS p3-*] end */


/* [QIBLA] start */
.qibla-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: calc(16px * var(--qx-scale)) calc(10px * var(--qx-scale));
  text-align: center;
  gap: 8px;
}

.compass-dial {
  position: relative;
  width: min(68vw,250px);
  height: min(68vw,250px);
  border-radius: 50%;
  border: 4px solid var(--qx-main-color);
  background: var(--qx-card-bg);
  box-shadow: var(--qx-shadow);
  margin: 14px auto;
  display: flex;
  align-items: center;
  justify-content: center;
  max-width: 250px;
  max-height: 250px;
  border-width: 3px;
}

.compass-ring {
  position: absolute;
  inset: 0;
  transition: transform 0.15s ease-out;
}

.compass-mark {
  position: absolute;
  font-size: var(--qx-fs-md);
  font-weight: 700;
  color: var(--qx-meta-color);
}

.compass-mark.n {
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  color: var(--qx-danger);
}

.compass-mark.s {
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
}

.compass-mark.e {
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
}

.compass-mark.w {
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
}

.kaaba-pointer {
  position: absolute;
  inset: 14px;
  transition: transform 0.2s ease-out;
}

.kaaba-badge {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  padding: 0;
  border-radius: 50%;
  font-size: var(--qx-fs-lg);
  font-weight: 700;
  box-shadow: var(--qx-shadow);
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
}

.kaaba-needle {
  position: absolute;
  top: 46px;
  bottom: 50%;
  left: 50%;
  width: 4px;
  margin-left: -2px;
  background: var(--qx-main-color);
  border-radius: 4px;
}

.compass-center {
  width: calc(14px * var(--qx-scale));
  height: calc(14px * var(--qx-scale));
  border-radius: 50%;
  background: var(--qx-main-color);
  z-index: 2;
  border: 2px solid var(--qx-card-bg);
}

.qibla-aligned {
  border-color: var(--qx-success);
  box-shadow: 0 0 0 4px rgba(22,163,74,0.2);
}

.alert-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--qx-border);
  gap: 12px;
  flex-wrap: wrap;
}

.alert-row:last-child {
  border-bottom: 0;
}
.alert-row>span:first-child {
  font-weight: 600;
}
.qibla-box .note {
  max-width: 42rem;
  line-height: 1.55;
}

.alert-row>div:first-child {
  min-width: 0;
  flex: 1 1 190px;
}
/* [QIBLA] end */







/* [SETTINGS] start */
.settings-modal-title {
  flex: 1;
  margin: 0;
  font-size: var(--qx-fs-xl);
  font-weight: 600;
  color: var(--qx-text-color);
  display: flex;
  align-items: center;
  gap: 10px;
}
.settings-body {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: calc(4px * var(--qx-scale)) 2px calc(6px * var(--qx-scale));
  font-size: var(--qx-fs-lg);
  line-height: 1.4;
}
.switch-btn {
  padding: calc(8px * var(--qx-scale)) calc(13px * var(--qx-scale));
  border-radius: var(--qx-radius-lg);
  font-size: var(--qx-fs-sm);
  font-weight: 600;
  cursor: pointer;
  min-width: 88px;
  border: 1px solid var(--qx-border);
  background: var(--qx-tile-bg);
  color: var(--qx-text-color);
}

.switch-btn.on {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-color: var(--qx-main-color);
}
.set-sec {
  padding: calc(10px * var(--qx-scale)) calc(4px * var(--qx-scale));
}

.set-title {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0;
  font-size: var(--qx-fs-lg);
  font-weight: 600;
  color: var(--qx-text-color);
}

summary.set-title {
  list-style: none;
  cursor: pointer;
  padding: calc(4px * var(--qx-scale)) 0;
}

summary.set-title::-webkit-details-marker {
  display: none;
}

summary.set-title::after {
  content: "";
  flex-shrink: 0;
  width: calc(8px * var(--qx-scale));
  height: calc(8px * var(--qx-scale));
  margin: 0 calc(6px * var(--qx-scale)) 0 auto;
  border-right: 2px solid var(--qx-meta-color);
  border-bottom: 2px solid var(--qx-meta-color);
  transform: rotate(45deg);
  transition: transform .2s ease;
}

.set-sec[open] > summary.set-title::after {
  transform: rotate(-135deg);
}

summary.set-title:focus-visible {
  outline: 2px solid var(--qx-main-color);
  outline-offset: 2px;
  border-radius: var(--qx-radius);
}

.set-title .ms,
.set-ico {
  display: grid;
  place-items: center;
  flex-shrink: 0;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: #CCFBF1;
  color: var(--qx-main-color);
  font-size: 24px;
}
.set-ico .ms {
  font-size: 1em;
}

.set-sec > :not(.set-title) ~ * {
  border-top: 1px solid var(--qx-border);
}

.set-row {
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 52px;
  padding: 10px 16px;
  margin: 0 16px 8px;
  border-radius: 14px;
  background: var(--qx-card-bg);
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
  font-size: 15px;
  color: var(--qx-text-color);
  cursor: pointer;
  border: 0;
  transition: transform .12s, box-shadow .15s;
}
.set-row:active {
  transform: scale(.98);
  box-shadow: 0 1px 2px rgba(0,0,0,.04);
}

label.set-row {
  cursor: pointer;
}

.set-label {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-width: 0;
  gap: 2px;
}

.set-label small {
  color: #6b7280;
  font-size: 12px;
  line-height: 1.35;
  font-weight: 400;
}

.set-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: calc(10px * var(--qx-scale)) 0 calc(6px * var(--qx-scale));
}

.set-field .set-label {
  flex: none;
  color: var(--qx-meta-color);
  font-size: var(--qx-fs-md);
}
.set-stepper {
  display: flex;
  align-items: stretch;
  flex-shrink: 0;
  overflow: hidden;
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  background: var(--qx-tile-bg);
}

.set-stepper button {
  min-width: calc(48px * var(--qx-scale));
  min-height: calc(42px * var(--qx-scale));
  padding: 0 calc(10px * var(--qx-scale));
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--qx-text-color);
  font-size: var(--qx-fs-lg);
  font-weight: 600;
  cursor: pointer;
  transition: background-color .18s ease, color .18s ease;
}

.set-stepper button + button {
  border-left: 1px solid var(--qx-border);
}

.set-stepper button:hover {
  background: var(--qx-main-soft);
  color: var(--qx-main-color);
}

.set-stepper button:focus-visible {
  outline: 2px solid var(--qx-main-color);
  outline-offset: -2px;
}

.set-switch {
  -webkit-appearance: none;
  appearance: none;
  position: relative;
  flex-shrink: 0;
  width: 42px;
  height: 26px;
  margin: 0 0 0 auto;
  padding: 0;
  border: 0;
  border-radius: 999px;
  background: #E5E7EB;
  cursor: pointer;
  transition: background-color .22s ease;
}

.set-switch::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 3px rgba(0,0,0,.25);
  transition: transform .22s cubic-bezier(.2,.7,.3,1);
}

.set-switch:checked {
  background: #0F766E;
  border-color: #0F766E;
}
.set-switch:checked::after {
  transform: translateX(16px);
}

.set-switch:focus-visible {
  outline: 2px solid var(--qx-main-color);
  outline-offset: 2px;
}
/* [SETTINGS] end */





/* [CLASS btn-*] start */
.btn-danger {
  color: var(--qx-danger);
  border-color: var(--qx-danger);
}

.btn-accent {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-color: var(--qx-main-color);
  font-weight: 600;
}
/* [CLASS btn-*] end */



/* [CLASS help-*] start */
.help-step {
  background: var(--qx-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  padding: calc(10px * var(--qx-scale)) calc(12px * var(--qx-scale));
  margin-bottom: 8px;
  font-size: var(--qx-fs-md);
  line-height: 1.6;
}
/* [CLASS help-*] end */

/* [CONTROLS] start */
.p3-grid input,.p3-grid select {
  margin: 0;
  padding: calc(8px * var(--qx-scale));
  border-radius: var(--qx-radius);
  border: 1px solid var(--qx-border);
  background: var(--qx-bg);
  color: var(--qx-text-color);
  font: inherit;
}
html,body,button,input,select,textarea {
  font-family: var(--qx-font);
}
.set-select {
  display: block;
  width: 100%;
  min-height: calc(48px * var(--qx-scale));
  padding: calc(9px * var(--qx-scale)) calc(12px * var(--qx-scale));
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  background: var(--qx-tile-bg);
  color: var(--qx-text-color);
  font: inherit;
  font-size: var(--qx-fs-lg);
  cursor: pointer;
  transition: border-color .18s ease, box-shadow .18s ease;
}

.set-select:hover {
  border-color: var(--qx-main-color);
}

.set-select:focus-visible {
  outline: none;
  border-color: var(--qx-main-color);
  box-shadow: 0 0 0 3px var(--qx-main-soft);
}
button:focus-visible,select:focus-visible,input:focus-visible {
  outline: 2px solid var(--qx-main-color);
  outline-offset: 2px;
}

#q {
  display: none;
}

#controls {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(560px, calc(100vw - 32px));
  max-height: min(82vh, 680px);
  overflow-y: auto;
  padding: calc(20px * var(--qx-scale));
  gap: 12px;
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  background: var(--qx-card-bg);
  color: var(--qx-text-color);
  box-shadow: 0 22px 70px rgba(0,0,0,.32), 0 5px 18px rgba(0,0,0,.16);
  z-index: 201;
}

#controls #q {
  display: block;
  width: 100%;
  box-sizing: border-box;
  margin: 0;
  padding: calc(13px * var(--qx-scale)) calc(14px * var(--qx-scale));
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  background: var(--qx-bg);
  color: var(--qx-text-color);
  font: inherit;
  font-size: var(--qx-fs-lg);
}
#transSel {
  display: none;
}
.controls-trans-wrap {
  margin-top: 8px;
}
/* [CONTROLS] end */




/* [MORE-MENU] start */
.g-settings-panel {
  color: var(--qx-text-color);
  text-align: left;
}

#gridDropdown.g-settings-view > :not(.g-settings-panel) {
  display: none;
}
#gridDropdown {
  display: none;
  position: fixed;
  top: calc(62px + env(safe-area-inset-top) + 8px);
  right: 12px;
  left: auto;
  width: min(360px, calc(100vw - 2 * var(--qx-gutter)));
  height: auto;
  max-height: calc(100vh - 80px);
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  z-index: 70;
  background: var(--qx-tile-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  box-shadow: 0 6px 20px rgba(0,0,0,.22);
  padding: calc(8px * var(--qx-scale));
  text-align: left;
  box-sizing: border-box;
}

#gridDropdown.open {
  display: block;
}

.g-menu-item,
.g-quick-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  min-height: calc(46px * var(--qx-scale));
  padding: calc(10px * var(--qx-scale));
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  background: var(--qx-tile-bg);
  color: var(--qx-text-color);
  font: inherit;
  font-size: var(--qx-fs);
  font-weight: 400;
  cursor: pointer;
  text-align: left;
  box-sizing: border-box;
  line-height: 1.4;
  gap: 10px;
  transition: background-color .18s ease, border-color .18s ease, color .18s ease, transform .15s ease, box-shadow .18s ease;
}

.g-menu-item {
  margin: 2px 0;
  border: 0;
  background: transparent;
  min-height: calc(54px * var(--qx-scale));
  padding: calc(10px * var(--qx-scale)) calc(12px * var(--qx-scale));
  font-size: var(--qx-fs-lg);
  border-radius: var(--qx-radius-lg);
}

.g-menu-item .ms {
  font-size: calc(22px * var(--qx-scale));
  color: var(--qx-main-color);
}

.g-menu-item .ms-svg {
  width: calc(22px * var(--qx-scale));
  height: calc(22px * var(--qx-scale));
  color: var(--qx-main-color);
  font-size: 1em;
}

.g-menu-item[data-popup="settings"] {
  border: 0;
  background: transparent;
  border-top: 1px solid var(--qx-border);
  margin-top: 8px;
  padding-top: 12px;
}

.g-menu-item small {
  color: var(--qx-meta-color);
  flex-shrink: 0;
  text-align: right;
  font-size: var(--qx-fs-md);
}

.g-menu-item:hover,
.g-quick-btn:hover {
  background: var(--qx-hover);
  border-color: var(--qx-main-color);
  color: var(--qx-text-color);
  box-shadow: 0 2px 7px rgba(0,0,0,.07);
}

.g-menu-item:active,
.g-quick-btn:active {
  background: var(--qx-border);
  transform: scale(.98);
  box-shadow: none;
}

.g-quick-btn {
  flex: 1 1 30%;
  min-width: 0;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
  padding: 12px 6px;
  font-size: 12px;
  text-align: center;
  min-height: calc(66px * var(--qx-scale));
  border-radius: var(--qx-radius-lg);
  align-items: center;
  font-weight: 500;
  line-height: 1.3;
}

.g-quick-btn .ms {
  width: 28px;
  height: 28px;
  flex: 0 0 28px;
  font-size: 28px;
  line-height: 28px;
  color: var(--qx-main-color);
}

.g-quick-btn.on {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-color: var(--qx-main-color);
}

.g-quick-btn.on .ms {
  color: var(--qx-on-main);
}

.install-menu-copy {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.install-menu-copy strong {
  font-size: inherit;
  font-weight: 600;
  color: inherit;
  line-height: 1.35;
}

.install-menu-copy small {
  font-size: var(--qx-fs-xs);
  color: var(--qx-meta-color);
  font-weight: 400;
}
/* [MORE-MENU] end */







/* [GRID-POPUP] start */
#gridPopupOverlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0,0,0,.55);
  align-items: center;
  justify-content: center;
  padding: calc(12px * var(--qx-scale));
  box-sizing: border-box;
  touch-action: manipulation;
}

#gridPopupOverlay.open {
  display: flex;
}

#gridPopupBox {
  position: relative;
  box-sizing: border-box;
  width: min(540px, calc(100vw - 24px));
  max-width: 540px;
  max-height: min(88vh, 760px);
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  background: var(--qx-tile-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  padding: calc(18px * var(--qx-scale));
  box-shadow: 0 20px 40px rgba(0,0,0,.3);
}
.pp-close {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 2;
  width: calc(40px * var(--qx-scale));
  height: calc(40px * var(--qx-scale));
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  background: var(--qx-card-bg);
  font-size: calc(22px * var(--qx-scale));
  line-height: 1;
  cursor: pointer;
  color: var(--qx-text-color);
  padding: 0;
}
.pp-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
}

.pp-tabs button {
  flex: 1;
  padding: calc(12px * var(--qx-scale)) calc(10px * var(--qx-scale));
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  background: var(--qx-card-bg);
  color: var(--qx-text-color);
  font: inherit;
  font-size: var(--qx-fs-lg);
  cursor: pointer;
}

.pp-tabs button.on {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-color: var(--qx-main-color);
}

.pp-input {
  width: 100%;
  padding: calc(11px * var(--qx-scale));
  border-radius: var(--qx-radius-lg);
  border: 1px solid var(--qx-border);
  background: var(--qx-card-bg);
  color: var(--qx-text-color);
  font: inherit;
  margin-bottom: 10px;
}

.pp-row {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.pp-row input {
  flex: 1;

  justify-content: space-between;
  align-items: center;
  padding: calc(9px * var(--qx-scale)) calc(6px * var(--qx-scale));
  border-bottom: 1px solid var(--qx-border);
  font-size: var(--qx-fs);
  gap: 10px;
  min-height: calc(42px * var(--qx-scale));
}

.trk-row:last-child {
  border-bottom: 0;
}

.trk-row b .ms {
  margin-inline-end: calc(6px * var(--qx-scale));
}

.trk-tick {
  width: calc(32px * var(--qx-scale));
  height: calc(32px * var(--qx-scale));
  border-radius: 50%;
  border: 2px solid var(--qx-border);
  background: var(--qx-card-bg);
  font-size: var(--qx-fs-lg);
  cursor: pointer;
  flex-shrink: 0;
}

.trk-tick.on {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-color: var(--qx-main-color);
}

.trk-dots {
  display: flex;
  gap: 6px;
  margin: 6px 0 2px;
  width: 100%;
  flex-wrap: nowrap;
  overflow-x: auto;
}

.trk-dot {
  width: auto;
  height: calc(30px * var(--qx-scale));
  border-radius: var(--qx-radius-pill);
  border: 1px solid var(--qx-border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--qx-fs-xs);
  background: var(--qx-card-bg);
  flex: 1 1 0;
  min-width: 0;
}

.trk-dot.done {
  background: var(--qx-main-soft);
  border-color: var(--qx-main-color);
  color: var(--qx-main-color);
}

.trk-dot.today {
  box-shadow: 0 0 0 2px var(--qx-main-color);
}
.trk-row:focus-within {
  background: var(--qx-main-soft);
}
.trk-row>div {
  min-width: 0;
  overflow-wrap: anywhere;
}
/* [TRACKER] end */

/* [ASMA-UL-HUSNA] start */
.asma-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 10px 0;
}

.asma-card {
  background: var(--qx-card-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  padding: 12px;
  text-align: center;
  cursor: pointer;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  line-height: 1.6;
  border-bottom: 1px solid color-mix(in srgb, var(--qx-border) 70%, transparent);
}

.asma-card .ar {
  grid-column: 2;
  grid-row: 1;
  font-size: 22px;
  line-height: 1.6;
  color: var(--qx-main-color);
  direction: rtl;
  text-align: right;
}

.asma-card b {
  grid-column: 1;
  grid-row: 1;
  text-align: left;
  display: block;
  font-size: var(--qx-fs);
  line-height: 1.5;
  margin-top: 6px;
  overflow-wrap: anywhere;
}

.asma-card small {
  grid-column: 1;
  grid-row: 2;
  text-align: left;
  display: block;
  color: var(--qx-meta-color);
  font-size: var(--qx-fs-sm);
  line-height: 1.5;
  margin-top: 2px;
  overflow-wrap: anywhere;
}

.asma-card .trk-mini {
  grid-column: 2;
  grid-row: 2;
}

.asma-card.fav {
  border-color: var(--qx-main-color);
  box-shadow: 0 0 0 1px var(--qx-main-color);
}

.asma-search {
  width: 100%;
  padding: calc(11px * var(--qx-scale));
  border-radius: var(--qx-radius-lg);
  border: 1px solid var(--qx-border);
  background: var(--qx-card-bg);
  color: var(--qx-text-color);
  font: inherit;
  margin: 8px 0;
}

.asma-top {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-radius: var(--qx-radius-lg);
  padding: 14px;
  text-align: center;
  margin: 8px 0;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 6px;
  line-height: 1.6;
}

.asma-top .ar {
  font-size: calc(38px * var(--qx-scale));
  line-height: 1.6;
}
.qx-nm {
  padding-top: 12px;
}
/* [ASMA-UL-HUSNA] end */

/* [TAJWEED] start */
.tj-ghunnah {
  color: var(--qx-tj-ghunnah);
  font-weight: 700;
}

.tj-qalqalah {
  color: var(--qx-tj-qalqalah);
  font-weight: 700;
}

.tj-ikhfa {
  color: var(--qx-tj-ikhfa);
  font-weight: 700;
}

.tj-idgham {
  color: var(--qx-tj-idgham);
  font-weight: 700;
}

.tj-iqlab {
  color: var(--qx-tj-iqlab);
  font-weight: 700;
}

.tj-madd {
  color: var(--qx-tj-madd);
  font-weight: 700;
}

.tj-lam {
  color: var(--qx-tj-lam);
  font-weight: 700;
}

#tajweedLegend {
  display: none;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  background: var(--qx-card-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  padding: calc(8px * var(--qx-scale)) calc(10px * var(--qx-scale));
  margin: 8px 0;
  font-size: var(--qx-fs-xs);
}

#tajweedLegend.show {
  display: flex;
}

.tj-dot {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  vertical-align: middle;
  margin-right: 4px;
}

#tajweedToggle.on {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-color: var(--qx-main-color);
}
/* [TAJWEED] end */

/* [WORD-BY-WORD] start */
.ar,.ayah .ar,.ar-name,.bism,.aotd-ar,.asma-card .ar,.asma-top .ar,.ww-sheet .ww-ar,.hadith-item .ar,.surah-item .ar-name {
  font-family: var(--qx-font-arabic), "Noto Naskh Arabic", serif;
}
.ww-word {
  cursor: pointer;
  border-radius: var(--qx-radius);
  padding: 0 2px;
}

.ww-word:hover {
  background: color-mix(in srgb, var(--qx-main-color) 18%, transparent);
}

body.ww-on .ayah .ar .ww-word {
  border-bottom: 2px dotted var(--qx-main-color);
}

.ww-sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 140;
  background: var(--qx-card-bg);
  border-top: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg) var(--qx-radius-lg) 0 0;
  padding: calc(14px * var(--qx-scale)) calc(16px * var(--qx-scale)) calc(18px + env(safe-area-inset-bottom));
  box-shadow: 0 -10px 30px rgba(0,0,0,.25);
  max-height: 55vh;
  overflow: auto;
}

.ww-sheet .ww-ar {
  font-size: calc(44px * var(--qx-scale));
  line-height: 1.6;
  direction: rtl;
  text-align: center;
  color: var(--qx-main-color);
}

.ww-close {
  float: right;
  border: 0;
  background: none;
  font-size: calc(20px * var(--qx-scale));
  cursor: pointer;
  color: var(--qx-meta-color);
}

#wwToggle.on {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-color: var(--qx-main-color);
}

.ww-bar {
  display: none;
  gap: 8px;
  align-items: center;
  background: var(--qx-card-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  padding: calc(8px * var(--qx-scale)) calc(10px * var(--qx-scale));
  margin: 8px 0;
  font-size: var(--qx-fs-sm);
  color: var(--qx-meta-color);
}

.ww-bar.show {
  display: flex;
}
/* [WORD-BY-WORD] end */



/* [HIJRI-CALENDAR] start */
.hijri-top {
  background: linear-gradient(135deg,var(--qx-c-teal),var(--qx-c-teal-deep));
  color: var(--qx-on-teal);
  border-radius: var(--qx-radius-lg);
  padding: calc(16px * var(--qx-scale)) calc(12px * var(--qx-scale));
  text-align: center;
  margin: 8px 0;
}

.hijri-top .big {
  font-size: calc(26px * var(--qx-scale));
  font-weight: 700;
}

.hijri-cal {
  display: grid;
  grid-template-columns: repeat(7,1fr);
  gap: 4px;
  margin: 10px 0;
}

.hijri-day {
  background: var(--qx-card-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius);
  padding: calc(6px * var(--qx-scale)) 2px;
  text-align: center;
  font-size: var(--qx-fs-xs);
  min-height: calc(40px * var(--qx-scale));
  transition: background .18s ease,border-color .18s ease,transform .15s ease;
}

.hijri-day.today {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-color: var(--qx-main-color);
}

.hijri-day.event {
  border-color: var(--qx-event);
  box-shadow: inset 0 0 0 1px var(--qx-event);
  background: color-mix(in srgb,var(--qx-event) 16%,var(--qx-card-bg));
  cursor: pointer;
}

.hijri-day:hover {
  background: var(--qx-hover);
  border-color: var(--qx-main-color);
  transform: translateY(-2px);
}

.hijri-day.today:hover {
  background: var(--qx-main-color);
}

.hijri-day .hnum {
  font-weight: 700;
  font-size: var(--qx-fs-md);
}

.hijri-event {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  padding: calc(10px * var(--qx-scale));
  margin: 8px 0;
  background: var(--qx-card-bg);
  font-size: var(--qx-fs-md);
}

.hijri-event.next {
  border-color: var(--qx-main-color);
  box-shadow: 0 0 0 1px var(--qx-main-color);
}

.hijri-upcoming {
  gap: 14px;
  padding: calc(16px * var(--qx-scale)) calc(16px * var(--qx-scale));
  cursor: pointer;
}

.hijri-upcoming .he-main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.hijri-upcoming .he-name {
  font-size: var(--qx-fs-xl);
  line-height: 1.3;
  font-weight: 700;
}

.hijri-upcoming .trk-mini {
  font-size: var(--qx-fs-sm);
  line-height: 1.4;
}
.hijri-event.next .he-date-en {
  color: var(--qx-meta-color);
}

.hijri-upcoming .he-side {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
/* [HIJRI-CALENDAR] end */

/* [CLASS he-*] start */
.he-date-en {
  display: inline-block;
  font-size: var(--qx-fs-sm);
  color: var(--qx-meta-color);
  background: color-mix(in srgb, var(--qx-meta-color) 16%, transparent);
  padding: 3px calc(10px * var(--qx-scale));
  border-radius: var(--qx-radius);
  margin-top: 2px;
  letter-spacing: .1px;
  line-height: 1.35;
  align-self: flex-start;
}
.he-ring {
  position: relative;
  width: calc(62px * var(--qx-scale));
  height: calc(62px * var(--qx-scale));
}

.he-ring svg {
  display: block;
  width: 100%;
  height: 100%;
}

.he-ring circle {
  fill: none;
  stroke-width: 4;
}

.he-ring .he-track {
  stroke: var(--qx-border);
}

.he-ring .he-arc {
  stroke: var(--qx-main-color);
  stroke-linecap: round;
}

.he-ring .he-days {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  line-height: 1.1;
  font-size: var(--qx-fs-xs);
  font-weight: 700;
  color: var(--qx-main-color);
}

.he-ring .he-days b {
  font-size: var(--qx-fs-lg);
}

.he-ring .he-days small {
  font-size: calc(8px * var(--qx-scale));
  font-weight: 400;
  color: var(--qx-meta-color);
}

.he-ic {
  display: flex;
  align-items: center;
  justify-content: center;
  width: calc(38px * var(--qx-scale));
  height: calc(38px * var(--qx-scale));
  border-radius: var(--qx-radius-lg);
  background: color-mix(in srgb,var(--qx-main-color) 12%,transparent);
}

.he-ic .ms {
  font-size: calc(22px * var(--qx-scale));
  color: var(--qx-main-color);
}
/* [CLASS he-*] end */

/* [PWA-INSTALL] start */
#pwaBanner {
  display: none;
  gap: 8px;
  align-items: center;
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  border-radius: var(--qx-radius-lg);
  padding: calc(10px * var(--qx-scale)) calc(12px * var(--qx-scale));
  margin: 8px 0;
  font-size: var(--qx-fs-md);
}

#pwaBanner.show {
  display: flex;
}

#pwaBanner button {
  border: 0;
  border-radius: var(--qx-radius);
  padding: calc(8px * var(--qx-scale)) calc(12px * var(--qx-scale));
  font-weight: 700;
  cursor: pointer;
  background: var(--qx-on-teal);
  color: var(--qx-main-color);
}

#pwaBanner .x {
  background: none;
  color: var(--qx-on-main);
  font-size: var(--qx-fs-lg);
  padding: calc(4px * var(--qx-scale));
}
/* [PWA-INSTALL] end */

/* [HADITH] start */
.hadith-pkg {
  background: var(--qx-card-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  padding: calc(14px * var(--qx-scale));
  margin: 10px 0;
  cursor: pointer;
}

.hadith-pkg h3 {
  margin: 0;
  color: var(--qx-main-color);
}

.hadith-pkg .sub {
  font-size: var(--qx-fs-sm);
  color: var(--qx-meta-color);
  margin-top: 4px;
}

.hadith-item {
  background: var(--qx-card-bg);
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  padding: calc(12px * var(--qx-scale));
  margin: 8px 0;
  cursor: pointer;
  position: relative;
}

.hadith-item .ar {
  font-size: calc(22px * var(--qx-scale));
  direction: rtl;
  text-align: right;
  color: var(--qx-main-color);
  line-height: 1.8;
}

.hadith-item b {
  font-size: var(--qx-fs);
}

.hadith-item .ref {
  font-size: var(--qx-fs-xs);
  color: var(--qx-meta-color);
  padding-right: 48px;
}

.hadith-item.done {
  border-color: var(--qx-main-color);
}
.hadith-item .qx-star {
  position: absolute;
  right: 8px;
  bottom: 8px;
}
/* [HADITH] end */




/* [TOPICS] start */
.qx-topic-sort {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 6px;
}

.surah-list-heading:has(.qx-topic-sort) {
  flex-wrap: nowrap;
  gap: 8px;
  justify-content: flex-start;
}

.surah-list-heading:has(.qx-topic-sort) span {
  flex: 0 0 auto;
}

.surah-list-heading:has(.qx-topic-sort) .qx-view-toggle {
  flex: 0 0 auto;
}
/* [TOPICS] end */

/* [BACK-LINK] start */
.qx-back-link {
  display: inline-block;
  min-height: 0;
  margin: 0 0 10px;
  padding: calc(6px * var(--qx-scale)) calc(4px * var(--qx-scale));
  border: none;
  background: none;
  color: var(--qx-main-color);
  font-weight: 600;
  cursor: pointer;
}
/* [BACK-LINK] end */








/* [AYAH-CARD] start */
.surah-item .num {
  flex: 0 0 36px;
  font-variant-numeric: tabular-nums;
}

.surah-item .mid {
  min-width: 0;
}

.surah-item .mid b {
  font-size: var(--qx-fs-lg);
  line-height: 1.35;
}

.surah-item .mid small {
  display: block;
  margin-top: 3px;
  line-height: 1.45;
  font-size: var(--qx-fs-sm);
}

.surah-item .ar-name {
  flex: 0 0 auto;
  max-width: 34%;
  overflow-wrap: anywhere;
  text-align: right;
  font-size: calc(22px * var(--qx-scale));
  line-height: 1.5;
  white-space: nowrap;
}

body.inside-page .ayah .ar {
  max-width: 100%;
}

body.inside-page .ayah .bn {
  max-width: 78ch;
}

body.inside-page .ayah .icon-btn:focus-visible, body.inside-page .ayah .star:focus-visible, body.inside-page .ayah .more-btn:focus-visible {
  outline: 2px solid var(--qx-main-color);
  outline-offset: 2px;
}
.mid b,.mid small {
  overflow-wrap: anywhere;
}
.ayah .ar, .ar-name {
  direction: rtl;
  unicode-bidi: isolate;
  line-height: 2.1;
}
.surah-grid:not(.is-list) .surah-item .num {
  order: 1;
  flex: 0 0 32px;
  min-width: calc(32px * var(--qx-scale));
  height: calc(32px * var(--qx-scale));
  font-size: var(--qx-fs-sm);
}

.surah-grid:not(.is-list) .surah-item .ar-name {
  order: 2;
  margin-left: auto;
  max-width: none;
  font-size: var(--qx-fs-xl);
}

.surah-grid:not(.is-list) .surah-item .mid {
  order: 3;
  flex: 1 1 100%;
}
.surah-grid.is-list .surah-item .num {
  flex: 0 0 36px;
  min-width: calc(36px * var(--qx-scale));
  height: calc(36px * var(--qx-scale));
  font-size: var(--qx-fs-sm);
}

.surah-grid.is-list .surah-item .mid {
  flex: 1 1 auto;
  min-width: 0;
}

.surah-grid.is-list .surah-item .ar-name {
  margin-left: auto;
  max-width: none;
  font-size: var(--qx-fs-xl);
}
/* [AYAH-CARD] end */

/* [AYAH-OF-THE-DAY] start */
.aotd-card {
  background: var(--qx-card-bg);
  border: 1px solid var(--qx-border);
  border-left: 4px solid var(--qx-main-color);
  border-radius: var(--qx-radius-lg);
  padding: calc(14px * var(--qx-scale));
  margin: 10px 0 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

.aotd-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.aotd-badge {
  font-size: var(--qx-fs-sm);
  font-weight: 600;
  color: var(--qx-main-color);
  display: flex;
  align-items: center;
  gap: 5px;
}

.aotd-ref {
  font-size: var(--qx-fs-sm);
  color: var(--qx-meta-color);
}

.aotd-ar {
  font-size: calc(var(--qx-fs-ar) - 4px);
  line-height: 2;
  direction: rtl;
  text-align: right;
  margin: 6px 0;
}

.aotd-bn {
  font-size: var(--qx-fs);
  line-height: 1.65;
  color: var(--qx-text-color);
  margin-top: 6px;
}

.aotd-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid var(--qx-border);
}

.aotd-link {
  font-size: var(--qx-fs-sm);
  color: var(--qx-main-color);
  background: none;
  border: 0;
  padding: calc(4px * var(--qx-scale)) 0;
  cursor: pointer;
  font-weight: 600;
}
.ayah .bn,.aotd-bn {
  font-size: var(--qx-fs-bn);
}
.aotd-card, .goal-bar, .resume {
  display: none;
}
.sheet-box .aotd-card {
  display: block;
  margin-top: 4px;
}
.ayah .bn,.aotd-bn,.tafseer-body,.note-box {
  overflow-wrap: anywhere;
}
/* [AYAH-OF-THE-DAY] end */





/* [FOOTER-MENU] start */
nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  gap: 0;
  justify-content: space-around;
  background: none;
  border-top: 1px solid var(--qx-border);
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 6;
  transition: transform .25s ease;
  justify-content: center;
  padding-left: 0;
  padding-right: 0;
  --qx-notch-r: calc(12px * var(--qx-scale) + 12px);
  --qx-notch-cy: calc(12px * var(--qx-scale) - 6px);
  border: 0;
  box-shadow: none;
}

nav button {
  flex: 1 1 0;
  min-width: 0;
  border: 0;
  border-radius: 0;
  background: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 4px;
  padding: 6px 2px;
  min-height: 52px;
  font-size: var(--qx-fs-xs);
  color: var(--qx-meta-color);
  text-align: center;
}

nav button b {
  font-size: calc(20px * var(--qx-scale));
  font-weight: 400;
  width: calc(24px * var(--qx-scale));
  height: calc(24px * var(--qx-scale));
  display: grid;
  place-items: center;
  line-height: 1;
  flex-shrink: 0;
}

nav button span {
  font-size: var(--qx-fs-xs);
  line-height: 1.15;
  white-space: normal;
  text-align: center;
  display: block;
  max-width: 100%;
}

nav button .ms {
  font-size: calc(20px * var(--qx-scale));
  line-height: 1;
}
nav button.on {
  color: var(--qx-main-color);
  font-weight: 600;
}
nav button[data-m="quran"] b {
  position: relative;
  transform: translateY(-12px);
  margin-bottom: 0;
}

nav button[data-m="quran"] b::before {
  content: "";
  position: absolute;
  inset: -7px;
  border-radius: 50%;
  background: var(--qx-card-bg);
  border: 1px solid var(--qx-border);
  box-shadow: var(--qx-shadow);
  z-index: -1;
}

nav button[data-m="quran"].on b {
  color: var(--qx-on-main);
}

nav button[data-m="quran"].on b::before {
  background: var(--qx-main-color);
  border-color: var(--qx-main-color);
}

nav button[data-m="quran"] span {
  margin-top: 0;
}
body.bars-hidden nav {
  transform: translateY(110%);
}
.ms.f,nav button.on .ms,button:active .ms,.g-menu-item:active .ms {
  font-variation-settings: 'FILL' 1;
}
nav button.on .dua-ic {
  stroke-width: 1.7;
}
html body .ms.qi.f::before,
html body nav button.on .ms.qi::before,
html body button:active .ms.qi::before,
html body .g-menu-item:active .ms.qi::before {
  content: var(--qi-s);
}
nav::before,
nav::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
}

nav::before {
  background: var(--qx-card-bg);
  border-top: 1px solid var(--qx-border);
  -webkit-mask-image: radial-gradient(circle at 50% var(--qx-notch-cy), transparent var(--qx-notch-r), #000 calc(var(--qx-notch-r) + .5px));
  mask-image: radial-gradient(circle at 50% var(--qx-notch-cy), transparent var(--qx-notch-r), #000 calc(var(--qx-notch-r) + .5px));
}

nav::after {
  background: radial-gradient(circle at 50% var(--qx-notch-cy),
    transparent calc(var(--qx-notch-r) - .5px),
    var(--qx-border) var(--qx-notch-r),
    var(--qx-border) calc(var(--qx-notch-r) + 1px),
    transparent calc(var(--qx-notch-r) + 1.5px));
}
nav button b .ms {
  margin: 0;
}
/* [FOOTER-MENU] end */





/* [SURAH-LIST] start */
.surah-list-heading {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  max-width: 820px;
  margin: 18px auto 8px;
  padding: 0 2px;
  color: var(--qx-text-color);
}

.surah-list-heading span {
  font-size: var(--qx-fs-sm);
  color: var(--qx-meta-color);
  white-space: nowrap;
}
.surah-item {
  min-height: calc(68px * var(--qx-scale));
  transition: border-color .16s ease,background .16s ease;
}

.surah-item:focus-visible {
  outline: 2px solid var(--qx-main-color);
  outline-offset: 2px;
}

.surah-item:hover {
  border-color: var(--qx-main-color);
  background: var(--qx-tile-bg);
}
.surah-meta {
  display: flex;
  align-items: center;
  gap: 6px 8px;
  flex-wrap: wrap;
  margin-top: 5px;
  min-width: 0;
}

.surah-meta span {
  font-size: var(--qx-fs-xs);
  line-height: 1.35;
  color: var(--qx-meta-color);
}

.surah-meta .surah-meaning {
  font-size: var(--qx-fs-sm);
  color: var(--qx-text-color);
  opacity: .78;
  min-width: 0;
}

.surah-meta .surah-revelation,.surah-meta .surah-ayah-count {
  padding: 2px calc(7px * var(--qx-scale));
  border-radius: var(--qx-radius-pill);
  background: var(--qx-tile-bg);
  border: 1px solid var(--qx-border);
  white-space: nowrap;
}

.surah-meta .surah-revelation {
  color: var(--qx-main-color);
  font-weight: 600;
}
.surah-grid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 8px;
}

.surah-grid .surah-item {
  margin: 0;
  min-height: 0;
}

.surah-grid:not(.is-list) .surah-item {
  padding: calc(10px * var(--qx-scale));
  gap: 6px 8px;
  flex-wrap: wrap;
  align-content: flex-start;
}
.surah-grid.is-list {
  grid-template-columns: minmax(0,1fr);
}

.surah-grid.is-list .surah-item {
  padding: calc(10px * var(--qx-scale)) calc(12px * var(--qx-scale));
  gap: 12px;
  flex-wrap: nowrap;
  align-items: center;
}
/* [SURAH-LIST] end */


/* [HOME-PAGE] start */
.home-hero {
  display: flex;
  overflow: hidden;
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  background: var(--qx-card-bg);
  margin: 10px 0 12px;
  flex-direction: column;
}

.home-hero-left {
  flex: 1;
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  padding: calc(14px * var(--qx-scale));
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
}

.home-hero-left .play {
  font-size: calc(22px * var(--qx-scale));
}

.home-hero-left .lbl {
  font-size: var(--qx-fs-md);
  opacity: .9;
}

.home-hero-left .val {
  font-size: var(--qx-fs-lg);
  font-weight: 700;
  line-height: 1.3;
}

.home-hero-right {
  flex: 1;
  padding: calc(14px * var(--qx-scale));
  cursor: pointer;
}

.home-hero-right .top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: var(--qx-fs-md);
  color: var(--qx-main-color);
}

.home-hero-right .val {
  font-size: var(--qx-fs-lg);
  font-weight: 700;
  color: var(--qx-text-color);
  margin: 6px 0 8px;
}

.home-hero-right .track {
  height: 6px;
  background: var(--qx-border);
  border-radius: var(--qx-radius-pill);
  overflow: hidden;
}

.home-hero-right .fill {
  height: 100%;
  background: var(--qx-main-color);
  border-radius: var(--qx-radius-pill);
}
.home-tiles {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 10px;
  margin: 12px auto 18px;
  max-width: 100%;
  width: 100%;
}

.home-tile {
  min-width: 0;
  min-height: 76px;
  display: grid;
  grid-template-columns: auto minmax(0,1fr);
  align-items: center;
  gap: 10px;
  padding: calc(10px * var(--qx-scale)) calc(12px * var(--qx-scale));
  text-align: left;
  background: var(--qx-card-bg);
  border: 1px solid color-mix(in srgb,var(--qx-main-color) 35%,var(--qx-border));
  border-radius: var(--qx-radius-lg);
  cursor: pointer;
  box-shadow: var(--qx-shadow);
  transition: background 0.22s ease,transform 0.18s ease,box-shadow 0.22s ease,border-color 0.22s ease;
}

.home-tile:hover {
  background: var(--qx-hover);
  border-color: var(--qx-main-color);
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
  transform: translateY(-2px);
}

.home-tile:active {
  border-color: var(--qx-main-color);
  transform: translateY(0) scale(.985);
}
.home-tile .t-ic {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: var(--qx-radius-lg);
  background: color-mix(in srgb,var(--qx-main-color) 12%,transparent);
  line-height: 1;
  color: var(--qx-main-color);
}

.home-tile .t-ic .ms {
  font-size: 22px;
  line-height: 1;
  transition: transform 0.2s ease;
}

.home-tile:hover .t-ic .ms {
  transform: scale(1.08);
}

.home-tile .tile-copy {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 3px;
  min-width: 0;
}

.home-tile .tile-copy b {
  font-size: var(--qx-fs-sm);
  color: var(--qx-meta-color);
  font-weight: 600;
}

.home-tile .tile-copy strong {
  font-size: var(--qx-fs);
  line-height: 1.35;
  color: var(--qx-text-color);
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.home-tile .tile-copy small {
  font-size: var(--qx-fs-xs);
  color: var(--qx-meta-color);
  line-height: 1.35;
}
.home-browse-nav {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  padding: 3px 1px calc(10px * var(--qx-scale));
  margin: 2px 0 10px;
  scrollbar-width: thin;
  -webkit-overflow-scrolling: touch;
}

.home-browse-nav button {
  flex: 0 0 auto;
  min-height: calc(38px * var(--qx-scale));
  padding: calc(8px * var(--qx-scale)) calc(15px * var(--qx-scale));
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-pill);
  background: var(--qx-card-bg);
  color: var(--qx-text-color);
  font: inherit;
  font-size: var(--qx-fs-md);
  font-weight: 600;
  cursor: pointer;
}

.home-browse-nav button.on {
  background: var(--qx-main-color);
  border-color: var(--qx-main-color);
  color: var(--qx-on-main);
}

.home-browse-nav.is-sticky {
  position: sticky;
  top: var(--qx-hdr-h,62px);
  z-index: 4;
  margin: 0 calc(-1 * var(--qx-gutter,12px)) 8px;
  padding: calc(8px * var(--qx-scale)) var(--qx-gutter,calc(12px * var(--qx-scale)));
  background: var(--qx-bg);
  border-bottom: 1px solid var(--qx-border);
  transition: transform .25s ease;
}

body.bars-hidden .home-browse-nav.is-sticky {
  transform: translateY(calc(-100% - var(--qx-hdr-h,62px)));
}

.home-browse-heading {
  padding: calc(10px * var(--qx-scale)) 2px calc(12px * var(--qx-scale));
}

.home-browse-heading h2 {
  font-size: var(--qx-fs-xl);
  line-height: 1.4;
  margin: 0 0 4px;
}

.home-browse-heading p {
  font-size: var(--qx-fs-md);
  color: var(--qx-meta-color);
  margin: 0;
}

@supports (height:100dvh) {

  }

  }

    max-height: 88dvh;
  }

  }

  }
}

@keyframes fadeInOut {
  0% {
    opacity: 0;
  transform: translate(-50%, -10px);
  }
  10%, 85% {
    opacity: 1;
  }
  100% {
    opacity: 0;
  }
}

.hijri-info-overlay.open {
  display: flex;
}

.hijri-info-box {
  position: relative;
  width: min(100%,560px);
  max-height: min(84dvh,760px);

  background: var(--qx-card-bg);

  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius-lg);
  padding: calc(22px * var(--qx-scale)) calc(20px * var(--qx-scale)) calc(20px * var(--qx-scale));

}

.hijri-info-close {

  border: 1px solid var(--qx-border);
  border-radius: 50%;
  background: var(--qx-hover);
  color: var(--qx-text-color);
  font-size: calc(20px * var(--qx-scale));
  line-height: 1;
  display: grid;
  place-items: center;
  cursor: pointer;
}

.hijri-info-title {
  font-size: calc(21px * var(--qx-scale));

}

.hijri-info-date {
  font-size: var(--qx-fs-sm);
  color: var(--qx-meta-color);

}

.hijri-info-section {
  margin: 13px 0 0;
  padding-top: 11px;
  border-top: 1px solid var(--qx-border);
}

.hijri-info-section b {
  display: block;
  font-size: var(--qx-fs-md);
  color: var(--qx-main-color);
  margin-bottom: 5px;
}

.hijri-info-section p {
  font-size: var(--qx-fs-md);
  line-height: 1.75;
  margin: 0;
  white-space: pre-line;
}

.hijri-info-section p.hijri-info-source {
  font-size: var(--qx-fs-xs);
  color: var(--qx-meta-color);
  font-style: italic;
  line-height: 1.65;
}

.hijri-day.event:focus-visible,.hijri-upcoming:focus-visible {
  outline: 2px solid var(--qx-main-color);

}

.qx-view-toggle {
  display: flex;
  gap: 6px;
}

.qx-view-btn {
  display: grid;
  place-items: center;
  width: calc(36px * var(--qx-scale));
  height: calc(36px * var(--qx-scale));
  min-height: 0;
  padding: 0;
  border: 1px solid var(--qx-border);
  border-radius: var(--qx-radius);
  background: var(--qx-card-bg);
  color: var(--qx-meta-color);
  font-size: var(--qx-fs-lg);

}

.qx-view-btn.on {

.qx-list {
  background: var(--qx-card-bg);

.qx-row:hover {

.qx-row-ic {

.qx-row-tx {

.qx-row-tx b {

}

.qx-row-tx small {

}

.qx-row-go {

.qx-list.qx-list-spaced {

.qx-list.qx-list-spaced .qx-row {

.qx-list.qx-list-spaced .qx-row:hover {

}

  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: var(--qx-pad-xl);
  text-align: center;
}

.qx-empty b {
  font-size: var(--qx-fs);
}

.qx-empty small {
  font-size: var(--qx-fs-sm);
  color: var(--qx-meta-color);
}

/* [CLASS qx-gh-*] start */
.qx-gh {
  margin: 18px 2px 6px;

  font-weight: 700;
  color: var(--qx-main-color);
}
/* [CLASS qx-gh-*] end */


/* [CLASS qx-sn-*] start */
.qx-sn {
  font-size: var(--qx-fs-md);
  margin: 4px 0;
}

.qx-saved .ayah .star,.qx-saved .ayah .read-btn {

.qx-saved .hadith-item {

.qx-saved-act,.qx-fbar {

}

.qx-seg button {

  flex: 1;
  padding: calc(9px * var(--qx-scale)) calc(6px * var(--qx-scale));
  border-radius: var(--qx-radius);

  color: var(--qx-text-color);
  font-size: var(--qx-fs);
  font-weight: 600;

}

.qx-seg button.on {
  background: var(--qx-main-color);
  color: var(--qx-on-main);
}
.qx-link {

  align-items: center;
  gap: 4px;
  padding: calc(8px * var(--qx-scale)) 2px;

  color: var(--qx-main-color);
  font-size: var(--qx-fs-sm);
  font-weight: 600;
  cursor: pointer;

.qx-link.danger {

}

.qx-btn {
  border: 0;
  display: block;
  width: 100%;
  margin: 12px 0 0;
  padding: var(--qx-pad-item);
  border-radius: var(--qx-radius);
  background: var(--qx-main-color);
  color: var(--qx-on-main);
  font-size: var(--qx-fs);
  font-weight: 700;
  cursor: pointer;
}

.qx-btn.ghost {

.qx-input {

/* [KHATAM] start */
.khatam-dot.part {

}

  color: var(--qx-danger);
}

.khatam-dot.ticked {
  font-weight: 700;
}

.khatam-dot.ticked::after {
  content: "\2713";
  position: absolute;
  top: -6px;
  right: -5px;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: calc(9px * var(--qx-scale));
  line-height: 1;
  background: var(--qx-card-bg);
  color: var(--qx-main-color);
  border: 1px solid var(--qx-main-color);
}

}

  height: 1em;
  fill: currentColor;
  stroke: none;
  display: inline-block;
  vertical-align: -.2em;
}
/* [ICONS] end */


/* [ANIMATION qxTsbRipple] start */
@keyframes qxTsbRipple {
  0% { opacity: 1;
  transform: scale(1.05);
  } 100% { opacity: 0;
  }
}
/* [ANIMATION qxTsbRipple] end */

/* [CLASS qx-tsb-*] start */
.qx-tsb-btn:focus-visible {
  outline: 3px solid var(--qx-main-color);
  outline-offset: 4px;
}

.qx-tsb-count.tap {
  animation: qxTsbTap .18s ease-out;
}
.qx-tsb-btn.cycle-done {
  animation: qxTsbDone .6s ease-out;
}
.qx-tsb-opt .ms {
  font-size: calc(20px * var(--qx-scale));
  width: calc(20px * var(--qx-scale));
}

.qx-tsb-opt:active {
  transform: scale(.96);
}

.qx-tsb-opt:focus-visible {
  outline: 2px solid var(--qx-main-color);
  outline-offset: 2px;
}
.qx-tsb-btn::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--qx-main-color) 30%, transparent) 0, transparent 70%);
  opacity: 0;
  transform: scale(.6);
  pointer-events: none;
}

.qx-tsb-btn.ripple::after {
  animation: qxTsbRipple .38s ease-out;
}
.qx-tsb-arc.empty {
  opacity: 0;
}

.qx-tsb-opt.danger .ms {
  font-size: calc(20px * var(--qx-scale));
}
/* [CLASS qx-tsb-*] end */


/* [AUDIO-BAR] start */
.audio-progress-top {

  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: var(--qx-border);
}

.audio-progress-top input[type=range] {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 4px;
  margin: 0;
  -webkit-appearance: none;
  appearance: none;
  background: transparent;
  z-index: 2;
}

.audio-progress-top input::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--qx-main-color);
  margin-top: -4px;
}

.audio-progress-fill {
  position: absolute;
  top: 0;
  left: 0;
  height: 4px;
  background: var(--qx-main-color);
  width: 0%;
  z-index: 1;
  transition: width .2s;
}

.audio-top-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 12px 6px;
}

.audio-top-actions {

  gap: 4px;
}

.audio-top-actions button {

  height: 32px;
  border-radius: 50%;
  border: 1px solid var(--qx-border);
  background: var(--qx-card-bg);

  place-items: center;
}

.audio-bottom {

  justify-content: space-between;
  font-size: 12px;
  color: var(--qx-meta-color);
  padding: 0 14px 10px;
}

.audio-float {

  right: 16px;
  z-index: 998;
}

.audio-float.with-nav {

}

.audio-float button {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--qx-main-color);
  color: #fff;
  border: none;
  box-shadow: 0 4px 12px rgba(0,0,0,.2);

  place-items: center;

/* [QIBLA] start */

/* [PAGE-TOOLS] start */
/* P13 Home / More menu - separate roles */

/* ===== পেজ টুলবার ও কার্ড ভিউ (হোম + আরও): apps.js-এর qxPageTools ===== */
.qx-page-tools {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin: 2px 0 6px;
}

.qx-tool-btn {
  width: 36px;

  padding: 0;

.qx-tool-btn:hover,
.qx-tool-btn:active {

  color: var(--qx-main-color);
}

  height: 20px;

/* নামাজ শিক্ষা ইত্যাদি .qx-sec-page-এ কাউন্ট বাঁয়ে, গ্রিড/লিস্ট বাটন ডানে */

  width: 100%;
  max-width: none;
  margin: 6px 0 0;
}
/* নামাজ শিক্ষা: অধ্যায় সংখ্যা বামে, গ্রিড/লিস্ট বাটন ডানে (DOM ক্রম যাই হোক) */
.qx-sec-page .surah-list-heading {
  display: flex;
  flex-direction: row;
  justify-content: space-between;
  align-items: center;
  text-align: left;
}

.qx-sec-page .surah-list-heading > span {
  order: 0;
  margin-right: auto;
}

.qx-sec-page .surah-list-heading > :not(span) {
  order: 2;
  margin-left: auto;
  flex: 0 0 auto;
}
/* [PAGE-TOOLS] end */



/* [HERO] start */
/* ===== নামাজের সময়: ফ্লিপ ক্লক কাউন্টডাউন, ক্যালেন্ডার আইকন, শব্দ বাটন ===== */
.hero-date.hero-date-ic {
  display: grid;
  place-items: center;
  width: calc(40px * var(--qx-scale));
  height: calc(40px * var(--qx-scale));
}

.hero-date.hero-date-ic .ms {
  font-size: calc(22px * var(--qx-scale));
}

.hero-snd {
  position: absolute;
  top: 10px;
  right: 10px;
  width: calc(40px * var(--qx-scale));
  height: calc(40px * var(--qx-scale));
  display: grid;
  place-items: center;
  padding: 0;
  border: 0;
  border-radius: var(--qx-radius-lg);
  background: var(--qx-hero-chip);
  color: var(--qx-on-main);
  cursor: pointer;
}

.hero-snd .ms {
  font-size: calc(22px * var(--qx-scale));
}
.hero-snd.off {
  opacity: .6;
}

.hero-snd.off::after {
  content: "";
  position: absolute;
  width: 55%;
  height: 2px;
  background: currentColor;
  border-radius: 2px;
  transform: rotate(-45deg);
}

.hero {
  padding-top: calc(18px * var(--qx-scale));
}

.hero > small {
  display: block;
  margin: 0 calc(70px * var(--qx-scale));
}
/* [HERO] end */


/* [ANIMATION qxFlipDigit] start */
@keyframes qxFlipDigit {
  0% { transform: perspective(320px) rotateX(-90deg); transform-origin: top; opacity: .2; }
  45% { transform: perspective(320px) rotateX(18deg); transform-origin: top; opacity: .85; }
  100% { transform: perspective(320px) rotateX(0); transform-origin: top; opacity: 1; }
}
/* [ANIMATION qxFlipDigit] end */

/* [PRAYER-FLIP-CLOCK] start */
.hero-date.qx-cal-transparent{
  background: transparent;
  border: none;
  box-shadow: none;
  width: calc(56px * var(--qx-scale));
  height: calc(60px * var(--qx-scale));
  display:grid;
  place-items:center;
  padding:0;
  overflow: visible;
}
.qx-cal-wrap{position:relative; display:grid; place-items:center; width:calc(56px * var(--qx-scale)); height:calc(60px * var(--qx-scale)); color: var(--qx-on-main);}
.qx-cal-wrap > .ms{font-size:calc(52px * var(--qx-scale)); color:currentColor; opacity:.95; line-height:1;}
.qx-cal-date{
  position:absolute; top:64%; left:50%; transform:translate(-50%,-50%);
  font-size:calc(22px * var(--qx-scale)); font-weight:800; color:currentColor; line-height:1;
  font-variant-numeric:tabular-nums;
}
/* তারিখ থাকলে আইকন নিজে আঁকা ক্যালেন্ডার: মোটা মাথা, দুই রিং, ভেতরে তারিখ */
.qx-cal-wrap:has(> .qx-cal-date) > .ms{visibility:hidden;}
.qx-cal-wrap:has(> .qx-cal-date)::before{
  content:""; position:absolute;
  inset: calc(6px * var(--qx-scale)) calc(2px * var(--qx-scale)) 0;
  border: 2.5px solid currentColor; border-radius: calc(11px * var(--qx-scale));
  background: linear-gradient(currentColor, currentColor) top / 100% 30% no-repeat;
}
.qx-cal-wrap:has(> .qx-cal-date)::after{
  content:""; position:absolute; top:0; left:calc(14px * var(--qx-scale));
  width: calc(5px * var(--qx-scale)); height: calc(13px * var(--qx-scale));
  border-radius: 3px; background: currentColor;
  box-shadow: calc(22px * var(--qx-scale)) 0 0 currentColor;
}


.qx-flip {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 6px;
  margin: 12px 0 2px;
}

.qx-flip-grp {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.qx-flip-digs {
  display: flex;
  gap: 4px;
}

.qx-fd {
  position: relative;
  display: grid;
  place-items: center;
  width: calc(34px * var(--qx-scale));
  height: calc(48px * var(--qx-scale));
  background-image: linear-gradient(#fff 50%, #ececec 50%);
  color: #1f2a29;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0,0,0,.28);
  overflow: hidden;
}

.qx-fd b {
  font-size: calc(30px * var(--qx-scale));
  line-height: 1;
  font-weight: 700;
}

.qx-fd::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  height: 1px;
  background: rgba(0,0,0,.06);
  box-shadow: none;
}

.qx-flip-colon {
  display: grid;
  place-items: center;
  height: calc(48px * var(--qx-scale));
  font-size: calc(28px * var(--qx-scale));
  font-weight: 700;
  line-height: 1;
  background: linear-gradient(180deg, var(--qx-colon-a) 25%, var(--qx-colon-b) 75%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}

.qx-flip-grp small {
  font-size: var(--qx-fs-xs);
  opacity: .9;
}
.qx-fd.flip {
  transform-style: preserve-3d;
}

.qx-fd.flip b {
  animation: qxFlipDigit .36s cubic-bezier(.2,.7,.3,1) both;
  backface-visibility: hidden;
  will-change: transform, opacity;
}
/* [PRAYER-FLIP-CLOCK] end */


/* [MEDIA (prefers-reduced-motion: reduce)] start */
@media (prefers-reduced-motion: reduce) {
  .qx-fd.flip b {
    animation: none;
  }
}
/* [MEDIA (prefers-reduced-motion: reduce)] end */

body.qx-g-ptr {

/* [PULL-TO-REFRESH] start */
.qx-ptr {
  position: fixed;
  left: 50%;
  top: calc(env(safe-area-inset-top, 0px) + 8px);
  z-index: 140;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  margin-left: -20px;
  border: 1px solid var(--qx-border);
  border-radius: 50%;
  background: var(--qx-card-bg);
  color: var(--qx-main-color);
  box-shadow: var(--qx-shadow);
  opacity: 0;
  transform: translateY(-70px);
  pointer-events: none;
}

.qx-ptr.snap {
  transition: transform .2s ease, opacity .2s ease;
}

.qx-ptr.spin .ms {
  animation: qxPtrSpin .8s linear infinite;
}
/* [PULL-TO-REFRESH] end */

/* [ANIMATION qxPtrSpin] start */
@keyframes qxPtrSpin {
  to { transform: rotate(360deg); }
}
/* [ANIMATION qxPtrSpin] end */

/* [ANIMATION qxDblPulse] start */
@keyframes qxDblPulse {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--qx-main-color) 55%, transparent); }
  100% { box-shadow: 0 0 0 14px transparent; }
}
/* [ANIMATION qxDblPulse] end */

.qx-fa-progress{height:5px;background:var(--qx-border);border-radius:10px;position:relative;margin:22px 2px 7px;overflow:visible}
.qx-fa-progress span{display:block;height:100%;width:0;background:var(--qx-main-color);border-radius:10px;pointer-events:none}
.qx-fa-progress input{position:absolute;inset:-7px 0;width:100%;height:19px;margin:0;opacity:0;cursor:pointer;z-index:2}
.qx-fa-time{display:flex;justify-content:space-between;font-size:11px;color:var(--qx-meta-color);font-variant-numeric:tabular-nums}
.qx-fa-controls{display:flex;align-items:center;justify-content:center;gap:14px;margin:15px 0 1px}
.qx-fa-controls button{width:42px;height:42px;border:1px solid var(--qx-border);border-radius:50%;background:var(--qx-tile-bg);color:var(--qx-text-color);display:grid;place-items:center;padding:0}
.qx-fa-controls button .ms{font-size:23px}
.qx-fa-controls .qx-fa-main-play{width:54px;height:54px;background:var(--qx-main-color);color:#fff;border-color:var(--qx-main-color)}
.qx-fa-controls .qx-fa-main-play .ms{font-size:29px}
.qx-fa-controls #qxFaRead{width:42px;height:42px;color:var(--qx-main-color);border-color:var(--qx-main-color)}
.qx-fa-controls button:disabled{opacity:.4}
.qx-fa-list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 2px 10px}
.qx-fa-list-head h3{font-size:16px;margin:0;white-space:nowrap}
.qx-fa-list-head h3 span{font-size:12px;color:var(--qx-meta-color);font-weight:500;margin-left:4px}
.qx-fa-search{display:flex;align-items:center;gap:6px;min-width:0;width:min(48%,210px);height:36px;padding:0 10px;border:1px solid var(--qx-border);border-radius:20px;background:var(--qx-card-bg);color:var(--qx-meta-color);box-sizing:border-box}
.qx-fa-search .ms{font-size:18px;flex:0 0 auto}
.qx-fa-search input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--qx-text-color);font:inherit;font-size:13px}
.qx-fa-list{display:flex;flex-direction:column;gap:5px}
.qx-fa-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:58px;padding:8px 10px;border:1px solid var(--qx-border);border-radius:13px;background:var(--qx-card-bg);box-sizing:border-box}
.qx-fa-row.current{border-color:var(--qx-main-color);background:var(--qx-hover)}
.qx-fa-row-info{display:flex;align-items:center;gap:11px;min-width:0;flex:1}
.qx-fa-num{width:31px;height:31px;flex:0 0 31px;display:grid;place-items:center;border-radius:9px;background:var(--qx-tile-bg);color:var(--qx-meta-color);font-size:12px}
.qx-fa-names{display:flex;flex-direction:column;min-width:0;gap:2px}
.qx-fa-names strong{font-size:14px;line-height:1.35;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qx-fa-names small{font-size:11px;color:var(--qx-meta-color);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qx-fa-row-play{width:38px;height:38px;flex:0 0 38px;border:1px solid var(--qx-border);border-radius:50%;background:var(--qx-tile-bg);color:var(--qx-main-color);display:grid;place-items:center;padding:0;font-size:21px}
.qx-fa-empty{text-align:center;color:var(--qx-meta-color);padding:20px}
@media(max-width:420px){.qx-full-audio-page{padding-left:9px;padding-right:9px}.qx-fa-player{padding:16px 12px 12px}.qx-fa-controls{gap:10px}.qx-fa-list-head{gap:7px}.qx-fa-list-head h3{font-size:15px}.qx-fa-search{width:46%}}
/* [FULL-SURAH-AUDIO-PAGE] end */

</style>
</head>
<body>
<!-- SECTION INDEX (search: [NAME] start)
  [HEADER] > [MORE-MENU]
  [CONTROLS]
  [APP-MOUNT] (pages like Home/Prayer/Quran/Dua/More render here via js/*.js)
  [HIFZ-BAR] [WW-BAR] [TAJWEED-LEGEND] [DOWNLOAD-BAR]
  [AUDIO-BAR] [AUDIO-FLOAT]
  [FOOTER-MENU]
  [GRID-POPUP] [SCRIPTS]
  Items inside: [PARENT > Name item]  e.g. [FOOTER-MENU > Home item] -->
<a class="qx-skip-link" href="#app">মূল কনটেন্টে যান</a>
<!-- [HEADER] start -->
<header>
  <div class="bar">
    <!-- [HEADER > Width toggle item] -->
    <button id="widthToggle" class="header-btn" aria-label="পড়ার প্রস্থ পরিবর্তন করুন" title="পড়ার প্রস্থ: সংকীর্ণ / পূর্ণ" aria-pressed="false"><svg class="ms-svg-fill wt-wide" viewBox="0 0 24 24" aria-hidden="true"><path d="M4,20q-0.82,0-1.41-0.59T2,18V6Q2,5.18 2.59,4.59T4,4H20q0.83,0 1.41,0.59Q22,5.18 22,6V18q0,0.82-0.59,1.41T20,20H4ZM20,6H4V18H20V6ZM4,6V18V6Zm5,9V9L6,12l3,3Zm9-3L15,9v6l3-3Z"/></svg><span class="ms wt-narrow" aria-hidden="true">fullscreen_exit</span></button>
    <!-- [HEADER > Back button item] -->
    <button id="back" class="back-btn-hidden" type="button" aria-label="পেছনে যান"><span class="ms" aria-hidden="true">chevron_left</span></button>
    <!-- [HEADER > Logo item] -->
    <img class="app-logo" src="icons/icon-192.png" onerror="this.onerror=null;this.src='icons/icon-192x192.png'" alt="Quranix" width="32" height="32" style="cursor:pointer;border-radius:var(--qx-radius)" role="button" tabindex="0" title="Home">
    <!-- [HEADER > Title item] -->
    <h1 id="title">Quranix</h1>
    <!-- [HEADER > Tools group] -->
    <div class="header-tools">
      <!-- [HEADER > Search button item] -->
      <button id="headerSearchBtn" class="header-btn" type="button" aria-label="সার্চ খুলুন" title="সার্চ"><span class="ms" aria-hidden="true">search</span></button>
      <!-- [HEADER > Theme toggle item] -->
      <button id="themeToggle" class="header-btn" type="button" aria-label="থিম পরিবর্তন করুন" aria-pressed="false" title="ডার্ক/লাইট"><span class="ms" aria-hidden="true">dark_mode</span></button>
      <!-- [HEADER > More-menu button item] -->
      <button id="gridMenu" class="header-btn" type="button" aria-label="অতিরিক্ত মেনু খুলুন" aria-controls="gridDropdown" aria-expanded="false" title="মেনু">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
      </button>
      <!-- [MORE-MENU] start -->
      <div id="gridDropdown">
        <!-- [MORE-MENU > Quick area] -->
        <div class="g-quick" id="gQuick"></div>
        <!-- [MORE-MENU > Hijri calendar item] -->
        <button class="g-menu-item" data-popup="hijri"><span><span class="ms qi" data-i="hijri" aria-hidden="true"></span>হিজরি ক্যালেন্ডার</span><small id="gHijriMini"><span class="ms" aria-hidden="true">chevron_right</span></small></button>
        <!-- [MORE-MENU > Full Audio Quran item] -->
        <button class="g-menu-item" data-popup="fullaudio"><span><span class="ms" aria-hidden="true">headphones</span>Full Audio Quran</span><small><span class="ms" aria-hidden="true">chevron_right</span></small></button>
        <!-- [MORE-MENU > Downloads item] -->
        <button class="g-menu-item" data-popup="downloads"><span><span class="ms" aria-hidden="true">download</span>ডাউনলোড</span><small id="gDlMini"><span class="ms" aria-hidden="true">chevron_right</span></small></button>
        <!-- [MORE-MENU > Source and references item] -->
        <button class="g-menu-item" data-popup="source"><span><span class="ms" aria-hidden="true">info</span>উৎস ও তথ্যসূত্র</span><small><span class="ms" aria-hidden="true">chevron_right</span></small></button>
        <!-- [MORE-MENU > Backup and restore item] -->
        <button class="g-menu-item" data-popup="backup"><span><span class="ms" aria-hidden="true">save</span>ব্যাকআপ ও রিস্টোর</span><small><span class="ms" aria-hidden="true">chevron_right</span></small></button>
        <!-- [MORE-MENU > App install item] -->
        <button class="g-menu-item install-menu-item" data-popup="pwa"><span><span class="ms" aria-hidden="true">smartphone</span>Quranix অ্যাপ</span><small id="gPwaMini">ইনস্টল করুন <span class="ms" aria-hidden="true">chevron_right</span></small></button>
        <!-- [MORE-MENU > Settings item] -->
        <button class="g-menu-item" data-popup="settings"><span><svg class="ms-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>কাস্টমাইজেশন</span><small><span class="ms" aria-hidden="true">chevron_right</span></small></button>
      </div>
      <!-- [MORE-MENU] end -->
    </div>
  </div>
  <!-- [HEADER > Reader progress bar item] -->
  <div class="reader-progress" id="readerProgress"><div class="reader-progress-fill" id="readerProgressFill"></div></div>
</header>
<!-- [HEADER] end -->

<!-- [CONTROLS] start -->
<div id="controls">
    <!-- [CONTROLS > Surah search item] -->
    <input id="q" placeholder="সূরা খুঁজুন...">
    <!-- [CONTROLS > Translation select item] -->
    <div class="controls-trans-wrap">
      <select id="transSel">
        <option value="bn.bengali">অনুবাদ: মাওলানা মুহিউদ্দীন খান</option>
        <option value="bn.zakaria">অনুবাদ: ড. আবু বকর মুহাম্মাদ যাকারিয়া</option>
      </select>
    </div>
    <!-- [CONTROLS > Quick jump item] -->
    <div class="quick-jump" id="quickJumpBox">
      <select id="jumpSurah" style="flex:2"></select>
      <input id="jumpAyah" type="number" min="1" placeholder="আয়াত নং" style="flex:1">
      <button id="jumpGo">যান</button>
    </div>
    <!-- [CONTROLS > Tabs item] -->
    <div class="tabs" id="tabs"></div>
</div>
<!-- [CONTROLS] end -->

<!-- [APP-MOUNT] start -->
<main id="app" tabindex="-1"></main>
<!-- [APP-MOUNT] end -->

<!-- [HIFZ-BAR] start -->
<div id="hifzBar"><b><span class="ms" aria-hidden="true">psychology</span> হিফজ মোড</b>
<!-- [HIFZ-BAR > Hide Bangla item] -->
<button class="hifz-chip" data-hifz="bn">বাংলা লুকাও</button>
<!-- [HIFZ-BAR > Hide Arabic item] -->
<button class="hifz-chip" data-hifz="ar">আরবি লুকাও</button>
<!-- [HIFZ-BAR > Hide both item] -->
<button class="hifz-chip" data-hifz="both">দুটোই লুকাও</button>
<!-- [HIFZ-BAR > Off item] -->
<button class="hifz-chip" data-hifz="off">বন্ধ</button>
<!-- [HIFZ-BAR > Progress item] -->
<span id="hifzProgress" class="hifz-progress"></span></div>
<!-- [HIFZ-BAR] end -->

<!-- [WW-BAR] start -->
<div id="wwBar" class="ww-bar"><span class="ms" aria-hidden="true">abc</span> <b>শব্দে শব্দে মোড</b><span>যেকোনো আরবি শব্দে ট্যাপ করো</span><span id="wwBarClose" style="margin-left:auto;cursor:pointer"><span class="ms" aria-hidden="true">close</span></span></div>
<!-- [WW-BAR] end -->
<!-- [TAJWEED-LEGEND] start -->
<div id="tajweedLegend"><b><span class="ms" aria-hidden="true">palette</span> তাজভিদ:</b><span><i class="tj-dot" style="background:var(--qx-tj-ghunnah)"></i>গুন্নাহ</span><span><i class="tj-dot" style="background:var(--qx-tj-qalqalah)"></i>ক্বলক্বলাহ</span><span><i class="tj-dot" style="background:var(--qx-tj-ikhfa)"></i>ইখফা</span><span><i class="tj-dot" style="background:var(--qx-tj-idgham)"></i>ইদগাম</span><span><i class="tj-dot" style="background:var(--qx-tj-iqlab)"></i>ইক্বলাব</span><span><i class="tj-dot" style="background:var(--qx-tj-madd)"></i>মাদ</span><span id="tajweedLegendClose" style="cursor:pointer;margin-left:auto"><span class="ms" aria-hidden="true">close</span></span></div>
<!-- [TAJWEED-LEGEND] end -->
<!-- [DOWNLOAD-BAR] start -->
<div id="dlBar"><div class="dl-txt"><b id="dlTitle"><span class="ms" aria-hidden="true">download</span> এই সূরার তেলাওয়াত</b><small id="dlSub">অফলাইনে শোনার জন্য</small></div><button class="dl-btn" id="dlBtn"><span class="ms" aria-hidden="true">download</span> ডাউনলোড</button><button class="dl-btn ghost" id="dlManageBtn"><span class="ms" aria-hidden="true">folder_open</span> ম্যানেজ</button></div>
<!-- [DOWNLOAD-BAR] end -->
<!-- [AUDIO-BAR] start -->
<div id="audioBar" class="audio-bar" role="region" aria-label="অডিও প্লেয়ার">
  <div class="audio-inner">
    <!-- [AUDIO-BAR > Seek bar item] -->
    <div class="audio-progress-top"><input id="audioSeek" type="range" min="0" max="1000" step="1" value="0" disabled aria-label="অডিও অগ্রগতি"><div class="audio-progress-fill" id="audioProgressFill"></div></div>
    <!-- [AUDIO-BAR > Title and top buttons item] -->
    <div class="audio-top-row"><div class="audio-info"><b id="audioTitle">সূরা · আয়াত</b><small id="audioReciterLabel">মিশারি রশিদ আল-আফাসি</small></div><div class="audio-top-actions"><button id="audioHide" type="button" aria-label="মিনিমাইজ"><span class="ms" aria-hidden="true">expand_more</span></button><button id="audioClose" type="button" aria-label="প্লেয়ার বন্ধ করো"><span class="ms" aria-hidden="true">close</span></button></div></div>
    <!-- [AUDIO-BAR > Controls item] -->
    <div class="audio-ctrls"><button id="audioSpeed" type="button" aria-label="তেলাওয়াতের গতি">1x</button><button id="audioPrev" type="button" aria-label="আগের আয়াত"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg></button><button id="audioPlayPause" type="button" class="primary" aria-label="অডিও চালাও"><span class="ms" aria-hidden="true">play_arrow</span></button><button id="audioNext" type="button" aria-label="পরের আয়াত"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button><button id="audioAuto" type="button" aria-label="অটো-প্লে"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zM17 17H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button></div>
    <!-- [AUDIO-BAR > Time item] -->
    <div class="audio-bottom"><span id="audioCurrentTime">০:০০</span><span id="audioDuration">০:০০</span></div>
    <!-- [AUDIO-BAR > Status item] -->
    <div class="audio-status" id="audioStatus" aria-live="polite"></div>
  </div>
</div>
<!-- [AUDIO-BAR] end -->
<!-- [AUDIO-FLOAT] start -->
<div id="audioFloat" class="audio-float" style="display:none"><button id="audioFloatBtn" type="button" aria-label="অডিও দেখাও"><span class="ms">headphones</span></button></div>
<!-- [AUDIO-FLOAT] end -->

<!-- [FOOTER-MENU] start -->
<nav id="nav" aria-label="প্রধান নেভিগেশন">
  <!-- [FOOTER-MENU > Home item] -->
  <button id="navHome" type="button"><b><span class="ms" aria-hidden="true">home</span></b><span>হোম</span></button>
  <!-- [FOOTER-MENU > Prayer item] -->
  <button data-m="prayer"><b><span class="ms qi" data-i="mosque" aria-hidden="true"></span></b><span>নামাজ</span></button>
  <!-- [FOOTER-MENU > Quran item] -->
  <button data-m="quran" class="on"><b><span class="ms qi" data-i="quran" aria-hidden="true"></span></b><span>কুরআন</span></button>
  <!-- [FOOTER-MENU > Dua and Tasbih item] -->
  <button data-m="dua"><b><span class="ms qi" data-i="dua" aria-hidden="true"></span></b><span>দোয়া ও তাসবিহ</span></button>
  <!-- [FOOTER-MENU > More item] -->
  <button data-m="more"><b><span class="ms" aria-hidden="true">more_horiz</span></b><span>আরও</span></button>
</nav>
<!-- [FOOTER-MENU] end -->

<!-- [GRID-POPUP] start -->
<div id="gridPopupOverlay"><div id="gridPopupBox"></div></div>
<!-- [GRID-POPUP] end -->
<!-- [SCRIPTS] start -->
<script src="quran-data.js"></script>
<script src="data/topics.js"></script>
<script src="data/dictionary.js"></script>
<script src="data/district.js"></script>
<script src="data/hadith.js"></script>
<script src="js/quran.js"></script>
<script src="js/apps.js"></script>
<!-- [SCRIPTS] end -->

</body>
</html>
